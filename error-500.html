<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <script>
            try {
                document.documentElement.setAttribute("data-theme", localStorage.getItem("rd-theme") === "1" ? "dark" : "light");
                document.documentElement.dir = localStorage.getItem("rd-dir") === "1" ? "rtl" : "ltr";
            } catch (e) {}
        </script>
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>500 · High Five</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet" />
        <link rel="stylesheet" href="assets/css/tokens.css" />
        <link rel="stylesheet" href="assets/css/base.css" />
        <link rel="stylesheet" href="assets/css/app.css" />
        <link rel="stylesheet" href="assets/css/components.css" />
        <link rel="stylesheet" href="assets/shell.css" />
        <style>
            body { min-height: 100vh; display: grid; place-items: center; background: var(--color-bg); padding: var(--space-6) var(--space-4); }
            .err { max-width: 560px; width: 100%; text-align: center; display: grid; gap: var(--space-4); justify-items: center; padding: var(--space-10) var(--space-6); }
            .err__code { font-size: 96px; line-height: 1; font-weight: 800; letter-spacing: -0.04em; color: var(--color-primary); }
            .err svg { width: min(100%, 300px); height: auto; }
        </style>
    </head>
    <body>
        <!-- Error 500 — mirrors modules/errors/components/Error500.tsx (route error/500):
             title · text · illustration · Return Home (to the dashboard). The dashboard's copy is
             English-only (hard-coded, no i18n keys); the Arabic below is this system's translation. -->
        <main class="card err">
            <span class="err__code" aria-hidden="true">500</span>
            <h1 class="t-h2" data-ar="خطأ في النظام">System Error</h1>
            <p class="text-tertiary" data-ar="حدث خطأ ما! يرجى المحاولة لاحقاً.">Something went wrong! Please try again later.</p>
            <svg viewBox="0 0 300 170" aria-hidden="true"><ellipse cx="150" cy="155" rx="120" ry="10" fill="var(--color-surface-sunken)"/><rect x="90" y="30" width="120" height="40" rx="10" fill="var(--color-surface)" stroke="var(--color-border)" stroke-width="3"/><rect x="90" y="80" width="120" height="40" rx="10" fill="var(--color-surface)" stroke="var(--color-border)" stroke-width="3"/><circle cx="110" cy="50" r="5" fill="var(--color-success)"/><circle cx="110" cy="100" r="5" fill="var(--color-danger)"/><path d="M130 50h55M130 100h55" stroke="var(--color-border)" stroke-width="5" stroke-linecap="round"/><path d="M205 112l18-30h-14l10-22" fill="none" stroke="var(--color-primary)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <a class="btn btn--sm" href="index.html" data-ar="العودة للرئيسية">Return Home</a>
        </main>
        <script src="assets/shell.js"></script>
        <script>
            if (document.documentElement.dir === "rtl" && window.RD && RD.arInit) RD.arInit();
        </script>
    </body>
</html>
