<style>
  .sa-hero { display: flex; gap: var(--space-6); flex-wrap: wrap; align-items: flex-start; margin-bottom: var(--space-5); }
  .sa-hero__status { min-width: 260px; flex: 0 1 340px; border-inline-start: var(--border-thin) solid var(--color-border-subtle); padding-inline-start: var(--space-6); }
  @media (max-width: 768px) { .sa-hero__status { border: 0; padding: 0; flex-basis: 100%; } }
  .sa-kv { display: grid; grid-template-columns: minmax(140px, 220px) minmax(0, 1fr); gap: var(--space-3) var(--space-5); margin: 0; }
  .sa-kv dt { color: var(--color-text-tertiary); font-size: var(--text-sm); }
  .sa-kv dd { margin: 0; font-weight: var(--weight-semibold); font-size: var(--text-sm); }
  @media (max-width: 560px) { .sa-kv { grid-template-columns: minmax(0, 1fr); gap: var(--space-1); } .sa-kv dd { margin-bottom: var(--space-2); } }
  .sa-tabbar { margin-bottom: var(--space-6); overflow-x: auto; }
  .sa-tabbar .tabs { flex-wrap: nowrap; white-space: nowrap; }
  .sa-tabbar .tabs > * { display: inline-flex; align-items: center; gap: var(--space-1); }
  .sa-gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: var(--space-4); }
  .sa-tile { margin: 0; border: var(--border-thin) solid var(--color-border); border-radius: var(--radius-lg); overflow: hidden; }
  .sa-tile.is-main { border-color: var(--color-warning); }
  .sa-tile__media { height: 150px; display: grid; place-content: center; justify-items: center; gap: var(--space-1); background: var(--color-surface-sunken); color: var(--color-text-tertiary); }
  .sa-tile figcaption { padding: var(--space-2); justify-content: center; }
  .sa-side { display: grid; grid-template-columns: 200px minmax(0, 1fr); gap: var(--space-6); align-items: start; }
  .sa-side__nav { display: flex; flex-direction: column; gap: var(--space-1); }
  .sa-side__nav a, .sa-side__nav span { display: flex; justify-content: space-between; align-items: center; padding: var(--space-2) var(--space-3); border-radius: var(--radius-md); font-size: var(--text-sm); color: var(--color-text-secondary); }
  .sa-side__nav a.is-active { background: var(--color-primary-subtle); color: var(--color-primary-ink); font-weight: var(--weight-semibold); }
  .sa-side__nav a:hover { background: var(--color-surface-hover); }
  .sa-side__nav .is-locked { opacity: .5; cursor: not-allowed; }
  @media (max-width: 900px) { .sa-side { grid-template-columns: minmax(0, 1fr); } .sa-side__nav { flex-direction: row; flex-wrap: wrap; } }
  .sa-players { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: var(--space-3); }
  .sa-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: var(--space-4); }
  .sa-formrow { display: grid; grid-template-columns: 180px minmax(0, 1fr); gap: var(--space-4); align-items: start; }
  @media (max-width: 640px) { .sa-formrow { grid-template-columns: minmax(0, 1fr); gap: var(--space-1); } }
  /* redesign 2026-11-17 — sub-navigation between the Setup Files pages (same bar on every sibling page) */
  .sa-tabbar { margin-top: calc(var(--space-2) * -1); margin-bottom: var(--space-5); scrollbar-width: none; }
  .sa-tabbar .tabs > a { flex: none; }
  .sa-tabbar .tabs svg { width: 16px; height: 16px; }
  .sa-count { display: inline-flex; align-items: center; gap: var(--space-1); font-weight: var(--weight-semibold); color: var(--color-text-link); }
  .sa-count svg { width: 14px; height: 14px; }
  .sa-num { font-variant-numeric: tabular-nums; font-weight: var(--weight-semibold); }

<script>
(() => {
  /* Setup Files — Types · Capacities · Services · Age Groups (pages/setup-files/*).
     One script, picked by file name; every page is a CRUD.page config. Labels on
     Capacities / Services / Age Groups reuse the dashboard's TYPES.* strings
     (e.g. "enter type name"), kept 1:1.
     API (dashboard setup-files/_requests.js, banks/_requests.js) — lists GET with { page, limit: 15, search, active }:
       Types        GET/POST /types · POST /types/{id} (FormData, _method=put) · DELETE /types/{id}
       Capacities   GET/POST /capacities · POST /capacities/{id} (_method=put) · DELETE /capacities/{id}
       Services     GET/POST /services · POST /services/{id} (_method=put) · DELETE /services/{id}
       Age groups   GET/POST /age-groups · POST /age-groups/{id} (_method=put) · DELETE /age-groups/{id}
                    — the form's ending_age is sent as end_age (start_age / end_age)
       Languages    GET/POST /languages · POST /languages/{id} (_method=put) · DELETE /languages/{id}
       Support      GET/POST /departments · POST /departments/{id} (_method=PUT) · DELETE /departments/{id}
         subcats    GET/POST /departments/{id}/subcategories · POST /departments/{id}/subcategories/{sub} · DELETE same
       Banks        GET/POST /banks · PUT /banks/{id} (JSON body, not FormData) · DELETE /banks/{id}
       Translations: /translations (see sa-translation.js).
     Images: UploadCropImage — 1MB max (checked on pick), crop 1:1, "Remove photo".
     Permissions (dashboard job permissions; demo ?perm=limited | ?perm=none):
       page view_<entity> · Add add_<entity> · Edit update_<entity> · Delete delete_<entity>, entity =
       types · capacities · services · age_groups · languages · banks · support_categories.
       The translation globe, the translation pages and the support subcategories (?parent=) have
       no permission check in the dashboard — left open here too. */
  const file = location.pathname.split("/").pop().replace(/^_preview-/, "").replace(".html", "");
  const ID = { "setup-types": "sf-types", "setup-capacities": "sf-capacities", "setup-services": "sf-services", "setup-age-groups": "sf-age-groups", "setup-languages": "sf-languages", "setup-banks": "sf-banks", "setup-support-categories": "sf-support-categories" }[file] || "sf-types";
  const PK = { "setup-types": "types", "setup-capacities": "capacities", "setup-services": "services", "setup-age-groups": "age_groups", "setup-languages": "languages", "setup-banks": "banks", "setup-support-categories": "support_categories" }[file] || "types";
  const qsP = new URLSearchParams(location.search), openView = !!(qsP.get("translation") || qsP.get("parent"));
  RD.boot({ activeId: ID, title: "setup files", perm: openView ? undefined : "view_" + PK });
  if (!document.getElementById("listMount")) return;
  const { L, esc, ic } = SA;
  const R = CRUD.rules, S = HF.SA;
  /* redesign 2026-11-17: one tab bar links the Setup Files pages (the sidebar group, same order);
     copy in sentence case, natural Arabic. Data, fields, rules and flows unchanged. */
  const qs0 = new URLSearchParams(location.search);
  if (!qs0.get("translation")) {
    const TABS = [["setup-types", "layers", "Types", "الأنواع", "types"], ["setup-capacities", "users", "Capacities", "السعات", "capacities"], ["setup-services", "list", "Services", "الخدمات", "services"], ["setup-age-groups", "users", "Age groups", "الفئات العمرية", "age_groups"],
      ["setup-languages", "globe", "Languages", "اللغات", "languages"], ["setup-banks", "chart", "Banks", "البنوك", "banks"], ["setup-support-categories", "chat", "Support categories", "فئات الدعم", "support_categories"]];
    document.getElementById("listMount").insertAdjacentHTML("beforebegin", `<nav class="sa-tabbar" aria-label="${L("Setup files", "ملفات الإعداد")}"><div class="tabs">${TABS.map((t) => `<a href="${t[0]}.html" data-perm="view_${t[4]}" class="${t[0] === file ? "is-active" : ""}"${t[0] === file ? ' aria-current="page"' : ""}>${ic(t[1])}<span>${L(t[2], t[3])}</span></a>`).join("")}</div></nav>`);
    const on = document.querySelector(".sa-tabbar .is-active"); if (on) on.scrollIntoView({ block: "nearest", inline: "nearest" });
  }
  const MIN3 = ["Minimum 3 symbols", "الحد الأدنى 3 رموز"], MAX50 = ["Maximum 50 symbols", "الحد الأقصى 50 رمزًا"], MAX10 = ["Maximum 10 symbols", "الحد الأقصى 10 رموز"], NUM = ["Number is not valid", "الرقم غير صحيح"];
  const CREATING = ["Creating…", "جاري الإنشاء…"], UPDATING = ["Updating…", "جاري التحديث…"];
  const thumb = (r, withDate) => `<div class="cell-user"><span class="cell-thumb">${ic("layers")}</span><div><b>${esc(r.name)}</b>${withDate ? `<div class="t-xs text-tertiary">${esc(r.created_at)}</div>` : ""}</div></div>`;
  const statusField = { key: "active", label: ["Status", "الحالة"], type: "select", placeholder: ["Select status", "اختر الحالة"], options: () => [["1", L("Active", "نشط")], ["0", L("Inactive", "غير نشط")]], rules: [R.req], get: (r) => String(r.active) };
  /* size (1MB) is checked on pick by the CRUD picker, then the 1:1 crop step runs (UploadCropImage) */
  const imageField = (warn) => ({ key: "image", label: ["Image", "صورة"], type: "image", accept: ".png,.jpg,.jpeg", maxMB: 1, crop: 1, hint: ["Max size 1MB for images", "الحد الأقصى للصور 1 ميجابايت"], warn: warn ? ["The image should be an icon with a transparent background.", "يجب أن تكون الصورة أيقونة ذات خلفية شفافة."] : null });
  const nameRules = (minMsg) => [R.req, R.min(2, minMsg || MIN3), R.max(50, MAX50)];
  /* order / ages: the dashboard's numberRegExp /^[0-9]+$/ → whole numbers only ("Number is not valid") */
  const orderRules = (withLen) => [R.req].concat(withLen ? [R.max(10, MAX10)] : [], [R.int(NUM)]);
  const seed = (names) => names.map((n, i) => ({ id: i + 1, name: n, image: null, created_at: `2026-0${1 + (i % 9)}-1${i % 10} 10:00:00`, order: i + 1, active: i % 5 === 4 ? 0 : 1 }));

  /* ---- data (shared with the rest of the system: types/capacities/services already exist as option lists) ---- */
  S._setup = S._setup || {
    types: seed(S.TYPES.concat(["Hall", "Track"])),
    capacities: seed(S.CAPS.concat(["31 - 50"])),
    services: seed(["Changing rooms", "Parking", "Lighting", "Coach", "Equipment", "Lockers", "Showers"]),
    ages: [{ id: 1, name: "All ages", starting_age: null, ending_age: null, description: "Default group — open to everyone", active: 1 }]
      .concat([["Kids", 4, 12], ["Teens", 13, 17], ["Adults", 18, 59], ["Seniors", 60, 90]].map((a, i) => ({ id: 2 + i, name: a[0], starting_age: a[1], ending_age: a[2], description: `${a[0]} sessions and packages`, active: i === 3 ? 0 : 1 }))),
  };
  const D = S._setup;
  const common = (kind, plural, data) => ({
    data, pills: true, search: ["Search by name", "البحث بالاسم"], add: ["Add new", "إضافة جديد"], translation: { key: kind, cols: [["name", ["Name", "الاسم"]]] },
    columns: [
      { head: ["Name", "الاسم"], cell: (r) => thumb(r, true) },
      { head: ["Order", "الترتيب"], align: "center", cell: (r) => `<span class="sa-num">${r.order}</span>` },
      { head: ["Status", "الحالة"], align: "center", cell: (r) => CRUD.statusBadge(r.active) },
    ],
  });

  const CFG = {
    "setup-types": Object.assign(common("type", "types", D.types), {
      title: ["Types", "الأنواع"],
      form: { labelCols: true, createTitle: ["create new type", "إنشاء نوع جديد"], editTitle: ["edit type", "تعديل النوع"], creatingText: CREATING, updatingText: UPDATING,
        fields: [imageField(false), { key: "name", label: ["Name", "الاسم"], placeholder: ["enter type name", "أدخل اسم النوع"], rules: nameRules() }, { key: "order", type: "number", label: ["Order", "الترتيب"], placeholder: ["enter type order", "أدخل ترتيب النوع"], rules: orderRules(true) }, statusField] },
      del: { body: ["Please confirm that you want to delete this type", "يرجى تأكيد أنك تريد حذف هذا النوع"], warn: ["You can't delete a type that is linked to a unit", "لا يمكنك حذف نوع مرتبط بوحدة"], feedback: "alert" },
    }),
    "setup-capacities": Object.assign(common("capacity", "capacities", D.capacities), {
      title: ["Capacities", "السعات"],
      form: { labelCols: true, createTitle: ["create new capacity", "إنشاء سعة جديدة"], editTitle: ["edit capacity", "تعديل السعة"], creatingText: CREATING, updatingText: UPDATING,
        fields: [imageField(false), { key: "name", label: ["Name", "الاسم"], placeholder: ["enter capacity name", "أدخل اسم السعة"], rules: nameRules() }, { key: "order", type: "number", label: ["Order", "الترتيب"], placeholder: ["enter order", "أدخل الترتيب"], rules: orderRules(true) }, statusField] },
      del: { body: ["Please confirm that you want to delete this capacity", "يرجى تأكيد أنك تريد حذف هذه السعة"], warn: ["You can't delete a capacity that is linked to a unit", "لا يمكنك حذف سعة مرتبطة بوحدة"], feedback: "alert" },
    }),
    "setup-services": Object.assign(common("service", "services", D.services), {
      title: ["Services", "الخدمات"],
      /* create and edit validate differently in the dashboard (create: "Minimum 2", no order length) */
      form: { labelCols: true, createTitle: ["Create New Service", "إنشاء خدمة جديدة"], editTitle: ["edit service", "تعديل الخدمة"], creatingText: CREATING, updatingText: UPDATING,
        fields: (row) => [imageField(true), { key: "name", label: ["Name", "الاسم"], placeholder: ["Enter service name", "أدخل اسم الخدمة"], rules: nameRules(row ? MIN3 : ["Minimum 2 symbols", "الحد الأدنى رمزان"]) },
          { key: "order", type: "number", label: ["Order", "الترتيب"], placeholder: ["Enter service order", "أدخل ترتيب الخدمة"], rules: orderRules(!!row) }, statusField] },
      del: { body: ["Please confirm that you want to delete this service", "يرجى تأكيد أنك تريد حذف هذه الخدمة"] },
    }),
    "setup-age-groups": {
      title: ["Age Groups", "الفئات العمرية"], data: D.ages, pills: true, search: ["Search by name", "البحث بالاسم"], add: ["Add new", "إضافة جديد"], translation: { key: "age-group", cols: [["name", ["Name", "الاسم"]], ["description", ["Description", "الوصف"]]] },
      columns: [
        { head: ["Name", "الاسم"], cell: (r) => thumb(r, false) },
        { head: ["Starting age", "عمر البداية"], align: "center", cell: (r) => (r.id === 1 ? `<b style="font-size:var(--text-xl)" data-tip="${L("All ages", "كل الأعمار")}">∞</b>` : L(`${r.starting_age} years`, `${r.starting_age} سنة`)) },
        { head: ["Ending age", "عمر النهاية"], align: "center", cell: (r) => (r.id === 1 ? `<b style="font-size:var(--text-xl)" data-tip="${L("All ages", "كل الأعمار")}">∞</b>` : L(`${r.ending_age} years`, `${r.ending_age} سنة`)) },
        { head: ["Description", "الوصف"], cell: (r) => `<span class="text-secondary" style="white-space:normal">${esc(r.description || "---")}</span>` },
        { head: ["Status", "الحالة"], align: "center", cell: (r) => CRUD.statusBadge(r.active) },
      ],
      canDel: (r) => r.id !== 1,
      form: { labelCols: true, createTitle: ["create new age group", "إنشاء فئة عمرية جديدة"], editTitle: ["edit age group", "تعديل الفئة العمرية"], creatingText: CREATING, updatingText: UPDATING,
        fields: (row) => [imageField(false), { key: "name", label: ["Name", "الاسم"], placeholder: ["enter name", "أدخل الاسم"], rules: nameRules() },
          { key: "description", type: "textarea", label: ["Description", "الوصف"], placeholder: ["enter description", "أدخل الوصف"], rules: [R.max(150, MAX50)] }]
          /* age range is hidden for the default group (#1) in Edit */
          .concat(row && row.id === 1 ? [] : [
            { key: "starting_age", type: "number", min: 1, label: ["Age range · start", "الفئة العمرية · من"], placeholder: ["start", "البداية"], rules: [R.req, R.max(10, MAX50), R.int(NUM)] },
            { key: "ending_age", type: "number", min: 1, label: ["Age range · end", "الفئة العمرية · إلى"], placeholder: ["end", "النهاية"], rules: [R.req, R.max(10, MAX50), R.int(NUM)] }] /* sent as end_age */, [statusField]) },
      del: {},
    },
  };
  /* ---------- Languages (no pills, no search; en / ar can't be deleted) ---------- */
  D.langs = D.langs || [["English", "Default interface language", "en"], ["العربية", "لغة الواجهة العربية", "ar"], ["Français", "French", "fr"], ["Türkçe", "Turkish", "tr"]].map((l, i) => ({ id: i + 1, name: l[0], image: null, description: l[1], order: i + 1, code: l[2], active: i === 3 ? 0 : 1 }));
  CFG["setup-languages"] = {
    title: ["Languages", "اللغات"], data: D.langs, add: ["Add new", "إضافة جديد"], translation: { key: "language", cols: [["name", ["Name", "الاسم"]], ["description", ["Description", "الوصف"]]] },
    empty: ["There is no data to display", "لا توجد بيانات لعرضها"],
    columns: [
      { head: ["Name (display name)", "الاسم (الاسم المعروض)"], cell: (r) => `<div class="cell-user"><span class="cell-thumb">${ic("globe")}</span><b>${esc(r.name)}</b></div>` },
      { head: ["Description", "الوصف"], cell: (r) => `<span class="text-secondary">${esc(r.description || "---")}</span>` },
      { head: ["Order", "الترتيب"], align: "center", cell: (r) => `<span class="sa-num">${r.order || "---"}</span>` },
      { head: ["ISO", "الرمز"], align: "center", cell: (r) => `<span class="badge" style="text-transform:uppercase">${esc(r.code || "---")}</span>` },
      { head: ["Status", "الحالة"], align: "center", cell: (r) => CRUD.statusBadge(r.active) },
    ],
    canDel: (r) => !["en", "ar"].includes(r.code),
    form: { labelCols: true, createTitle: ["create language", "إنشاء لغة"], editTitle: ["edit language", "تعديل اللغة"], creatingText: CREATING, updatingText: UPDATING,
      fields: [imageField(false), { key: "name", label: ["Name", "الاسم"], placeholder: ["enter name", "أدخل الاسم"], rules: [R.req, R.min(3, MIN3), R.max(50, MAX50)] },
        { key: "description", label: ["Description", "الوصف"], placeholder: ["enter description", "أدخل الوصف"], rules: [R.req, R.min(3, MIN3), R.max(50, MAX50)] },
        { key: "code", label: ["code", "الرمز"], placeholder: ["enter code", "أدخل الرمز"], rules: [R.req, R.min(2, ["Minimum 2 symbols", "الحد الأدنى رمزان"]), R.max(50, MAX50)] },
        { key: "order", type: "number", label: ["Order", "الترتيب"], placeholder: ["enter order", "أدخل الترتيب"], rules: orderRules(true) }, Object.assign({}, statusField, { default: "1" })] },
    del: {},
  };

  /* ---------- Banks (/banks/list — listed under Setup Files; every save reloads in the dashboard) ---------- */
  D.banks = D.banks || ["Al Rajhi Bank", "Saudi National Bank", "Riyad Bank", "Alinma Bank", "Banque Misr", "Emirates NBD"].map((n, i) => ({ id: i + 1, name: n, order: i + 1, active: i === 5 ? 0 : 1 }));
  CFG["setup-banks"] = {
    title: ["Banks", "البنوك"], data: D.banks, pills: true, search: ["Search by name", "البحث بالاسم"], add: ["Add new", "إضافة جديد"], translation: { key: "bank", cols: [["name", ["Name", "الاسم"]]] },
    empty: ["There is no data to display", "لا توجد بيانات لعرضها"],
    columns: [
      { head: ["Name", "الاسم"], cell: (r) => `<div class="cell-user"><span class="cell-thumb">${ic("chart")}</span><b>${esc(r.name)}</b></div>` },
      { head: ["Order", "الترتيب"], align: "center", cell: (r) => `<span class="sa-num">${r.order}</span>` },
      { head: ["Status", "الحالة"], align: "center", cell: (r) => CRUD.statusBadge(r.active) },
    ],
    form: { labelCols: true, createTitle: ["create Bank", "إنشاء بنك"], editTitle: ["Edit Bank", "تعديل البنك"], feedback: "alert", delay: 700,
      fields: (row) => [{ key: "name", label: ["Name", "الاسم"], placeholder: ["Enter bank name", "أدخل اسم البنك"], rules: row ? [R.req] : [R.req, R.min(2, ["Minimum 2 symbols", "الحد الأدنى رمزان"]), R.max(50, MAX50)] },
        { key: "order", label: ["Order", "الترتيب"], placeholder: ["Enter bank order", "أدخل ترتيب البنك"], rules: [R.req] },
        { key: "active", label: ["Status", "الحالة"], type: "select", placeholder: ["Select status", "اختر الحالة"], options: () => [["1", L("Active", "نشط")], ["0", L("Inactive", "غير نشط")]], rules: [R.req], get: (r) => String(r.active) }] },
    del: {},
  };

  /* ---------- Support categories (+ subcategories via ?parent=<id>) ---------- */
  const STYPE = [["partner", ["Partner support", "دعم الشريك"]], ["user", ["User support", "دعم المستخدم"]], ["booking", ["Booking support", "دعم الحجوزات"]], ["public_event", ["Public event support", "دعم الفعاليات العامة"]], ["package", ["Package support", "دعم الباقات"]]]; /* package: dev 2026-11-16 */
  D.support = D.support || [["Payments", "partner"], ["Account access", "user"], ["Refunds", "booking"], ["Cancellations", "booking"], ["Event changes", "public_event"], ["App issues", "user"], ["Onboarding", "partner"], ["Package issues", "package"]].map((s, i) => ({ id: i + 1, name: s[0], type: s[1], order: i + 1, tickets_count: 3 + ((i * 7) % 23), active: i === 6 ? 0 : 1,
    subs: ["General", "Urgent", "Other"].slice(0, 1 + (i % 3)).map((n, j) => ({ id: (i + 1) * 10 + j, name: n, order: j + 1, tickets_count: (i + j) % 6, active: 1 })) }));
  D.support.forEach((s) => (s.subcategories_count = s.subs.length));
  const SUPREQ = { name: [(v) => (!v ? L("Please enter the category name", "الرجاء إدخال اسم الفئة") : ""), R.min(3, ["Name should be 3 letters at least", "يجب أن يتكون الاسم من 3 أحرف على الأقل"])],
    order: [(v) => (v === "" ? L("Please enter the order", "الرجاء إدخال الترتيب") : ""), (v) => (!/^-?\d+$/.test(v) ? L("Accepts whole numbers only", "يقبل أرقامًا صحيحة فقط") : ""), (v) => (+v < 1 ? L("Accepts positive numbers only", "يقبل أرقامًا موجبة فقط") : "")] };
  const supFields = (withType, row) => [{ key: "name", label: ["Name", "الاسم"], placeholder: ["Enter category name", "أدخل اسم الفئة"], rules: SUPREQ.name }, { key: "order", type: "number", label: ["Order", "الترتيب"], placeholder: ["Enter category order", "أدخل ترتيب الفئة"], rules: SUPREQ.order }, Object.assign({}, statusField, { default: "1" })]
    .concat(withType ? [{ key: "type", label: ["Type", "النوع"], type: "select", placeholder: ["Select type…", "اختر النوع…"], options: () => STYPE.map((t) => [t[0], L(...t[1])]), rules: [R.req],
      disabled: !!(row && +row.tickets_count > 0), note: row && +row.tickets_count > 0 ? ["This category already has tickets.", "هذا التصنيف لديه تذاكر بالفعل."] : null }] : []);
  const parentId = new URLSearchParams(location.search).get("parent");
  const parent = parentId && D.support.find((s) => String(s.id) === parentId);
  CFG["setup-support-categories"] = parent ? {
    title: [`${parent.name} / ${L(...STYPE.find((t) => t[0] === parent.type)[1])}`, `${parent.name} / ${L(...STYPE.find((t) => t[0] === parent.type)[1])}`], crumbs: [["Support Categories", "فئات الدعم", "setup-support-categories.html"]],
    baseQuery: "parent=" + parent.id, data: parent.subs, search: ["Search by name", "البحث بالاسم"], minSearch: 3, add: ["Add new", "إضافة جديد"], translation: { key: "support-department", cols: [["name", ["Name", "الاسم"]]] },
    empty: ["There is no data yet", "لا توجد بيانات بعد"],
    columns: [{ head: ["Name", "الاسم"], cell: (r) => `<b>${esc(r.name)}</b>` }, { head: ["Order", "الترتيب"], align: "center", cell: (r) => `<span class="sa-num">${r.order}</span>` }, { head: ["Tickets", "عدد التذاكر"], align: "center", cell: (r) => `<span class="sa-num">${r.tickets_count}</span>` }, { head: ["Status", "الحالة"], align: "center", cell: (r) => CRUD.statusBadge(r.active) }],
    form: { labelCols: true, createTitle: ["Create New Subcategory", "إنشاء فئة فرعية جديدة"], editTitle: ["Edit subcategory", "تعديل الفئة الفرعية"], creatingText: CREATING, updatingText: UPDATING, fields: supFields(false),
      /* the dashboard's title follows the typed name: "Edit subcategory - {name}" ("---" when empty) */
      onOpen: (el, row) => { if (!row) return; const t = el.querySelector("#crudFormT"), nm = el.querySelector('[data-f="name"]'), set = () => (t.textContent = L("Edit subcategory", "تعديل الفئة الفرعية") + " - " + (nm.value.trim() || "---")); set(); nm.addEventListener("input", set); } },
    onSave: (v, r) => { if (r) Object.assign(r, v); else { parent.subs.unshift(Object.assign({ id: Date.now() % 100000, tickets_count: 0 }, v)); parent.subcategories_count = parent.subs.length; } },
    del: { title: ["delete category", "حذف الفئة"], body: ["Are you sure you want to delete this category?", "هل أنت متأكد أنك تريد حذف هذه الفئة؟"] },
  } : {
    title: ["Support Categories", "فئات الدعم"], data: D.support, add: ["Add new", "إضافة جديد"], search: ["Search by category name", "البحث باسم الفئة"], minSearch: 3, translation: { key: "support-department", cols: [["name", ["Name", "الاسم"]]] },
    pills: [{ key: "all", label: ["All", "الكل"] }].concat(STYPE.map((t, i) => ({ key: t[0], label: t[1], icon: ["hotel", "users", "ticket", "star", "box"][i], tone: "info", match: (r) => r.type === t[0] }))),
    empty: ["There is no data yet", "لا توجد بيانات بعد"],
    columns: [
      { head: ["Name", "الاسم"], cell: (r) => `<b>${esc(r.name)}</b>` },
      { head: ["Type", "النوع"], cell: (r) => SA.badge("info", L(...STYPE.find((t) => t[0] === r.type)[1])) },
      { head: ["Order", "الترتيب"], align: "center", cell: (r) => `<span class="sa-num">${r.order}</span>` },
      { head: ["Tickets", "عدد التذاكر"], align: "center", cell: (r) => `<span class="sa-num">${r.tickets_count}</span>` },
      { head: ["Subcategories", "الفئات الفرعية"], align: "center", cell: (r) => `<a class="sa-count" href="setup-support-categories.html?parent=${r.id}">${L(`${r.subcategories_count} ${r.subcategories_count === 1 ? "subcategory" : "subcategories"}`, `${r.subcategories_count} ${r.subcategories_count === 1 ? "فئة فرعية" : "فئات فرعية"}`)}${ic(document.documentElement.dir === "rtl" ? "chevronLeft" : "chevronRight")}</a>` },
      { head: ["Status", "الحالة"], align: "center", cell: (r) => CRUD.statusBadge(r.active) },
    ],
    form: { labelCols: true, createTitle: ["Create New support category", "إنشاء فئة دعم جديدة"], editTitle: ["Edit category", "تعديل الفئة"], creatingText: CREATING, updatingText: UPDATING, fields: (row) => supFields(true, row) },
    onSave: (v, r) => { if (r) Object.assign(r, v); else D.support.unshift(Object.assign({ id: Date.now() % 100000, tickets_count: 0, subs: [], subcategories_count: 0 }, v)); },
    del: { title: ["delete category", "حذف الفئة"], body: ["Are you sure you want to delete this category?", "هل أنت متأكد أنك تريد حذف هذه الفئة؟"] },
  };

  /* permission gating (Add add_* · Edit update_* · Delete delete_*); support subcategories are ungated in the dashboard */
  const cfg = CFG[file] || CFG["setup-types"];
  if (!(file === "setup-support-categories" && parent)) {
    const keep = cfg.canDel;
    if (!RD.can("add_" + PK)) cfg.add = null;
    cfg.canEdit = () => RD.can("update_" + PK);
    cfg.canDel = (r) => RD.can("delete_" + PK) && (!keep || keep(r));
  }
  CRUD.page(cfg);
})();
</script>
</body>
</html>
