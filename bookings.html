<script>/* redesign trial — assets/css/skin-v2.css (+ skin-v2-looks.css); ?skin=classic shows the current look, ?look=swiss|bento|soft, ?look=glass the alternative looks */(function(){var q=new URLSearchParams(location.search),r=document.documentElement;if(q.get("skin")==="classic")return;r.setAttribute("data-skin","v2");/* partners: new layout, the dashboard's own colours (?palette=v2 shows the v2 colours) */if(q.get("palette")!=="v2")r.setAttribute("data-palette","classic");var l=q.get("look");if(["swiss","bento","soft","glass"].indexOf(l)>-1)r.setAttribute("data-look",l);})();</script>

<title>Bookings · HighFive Super Admin</title>

<style>
  .sa-hero { display: flex; gap: var(--space-6); flex-wrap: wrap; align-items: flex-start; margin-bottom: var(--space-5); }
  .sa-hero__status { min-width: 260px; flex: 0 1 340px; border-inline-start: var(--border-thin) solid var(--color-border-subtle); padding-inline-start: var(--space-6); }
  @media (max-width: 768px) { .sa-hero__status { border: 0; padding: 0; flex-basis: 100%; } }
  .sa-kv { display: grid; grid-template-columns: minmax(140px, 220px) minmax(0, 1fr); gap: var(--space-3) var(--space-5); margin: 0; }
  .sa-kv dt { color: var(--color-text-tertiary); font-size: var(--text-sm); }
  .sa-kv dd { margin: 0; font-weight: var(--weight-semibold); font-size: var(--text-sm); }
  @media (max-width: 560px) { .sa-kv { grid-template-columns: minmax(0, 1fr); gap: var(--space-1); } .sa-kv dd { margin-bottom: var(--space-2); } }
  .sa-tabbar { margin-bottom: var(--space-6); overflow-x: auto; }
  .sa-tabbar .tabs { flex-wrap: nowrap; white-space: nowrap; }
  .sa-tabbar .tabs > * { display: inline-flex; align-items: center; gap: var(--space-1); }
  .sa-gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: var(--space-4); }
  .sa-tile { margin: 0; border: var(--border-thin) solid var(--color-border); border-radius: var(--radius-lg); overflow: hidden; }
  .sa-tile.is-main { border-color: var(--color-warning); }
  .sa-tile__media { height: 150px; display: grid; place-content: center; justify-items: center; gap: var(--space-1); background: var(--color-surface-sunken); color: var(--color-text-tertiary); }
  .sa-tile figcaption { padding: var(--space-2); justify-content: center; }
  .sa-side { display: grid; grid-template-columns: 200px minmax(0, 1fr); gap: var(--space-6); align-items: start; }
  .sa-side__nav { display: flex; flex-direction: column; gap: var(--space-1); }
  .sa-side__nav a, .sa-side__nav span { display: flex; justify-content: space-between; align-items: center; padding: var(--space-2) var(--space-3); border-radius: var(--radius-md); font-size: var(--text-sm); color: var(--color-text-secondary); }
  .sa-side__nav a.is-active { background: var(--color-primary-subtle); color: var(--color-primary-ink); font-weight: var(--weight-semibold); }
  .sa-side__nav a:hover { background: var(--color-surface-hover); }
  .sa-side__nav .is-locked { opacity: .5; cursor: not-allowed; }
  @media (max-width: 900px) { .sa-side { grid-template-columns: minmax(0, 1fr); } .sa-side__nav { flex-direction: row; flex-wrap: wrap; } }
  .sa-players { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: var(--space-3); }
  .sa-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: var(--space-4); }
  .sa-formrow { display: grid; grid-template-columns: 180px minmax(0, 1fr); gap: var(--space-4); align-items: start; }
  @media (max-width: 640px) { .sa-formrow { grid-template-columns: minmax(0, 1fr); gap: var(--space-1); } }
  /* ---- redesign 2026-11-17: global list layer (same composition as partners.html) ---- */
  .ops-head { display: flex; align-items: flex-end; justify-content: space-between; gap: var(--space-4); flex-wrap: wrap; margin-bottom: var(--space-6); }
  #listMount .data-table-toolbar > .grow { display: none; }
  #listMount .data-table-toolbar > .input-wrap { flex: 1 1 320px; min-width: 0 !important; }
  .ops-chips { padding: 0 var(--space-5) var(--space-4); }
  .ops-id { font: inherit; font-weight: var(--weight-semibold); color: var(--color-text); padding: 0; cursor: pointer; text-align: start; }
  .ops-id:hover { color: var(--color-primary-ink); text-decoration: underline; text-underline-offset: 3px; }
  .ops-two { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .ops-two > b { font-weight: var(--weight-medium); }
  .ops-check { display: inline-flex; flex-direction: column; gap: var(--space-1); align-items: flex-start; }
  #listMount tbody tr:has([data-peek]) { cursor: pointer; }
  @media (min-width: 769px) { #listMount > .stat-strip { grid-template-columns: repeat(auto-fit, minmax(min(100%, 128px), 1fr)) !important; } } /* ≤768px: two per row (components.css) */

</head>
<body>
<div class="app" id="app">
  <div class="scrim"></div>
  <aside class="sidebar" id="sidebarMount"></aside>
  <div class="main">
    <header class="topbar" id="topbarMount"></header>
    <nav id="topTabsMount"></nav>

    <main class="content"><div class="content__inner" style="max-width:none">
      <div id="pageHead"></div>
      <div id="listMount"></div>
    </div></main>
  </div>
</div>

<script src="assets/js/data.js"></script>
<script src="assets/js/env.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/shell.js"></script>
<script src="assets/js/sa-data.js"></script>
<script src="assets/js/sa-kit.js"></script>
<script src="assets/js/pp/pp-core.js"></script>
<script src="assets/js/pp/pp-ops.js"></script>
<script src="assets/js/sa-ops.js"></script>
<script>
(() => {
  /* Bookings — mirrors pages/bookings (list + BookingView).
     List: pills (all · coming · pending approval · ended · cancelled), search by
     booking id, Filter Options (session date · check-in date · category →
     activity · booking type · session gender), 12 columns, eye → view.
     API: GET /session-booking (params incl. status — the Cancelled pill sends
     status=cancelled while the response counts key is counts.canceled and rows
     carry status "canceled"); GET /activity-categories and
     GET /activity-categories/{id}/activities (Filter: category → activity).
     View: GET /session-booking/{id}. View (?view=<id>): "Booking ID {id}" card around
     the shared SessionBookingView (pp-ops.js) — no breadcrumbs, no back.
     Permissions (job keys): list view_bookings (TableWrapper.js); row eye + drawer
     link view_booking_details (BookingsTable.js); view page view_booking_details
     (SessionBookingView.js → NotHavePermissions). */
  const qs = new URLSearchParams(location.search), view = qs.get("view");
  RD.boot({ activeId: "bookings", title: view ? "Booking" : "Bookings", perm: view ? "view_booking_details" : "view_bookings" });
  if (!document.getElementById("listMount")) return;
  const { L, esc, ic, badge } = SA;
  const D = OPS.all();
  const dash = (v) => (v == null || v === "" ? "---" : esc(v));
  PP.href = () => "bookings.html";

  if (view) {
    const b = D.bookings.find((x) => String(x.id) === view) || D.bookings[0];
    document.getElementById("pageHead").hidden = true;
    const mount = document.getElementById("listMount");
    mount.className = "stack gap-6";
    /* noBack: the back link is commented out in the dashboard */
    PP.tabs.bookings(mount, { partner: OPS.partnerOf(b), params: new URLSearchParams({ view: String(b.id) }), noBack: true });
    return;
  }

  /* Redesign (2026-11-17) — same data, filters, fields, actions and routes as the
     dashboard list, re-composed like partners.html: head with a live summary,
     status tiles, one search + Filter bar with removable chips, company + unit in
     one Venue column, date + time on one line, row (or #id) opens a summary drawer
     with the link to the booking view. */
  const by = (k) => D.bookings.filter((r) => r.status === k).length;
  OPS.head(document.getElementById("pageHead"), { title: ["Bookings", "الحجوزات"],
    sub: L(`${SA.fmt(D.bookings.length)} bookings across ${HF.SA.partners.length} partners · ${by("coming")} coming · ${by("pending")} pending approval`,
      `${SA.fmt(D.bookings.length)} حجز لدى ${HF.SA.partners.length} شريك · ${by("coming")} قادم · ${by("pending")} في انتظار الموافقة`) });
  const BTYPE = () => [["online", L("Online", "عبر الإنترنت")], ["linked", L("Linked", "مرتبط")], ["manual", L("Manual", "يدوي")]];
  const btype = (r) => (r.is_flexible_slot ? L("Online flexible booking", "حجز مرن عبر الإنترنت") : OPS.dash(r.booking_type));
  const checkin = (r) => (r.check_in_at ? `${badge("success", L("Checked in", "تم تسجيل الحضور"))}<div class="t-xs text-tertiary" style="margin-top:2px">${esc(r.check_in_at)}</div>` : badge("", L("Not checked in", "لم يسجّل الحضور")));
  const viewHref = (r) => `bookings.html?view=${r.id}&redirect_to_page=${ctl ? ctl.state.page : 1}`;
  const fx = OPS.filters([
    { keys: ["session_from", "session_to"], label: ["Session date", "تاريخ الجلسة"], value: (f) => OPS.range(f.session_from, f.session_to) },
    { keys: ["checkin_from", "checkin_to"], label: ["Check-in date", "تاريخ تسجيل الحضور"], value: (f) => OPS.range(f.checkin_from, f.checkin_to) },
    { keys: ["category"], also: ["activity"], label: ["Category", "الفئة"], value: (f) => f.category },
    { keys: ["activity"], label: ["Activity", "النشاط"], value: (f) => f.activity },
    { keys: ["btype"], label: ["Booking type", "نوع الحجز"], value: (f) => OPS.opt(BTYPE(), f.btype) },
    { keys: ["gender"], label: ["Session gender", "جنس الجلسة"], value: (f) => PP.cap(f.gender) },
  ]);
  let ctl = null;
  ctl = SA.list({
    mount: document.getElementById("listMount"), data: D.bookings,
    pills: [["all", "All bookings", "كل الحجوزات", "booking", ""], ["coming", "Coming", "قادم", "calendar", "success"], ["pending", "Pending approval", "في انتظار الموافقة", "clock", "warning"], ["ended", "Ended", "انتهى", "check", "primary"], ["canceled", "Cancelled", "ملغي", "close", "danger"]]
      .map((p) => ({ key: p[0], label: [p[1], p[2]], icon: p[3], tone: p[4] })),
    pillMatch: (r, k) => k === "all" || r.status === k,
    search: ["Search by booking ID", "البحث برقم الحجز"], searchMatch: (r, q) => String(r.id).includes(q),
    toolbarExtra: fx.toolbarExtra, after: fx.after,
    extraMatch: (r, f) => OPS.inRange(r.date, f.session_from, f.session_to) && (!(f.checkin_from || f.checkin_to) || (r.check_in_at && OPS.inRange(r.check_in_at, f.checkin_from, f.checkin_to)))
      && (!f.category || r.activity_category_name === f.category) && (!f.activity || r.activity_name === f.activity) && (!f.btype || r.booking_type === f.btype) && (!f.gender || r.session_gender === f.gender),
    empty: () => `<div class="stack gap-2" style="align-items:center"><span style="transform:scale(1.6)">${ic("calendar")}</span><b style="margin-top:var(--space-2)">${L("No bookings yet", "لا توجد حجوزات")}</b><span class="t-sm">${L("Try another tab, adjust filters, or search again.", "جرّب تبويبًا آخر أو غيّر عوامل التصفية أو أعد البحث.")}</span></div>`,
    columns: [
      { head: ["Booking", "الحجز"], cell: (r) => `<div class="ops-two">${OPS.peekId(r.id, "#" + r.id)}<span class="t-xs text-tertiary">${esc(r.created_at)}</span>${r.is_flexible_slot ? `<span>${badge("info", L("Flexible", "مرن"))}</span>` : ""}</div>` },
      { head: ["Venue", "المكان"], cell: (r) => OPS.two(dash(r.company_name), dash(r.unit_name)) },
      { head: ["Date & time", "التاريخ والوقت"], cell: (r) => OPS.when(r.date, r.start_time, r.end_time) },
      { head: ["Activity", "النشاط"], cell: (r) => OPS.two(esc(r.activity_category_name), esc(r.activity_name)) },
      { head: ["User", "المستخدم"], cell: (r) => (r.user_name ? `<div class="cell-user">${PP.avatar(r.user_name)}<b>${esc(r.user_name)}</b></div>` : "---") },
      { head: ["Session gender", "جنس الجلسة"], align: "center", cell: (r) => OPS.dash(r.session_gender) },
      { head: ["Booking type", "نوع الحجز"], align: "center", cell: btype },
      { head: ["Price per user", "السعر لكل مستخدم"], align: "end", cell: (r) => `<b style="font-variant-numeric:tabular-nums">${r.paid_price || 0}</b> <span class="t-xs">${esc(r.currency.code)}</span><div class="t-xs text-tertiary">${OPS.dash(r.payment_method)}</div>` },
      { head: ["Status", "الحالة"], align: "center", cell: (r) => OPS.sessionBadge(r.status) },
      { head: ["Check-in status", "حالة تسجيل الحضور"], align: "center", cell: checkin },
      { head: ["Actions", "الإجراءات"], align: "center", cell: (r) => `<a class="icon-btn" href="${viewHref(r)}" aria-label="${L("View", "عرض")} #${r.id}" data-tip="${L("View", "عرض")}" data-perm="view_booking_details">${ic("eye")}</a>` },
    ],
  });
  fx.bind(document.getElementById("listMount"), ctl);
  if (+qs.get("page") > 1) { ctl.state.page = +qs.get("page"); ctl.paint(); }
  OPS.peek(document.getElementById("listMount"), (id) => ctl.rowById(id), (r) => ({
    title: `${L("Booking", "الحجز")} #${r.id}`, href: viewHref(r), open: L("Open booking", "فتح الحجز"), perm: "view_booking_details",
    rows: [[L("Status", "الحالة"), OPS.sessionBadge(r.status)], [L("Created", "تاريخ الإنشاء"), esc(r.created_at)], [L("Company", "الشركة"), dash(r.company_name)], [L("Unit", "الوحدة"), dash(r.unit_name)],
      [L("Date", "التاريخ"), esc(r.date)], [L("Time", "الوقت"), `<span dir="ltr">${esc(r.start_time)} – ${esc(r.end_time)}</span>`], [L("Category", "الفئة"), esc(r.activity_category_name)], [L("Activity", "النشاط"), esc(r.activity_name)],
      [L("User", "المستخدم"), dash(r.user_name)], [L("Session gender", "جنس الجلسة"), OPS.dash(r.session_gender)], [L("Booking type", "نوع الحجز"), btype(r)],
      [L("Price per user", "السعر لكل مستخدم"), `${r.paid_price || 0} ${esc(r.currency.code)}`], [L("Payment method", "طريقة الدفع"), OPS.dash(r.payment_method)], [L("Check-in status", "حالة تسجيل الحضور"), checkin(r)]],
  }));
  document.getElementById("listMount").addEventListener("click", (e) => {
    const b = e.target.closest("[data-filter]");
    if (!b) return;
    PP.filterPop(b, { width: 320, value: ctl.state.extra, cascade: { category: ["activity"] },
      fields: [{ key: "session", type: "range", label: ["Session date", "تاريخ الجلسة"] }, { key: "checkin", type: "range", label: ["Check-in date", "تاريخ تسجيل الحضور"] }].concat(OPS.catFields(), [
        { key: "btype", label: ["Booking type", "نوع الحجز"], placeholder: ["Select booking type", "اختر نوع الحجز"], options: BTYPE },
        OPS.genderField()]),
      onApply: (d) => { ctl.state.extra = d; ctl.paint(); } });
  });
})();
</script>
</body>
</html>
