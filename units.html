<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><defs><linearGradient id='fvg' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='%23FC6404'/><stop offset='1' stop-color='%23FF8536'/></linearGradient></defs><rect width='64' height='64' rx='14' fill='%23131313'/><g transform='translate(6 10.71) scale(0.7312)' fill='url(%23fvg)'><path d='M9.19 34.39C8.66 33.98 8.39 33.32 6.29 32.44 4.52 31.7 2 32.73 2.07 35.06 2.15 37.81 7.95 50.58 10.44 53.63 12.15 55.74 16.3 54.67 16.78 51.56 17.46 47.1 11.6 36.26 9.19 34.39'/><path d='M57.86 13.44C56.88 13.08 53.96 13.48 51.32 19.16 49.99 22.02 45.55 38.6 45.63 40.58 45.75 43.74 50.36 45.81 52.67 42.28 53.44 41.11 59.78 19.81 60.15 18.41 60.95 15.37 59.63 14.07 57.86 13.44'/><path d='M33.57 5.08C32.57 4.75 30.43 5.64 27.22 11.03 25.3 14.24 20.01 34.86 19.9 41.69 19.81 47.32 25.82 46.77 27.05 43.99 29.87 37.62 35.64 11.65 36.03 9.96 36.72 6.9 35.36 5.65 33.57 5.08'/><path d='M66.39 28.04C65.4 27.69 62.48 28.08 59.84 33.76 58.93 35.72 54.31 49.26 54.65 51.63 55.03 54.21 59.1 56.24 61.35 53.21 61.99 52.35 62.74 49.48 63.38 47.41 65.82 39.58 68.02 33.43 68.31 32.3 69.12 29.26 68.16 28.68 66.39 28.04'/><path d='M50.27 7.33C51.07 4.29 49.76 3 47.98 2.36 47 2 44.08 2.39 41.44 8.08 39.7 11.81 32.43 33.12 33.95 37.77 34.71 40.1 37.95 41.32 40.38 38.99 42.69 36.78 49.81 9.09 50.27 7.33'/></g></svg>">
<title>Units · HighFive Super Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Tajawal:wght@300;400;500;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/tokens.css">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/app.css">
<link rel="stylesheet" href="assets/css/components.css">
<link rel="stylesheet" href="assets/shell.css">
</head>
<body>
<div class="app" id="app">
  <div class="scrim"></div>
  <aside class="sidebar" id="sidebarMount"></aside>
  <div class="main">
    <header class="topbar" id="topbarMount"></header>
    <nav id="topTabsMount"></nav>

    <main class="content"><div class="content__inner" style="max-width:none">
      <div id="pageHead"></div>
      <div id="listMount"></div>
    </div></main>
  </div>
</div>

<script src="assets/js/data.js"></script>
<script src="assets/js/env.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/shell.js"></script>
<script src="assets/js/sa-data.js"></script>
<script src="assets/js/sa-kit.js"></script>
<script>
(() => {
  /* Units — mirrors pages/units (list): status pills with counts, search,
     Filter (category · activity · type · capacity · availability · partner
     app status · attendance type), 11 columns, eye → unit profile.
     API: GET /units. */
  RD.boot({ activeId: "units", title: "Units" });
  if (!document.getElementById("listMount")) return;
  const { L, esc, ic, badge } = SA;
  const data = HF.SA.units;

  SA.head(document.getElementById("pageHead"), { title: ["units", "الوحدات"] });

  const tone = (v) => (v === "waiting" || v === "pending" ? "warning" : v === "active" ? "primary" : "danger");
  const label = (v) => ({ waiting: L("pending", "معلق"), pending: L("pending", "معلق"), active: L("approved", "معتمد"), inactive: L("not approved", "غير معتمد") }[v] || v);
  const initials = (s) => (s || "?").trim().split(/\s+/).map((w) => w[0]).slice(0, 2).join("").toUpperCase();
  const dash = (v) => (v == null || v === "" ? "---" : esc(v));

  let ctl = null;
  ctl = SA.list({
    mount: document.getElementById("listMount"),
    data,
    pills: [
      { key: "all", label: ["all", "الكل"] },
      { key: "waiting", label: ["pending", "معلق"] },
      { key: "active", label: ["approved", "معتمد"] },
      { key: "inactive", label: ["not approved", "غير معتمد"] },
    ],
    pillMatch: (r, k) => k === "all" || (k === "waiting" ? r.status.value === "waiting" || r.status.value === "pending" : r.status.value === k),
    search: ["search by company name or unit name", "البحث باسم الشركة أو الوحدة"],
    searchMatch: (r, q) => r.name.toLowerCase().includes(q) || r.partner.company_name.toLowerCase().includes(q),
    toolbarExtra: `<button type="button" class="btn btn--sm btn--secondary" data-filter aria-haspopup="dialog">${ic("sliders")}<span>${L("Filter", "تصفية")}</span></button>`,
    extraMatch: (r, f) =>
      (!f.category || String(r.activity_category.id) === f.category) &&
      (!f.activity || r.activity.name === f.activity) &&
      (!f.type || r.type.name === f.type) &&
      (!f.capacity || r.capacity === f.capacity) &&
      (!f.availability || r.availability.toLowerCase() === f.availability) &&
      (!f.partner_app_status || (r.ownappactive && r.ownappactive.value === f.partner_app_status)) &&
      (!f.attendance_type || r.attendance_type === f.attendance_type),
    empty: ["there is no data to display", "لا توجد بيانات للعرض"],
    columns: [
      { head: ["unit", "الوحدة"], cell: (r) => `<div class="cell-user"><span class="cell-thumb">${ic("box")}</span>
          <div><b>${esc(r.name)}</b> ${r.attendance_type === "online" ? badge("primary", L("online", "عبر الإنترنت")) : ""}<div class="t-xs text-tertiary">${esc(r.created_at)}</div></div></div>` },
      { head: ["company", "الشركة"], align: "center", cell: (r) => `<div class="cell-user" style="justify-content:center"><span class="avatar avatar--sm">${esc(initials(r.partner.company_name))}</span>
          <div style="text-align:start"><a href="#" style="color:var(--color-text-link);font-weight:var(--weight-semibold)">${esc(r.partner.company_name)}</a><div class="t-xs text-tertiary">${esc(r.partner.created_at)}</div></div></div>` },
      { head: ["Category", "الفئة"], align: "center", cell: (r) => dash(r.activity_category.name) },
      { head: ["Activity", "النشاط"], align: "center", cell: (r) => dash(r.activity.name) },
      { head: ["Type", "النوع"], align: "center", cell: (r) => dash(r.type.name) },
      { head: ["Capacity", "السعة"], align: "center", cell: (r) => dash(r.capacity) },
      { head: ["booking methodology", "منهجية الحجز"], align: "center", cell: (r) => dash(r.booking_methodology) },
      { head: ["Availability", "التوفر"], align: "center", cell: (r) => `<span style="color:${r.availability.toLowerCase() === "available" ? "var(--color-info)" : "var(--color-danger)"};font-weight:var(--weight-semibold)">${esc(r.availability.toLowerCase() === "available" ? L("Available", "متاح") : L("Maintenance", "صيانة"))}</span>` },
      { head: ["HighFive App Status", "حالة تطبيق هاي فايف"], align: "center", cell: (r) => badge(tone(r.status.value), label(r.status.value)) },
      { head: ["Partner App Status", "حالة تطبيق الشريك"], align: "center", cell: (r) => (r.partner.is_independent ? (r.ownappactive ? badge(tone(r.ownappactive.value), label(r.ownappactive.value)) : badge("", L("N/A", "غير متاح"))) : "---") },
      { head: ["Actions", "الإجراءات"], align: "center", cell: (r) => `<a class="icon-btn" href="unit-profile.html?id=${r.id}&tab=details&redirect_to_page=${ctl ? ctl.state.page : 1}" aria-label="${L("View", "عرض")} ${esc(r.name)}">${ic("eye")}</a>` },
    ],
  });

  /* ---------------- Filter Options ---------------- */
  const ALL = L("all", "الكل");
  const pop = document.createElement("div");
  pop.className = "popover";
  pop.setAttribute("role", "dialog");
  pop.style.cssText = "width:300px;max-height:500px;overflow:auto";
  document.body.appendChild(pop);
  let draft = {};
  function paintPop() {
    const o = (v, t, k) => [v, t, String(draft[k] || "") === String(v)];
    const sel = (k, list) => SA.select([o("", ALL, k)].concat(list.map((x) => o(x[0], x[1], k))), `data-f="${k}"`);
    const acts = draft.category ? HF.SA.ACTS[draft.category] : [];
    pop.innerHTML = `<div class="popover__title">${L("Filter Options", "خيارات التصفية")}</div>
      <div class="popover__body stack gap-3">
        ${SA.field(["Category", "الفئة"], sel("category", HF.SA.CATS.map((c) => [c.id, c.name])))}
        ${SA.field(["Activity", "النشاط"], sel("activity", acts.map((a) => [a, a])))}
        ${SA.field(["Type", "النوع"], sel("type", HF.SA.TYPES.map((t) => [t, t])))}
        ${SA.field(["Capacity", "السعة"], sel("capacity", HF.SA.CAPS.map((c) => [c, c])))}
        ${SA.field(["Availability", "التوفر"], sel("availability", [["available", L("available", "متاح")], ["maintenance", L("maintenance", "صيانة")]]))}
        ${SA.field(["Partner App Status", "حالة تطبيق الشريك"], sel("partner_app_status", [["waiting", L("pending", "معلق")], ["active", L("approved", "معتمد")], ["inactive", L("not approved", "غير معتمد")]]))}
        ${SA.field(["attendance type", "نوع الحضور"], sel("attendance_type", [["online", L("online", "عبر الإنترنت")], ["onsite", L("onsite", "حضوري")]]))}
      </div>
      <div class="popover__foot">
        <button type="button" class="btn btn--sm btn--secondary" data-reset>${L("Reset", "إعادة تعيين")}</button>
        <button type="button" class="btn btn--sm" data-apply>${L("Apply", "تطبيق")}</button>
      </div>`;
  }
  pop.addEventListener("change", (e) => {
    const k = e.target.dataset.f;
    if (!k) return;
    draft[k] = e.target.value;
    if (k === "category") draft.activity = "";
    paintPop();
  });
  pop.addEventListener("click", (e) => {
    /* the dashboard's Reset clears the fields AND reloads page 1 */
    if (e.target.closest("[data-reset]")) { draft = {}; ctl.state.extra = {}; ctl.state.page = 1; paintPop(); ctl.paint(); }
    if (e.target.closest("[data-apply]")) { ctl.state.extra = Object.assign({}, draft); ctl.state.page = 1; pop.classList.remove("is-open"); ctl.paint(); }
  });
  document.getElementById("listMount").addEventListener("click", (e) => {
    const b = e.target.closest("[data-filter]");
    if (!b) return;
    if (pop.classList.contains("is-open")) return pop.classList.remove("is-open");
    draft = Object.assign({}, ctl.state.extra);
    paintPop();
    SA.popover(pop, b);
  });
})();
</script>
</body>
</html>
