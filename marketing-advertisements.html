  @media (max-width: 900px) { .sa-side { grid-template-columns: minmax(0, 1fr); } .sa-side__nav { flex-direction: row; flex-wrap: wrap; } }
  .sa-players { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: var(--space-3); }

<script>
(() => {
  /* Advertisement Management — mirrors pages/marketing/advertisements:
       list   marketing-advertisements.html            pills (all · active · inactive · scheduled · expired), search, 8 columns,
                                                        view · edit · activate/deactivate · delete
       form   ?new=1 · ?edit=<id>                      3-step campaign form (details · trigger · content) + live phone preview
       view   ?view=<id>                               detail cards + the same preview
     Display status is computed client-side (advertisementStatus.js). No toasts — success goes back to the list.
     API: GET/POST /advertisement · GET/POST /advertisement/{id} · DELETE /advertisement/{id} · PATCH /advertisement/{id}/status;
          trigger options (screens / custom events) GET /general/app-screens-and-events;
          targeting GET /general/countries (phone country) · /general/gps/countries · /general/gps/states/{country} ·
          /general/gps/cities/{country}/{state}.
     Permissions (constants/permissions.js ADVERTISEMENT; demo ?perm=limited | ?perm=none):
       list + ?view= view_advertisements · Add + ?new= add_advertisements · Edit (row, view page, ?edit=) and
       Activate / Deactivate update_advertisements · Delete delete_advertisements */
  const qs = new URLSearchParams(location.search);
  RD.boot({ activeId: "mk-advertisements", title: "Advertisement Management", perm: qs.get("edit") ? "update_advertisements" : qs.get("new") ? "add_advertisements" : "view_advertisements" });
  if (!document.getElementById("listMount")) return;
  const { T, esc, ic, badge } = SA;
  /* redesign 2026-11-17: every English label on this page reads in sentence case (SA.sc — names and
     acronyms keep their capitals); tab bar between the Marketing pages; list cells, the view's record
     header and tooltips redesigned. Data, steps, validation and flows unchanged. */
  const L = (en, ar) => SA.L(SA.sc(en), ar);
  const S = HF.SA, mount = document.getElementById("listMount");
  const crumbs = [["Marketing", "التسويق", "marketing-advertisements.html"], ["Advertisement Management", "إدارة الإعلانات", "marketing-advertisements.html"]];
  const title = (s) => String(s || "").replace(/_/g, " ").replace(/^\w/, (c) => c.toUpperCase());
  const PRIO = { 1: ["Critical", "danger", "حرج"], 2: ["High", "warning", "عالي"], 3: ["Medium", "primary", "متوسط"], 4: ["Low", "", "منخفض"] };
  const prioBadge = (p) => (PRIO[p] ? badge(PRIO[p][1], L(PRIO[p][0], PRIO[p][2])) : "---");
  const TRIG_IC = { app_launch: "click", screen_load: "mobile", custom_event: "flash" };
  const TRIG_LB = { app_launch: ["On session start", "عند بدء الجلسة"], screen_load: ["On screen load", "عند تحميل الشاشة"], custom_event: ["On custom event", "عند حدث مخصص"] };
  const SCHED_LB = { one_time: ["One time", "مرة واحدة"], periodic: ["Periodic", "دوري"] };
  const PRIO_KEY = { critical: 1, high: 2, medium: 3, low: 4 };

  /* ---------------- data (GET /advertisement) ---------------- */
  const fmt = (d) => `${String(d.getDate()).padStart(2, "0")}/${String(d.getMonth() + 1).padStart(2, "0")}/${d.getFullYear()} ${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`;
  const day = (n) => { const d = new Date(); d.setDate(d.getDate() + n); return d; };
  if (!S.ads) {
    const base = () => ({ campaign_description: "", schedule_type: "one_time", start_mode: "asap", timezone: "Asia/Riyadh", recurrence_type: "daily", periodic_end_type: "never", limit_on: false, max_displays: 1, delay_on: false, delay_value: 4, delay_unit: "hours",
      user_type: "all", activity_status: "all", location_type: "", country: "", state: "", city: "", gender: "all", age: "all", age_group_id: "", app_lang: "all",
      trigger_type: "app_launch", target_screen: "", event_name: "", display_timing: "immediately", delay_seconds: "", image: null, fullscreen: false,
      show_button: true, button_text: "Book now", button_action: "company_page", phone_number: "", coupon_code: "", external_url: "", deep_link: "", partner_id: String(S.partners[0].id),
      show_close_button: true, close_button_style: "icon", button_type: "filled", button_text_color: "#FFFFFF", button_color: "#FC6404", button_font_size: 14, button_border_radius: "16", entry_animation: "fade_in", exit_animation: "fade_out", overlay_color: "#000000", overlay_opacity: 50 });
    S.ads = [
      ["Ramadan Padel Week", 1, 1, -3, 20, "app_launch", "one_time"], ["Summer Swim Offers", 2, 1, 5, 40, "screen_load", "periodic"], ["Kids Camp Early Bird", 3, 1, -40, -5, "custom_event", "one_time"],
      ["New Branch Opening", 2, 0, -2, 30, "app_launch", "one_time"], ["Weekend Football Leagues", 4, 1, -10, null, "screen_load", "periodic"], ["Bowling Night Promo", 3, 1, 12, 45, "app_launch", "periodic"],
    ].map((a, i) => Object.assign(base(), { id: 41 + i, campaign_name: a[0], priority: a[1], active: a[2], start_at: fmt(day(a[3])), end_at: a[4] == null ? null : fmt(day(a[4])), periodic_end_type: a[4] == null ? "never" : "on_date",
      trigger_type: a[5], schedule_type: a[6], start_mode: "specific_datetime", target_screen: a[5] === "screen_load" ? "home" : "", event_name: a[5] === "custom_event" ? "booking_completed" : "", created_at: fmt(day(-50 + i * 4)),
      user_type: i % 2 ? "registered" : "all", location_type: i % 2 ? "phone" : i === 2 ? "gps" : "", country: i % 2 || i === 2 ? "SA" : "", state: i === 2 ? "Riyadh Region" : "", city: i === 2 ? "Riyadh" : "", gender: i % 3 === 1 ? "male" : "all", app_lang: i === 0 ? "ar" : "all",
      max_clicks_per_user: i === 1 ? 3 : null }));
  }
  const parse = (s) => { if (!s) return null; const [d, t] = s.split(" "); const [dd, mm, yy] = d.split("/"); return new Date(+yy, +mm - 1, +dd, ...(t || "0:0").split(":").map(Number)); };
  const dispStatus = (a) => (!+a.active ? "inactive" : parse(a.start_at) > new Date() ? "scheduled" : a.end_at && parse(a.end_at) < new Date() ? "expired" : "active");
  const ST = { active: [L("Active", "نشط"), "primary"], scheduled: [L("Scheduled", "مجدول"), "info"], expired: [L("Expired", "منتهي"), ""], inactive: [L("Inactive", "غير نشط"), "danger"] };
  /* screens / custom events come from GET /general/app-screens-and-events */
  const SCREENS = [["home", "Home"], ["search", "Search"], ["partner_profile", "Partner Profile"], ["bookings", "My Bookings"], ["wallet", "Wallet"]];
  const AGEG = { 2: ["Kids", 4, 12], 3: ["Teens", 13, 17], 4: ["Adults", 18, 59] };
  /* GPS targeting: states / cities of the chosen country (GET /general/gps/states/{country} · /general/gps/cities/{country}/{state}) */
  const gpsStates = (c) => [...new Set(S.GEO.filter((g) => g.country.iso === c).map((g) => g.state.name))];
  const gpsCities = (c, st) => [...new Set(S.GEO.filter((g) => g.country.iso === c && g.state.name === st).map((g) => g.city.name))];
  const EVENTS = [["booking_completed", "Booking Completed"], ["package_purchased", "Package Purchased"], ["event_joined", "Event Joined"], ["wallet_topup", "Wallet Top-up"]];

  /* ---------------- live phone preview (AdvertisementPreview) ---------------- */
  function preview(a, big) {
    const w = big ? 340 : 280, h = big ? 640 : 520, rgba = (hex, op) => { const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${(op || 0) / 100})`; };
    const radius = a.button_border_radius === "custom" ? a.radius_custom || 8 : a.button_border_radius;
    const btn = a.show_button ? `<span style="display:inline-block;padding:8px 18px;font-size:${a.button_font_size}px;border-radius:${radius}px;${a.button_type === "filled" ? `background:${a.button_color};color:${a.button_text_color}` : a.button_type === "outlined" ? `border:1.5px solid ${a.button_color};color:${a.button_color}` : `color:${a.button_color}`};font-weight:600">${esc(a.button_text || "---")}</span>` : "";
    const close = a.show_close_button ? `<span style="position:absolute;top:8px;inset-inline-end:8px;display:inline-flex;gap:4px;align-items:center;font-size:11px;color:#071437;background:#fff;border-radius:999px;padding:3px 7px" data-adclose>${a.close_button_style !== "text" ? "✕" : ""}${a.close_button_style !== "icon" ? ` ${L("Close", "إغلاق")}` : ""}</span>` : "";
    const img = `<div style="height:${a.fullscreen ? "100%" : "140px"};background:linear-gradient(135deg,#FC6404,#FFB27A);display:grid;place-content:center;color:#fff;font-size:12px;text-align:center;padding:8px">${a.image ? esc(a.image) : L("Upload an image to preview", "ارفع صورة للمعاينة")}</div>`;
    return `<div data-phone dir="${a._rtl ? "rtl" : "ltr"}" style="width:${w}px;height:${h}px;margin:auto;border-radius:36px;padding:10px;background:linear-gradient(160deg,#1c1c1c,#3a3a3a)">
      <div style="position:relative;width:100%;height:100%;border-radius:28px;overflow:hidden;background:#f4f5f7">
        <div style="display:flex;justify-content:space-between;padding:8px 16px;font-size:11px;font-weight:600;color:#071437" dir="ltr"><span>9:41</span><span style="width:70px;height:16px;background:#1c1c1c;border-radius:10px"></span><span>▮▮ ◔ ▬</span></div>
        <div style="padding:12px;display:grid;gap:10px">${[60, 90, 90, 40, 90].map((x) => `<div style="height:${x === 40 ? 12 : 54}px;width:${x}%;background:#e3e6ee;border-radius:10px"></div>`).join("")}</div>
        <div data-adlayer style="position:absolute;inset:0;background:${rgba(a.overlay_color, a.overlay_opacity)};display:grid;place-items:center;animation:adIn .4s ease">
          <div style="position:relative;${a.fullscreen ? "position:absolute;inset:0" : "width:230px;border-radius:14px;overflow:hidden;background:#fff"}">${close}${img}${btn ? `<div style="padding:12px;text-align:center;${a.fullscreen ? "position:absolute;bottom:40px;inset-inline:0" : ""}">${btn}</div>` : ""}</div></div>
        <div style="position:absolute;bottom:6px;left:50%;transform:translateX(-50%);width:100px;height:4px;border-radius:2px;background:#071437;opacity:.6"></div></div></div>`;
  }
  const previewCard = (a) => `<section class="card card--pad stack gap-3" style="position:sticky;top:90px">
      <div class="row between gap-2" style="align-items:center;flex-wrap:wrap"><h3 class="t-title">${L("Live advertisement preview", "معاينة الإعلان المباشرة")}</h3>
        <div class="row gap-1" style="flex-wrap:wrap"><button type="button" class="btn btn--sm btn--secondary" data-replay>${ic("refresh")}<span>${L("Replay animation", "إعادة تشغيل الحركة")}</span></button>
        <button type="button" class="btn btn--sm ${a._rtl ? "" : "btn--secondary"}" data-rtl>${L("RTL", "من اليمين لليسار")}</button><button type="button" class="btn btn--sm btn--secondary" data-full>${L("Full screen", "ملء الشاشة")}</button></div></div>
      <div data-prev>${preview(a)}</div>
      <p class="t-xs text-tertiary" style="text-align:center">${L("Click overlay or close button to preview exit animation. Use replay to show entry animation again.", "انقر على الخلفية أو زر الإغلاق لمعاينة حركة الخروج. استخدم إعادة التشغيل لعرض حركة الدخول مرة أخرى.")}</p></section>`;
  const style = document.createElement("style");
  style.textContent = "@keyframes adIn{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:none}}@keyframes adOut{to{opacity:0;transform:scale(.92)}}";
  document.head.appendChild(style);
  const wirePreview = (root, a, repaint) => root.addEventListener("click", (e) => {
    if (e.target.closest("[data-replay]")) return repaint();
    if (e.target.closest("[data-rtl]")) { a._rtl = !a._rtl; return repaint(); }
    if (e.target.closest("[data-full]")) { const el = SA.modal({ id: "adFull", wide: true, title: L("Live advertisement preview", "معاينة الإعلان المباشرة"), body: preview(a, true), foot: "" }); return el; }
    const lay = e.target.closest("[data-adlayer]");
    if (lay && (e.target === lay || e.target.closest("[data-adclose]"))) { lay.style.animation = "adOut .4s ease forwards"; }
  });

  /* ================= view ================= */
  if (qs.get("view")) {
    const a = S.ads.find((x) => String(x.id) === qs.get("view"));
    SA.head(document.getElementById("pageHead"), { title: ["View advertisement campaign", "عرض حملة إعلانية"], crumbs });
    if (!a) { mount.innerHTML = CRUD.alert("warning", L("Campaign not found", "الحملة غير موجودة")); return; }
    const yes = (v) => (v ? L("Yes", "نعم") : L("No", "لا")), sw = (c) => `<span style="display:inline-block;width:14px;height:14px;border-radius:3px;background:${c};vertical-align:middle;border:1px solid var(--color-border)"></span> ${esc(c)}`;
    const c = (t, rows) => PP.card(t, "", PP.kv(rows.filter(Boolean)));
    const st = ST[dispStatus(a)];
    const recordHead = () => `<section class="card card--pad animate-in" style="margin-bottom:var(--space-5)"><div class="record-head" style="align-items:center">
        <div class="record-head__media" style="inline-size:56px;block-size:56px;color:var(--color-primary)">${ic(TRIG_IC[a.trigger_type] || "flash")}</div>
        <div class="record-head__id"><div class="t-xs text-tertiary" style="margin-bottom:var(--space-1)">${L("Campaign", "حملة")} #${a.id}</div>
          <h2 class="t-title" style="margin:0 0 var(--space-2);overflow-wrap:anywhere">${esc(a.campaign_name)}</h2>

        .map(([k, i, t, d, tip]) => `<button type="button" data-trig="${k}" class="card card--pad stack gap-2" style="text-align:start;cursor:pointer;border:2px solid ${a.trigger_type === k ? "var(--color-primary)" : "var(--color-border)"};background:${a.trigger_type === k ? "var(--color-primary-subtle)" : "var(--color-surface)"}">${ic(i)}<b>${t}</b><span class="t-xs text-tertiary">${d}</span><span class="t-xs" style="color:var(--color-text-link)" data-tip="${tip}" data-tip-label="${t}">${L("Know more", "اعرف المزيد")}</span></button>`).join("")}</div>
      ${a.trigger_type === "screen_load" ? fld(L("Target screen", "الشاشة المستهدفة"), sel("target_screen", SCREENS, L("Select screen", "اختر الشاشة")), "target_screen", 1) : ""}
      ${a.trigger_type === "custom_event" ? fld(L("Event name", "اسم الحدث"), sel("event_name", EVENTS, L("Select event", "اختر الحدث")), "event_name", 1) : ""}
      ${fld(L("Then trigger the message", "ثم تفعيل الرسالة"), `<div class="row gap-4">${radio("display_timing", "immediately", L("Immediately", "فوراً"))}${radio("display_timing", "after_delay", L("After delay", "بعد تأخير"))}</div>`)}
      ${a.display_timing === "after_delay" ? fld(L("Delay duration (seconds)", "مدة التأخير (ثواني)"), `<input class="input" type="number" min="1" data-a="delay_seconds" value="${esc(a.delay_seconds)}" style="max-width:200px">`, "delay_seconds", 1) : ""}`);
    const acc = (id, t, sub, icn, body) => `<details ${id === "img" ? "open" : ""} class="card" style="padding:0"><summary class="row between" style="padding:var(--space-4);cursor:pointer;align-items:center"><span class="stack"><b>${t}</b><span class="t-xs text-tertiary">${sub}</span></span><span style="color:var(--color-primary)">${ic(icn)}</span></summary><div class="stack gap-4" style="padding:0 var(--space-4) var(--space-4)">${body}</div></details>`;
    const ACT = { call: ["phone_number", L("Phone number", "رقم الهاتف")], copy_coupon: ["coupon_code", L("Coupon code", "كود الخصم")], external_url: ["external_url", "URL"], deep_link: ["deep_link", L("Deep link", "رابط عميق")] };
    const tab2 = () => `<h3 class="t-title">${L("Advertisement content", "محتوى الإعلان")}</h3>`
      + acc("img", L("Image and content", "الصورة والمحتوى"), L("Customize the advertisement image, title and description.", "تخصيص صورة الإعلان والعنوان والوصف."), "camera", fld(L("Advertisement image", "صورة الإعلان"), `<div class="row gap-4" style="align-items:center;padding:var(--space-3);border:var(--border-thin) dashed var(--color-border);border-radius:var(--radius-lg);background:var(--color-surface-sunken)"><span class="cell-thumb" style="width:56px;height:56px;border-radius:var(--radius-md);flex:none;background:var(--color-surface)">${ic("camera")}</span>
        <div class="stack gap-1" style="min-width:0"><label class="btn btn--sm btn--secondary" style="align-self:flex-start;cursor:pointer">${ic("upload")}<span>${L("Choose image", "اختر صورة")}</span><input type="file" accept=".jpg,.jpeg,.png,.webp" data-img style="position:absolute;inline-size:1px;block-size:1px;opacity:0;pointer-events:none"></label>
        <span class="t-xs text-secondary" style="overflow-wrap:anywhere">${a.image ? esc(a.image) : L("No file chosen", "لم يتم اختيار ملف")}</span><span class="t-xs text-tertiary">${L("Supported formats: JPG, JPEG, PNG, WEBP", "الصيغ المدعومة: JPG, JPEG, PNG, WEBP")}</span></div></div>`))
      + acc("btn", L("Buttons", "الأزرار"), L("Configure CTA button, close button visibility and appearance styles.", "إعداد زر الإجراء وزر الإغلاق ومظهرهما."), "click", `<b>${L("Action button", "زر الإجراء")}</b>${fld(L("Display", "العرض"), sw("show_button", L("Show button", "إظهار الزر")))}
          ${a.show_button ? `${fld(L("Button text", "نص الزر"), `<input class="input" data-a="button_text" value="${esc(a.button_text)}">`)}${fld(L("Button action", "إجراء الزر"), sel("button_action", [["none", L("None", "لا شيء")], ["call", L("Call", "اتصال")], ["copy_coupon", L("Copy coupon code", "نسخ كود الخصم")], ["external_url", L("Open external URL", "فتح رابط خارجي")], ["deep_link", L("Deep link", "رابط عميق")], ["company_page", L("Company page", "صفحة الشريك")]]))}
            ${ACT[a.button_action] ? fld(ACT[a.button_action][1], `<input class="input" data-a="${ACT[a.button_action][0]}" value="${esc(a[ACT[a.button_action][0]])}">`) : a.button_action === "company_page" ? fld(L("Partner", "الشريك"), sel("partner_id", S.partners.slice(0, 8).map((p) => [String(p.id), `${p.company_name} (#${p.id} - ${p.owner_name || "---"})`]))) : ""}
            <b>${L("Button appearance", "مظهر الزر")}</b>${fld(L("Button type", "نوع الزر"), `<div class="row gap-4">${radio("button_type", "filled", L("Filled", "ممتلئ"))}${radio("button_type", "outlined", L("Outlined", "محدد"))}${radio("button_type", "text", L("Text", "نص"))}</div>`)}
            <div class="grid grid-2">${fld(L("Button text color", "لون نص الزر"), color("button_text_color"))}${fld(L("Button color", "لون الزر"), color("button_color"))}</div>
            ${fld(L("Button font size", "حجم خط الزر"), `<input class="input" type="number" min="10" max="24" data-a="button_font_size" value="${a.button_font_size}" style="max-width:120px">`)}
            ${fld(L("Button border radius", "انحناء زوايا الزر"), `<div class="row gap-4" style="flex-wrap:wrap">${radio("button_border_radius", "0", L("Square", "مربع"))}${radio("button_border_radius", "16", L("Rounded", "مستدير"))}${radio("button_border_radius", "25", L("Pill shape", "شكل حبة"))}${radio("button_border_radius", "custom", L("Custom", "مخصص"))}${a.button_border_radius === "custom" ? `<span class="row gap-2" style="align-items:center"><input type="range" min="0" max="50" data-a="radius_custom" value="${a.radius_custom || 8}"><input class="input" type="number" min="0" max="50" data-a="radius_custom" value="${a.radius_custom || 8}" style="width:80px" aria-label="${L("Button border radius", "انحناء زوايا الزر")}"></span>` : ""}</div>`)}` : ""}
          <hr style="border:0;border-top:var(--border-thin) solid var(--color-border)"><b>${L("Close button", "زر الإغلاق")}</b>${fld(L("Display", "العرض"), sw("show_close_button", L("Show close button", "إظهار زر الإغلاق")))}
          ${a.show_close_button ? fld(L("Close button style", "نمط زر الإغلاق"), `<div class="row gap-4">${radio("close_button_style", "icon", L("Icon only", "أيقونة فقط"))}${radio("close_button_style", "text", L("Text only", "نص فقط"))}${radio("close_button_style", "icon_text", L("Icon + text", "أيقونة + نص"))}</div>`) : ""}`)
      + acc("pop", L("Popup settings", "إعدادات النافذة المنبثقة"), L("Customize popup animations and overlay settings.", "تخصيص حركات النافذة المنبثقة وإعدادات الخلفية."), "layout", `${fld(L("Display", "العرض"), sw("fullscreen", L("Full screen ad", "إعلان ملء الشاشة")))}<b>${L("Animation", "الحركة")}</b>
          <div class="grid grid-2">${fld(L("Entry animation", "حركة الدخول"), sel("entry_animation", [["fade_in", "Fade In"], ["slide_up", "Slide Up"], ["slide_down", "Slide Down"], ["zoom_in", "Zoom In"]], L("None", "لا شيء")))}${fld(L("Exit animation", "حركة الخروج"), sel("exit_animation", [["fade_out", "Fade Out"], ["slide_up", "Slide Up"], ["slide_down", "Slide Down"], ["zoom_out", "Zoom Out"]], L("None", "لا شيء")))}</div>
          ${fld(L("Background overlay color", "لون الخلفية الشفافة"), `<div class="row gap-2" style="align-items:center">${color("overlay_color")}<span>|</span><input class="input" type="number" min="0" max="100" data-a="overlay_opacity" value="${a.overlay_opacity}" style="width:90px">%</div>`)}`);
    const paint = () => {
      const done = (n) => !Object.keys(stepErrors(n)).length;
      mount.innerHTML = `<div class="stack gap-5">${err ? CRUD.alert("danger", err) : ""}
        <section class="card card--pad row gap-3" style="align-items:center;flex-wrap:wrap">${STEPS.map((t, i) => `<button type="button" data-step="${i}" class="row gap-2" style="align-items:center;background:none;border:0;cursor:pointer;color:${i === step ? "var(--color-primary-ink)" : "var(--color-text-secondary)"};font-weight:${i === step ? 700 : 500}">
            <span style="width:30px;height:30px;border-radius:50%;display:grid;place-content:center;background:${i === step ? "var(--color-primary)" : done(i) ? "var(--color-success-subtle)" : "var(--color-surface-sunken)"};color:${i === step ? "var(--color-on-primary)" : done(i) ? "var(--color-success)" : "inherit"}">${done(i) && i !== step ? ic("check") : i + 1}</span>${t}</button>${i < 2 ? `<span style="flex:1;min-width:20px;height:2px;background:var(--color-border)"></span>` : ""}`).join("")}</section>
        ${step === 2 ? `<div class="sa-side" style="grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr))"><div class="stack gap-4">${tab2()}</div>${previewCard(a)}</div>` : `<div class="stack gap-5">${step === 0 ? tab0() : tab1()}</div>`}
        <section class="card card--pad row between gap-3"><div class="row gap-2"><a class="btn btn--danger" href="marketing-advertisements.html">${L("cancel", "إلغاء")}</a>${step ? `<button type="button" class="btn btn--secondary" data-back>${L("back", "رجوع")}</button>` : ""}</div>
          <button type="button" class="btn" data-next>${step < 2 ? L("Next", "التالي") : L("Save advertisement", "حفظ الإعلان")}</button></section></div>`;
    };
    const set = (k, v) => {
      a[k] = v;
      const resetProfile = () => { a.gender = "all"; a.age = "all"; a.age_group_id = ""; };
      /* user type: not registered → activity + profile reset; the location type is cleared only when it was Phone country */
      if (k === "user_type" && v !== "registered") { a.activity_status = "all"; resetProfile(); if (a.location_type === "phone") { a.location_type = ""; a.country = ""; a.state = ""; a.city = ""; } }
      /* location type: country / state / city cleared; GPS also resets the profile settings */
      if (k === "location_type") { a.country = ""; a.state = ""; a.city = ""; if (v === "gps" || !v) resetProfile(); }
      if (k === "country") { a.state = ""; a.city = ""; }
      if (k === "state") a.city = "";
    };
    mount.addEventListener("input", (e) => { const k = e.target.dataset.a; if (k && ["campaign_name", "campaign_description", "button_text"].includes(k)) a[k] = e.target.value; if (k && e.target.type === "color") { a[k] = e.target.value; paint(); } });
    mount.addEventListener("change", (e) => {
      const t = e.target, k = t.dataset.a;
      if (t.dataset.sched) { const [p, v] = t.dataset.sched.split(":"); a.schedule_type = p; if (p === "periodic") a.recurrence_type = v; else a.start_mode = v; }
      else if (t.dataset.dt) { const d = new Date(t.value); a[t.dataset.dt] = isNaN(d) ? "" : fmt(d); }
      else if (t.matches("[data-img]")) { const f = t.files[0]; if (f && !/\.(jpe?g|png|webp)$/i.test(f.name)) err = L("Invalid image format", "صيغة الصورة غير صالحة"); else { err = ""; a.image = f ? f.name : null; } }
      else if (k) set(k, t.type === "checkbox" ? t.checked : t.type === "radio" ? (k === "active" ? +t.value : t.value) : t.value);
      paint();
    });
    mount.addEventListener("click", (e) => {
      const pr = e.target.closest("[data-prio]"); if (pr) { a.priority = +pr.dataset.prio; return paint(); }
      const tr = e.target.closest("[data-trig]"); if (tr) { a.trigger_type = tr.dataset.trig; return paint(); }
      const st = e.target.closest("[data-step]"); if (st) { step = +st.dataset.step; err = ""; touched = false; return paint(); } /* every step is clickable, no validation */
      if (e.target.closest("[data-reset]")) { Object.assign(a, { schedule_type: "one_time", start_mode: "asap", start_at: "", end_at: "", periodic_end_type: "never", timezone: "Asia/Riyadh", limit_on: false, delay_on: false }); return paint(); }
      if (e.target.closest("[data-clearloc]")) { set("location_type", ""); return paint(); }
      if (e.target.closest("[data-back]")) { step--; err = ""; touched = false; return paint(); }
      if (e.target.closest("[data-next]")) {
        touched = true;
        if (step < 2) { if (Object.keys(stepErrors(step)).length) { err = L("Please complete all required fields in this step before continuing.", "يرجى إكمال جميع الحقول المطلوبة في هذه الخطوة قبل المتابعة."); paint(); return scrollTo({ top: 0 }); } step++; err = ""; touched = false; return paint(); }
        /* validateBeforeSave: schema + step 1 errors; only the date-range error jumps back to step 1 */
        const e0 = stepErrors(0);
        if (e0.end_at) { err = e0.end_at; step = 0; paint(); return scrollTo({ top: 0 }); }
        if (Object.keys(e0).length) { err = L("Please complete all required fields in this step before continuing.", "يرجى إكمال جميع الحقول المطلوبة في هذه الخطوة قبل المتابعة."); touched = false; paint(); return scrollTo({ top: 0 }); }
        const b = e.target.closest("[data-next]"); b.disabled = true; b.textContent = L("Confirming…", "جاري التأكيد…");
        setTimeout(() => { if (src) Object.assign(src, a); else S.ads.unshift(Object.assign(a, { id: Math.max(...S.ads.map((x) => x.id)) + 1, created_at: fmt(new Date()) })); location.href = "marketing-advertisements.html"; }, 500);
        return;
      }
    });
    wirePreview(mount, a, paint);
    paint();
    return;
  }

  /* ================= list ================= */
  SA.head(document.getElementById("pageHead"), { title: ["Advertisement Management", "إدارة الإعلانات"], crumbs: [["Marketing", "التسويق", "marketing-advertisements.html"]], actions: `<a class="btn btn--sm" href="marketing-advertisements.html?new=1" data-perm="add_advertisements">${ic("plus")}<span>${L("Add advertisement", "إضافة إعلان")}</span></a>` });
  {
    const TABS = [["marketing-promo-codes", "ticket", "Promo codes", "أكواد الخصم"], ["marketing-partner-promo-codes", "hotel", "Partner's promo codes", "أكواد خصم الشركاء"], ["marketing-advertisements", "flash", "Advertisements", "الإعلانات"]];
    mount.insertAdjacentHTML("beforebegin", `<nav class="sa-tabbar" aria-label="${L("Marketing", "التسويق")}"><div class="tabs">${TABS.map((t) => `<a href="${t[0]}.html" class="${t[0] === "marketing-advertisements" ? "is-active" : ""}"${t[0] === "marketing-advertisements" ? ' aria-current="page"' : ""}>${ic(t[1])}<span>${SA.L(t[2], t[3])}</span></a>`).join("")}</div></nav>`);
    const on = document.querySelector(".sa-tabbar .is-active"); if (on) on.scrollIntoView({ block: "nearest", inline: "nearest" });
  }
  const ctl = SA.list({
    mount, data: S.ads,
    pills: [["all", "All", "الكل", "list", "primary"], ["active", "Active", "نشط", "check", "success"], ["inactive", "Inactive", "غير نشط", "eyeOff", "danger"], ["scheduled", "Scheduled", "مجدول", "clock", "info"], ["expired", "Expired", "منتهي", "warn", "warning"]].map((p) => ({ key: p[0], label: [p[1], p[2]], icon: p[3], tone: p[4] })),
    pillMatch: (r, k) => k === "all" || dispStatus(r) === k,
    search: ["Search by campaign name or ID", "البحث باسم الحملة أو المعرف"], searchMatch: (r, q) => (/^\d+$/.test(q) ? String(r.id) === q : r.campaign_name.toLowerCase().includes(q)),
    empty: ["There is no data yet", "لا توجد بيانات بعد"],
    columns: [
      { head: ["Campaign ID", "معرف الحملة"], align: "center", cell: (r) => `<span class="text-tertiary" style="font-variant-numeric:tabular-nums">#${r.id}</span>` },
      { head: ["Campaign name", "اسم الحملة"], cell: (r) => `<div class="cell-user"><span class="cell-thumb">${ic(TRIG_IC[r.trigger_type] || "flash")}</span><a href="marketing-advertisements.html?view=${r.id}" style="color:inherit"><b>${esc(r.campaign_name)}</b></a></div>` },
      { head: ["Priority", "الأولوية"], align: "center", cell: (r) => prioBadge(r.priority) },
      { head: ["Status", "الحالة"], align: "center", cell: (r) => { const s = ST[dispStatus(r)]; return badge(s[1], s[0]); } },
      { head: ["Trigger type", "نوع المحفز"], cell: (r) => `<span class="row gap-1 t-sm" style="align-items:center">${L(...(TRIG_LB[r.trigger_type] || [title(r.trigger_type), title(r.trigger_type)]))}</span>` },
      { head: ["Schedule type", "نوع الجدولة"], align: "center", cell: (r) => badge("", L(...(SCHED_LB[r.schedule_type] || [title(r.schedule_type), title(r.schedule_type)]))) },
      { head: ["Created date", "تاريخ الإنشاء"], align: "center", cell: (r) => `<span class="t-sm text-secondary">${esc(r.created_at)}</span>` },
      { head: ["Actions", "الإجراءات"], align: "center", cell: (r) => `<div class="row gap-1" style="justify-content:center"><a class="icon-btn" href="marketing-advertisements.html?view=${r.id}" data-tip="${L("View", "عرض")}" aria-label="${L("View", "عرض")}">${ic("eye")}</a><a class="icon-btn" href="marketing-advertisements.html?edit=${r.id}" data-perm="update_advertisements" data-tip="${L("Edit", "تعديل")}" aria-label="${L("Edit", "تعديل")}">${ic("edit")}</a>
          ${SA.iconBtn(+r.active ? "eyeOff" : "check", +r.active ? L("Deactivate", "إلغاء التفعيل") : L("Activate", "تفعيل"), `data-toggle="${r.id}" data-perm="update_advertisements"`)}${SA.iconBtn("trash", L("Delete", "حذف"), `data-del="${r.id}" data-perm="delete_advertisements"`)}</div>` },
    ],
  });
  mount.addEventListener("click", (e) => {
    const t = e.target.closest("[data-toggle],[data-del]"); if (!t) return;
    const r = S.ads.find((x) => String(x.id) === (t.dataset.toggle || t.dataset.del)), isDel = !!t.dataset.del, on = +r.active;
    const el = SA.modal({ id: "adConfirm", title: isDel ? L("Delete campaign", "حذف الحملة") : on ? L("Deactivate", "إلغاء التفعيل") : L("Activate", "تفعيل"),
      body: `<p class="t-sm text-secondary">${isDel ? L("Are you sure you want to delete this campaign?", "هل أنت متأكد من حذف هذه الحملة؟") : on ? L("Are you sure you want to deactivate this campaign?", "هل أنت متأكد من إلغاء تفعيل هذه الحملة؟") : L("Are you sure you want to activate this campaign?", "هل أنت متأكد من تفعيل هذه الحملة؟")}${isDel ? "" : ` <b>"${esc(r.campaign_name)}"</b>`}</p>`,
      foot: `<button class="btn btn--ghost" data-close>${L("cancel", "إلغاء")}</button><button class="btn" data-ok>${L("Confirm", "تأكيد")}</button>` });
    el.querySelector("[data-ok]").onclick = (ev) => { ev.currentTarget.disabled = true; ev.currentTarget.textContent = L("Confirming…", "جاري التأكيد…"); setTimeout(() => { if (isDel) S.ads.splice(S.ads.indexOf(r), 1); else r.active = on ? 0 : 1; SA.close(el); ctl.paint(); }, 400); };
  });
})();
</script>
</body>
