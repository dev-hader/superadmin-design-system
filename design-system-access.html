<title>Design System Access · HighFive Super Admin</title>

<style>
  .sa-hero { display: flex; gap: var(--space-6); flex-wrap: wrap; align-items: flex-start; margin-bottom: var(--space-5); }
  .sa-hero__status { min-width: 260px; flex: 0 1 340px; border-inline-start: var(--border-thin) solid var(--color-border-subtle); padding-inline-start: var(--space-6); }
  @media (max-width: 768px) { .sa-hero__status { border: 0; padding: 0; flex-basis: 100%; } }
  .sa-kv { display: grid; grid-template-columns: minmax(140px, 220px) minmax(0, 1fr); gap: var(--space-3) var(--space-5); margin: 0; }
  .sa-kv dt { color: var(--color-text-tertiary); font-size: var(--text-sm); }
  .sa-kv dd { margin: 0; font-weight: var(--weight-semibold); font-size: var(--text-sm); }
  @media (max-width: 560px) { .sa-kv { grid-template-columns: minmax(0, 1fr); gap: var(--space-1); } .sa-kv dd { margin-bottom: var(--space-2); } }
  .sa-tabbar { margin-bottom: var(--space-6); overflow-x: auto; }
  .sa-tabbar .tabs { flex-wrap: nowrap; white-space: nowrap; }
  .sa-tabbar .tabs > * { display: inline-flex; align-items: center; gap: var(--space-1); }
  .sa-gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: var(--space-4); }
  .sa-tile { margin: 0; border: var(--border-thin) solid var(--color-border); border-radius: var(--radius-lg); overflow: hidden; }
  .sa-tile.is-main { border-color: var(--color-warning); }
  .sa-tile__media { height: 150px; display: grid; place-content: center; justify-items: center; gap: var(--space-1); background: var(--color-surface-sunken); color: var(--color-text-tertiary); }
  .sa-tile figcaption { padding: var(--space-2); justify-content: center; }
  .sa-side { display: grid; grid-template-columns: 200px minmax(0, 1fr); gap: var(--space-6); align-items: start; }
  .sa-side__nav { display: flex; flex-direction: column; gap: var(--space-1); }
  .sa-side__nav a, .sa-side__nav span { display: flex; justify-content: space-between; align-items: center; padding: var(--space-2) var(--space-3); border-radius: var(--radius-md); font-size: var(--text-sm); color: var(--color-text-secondary); }
  .sa-side__nav a.is-active { background: var(--color-primary-subtle); color: var(--color-primary-ink); font-weight: var(--weight-semibold); }
  .sa-side__nav a:hover { background: var(--color-surface-hover); }
  .sa-side__nav .is-locked { opacity: .5; cursor: not-allowed; }
  @media (max-width: 900px) { .sa-side { grid-template-columns: minmax(0, 1fr); } .sa-side__nav { flex-direction: row; flex-wrap: wrap; } }
  .sa-players { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: var(--space-3); }
  .sa-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: var(--space-4); }
  .sa-formrow { display: grid; grid-template-columns: 180px minmax(0, 1fr); gap: var(--space-4); align-items: start; }
  @media (max-width: 640px) { .sa-formrow { grid-template-columns: minmax(0, 1fr); gap: var(--space-1); } }
</style>
</head>
<body>
<div class="app" id="app">
  <div class="scrim"></div>
  <aside class="sidebar" id="sidebarMount"></aside>
  <div class="main">
    <header class="topbar" id="topbarMount"></header>
    <nav id="topTabsMount"></nav>

    <main class="content"><div class="content__inner" style="max-width:none">
      <div id="pageHead"></div>
      <div id="listMount"></div>
    </div></main>
  </div>
</div>

<script src="assets/js/data.js"></script>
<script src="assets/js/env.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/shell.js"></script>
<script src="assets/js/sa-data.js"></script>
<script src="assets/js/sa-kit.js"></script>
<script src="assets/js/sa-translation.js"></script>
<script src="assets/js/pp/pp-core.js"></script>
<script src="assets/js/sa-crud.js"></script>
<script>
(() => {
  /* Design System admin — pages/design-systems · design-system-pages · design-system-access.
     One script, picked by file name; each page is a CRUD.page config.
       design-systems.html        systems (name · active) — pills all / active / inactive
       design-system-pages.html   pages = permissions (title · key) per system; system rows are read-only;
                                  key auto-slugs from the name until edited by hand
       design-system-access.html  users (name · email · password) with permission ids grouped by system;
                                  picking any page of a system also grants its "dashboard" page */
  const file = location.pathname.split("/").pop().replace(/^_preview-/, "").replace(".html", "");
  RD.boot({ activeId: { "design-systems": "dsa-systems", "design-system-pages": "dsa-pages", "design-system-access": "dsa-access" }[file] || "dsa-systems", title: "Design System" });
  if (!document.getElementById("listMount")) return;
  const { L, T, esc, badge } = SA;
  const S = HF.SA, R = CRUD.rules;
  const MAX50 = ["Maximum 50 symbols", "الحد الأقصى 50 رمز"]; /* the dashboard's message for a 100-char limit */
  const slug = (s) => String(s || "").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
  const nice = (k) => k.split("-").map((w) => w.charAt(0).toUpperCase() + w.slice(1)).join(" ");
  const today = (() => { const d = new Date(); return `${String(d.getDate()).padStart(2, "0")}/${String(d.getMonth() + 1).padStart(2, "0")}/${d.getFullYear()}`; })();

  /* ---- data (GET /design-systems · /design-system-permissions · /design-system-users) ---- */
  if (!S._dsa) {
    const systems = [["Partner Design System", 1], ["Superadmin", 1], ["Marketing Site", 0]].map((s, i) => ({ id: i + 1, name: s[0], active: s[1], created_at: "02/10/2026" }));
    let pid = 1;
    const pages = [];
    systems.forEach((s) => ["dashboard", "foundations", "components", "templates"].concat(s.id === 2 ? ["partners", "packages"] : ["design-system"]).forEach((k, i) => pages.push({ id: pid++, title: nice(k), permission: k, system_id: s.id, type: i < 4 ? "system" : "custom", is_system: i < 4 ? 1 : 0, created_at: i < 4 ? "02/10/2026" : today })));
    const users = [["Hadeer Abdulfatah", "hadeer@highfive.sa", [1, 2, 3, 8, 9]], ["Magdy Ali", "magdy@highfive.sa", [8, 13, 14]], ["Design Reviewer", "review@highfive.sa", [1, 5]]].map((u, i) => ({ id: i + 1, name: u[0], email: u[1], permissions: u[2] }));
    S._dsa = { systems, pages, users };
  }
  const D = S._dsa;
  const sysOf = (id) => D.systems.find((s) => s.id === +id);
  const isNew = (p) => p.is_system === 0 || p.created_at === today;
  const newTag = ` <b style="color:var(--color-success)">${L("New", "جديد")}</b>`;
  const formBase = { labelCols: true, creatingText: ["create", "إنشاء"], updatingText: ["update", "تحديث"] };

  const CFG = {
    "design-systems": {
      title: ["Design Systems", "أنظمة التصميم"], data: D.systems, pills: true, search: ["Search by name", "البحث بالاسم"], add: ["add new", "إضافة جديد"],
      empty: ["No design systems found. Try adjusting your search, or add a new one.", "لا توجد أنظمة تصميم. حاول تعديل البحث أو أضف نظاماً جديداً."],
      columns: [{ head: ["Name", "الاسم"], cell: (r) => `<b>${esc(r.name)}</b>` }, { head: ["Status", "الحالة"], cell: (r) => (+r.active ? badge("success", L("Active", "مفعّل")) : badge("danger", L("Inactive", "غير مفعّل"))) }],
      form: Object.assign({}, formBase, { createTitle: ["Add Design System", "إضافة نظام تصميم"], editTitle: ["Edit Design System", "تعديل نظام تصميم"],
        fields: [{ key: "name", label: ["Name", "الاسم"], req: 1, placeholder: ["e.g. Partner Design System", "مثال: نظام تصميم الشركاء"], rules: [R.req, R.max(100, MAX50), (v, _, row) => (D.systems.some((s) => s !== row && s.name.toLowerCase() === String(v).toLowerCase()) ? L("This name is already in use. Please choose another one.", "هذا الاسم مستخدم بالفعل، يرجى اختيار اسم آخر.") : "")] },
          { key: "active", type: "switch", label: ["Active", "مفعّل"], default: 1 }] }),
      del: { title: ["Delete Design System", "حذف نظام تصميم"], body: ["Are you sure you want to delete this design system? Its pages and permissions will no longer be available.", "هل أنت متأكد من حذف نظام التصميم هذا؟ لن تعود صفحاته وصلاحياته متاحة بعد الحذف."], danger: true },
    },
    "design-system-pages": {
      title: ["Design System Pages", "صفحات نظام التصميم"], data: D.pages, search: ["Search by page name or key", "البحث باسم الصفحة أو المفتاح"], searchKeys: ["title", "permission"], add: ["add new", "إضافة جديد"],
      /* system filter (react-select in the dashboard) */
      toolbarExtra: (st) => `<div class="select" style="min-width:230px"><select data-sys aria-label="${L("Filter by design system", "تصفية حسب نظام التصميم")}"><option value="">${L("All Design Systems", "كل أنظمة التصميم")}</option>${D.systems.filter((s) => +s.active).map((s) => `<option value="${s.id}" ${String(st.extra.sys || "") === String(s.id) ? "selected" : ""}>${esc(s.name)}</option>`).join("")}</select><span class="select__caret">${SA.ic("chevronDown")}</span></div>`,
      extraMatch: (r, f) => !f.sys || String(r.system_id) === f.sys,
      empty: ["No pages found. Try adjusting your search, or add a new page.", "لا توجد صفحات. حاول تعديل البحث أو أضف صفحة جديدة."],
      columns: [
        { head: ["Page Name", "اسم الصفحة"], cell: (r) => `<b>${esc(r.title || r.permission)}</b> ${r.type === "system" ? badge("primary", L("System", "نظامي")) : isNew(r) ? badge("success", L("New", "جديد")) : ""}` },
        { head: ["Design System", "نظام التصميم"], cell: (r) => (sysOf(r.system_id) ? badge("info", sysOf(r.system_id).name) : `<span class="text-tertiary">—</span>`) },
        { head: ["Key", "المفتاح"], cell: (r) => `<code>${esc(r.permission)}</code>` },
      ],
      canEdit: (r) => r.type !== "system", canDel: (r) => r.type !== "system", /* system pages are built-in and view-only */
      form: Object.assign({}, formBase, { createTitle: ["Add Page", "إضافة صفحة"], editTitle: ["Edit Page", "تعديل صفحة"],
        fields: [{ key: "system_id", type: "select", label: ["Design System", "نظام التصميم"], req: 1, placeholder: ["Select a design system", "اختر نظام تصميم"], options: () => D.systems.filter((s) => +s.active).map((s) => [s.id, s.name]), rules: [R.req] },
          { key: "title", label: ["Page Name", "اسم الصفحة"], req: 1, placeholder: ["e.g. Design System", "مثال: Design System"], rules: [R.req, R.max(100, MAX50)] },
          { key: "permission", label: ["Key", "المفتاح"], req: 1, placeholder: ["e.g. design-system", "مثال: design-system"], hint: ["Auto-generated from the page name. Lowercase letters, numbers and dashes only.", "يتم إنشاؤه تلقائياً من اسم الصفحة. أحرف إنجليزية صغيرة وأرقام وشرطات فقط."],
            rules: [R.req, (v) => (v && !/^[a-z0-9]+(-[a-z0-9]+)*$/.test(v) ? L("Key must contain only lowercase letters, numbers and dashes (e.g. design-system).", "يجب أن يحتوي المفتاح على أحرف إنجليزية صغيرة وأرقام وشرطات فقط (مثال: design-system).") : ""),
              (v, vals, row) => (D.pages.some((p) => p !== row && p.permission === v && String(p.system_id) === String(vals.system_id)) ? L("This key is already in use. Please choose another one.", "هذا المفتاح مستخدم بالفعل، يرجى اختيار مفتاح آخر.") : "")] }],
        /* key follows the name until it is edited by hand (never on edit) */
        onOpen: (el, row) => { if (row) return; const n = el.querySelector('[data-f="title"]'), k = el.querySelector('[data-f="permission"]'); let manual = false; k.oninput = () => (manual = true); n.oninput = () => { if (!manual) k.value = slug(n.value); }; } }),
      onSave: (v, r) => { const vals = { title: v.title, permission: v.permission, system_id: +v.system_id }; if (r) Object.assign(r, vals); else D.pages.unshift(Object.assign({ id: Math.max(...D.pages.map((p) => p.id)) + 1, type: "custom", is_system: 0, created_at: today }, vals)); },
      del: { title: ["Delete Page", "حذف صفحة"], body: ["Are you sure you want to delete this page? It will no longer be assignable as a permission.", "هل أنت متأكد من حذف هذه الصفحة؟ لن تعود متاحة كصلاحية بعد الحذف."], danger: true },
    },
    "design-system-access": {
      title: ["Design System Access", "صلاحيات نظام التصميم"], data: D.users, search: ["Search by name or email", "البحث بالاسم أو البريد الإلكتروني"], searchKeys: ["name", "email"], add: ["add new", "إضافة جديد"],
      empty: ["No users found. Try adjusting your search, or add a new access.", "لا يوجد مستخدمون. حاول تعديل البحث أو أضف صلاحية جديدة."],
      columns: [
        { head: ["Name", "الاسم"], cell: (r) => `<b>${esc(r.name)}</b>` },
        { head: ["Email", "البريد الإلكتروني"], cell: (r) => esc(r.email) },
        { head: ["Permissions", "الصلاحيات"], cell: (r) => { const by = {}; r.permissions.forEach((id) => { const p = D.pages.find((x) => x.id === +id); if (!p) return; const g = (sysOf(p.system_id) || {}).name || L("Other", "أخرى"); (by[g] = by[g] || []).push(p); });
          return `<div class="stack gap-2">${Object.entries(by).map(([g, ps]) => `<div><span class="t-xs text-tertiary" style="text-transform:uppercase;letter-spacing:.06em">${esc(g)}</span><div class="row gap-1" style="flex-wrap:wrap">${ps.map((p) => `<span class="badge badge--primary">${esc(p.title || nice(p.permission))}${isNew(p) ? newTag : ""}</span>`).join("")}</div></div>`).join("")}</div>`; } },
      ],
      form: Object.assign({}, formBase, { wide: true, createTitle: ["Add Access", "إضافة صلاحية"], editTitle: ["Edit Access", "تعديل صلاحية"],
        fields: (row) => [{ key: "name", label: ["Name", "الاسم"], req: 1, placeholder: ["Enter full name", "أدخل الاسم الكامل"], rules: [R.req, R.max(100, MAX50)] },
          { key: "email", type: "email", label: ["Email", "البريد الإلكتروني"], req: 1, placeholder: ["Enter email address", "أدخل البريد الإلكتروني"], rules: [R.req, (v) => (v && !/^\S+@\S+\.\S+$/.test(v) ? L("Wrong email format", "تنسيق البريد الإلكتروني خاطئ") : ""), (v, _, r) => (D.users.some((u) => u !== r && u.email === v) ? L("This email is already in use. Please choose another one.", "هذا البريد الإلكتروني مستخدم بالفعل، يرجى اختيار بريد آخر.") : "")] },
          { key: "password", type: "password", label: ["Password", "كلمة المرور"], req: !row, placeholder: row ? ["Leave blank to keep current password", "اتركه فارغاً للاحتفاظ بكلمة المرور الحالية"] : ["Enter password", "أدخل كلمة المرور"], get: () => "",
            rules: [(v) => (!row && !v ? CRUD.REQ() : v && !/^(?=.*[A-Za-z])(?=.*\d).{8,}$/.test(v) ? L("Password must be at least 8 characters and include a letter and a number.", "يجب أن تتكون كلمة المرور من 8 أحرف على الأقل وتحتوي على حرف ورقم.") : "")] },
          { key: "permissions", type: "groups", label: ["Permissions", "الصلاحيات"], req: 1, rules: [R.req],
            options: () => D.systems.filter((s) => +s.active).map((s) => ({ group: s.name, items: D.pages.filter((p) => p.system_id === s.id).map((p) => [p.id, p.title || p.permission, isNew(p) ? ` ${badge("success", L("New", "جديد"))}` : ""]) })) }] },
        /* baseline rule: picking any page of a system also grants that system's "dashboard" */
        { onOpen: (el) => el.addEventListener("change", (e) => { const b = e.target; if (!b.matches('[data-m="permissions"]') || !b.checked) return; const p = D.pages.find((x) => x.id === +b.value); const dash = D.pages.find((x) => x.system_id === p.system_id && x.permission === "dashboard"); const box = dash && el.querySelector(`[data-m="permissions"][value="${dash.id}"]`); if (box) box.checked = true; }) }),
      onSave: (v, r) => { const vals = { name: v.name, email: v.email, permissions: v.permissions.map(Number) }; if (r) Object.assign(r, vals); else D.users.unshift(Object.assign({ id: Math.max(...D.users.map((u) => u.id)) + 1 }, vals)); },
      del: { title: ["Delete Access", "حذف صلاحية"], body: ["Are you sure you want to delete this user's access? They will no longer be able to sign in.", "هل أنت متأكد من حذف صلاحية وصول هذا المستخدم؟ لن يتمكن بعدها من تسجيل الدخول."], danger: true },
    },
  };
  const cfg = CFG[file] || CFG["design-systems"];
  const ctl = CRUD.page(cfg);
  if (file === "design-system-pages") {
    /* info note above the card */
    document.getElementById("listMount").insertAdjacentHTML("beforebegin", `<div class="alert alert--info" style="margin-bottom:var(--space-4)"><span class="alert__icon">${SA.ic("info")}</span><div class="alert__body">${L("Pages added here become available as permissions in", "الصفحات المضافة هنا تصبح متاحة كصلاحيات في")} <b>${L("Design System Access", "صلاحيات نظام التصميم")}</b> ${L("when assigning access to users.", "عند تعيين الصلاحيات للمستخدمين.")}</div></div>`);
    document.getElementById("listMount").addEventListener("change", (e) => { if (e.target.matches("[data-sys]")) { ctl.state.extra = { sys: e.target.value }; ctl.state.page = 1; ctl.paint(); } });
  }
})();
</script>
</body>
</html>
