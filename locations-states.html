<style>
  .sa-hero { display: flex; gap: var(--space-6); flex-wrap: wrap; align-items: flex-start; margin-bottom: var(--space-5); }
  .sa-hero__status { min-width: 260px; flex: 0 1 340px; border-inline-start: var(--border-thin) solid var(--color-border-subtle); padding-inline-start: var(--space-6); }
  @media (max-width: 768px) { .sa-hero__status { border: 0; padding: 0; flex-basis: 100%; } }
  .sa-kv { display: grid; grid-template-columns: minmax(140px, 220px) minmax(0, 1fr); gap: var(--space-3) var(--space-5); margin: 0; }
  .sa-kv dt { color: var(--color-text-tertiary); font-size: var(--text-sm); }
  .sa-kv dd { margin: 0; font-weight: var(--weight-semibold); font-size: var(--text-sm); }
  @media (max-width: 560px) { .sa-kv { grid-template-columns: minmax(0, 1fr); gap: var(--space-1); } .sa-kv dd { margin-bottom: var(--space-2); } }
  .sa-tabbar { margin-bottom: var(--space-6); overflow-x: auto; }
  .sa-tabbar .tabs { flex-wrap: nowrap; white-space: nowrap; }
  .sa-tabbar .tabs > * { display: inline-flex; align-items: center; gap: var(--space-1); }
  .sa-gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: var(--space-4); }
  .sa-tile { margin: 0; border: var(--border-thin) solid var(--color-border); border-radius: var(--radius-lg); overflow: hidden; }
  .sa-tile.is-main { border-color: var(--color-warning); }
  .sa-tile__media { height: 150px; display: grid; place-content: center; justify-items: center; gap: var(--space-1); background: var(--color-surface-sunken); color: var(--color-text-tertiary); }
  .sa-tile figcaption { padding: var(--space-2); justify-content: center; }
  .sa-side { display: grid; grid-template-columns: 200px minmax(0, 1fr); gap: var(--space-6); align-items: start; }
  .sa-side__nav { display: flex; flex-direction: column; gap: var(--space-1); }
  .sa-side__nav a, .sa-side__nav span { display: flex; justify-content: space-between; align-items: center; padding: var(--space-2) var(--space-3); border-radius: var(--radius-md); font-size: var(--text-sm); color: var(--color-text-secondary); }
  .sa-side__nav a.is-active { background: var(--color-primary-subtle); color: var(--color-primary-ink); font-weight: var(--weight-semibold); }
  .sa-side__nav a:hover { background: var(--color-surface-hover); }

  @media (max-width: 900px) { .sa-side { grid-template-columns: minmax(0, 1fr); } .sa-side__nav { flex-direction: row; flex-wrap: wrap; } }
  .sa-players { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: var(--space-3); }
  .sa-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: var(--space-4); }
  .sa-formrow { display: grid; grid-template-columns: 180px minmax(0, 1fr); gap: var(--space-4); align-items: start; }
  @media (max-width: 640px) { .sa-formrow { grid-template-columns: minmax(0, 1fr); gap: var(--space-1); } }
  /* redesign 2026-11-17 — sub-navigation between Countries · States · Cities (same bar on every sibling page) */
  .sa-tabbar { margin-top: calc(var(--space-2) * -1); margin-bottom: var(--space-5); scrollbar-width: none; }

<script>
(() => {
  /* Locations — Countries · States · Cities (pages/locations), each with its
     Documents and Taxes sub-pages (?docs=<key> · ?taxes=<key>) and a translation
     view. One script picked by file name; every view is a CRUD.page config. The
     dashboard's Google Places map is shown as a pick-a-point stand-in.
     API (locations/_requests.js): GET/POST /countries · /states · /cities (+ /{id} edit, DELETE /{id});
     options GET /general/countries · /general/states?country_iso= · /general/cities · /general/timezones · /general/currencies.
     Documents / Taxes: /{countries|states|cities}/{key}/documents · /taxes. Translations: model country · state · city
     (+ country-document / country-tax …); the country translation route uses the ISO (countries/{iso}/translation).
     Maps: States create — map hidden ("Please select country") until a country is picked, search limited to it;
     Cities — "Please select country and state" until a state is picked, the state's place_id bounds the pick
     ("This state does not have a place id." when it has none; a point outside → "The selected area is not within
     the governorate boundaries"). Country create — ISO comes from the map pick (result.short_name).
     Permissions (dashboard job permissions; demo ?perm=limited | ?perm=none):
       countries  page view_countries · Add add_countries · Edit update_countries · Delete delete_countries
       states     page view_states · Add add_states · Edit update_states · Delete delete_states
       cities     page view_cities · Add add_cities · Edit update_cities · Delete delete_countries
                  (dashboard bug: cities/ItemsTable.js checks delete_countries, not delete_cities — mirrored)
       Each tab shows only with its view_* key. Translation globe / pages and the Documents / Taxes
       sub-pages have no permission check in the dashboard — left open here too. */
  const file = location.pathname.split("/").pop().replace(/^_preview-/, "").replace(".html", "");
  const LV = { "locations-countries": "countries", "locations-states": "states", "locations-cities": "cities" }[file] || "countries";
  const qsP = new URLSearchParams(location.search), openView = !!(qsP.get("translation") || qsP.get("docs") || qsP.get("taxes"));
  RD.boot({ activeId: { countries: "loc-countries", states: "loc-states", cities: "loc-cities" }[LV], title: "locations", perm: openView ? undefined : "view_" + LV });
  if (!document.getElementById("listMount")) return;
  const { L, esc, ic } = SA;
  const R = CRUD.rules, S = HF.SA, qs = new URLSearchParams(location.search);
  /* redesign 2026-11-17: one tab bar links the three Locations lists (the sidebar group, same order);
     copy in sentence case, natural Arabic. Data, fields, rules and flows unchanged. */
  if (!qs.get("translation") && !qs.get("docs") && !qs.get("taxes")) {
    const TABS = [["locations-countries", "globe", "Countries", "الدول", "countries"], ["locations-states", "layers", "States", "المحافظات", "states"], ["locations-cities", "pin", "Cities", "المدن", "cities"]];
    document.getElementById("listMount").insertAdjacentHTML("beforebegin", `<nav class="sa-tabbar" aria-label="${L("Locations", "المواقع")}"><div class="tabs">${TABS.map((t) => `<a href="${t[0]}.html" data-perm="view_${t[4]}" class="${t[0] === file ? "is-active" : ""}"${t[0] === file ? ' aria-current="page"' : ""}>${ic(t[1])}<span>${L(t[2], t[3])}</span></a>`).join("")}</div></nav>`);
    const on = document.querySelector(".sa-tabbar .is-active"); if (on) on.scrollIntoView({ block: "nearest", inline: "nearest" });
  }
  const CREATING = ["Creating…", "جاري الإنشاء…"], UPDATING = ["Updating…", "جاري التحديث…"];
  const MIN3 = ["Minimum 3 symbols", "3 رموز على الأقل"], MAX50 = ["Maximum 50 symbols", "50 رمزًا على الأكثر"], NUM = ["Number is not valid", "الرقم غير صحيح"];
  const statusField = { key: "active", label: ["Status", "الحالة"], type: "select", placeholder: ["Select status", "اختر الحالة"], default: "0", options: () => [["0", L("Inactive", "غير نشط")], ["1", L("Active", "نشط")]], rules: [R.req], get: (r) => String(r.active) };
  const flag = (iso, name) => `<div class="cell-user"><span class="badge">${esc(iso)}</span><b>${esc(name)}</b></div>`;
  const docs = (name) => [["Commercial Registration", 1], ["Tax Certificate", 1], ["Municipality License", 0]].map((d, i) => ({ id: i + 1, name: d[0], required: d[1] }));
  const taxes = (vat) => [["VAT", vat, 1], ["Municipality fee", 2.5, 0]].map((t, i) => ({ id: i + 1, name: t[0], tax: t[1], active: t[2] }));

  /* ---- data (from HF.SA.GEO, the same countries / states / cities the rest of the system uses) ---- */
  if (!S._loc) {
    const C = [...new Map(S.GEO.map((g) => [g.country.iso, g.country])).values()];
    const META = { SA: ["966", "SAR", "Asia/Riyadh", 15], EG: ["20", "EGP", "Africa/Cairo", 14], AE: ["971", "AED", "Asia/Dubai", 5] };
    S._loc = {
      countries: C.map((c, i) => ({ id: i + 1, iso: c.iso, name: c.name, phone_code: META[c.iso][0], currency: { code: META[c.iso][1] }, timezone: META[c.iso][2], active: 1, map: "24.7136, 46.6753", docs: docs(), taxes: taxes(META[c.iso][3]) })),
      states: [...new Map(S.GEO.map((g) => [g.state.id, g])).values()].map((g, i) => ({ id: g.state.id, name: g.state.name, country: g.country, active: i === 4 ? 0 : 1, map: "24.70, 46.70", place_id: i === 4 ? null : "ChIJ" + g.state.id, docs: docs().slice(0, 2), taxes: taxes(0).slice(1) })),
      cities: S.GEO.map((g, i) => ({ id: g.city.id, name: g.city.name, country: g.country, state: g.state, active: 1, map: "24.71, 46.67", docs: i % 2 ? [] : docs().slice(2), taxes: i % 3 ? [] : taxes(0).slice(1) })),
    };
  }
  const D = S._loc;
  D.countries.forEach((r) => (r.key = r.iso)); D.states.forEach((r) => (r.key = r.id)); D.cities.forEach((r) => (r.key = r.id));
  const NAMES = { countries: ["Countries", "الدول"], states: ["States", "المحافظات"], cities: ["Cities", "المدن"] };
  const countLink = (r, kind, n) => { n = n || 0; const w = kind === "docs" ? L(n === 1 ? "document" : "documents", n === 1 ? "مستند" : "مستندات") : L(n === 1 ? "tax" : "taxes", n === 1 ? "ضريبة" : "ضرائب"); return `<a class="sa-count" href="${file}.html?${kind}=${r.key}">${n} ${w}${ic(document.documentElement.dir === "rtl" ? "chevronLeft" : "chevronRight")}</a>`; };

  /* ================= documents / taxes of a country · state · city ================= */
  const docKey = qs.get("docs"), taxKey = qs.get("taxes");
  const ONE = { countries: "country", states: "state", cities: "city" }[LV]; /* translation model names */
  /* documents / taxes edit title: "edit {name}" (DOCUMENTS.EDIT_DOCUMENT / TAXES.EDIT_TAX + the row's name) */
  const namedTitle = (el, row) => { if (row) el.querySelector("#crudFormT").textContent = L("Edit", "تعديل") + " " + row.name; };
  if (docKey || taxKey) {
    const parent = D[LV].find((r) => String(r.key) === (docKey || taxKey)) || D[LV][0];
    const crumbs = [["Countries", "الدول", "locations-countries.html"]]; /* same crumb at every level in the dashboard */
    if (docKey) return CRUD.page({
      title: [`${parent.name} Documents`, `مستندات ${parent.name}`], crumbs, baseQuery: "docs=" + parent.key, data: parent.docs, add: ["Add new", "إضافة جديد"], search: ["Search by name", "البحث بالاسم"], translation: { key: `${ONE}-document`, cols: [["name", ["Name", "الاسم"]]] },
      pills: [{ key: "all", label: ["All", "الكل"] }, { key: "1", label: ["Required", "مطلوب"] }, { key: "0", label: ["Not required", "غير مطلوب"] }], pillKey: "required",
      empty: ["There is no data to display", "لا توجد بيانات لعرضها"],
      columns: [{ head: ["Name", "الاسم"], cell: (r) => `<div class="cell-user"><span class="cell-thumb">${ic("paperclip")}</span><b>${esc(r.name)}</b></div>` }, { head: ["Required", "مطلوب"], align: "center", cell: (r) => (+r.required === 1 ? SA.badge("success", L("Yes", "نعم")) : SA.badge("", L("No", "لا"))) }],
      form: { labelCols: true, createTitle: ["create new document", "إنشاء مستند جديد"], editTitle: ["edit", "تعديل"], creatingText: CREATING, updatingText: UPDATING,
        fields: [{ key: "name", label: ["Name", "الاسم"], placeholder: ["Enter document name", "أدخل اسم المستند"], rules: [R.req, R.min(2, MIN3), R.max(50, MAX50)] },
          { key: "required", label: ["Required", "مطلوب"], type: "select", placeholder: ["Select whether it is required", "اختر إن كان مطلوبًا"], default: "1", options: () => [["1", L("Required", "مطلوب")], ["0", L("Not required", "غير مطلوب")]], rules: [R.req], get: (r) => String(r.required) }], onOpen: namedTitle },
      del: { body: ["Please confirm that you want to delete this document", "يرجى تأكيد أنك تريد حذف هذا المستند"] },
    });
    return CRUD.page({
      title: [`${parent.name} Taxes`, `ضرائب ${parent.name}`], crumbs, baseQuery: "taxes=" + parent.key, data: parent.taxes, add: ["Add new", "إضافة جديد"], search: ["Search by name", "البحث بالاسم"], translation: { key: `${ONE}-tax`, cols: [["name", ["Name", "الاسم"]]] },
      pills: true, empty: ["There is no data to display", "لا توجد بيانات لعرضها"],
      columns: [{ head: ["Name", "الاسم"], cell: (r) => `<b>${esc(r.name)}</b>` }, { head: ["Tax", "الضريبة"], align: "center", cell: (r) => `<b style="font-variant-numeric:tabular-nums">${r.tax}%</b>` }, { head: ["Status", "الحالة"], align: "center", cell: (r) => CRUD.statusBadge(r.active) }],
      form: { labelCols: true, createTitle: ["create new tax", "إنشاء ضريبة جديدة"], editTitle: ["edit", "تعديل"], creatingText: CREATING, updatingText: UPDATING,
        fields: [{ key: "name", label: ["Name", "الاسم"], placeholder: ["enter tax name", "أدخل اسم الضريبة"], rules: [R.req, R.max(50, MAX50)] },
          { key: "tax", type: "number", label: ["Tax", "الضريبة"], placeholder: ["enter tax percentage", "أدخل نسبة الضريبة"], rules: [R.req, R.max(5, MAX50)] }, statusField], onOpen: namedTitle },
      del: { body: ["Please confirm that you want to delete this tax", "يرجى تأكيد أنك تريد حذف هذه الضريبة"] },
    });
  }

  /* ================= countries · states · cities ================= */
  const nameField = (ph) => ({ key: "name", label: ["Name", "الاسم"], placeholder: ph, rules: [R.req, R.min(2, MIN3), R.max(50, MAX50)] });
  const mapField = (rules) => ({ key: "map", label: ["map", "الخريطة"], type: "map", rules });
  const countryOpts = () => D.countries.map((c) => [c.iso, c.name]);
  const mapReq = (msg) => (v, vals, row) => (!v ? (row && row.map ? "" : T(msg)) : "");
  const { T } = SA;
  const PICK = ["Please select the location on the map", "الرجاء تحديد الموقع على الخريطة"];
  /* map gate: the dashboard shows a message instead of the map until its parent is chosen */
  const gateMap = (el, msg) => { const box = el.querySelector("[data-mapbox]"), lab = box.querySelector("[data-maplabel]"), hid = box.parentNode.querySelector("[data-f]");
    if (!box._ph) box._ph = lab.textContent;
    box.style.pointerEvents = msg ? "none" : ""; box.style.opacity = msg ? ".6" : ""; box.style.cursor = msg ? "default" : "crosshair";
    if (msg) { hid.value = ""; lab.textContent = T(msg); box.style.color = ""; } else if (!hid.value) lab.textContent = box._ph; };
  const shared = (kind) => ({ data: D[LV], pills: true, search: ["Search by name", "البحث بالاسم"], add: ["Add new", "إضافة جديد"], idKey: "id", empty: ["There is no data to display", "لا توجد بيانات لعرضها"],
    translation: { key: kind, cols: [["name", ["Name", "الاسم"]]] } });
  const CFG = {
    countries: Object.assign(shared("country"), {
      title: NAMES.countries, idKey: "iso", /* translation route: countries/{iso}/translation */
      columns: [
        { head: ["Name", "الاسم"], cell: (r) => flag(r.iso, r.name) },
        { head: ["ISO", "الرمز"], align: "center", cell: (r) => esc(r.iso) },
        { head: ["Phone code", "رمز الاتصال"], align: "center", cell: (r) => `<span dir="ltr">${esc(r.phone_code || "---")}</span>` },
        { head: ["Currency", "العملة"], align: "center", cell: (r) => esc((r.currency && r.currency.code) || "---") },
        { head: ["Time zone", "المنطقة الزمنية"], align: "center", cell: (r) => esc(r.timezone || "---") },
        { head: ["Required documents", "المستندات المطلوبة"], align: "center", cell: (r) => countLink(r, "docs", r.docs.length) },
        { head: ["Taxes", "الضرائب"], align: "center", cell: (r) => countLink(r, "taxes", r.taxes.length) },
        { head: ["Status", "الحالة"], align: "center", cell: (r) => CRUD.statusBadge(r.active) },
      ],
      form: { labelCols: true, wide: true, createTitle: ["create new country", "إنشاء دولة جديدة"], editTitle: ["edit country", "تعديل الدولة"], creatingText: CREATING, updatingText: UPDATING,
        fields: [nameField(["enter country name", "أدخل اسم الدولة"]),
          { key: "phone_code", label: ["Phone code", "رمز الاتصال"], placeholder: ["Enter phone code", "أدخل رمز الاتصال"], rules: [R.req, R.min(2, MIN3), R.max(5, MAX50), (v) => (v && !/^[0-9]+$/.test(v) ? T(NUM) : "")] }, statusField,
          { key: "currency", label: ["currency", "العملة"], type: "select", placeholder: ["Select", "اختر"], options: () => [["SAR", "Saudi Riyal"], ["EGP", "Egyptian Pound"], ["AED", "UAE Dirham"], ["USD", "US Dollar"]], get: (r) => r.currency && r.currency.code },
          { key: "timezone", label: ["time zone", "المنطقة الزمنية"], type: "select", placeholder: ["Select", "اختر"], options: () => ["Asia/Riyadh", "Africa/Cairo", "Asia/Dubai", "Asia/Kuwait"].map((z) => [z, z]) },
          mapField([mapReq(PICK)])] },
      onSave: (v, r) => { const vals = Object.assign({}, v, { currency: { code: v.currency } }); if (r) Object.assign(r, vals); else D.countries.push(Object.assign({ id: D.countries.length + 1, /* dashboard: iso = the map pick's short_name */ iso: v.name.slice(0, 2).toUpperCase(), key: v.name.slice(0, 2).toUpperCase(), docs: [], taxes: [] }, vals)); },
      del: { body: ["Please confirm that you want to delete this country?", "يرجى تأكيد أنك تريد حذف هذه الدولة؟"] },
    }),
    states: Object.assign(shared("state"), {
      title: NAMES.states,
      columns: [
        { head: ["Name", "الاسم"], cell: (r) => `<b>${esc(r.name)}</b>` },
        { head: ["Country", "الدولة"], cell: (r) => flag(r.country.iso, r.country.name) },
        { head: ["Required documents", "المستندات المطلوبة"], align: "center", cell: (r) => countLink(r, "docs", r.docs.length) },
        { head: ["Taxes", "الضرائب"], align: "center", cell: (r) => countLink(r, "taxes", r.taxes.length) },
        { head: ["Status", "الحالة"], align: "center", cell: (r) => CRUD.statusBadge(r.active) },
      ],
      form: { labelCols: true, wide: true, createTitle: ["create new state", "إنشاء محافظة جديدة"], editTitle: ["edit state", "تعديل المحافظة"], creatingText: CREATING, updatingText: UPDATING,
        fields: [nameField(["enter state name", "أدخل اسم المحافظة"]), { key: "country", label: ["Country", "الدولة"], type: "select", placeholder: ["select country", "اختر الدولة"], options: countryOpts, rules: [R.req], get: (r) => r.country.iso }, statusField, mapField([mapReq(PICK)])],
        /* create: "Please select country" until a country is chosen (the map search is then limited to it) */
        onOpen: (el, row) => { if (row) return; const c = el.querySelector('[data-f="country"]'), sync = () => gateMap(el, c.value ? null : ["Please select country", "يرجى اختيار الدولة"]); c.addEventListener("change", sync); sync(); } },
      onSave: (v, r) => { const c = D.countries.find((x) => x.iso === v.country), vals = Object.assign({}, v, { country: { iso: c.iso, name: c.name } }); if (r) Object.assign(r, vals); else D.states.push(Object.assign({ id: 100 + D.states.length, place_id: "ChIJnew" + D.states.length, docs: [], taxes: [] }, vals)); },
      /* the dashboard's English text says "city" here (i18n bug) — kept 1:1 */
      del: { body: ["Please confirm that you want to delete this city", "يرجى تأكيد أنك تريد حذف هذه المحافظة"] },
    }),
    cities: Object.assign(shared("city"), {
      title: NAMES.cities,
      columns: [
        { head: ["Name", "الاسم"], cell: (r) => `<b>${esc(r.name)}</b>` },
        { head: ["Country", "الدولة"], cell: (r) => flag(r.country.iso, r.country.name) },
        { head: ["State", "المحافظة"], align: "center", cell: (r) => esc((r.state && r.state.name) || "---") },
        { head: ["Required documents", "المستندات المطلوبة"], align: "center", cell: (r) => countLink(r, "docs", r.docs.length) },
        { head: ["Taxes", "الضرائب"], align: "center", cell: (r) => countLink(r, "taxes", r.taxes.length) },
        { head: ["Status", "الحالة"], align: "center", cell: (r) => CRUD.statusBadge(r.active) },
      ],
      form: { labelCols: true, wide: true, createTitle: ["create city", "إنشاء مدينة"], editTitle: ["edit city", "تعديل المدينة"], creatingText: CREATING, updatingText: UPDATING,
        fields: [nameField(["enter city name", "أدخل اسم المدينة"]), { key: "country", label: ["country", "الدولة"], type: "select", placeholder: ["select country", "اختر الدولة"], options: countryOpts, rules: [R.req], get: (r) => r.country.iso },
          { key: "state", label: ["state", "المحافظة"], type: "select", placeholder: ["Select state", "اختر المحافظة"], options: () => D.states.map((s) => [s.id, s.name]), rules: [R.req], get: (r) => r.state && r.state.id }, statusField,
          mapField([mapReq(["The selected area is not within the governorate boundaries", "المنطقة المختارة ليست ضمن حدود المحافظة"])])],
        /* state cascades from country (GET /general/states?country_iso=) */
        onOpen: (el) => { const c = el.querySelector('[data-f="country"]'), s = el.querySelector('[data-f="state"]'); const fill = () => { const cur = s.value; s.innerHTML = `<option value="">${L("Select state", "اختر المحافظة")}</option>` + D.states.filter((x) => x.country.iso === c.value).map((x) => `<option value="${x.id}" ${String(x.id) === cur ? "selected" : ""}>${esc(x.name)}</option>`).join(""); };
          /* map: "Please select country and state" until a state is chosen; a state without place_id can't be mapped */
          const sync = () => { const st = D.states.find((x) => String(x.id) === s.value); gateMap(el, !c.value || !st ? ["Please select country and state", "يرجى اختيار الدولة والمحافظة"] : !st.place_id ? ["This state does not have a place id.", "هذه المحافظة ليس لديها معرف مكان."] : null); };
          c.onchange = () => { s.value = ""; fill(); sync(); }; s.onchange = sync; fill(); sync();
          /* stand-in for checkPointInPlace: a point near the edge of the box is "outside" the state's boundaries */
          const box = el.querySelector("[data-mapbox]"), pick = box.onclick, err = el.querySelector('[data-e="map"]');
          box.onclick = (ev) => { const b = box.getBoundingClientRect(), x = (ev.clientX - b.left) / b.width, y = (ev.clientY - b.top) / b.height; err.innerHTML = "";
            if (x < 0.12 || x > 0.88 || y < 0.12 || y > 0.88) { box.parentNode.querySelector("[data-f]").value = ""; box.querySelector("[data-maplabel]").textContent = box._ph; box.style.color = ""; err.innerHTML = `<span class="field__error">${ic("warn")} ${L("The selected area is not within the governorate boundaries", "المنطقة المختارة ليست ضمن حدود المحافظة")}</span>`; return; }
            pick(ev); }; } },
      onSave: (v, r) => { const c = D.countries.find((x) => x.iso === v.country), s = D.states.find((x) => String(x.id) === v.state), vals = Object.assign({}, v, { country: { iso: c.iso, name: c.name }, state: { id: s.id, name: s.name } }); if (r) Object.assign(r, vals); else D.cities.push(Object.assign({ id: 1000 + D.cities.length, docs: [], taxes: [] }, vals)); },
      del: { body: ["Please confirm that you want to delete this city", "يرجى تأكيد أنك تريد حذف هذه المدينة"] },
    }),
  };
  /* permission gating — cities delete checks delete_countries in the dashboard (bug, mirrored) */
  const cfg = CFG[LV], DEL = { countries: "delete_countries", states: "delete_states", cities: "delete_countries" }[LV];
  if (!RD.can("add_" + LV)) cfg.add = null;
  cfg.canEdit = () => RD.can("update_" + LV);
  cfg.canDel = () => RD.can(DEL);
  /* countries: idKey "iso" — CRUD builds the translation link from r.iso (countries/{iso}/translation) */
  CRUD.page(cfg);
})();
</script>
