<title>Public events · HighFive Super Admin</title>

<style>
  .sa-hero { display: flex; gap: var(--space-6); flex-wrap: wrap; align-items: flex-start; margin-bottom: var(--space-5); }
  .sa-hero__status { min-width: 260px; flex: 0 1 340px; border-inline-start: var(--border-thin) solid var(--color-border-subtle); padding-inline-start: var(--space-6); }
  @media (max-width: 768px) { .sa-hero__status { border: 0; padding: 0; flex-basis: 100%; } }
  .sa-kv { display: grid; grid-template-columns: minmax(140px, 220px) minmax(0, 1fr); gap: var(--space-3) var(--space-5); margin: 0; }
  .sa-kv dt { color: var(--color-text-tertiary); font-size: var(--text-sm); }
  .sa-kv dd { margin: 0; font-weight: var(--weight-semibold); font-size: var(--text-sm); }
  @media (max-width: 560px) { .sa-kv { grid-template-columns: minmax(0, 1fr); gap: var(--space-1); } .sa-kv dd { margin-bottom: var(--space-2); } }
  .sa-tabbar { margin-bottom: var(--space-6); overflow-x: auto; }
  .sa-tabbar .tabs { flex-wrap: nowrap; white-space: nowrap; }
  .sa-tabbar .tabs > * { display: inline-flex; align-items: center; gap: var(--space-1); }
  .sa-gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: var(--space-4); }
  .sa-tile { margin: 0; border: var(--border-thin) solid var(--color-border); border-radius: var(--radius-lg); overflow: hidden; }
  .sa-tile.is-main { border-color: var(--color-warning); }
  .sa-tile__media { height: 150px; display: grid; place-content: center; justify-items: center; gap: var(--space-1); background: var(--color-surface-sunken); color: var(--color-text-tertiary); }
  .sa-tile figcaption { padding: var(--space-2); justify-content: center; }
  .sa-side { display: grid; grid-template-columns: 200px minmax(0, 1fr); gap: var(--space-6); align-items: start; }
  .sa-side__nav { display: flex; flex-direction: column; gap: var(--space-1); }
  .sa-side__nav a, .sa-side__nav span { display: flex; justify-content: space-between; align-items: center; padding: var(--space-2) var(--space-3); border-radius: var(--radius-md); font-size: var(--text-sm); color: var(--color-text-secondary); }
  .sa-side__nav a.is-active { background: var(--color-primary-subtle); color: var(--color-primary-ink); font-weight: var(--weight-semibold); }
  .sa-side__nav a:hover { background: var(--color-surface-hover); }
  .sa-side__nav .is-locked { opacity: .5; cursor: not-allowed; }
  @media (max-width: 900px) { .sa-side { grid-template-columns: minmax(0, 1fr); } .sa-side__nav { flex-direction: row; flex-wrap: wrap; } }
  .sa-players { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: var(--space-3); }
  .sa-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: var(--space-4); }
  .sa-formrow { display: grid; grid-template-columns: 180px minmax(0, 1fr); gap: var(--space-4); align-items: start; }
  @media (max-width: 640px) { .sa-formrow { grid-template-columns: minmax(0, 1fr); gap: var(--space-1); } }
  /* ---- redesign 2026-11-17: global list layer (same composition as partners.html) ---- */
  .ops-head { display: flex; align-items: flex-end; justify-content: space-between; gap: var(--space-4); flex-wrap: wrap; margin-bottom: var(--space-6); }
  #listMount .data-table-toolbar > .grow { display: none; }
  #listMount .data-table-toolbar > .input-wrap { flex: 1 1 320px; min-width: 0 !important; }
  .ops-chips { padding: 0 var(--space-5) var(--space-4); }
  .ops-id { font: inherit; font-weight: var(--weight-semibold); color: var(--color-text); padding: 0; cursor: pointer; text-align: start; }
  .ops-id:hover { color: var(--color-primary-ink); text-decoration: underline; text-underline-offset: 3px; }
  .ops-two { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .ops-two > b { font-weight: var(--weight-medium); }
  .ops-check { display: inline-flex; flex-direction: column; gap: var(--space-1); align-items: flex-start; }
  #listMount tbody tr:has([data-peek]) { cursor: pointer; }
  @media (min-width: 769px) { #listMount > .stat-strip { grid-template-columns: repeat(auto-fit, minmax(min(100%, 128px), 1fr)) !important; } } /* ≤768px: two per row (components.css) */

</head>
<body>
<div class="app" id="app">
  <div class="scrim"></div>
  <aside class="sidebar" id="sidebarMount"></aside>
  <div class="main">
    <header class="topbar" id="topbarMount"></header>
    <nav id="topTabsMount"></nav>

    <main class="content"><div class="content__inner" style="max-width:none">
      <div id="pageHead"></div>
      <div id="listMount"></div>
    </div></main>
  </div>
</div>

<script src="assets/js/data.js"></script>
<script src="assets/js/env.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/shell.js"></script>
<script src="assets/js/sa-data.js"></script>
<script src="assets/js/sa-kit.js"></script>
<script src="assets/js/pp/pp-core.js"></script>
<script src="assets/js/pp/pp-ops.js"></script>
<script src="assets/js/sa-ops.js"></script>
<script>
(() => {
  /* Public events — mirrors pages/public-events (list + PublicEventView).
     List: status pills (all · coming · ended · cancelled), search, Filter
     Options (session date · category → activity · age group · session gender),
     13 columns incl. App Type and Check-in, eye → view. API: GET /public-events
     (status=cancelled for the Cancelled pill; counts/rows use "canceled");
     GET /age-groups, GET /activity-categories(/{id}/activities) for the filter;
     view: GET /public-events/{id}.
     View (?view=<id>): "Public event ID {id}" card around the shared
     SessionPublicEventView (pp-ops.js) — no breadcrumbs, no back (as in the dashboard).
     Permissions (job keys): list view_public_events (TableWrapper.js / PublicEventsTable.js);
     row eye + drawer link view_public_event_details (PublicEventsTable.js); view page
     view_public_event_details (PublicEventView.js / SessionPublicEventView.js). */
  const qs = new URLSearchParams(location.search), view = qs.get("view");
  RD.boot({ activeId: "pe-list", title: view ? "Public event" : "Public events", perm: view ? "view_public_event_details" : "view_public_events" });
  if (!document.getElementById("listMount")) return;
  const { L, esc, ic } = SA;
  const D = OPS.all();
  const dash = (v) => (v == null || v === "" ? "---" : esc(v));
  PP.href = () => "public-events.html";

  if (view) {
    const e = D.events.find((x) => String(x.id) === view) || D.events[0];
    document.getElementById("pageHead").hidden = true;
    const mount = document.getElementById("listMount");
    mount.className = "stack gap-6";
    /* noBack: the dashboard's back link is commented out */
    PP.tabs["public-events"](mount, { partner: OPS.partnerOf(e), params: new URLSearchParams({ view: String(e.id) }), noBack: true });
    return;
  }

  /* Redesign (2026-11-17) — same data, filters, fields, actions and routes; laid
     out like partners.html: head with a live summary, status tiles, search +
     Filter bar with removable chips, company + unit in one Venue column, joined
     users and check-in as small progress meters, row (or #id) opens a summary
     drawer with the link to the public event view. */
  const by = (k) => D.events.filter((r) => r.status === k).length;
  OPS.head(document.getElementById("pageHead"), { title: ["Public events", "الأحداث العامة"],
    sub: L(`${SA.fmt(D.events.length)} public events across ${HF.SA.partners.length} partners · ${by("coming")} coming`, `${SA.fmt(D.events.length)} حدث عام لدى ${HF.SA.partners.length} شريك · ${by("coming")} قادم`) });
  const page = +(qs.get("page") || 1);
  const viewHref = (r) => `public-events.html?view=${r.id}&redirect_to_page=${ctl ? ctl.state.page : 1}`;
  const checkin = (r) => (r.check_in_summary ? OPS.check(r.check_in_summary.checked_in, r.check_in_summary.total, true) : `<span class="text-tertiary">—</span>`);
  /* "SAR" is hard-coded in the dashboard cell — kept 1:1 */
  const price = (r) => `<b style="font-variant-numeric:tabular-nums">${r.price_per_user || 0}</b> <span class="t-xs">SAR</span>`;
  const fx = OPS.filters([
    { keys: ["session_from", "session_to"], label: ["Session date", "تاريخ الجلسة"], value: (f) => OPS.range(f.session_from, f.session_to) },
    { keys: ["category"], also: ["activity"], label: ["Category", "الفئة"], value: (f) => f.category },
    { keys: ["activity"], label: ["Activity", "النشاط"], value: (f) => f.activity },
    { keys: ["age"], label: ["Age group", "الفئة العمرية"], value: (f) => f.age },
    { keys: ["gender"], label: ["Session gender", "جنس الجلسة"], value: (f) => PP.cap(f.gender) },
  ]);
  let ctl = null;
  ctl = SA.list({
    mount: document.getElementById("listMount"), data: D.events,
    pills: [["all", "All events", "كل الأحداث", "users", ""], ["coming", "Coming", "قادم", "calendar", "success"], ["ended", "Ended", "انتهى", "check", "primary"], ["canceled", "Cancelled", "ملغي", "close", "danger"]]
      .map((p) => ({ key: p[0], label: [p[1], p[2]], icon: p[3], tone: p[4] })),
    pillMatch: (r, k) => k === "all" || r.status === k,
    search: ["Search by unit name or ID", "البحث باسم الوحدة أو الرقم"],
    searchMatch: (r, q) => r.unit_name.toLowerCase().includes(q) || String(r.id).includes(q),
    toolbarExtra: fx.toolbarExtra, after: fx.after,
    extraMatch: (r, f) => OPS.inRange(r.date, f.session_from, f.session_to) && (!f.category || r.activity_category_name === f.category) && (!f.activity || r.activity_name === f.activity)
      && (!f.age || r.age_group_name === f.age) && (!f.gender || r.session_gender === f.gender),
    empty: ["There is no data to display", "لا توجد بيانات للعرض"],
    columns: [
      { head: ["Event", "الحدث"], cell: (r) => `<div class="ops-two">${OPS.peekId(r.id, "#" + r.id)}<span class="t-xs text-tertiary">${esc(r.created_at)}</span></div>` },
      { head: ["Venue", "المكان"], cell: (r) => OPS.two(dash(r.company_name), dash(r.unit_name)) },
      { head: ["Session time", "وقت الجلسة"], cell: (r) => OPS.when(r.date, r.start_time, r.end_time) },
      { head: ["Activity", "النشاط"], cell: (r) => OPS.two(esc(r.activity_category_name), esc(r.activity_name)) },
      { head: ["Age group", "الفئة العمرية"], align: "center", cell: (r) => dash(r.age_group_name) },
      { head: ["Session gender", "جنس الجلسة"], align: "center", cell: (r) => OPS.dash(r.session_gender) },
      { head: ["Joined users", "المستخدمون المنضمون"], cell: (r) => OPS.check(r.joined_players || 0, r.player_numbers || 0) },
      { head: ["Price per user", "السعر لكل مستخدم"], align: "end", cell: (r) => `${price(r)}<div class="t-xs text-tertiary">${OPS.dash(r.payment_method)}</div>` },
      { head: ["App type", "نوع التطبيق"], cell: (r) => `<div class="row gap-1" style="flex-wrap:wrap">${OPS.appType(r.app_type)}</div>` },
      { head: ["Status", "الحالة"], align: "center", cell: (r) => OPS.sessionBadge(r.status) },
      { head: ["Check-in", "تسجيل الحضور"], cell: checkin }, /* CheckInCount: "{a}/{b} checked in" */
      { head: ["Actions", "الإجراءات"], align: "center", cell: (r) => `<a class="icon-btn" href="${viewHref(r)}" aria-label="${L("View", "عرض")} #${r.id}" data-tip="${L("View", "عرض")}" data-perm="view_public_event_details">${ic("eye")}</a>` },
    ],
  });
  fx.bind(document.getElementById("listMount"), ctl);
  if (page > 1) { ctl.state.page = page; ctl.paint(); }
  OPS.peek(document.getElementById("listMount"), (id) => ctl.rowById(id), (r) => ({
    title: `${L("Public event", "الحدث العام")} #${r.id}`, href: viewHref(r), open: L("Open public event", "فتح الحدث العام"), perm: "view_public_event_details",
    rows: [[L("Status", "الحالة"), OPS.sessionBadge(r.status)], [L("Created", "تاريخ الإنشاء"), esc(r.created_at)], [L("Company", "الشركة"), dash(r.company_name)], [L("Unit", "الوحدة"), dash(r.unit_name)],
      [L("Date", "التاريخ"), esc(r.date)], [L("Time", "الوقت"), `<span dir="ltr">${esc(r.start_time)} – ${esc(r.end_time)}</span>`], [L("Category", "الفئة"), esc(r.activity_category_name)], [L("Activity", "النشاط"), esc(r.activity_name)],
      [L("Age group", "الفئة العمرية"), dash(r.age_group_name)], [L("Session gender", "جنس الجلسة"), OPS.dash(r.session_gender)], [L("Joined users", "المستخدمون المنضمون"), `${r.joined_players || 0} / ${r.player_numbers || 0}`],
      [L("Price per user", "السعر لكل مستخدم"), price(r)], [L("Payment method", "طريقة الدفع"), OPS.dash(r.payment_method)], [L("App type", "نوع التطبيق"), OPS.appType(r.app_type)], [L("Check-in", "تسجيل الحضور"), checkin(r)]],
  }));
  document.getElementById("listMount").addEventListener("click", (e) => {
    const b = e.target.closest("[data-filter]");
    if (!b) return;
    PP.filterPop(b, { width: 300, value: ctl.state.extra, cascade: { category: ["activity"] },
      fields: [{ key: "session", type: "range", label: ["Session date", "تاريخ الجلسة"] }].concat(OPS.catFields(), [OPS.ageField(), OPS.genderField()]),
      /* dashboard: Apply keeps the page, Reset only clears the form */
      onApply: (d) => { ctl.state.extra = d; ctl.paint(); } });
  });
})();
</script>
</body>
</html>
