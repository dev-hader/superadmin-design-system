<!DOCTYPE html>

<script>/* redesign trial — assets/css/skin-v2.css (+ skin-v2-looks.css); ?skin=classic shows the current look, ?look=swiss|bento|soft, ?look=glass the alternative looks */(function(){var q=new URLSearchParams(location.search),r=document.documentElement;if(q.get("skin")==="classic")return;r.setAttribute("data-skin","v2");/* partners: new layout, the dashboard's own colours (?palette=v2 shows the v2 colours) */if(q.get("palette")!=="v2")r.setAttribute("data-palette","classic");var l=q.get("look");if(["swiss","bento","soft","glass"].indexOf(l)>-1)r.setAttribute("data-look",l);})();</script>
<script>try{document.documentElement.setAttribute("data-theme",localStorage.getItem("rd-theme")==="1"?"dark":"light");document.documentElement.dir=localStorage.getItem("rd-dir")==="1"?"rtl":"ltr";}catch(e){}</script>

<title>Settings · HighFive Super Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Tajawal:wght@300;400;500;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/app.css">
<link rel="stylesheet" href="assets/css/components.css">
<link rel="stylesheet" href="assets/shell.css">
<link rel="stylesheet" href="assets/css/skin-v2.css?v=7">
<link rel="stylesheet" href="assets/css/skin-v2-looks.css?v=7">
<style>
  .sa-hero { display: flex; gap: var(--space-6); flex-wrap: wrap; align-items: flex-start; margin-bottom: var(--space-5); }
  .sa-hero__status { min-width: 260px; flex: 0 1 340px; border-inline-start: var(--border-thin) solid var(--color-border-subtle); padding-inline-start: var(--space-6); }
  @media (max-width: 768px) { .sa-hero__status { border: 0; padding: 0; flex-basis: 100%; } }
  .sa-kv { display: grid; grid-template-columns: minmax(140px, 220px) minmax(0, 1fr); gap: var(--space-3) var(--space-5); margin: 0; }
  .sa-kv dt { color: var(--color-text-tertiary); font-size: var(--text-sm); }
  .sa-kv dd { margin: 0; font-weight: var(--weight-semibold); font-size: var(--text-sm); }
  @media (max-width: 560px) { .sa-kv { grid-template-columns: minmax(0, 1fr); gap: var(--space-1); } .sa-kv dd { margin-bottom: var(--space-2); } }
  .sa-tabbar { margin-bottom: var(--space-6); overflow-x: auto; }
  .sa-tabbar .tabs { flex-wrap: nowrap; white-space: nowrap; }
  .sa-tabbar .tabs > * { display: inline-flex; align-items: center; gap: var(--space-1); }
  .sa-gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: var(--space-4); }
  .sa-tile { margin: 0; border: var(--border-thin) solid var(--color-border); border-radius: var(--radius-lg); overflow: hidden; }
  .sa-tile.is-main { border-color: var(--color-warning); }
  .sa-tile__media { height: 150px; display: grid; place-content: center; justify-items: center; gap: var(--space-1); background: var(--color-surface-sunken); color: var(--color-text-tertiary); }
  .sa-tile figcaption { padding: var(--space-2); justify-content: center; }
  .sa-side { display: grid; grid-template-columns: 200px minmax(0, 1fr); gap: var(--space-6); align-items: start; }
  .sa-side__nav { display: flex; flex-direction: column; gap: var(--space-1); }
  .sa-side__nav a, .sa-side__nav span { display: flex; justify-content: space-between; align-items: center; padding: var(--space-2) var(--space-3); border-radius: var(--radius-md); font-size: var(--text-sm); color: var(--color-text-secondary); }
  .sa-side__nav a.is-active { background: var(--color-primary-subtle); color: var(--color-primary-ink); font-weight: var(--weight-semibold); }
  .sa-side__nav a:hover { background: var(--color-surface-hover); }
  .sa-side__nav .is-locked { opacity: .5; cursor: not-allowed; }
  @media (max-width: 900px) { .sa-side { grid-template-columns: minmax(0, 1fr); } .sa-side__nav { flex-direction: row; flex-wrap: wrap; } }
  .sa-players { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: var(--space-3); }
  .sa-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: var(--space-4); }
  .sa-formrow { display: grid; grid-template-columns: 180px minmax(0, 1fr); gap: var(--space-4); align-items: start; }
  @media (max-width: 640px) { .sa-formrow { grid-template-columns: minmax(0, 1fr); gap: var(--space-1); } }
  /* redesign 2026-11-17 — settings as a grouped card (label above value) */
  .sa-set { max-width: 820px; padding: 0; overflow: hidden; }
  .sa-set__head { display: flex; align-items: center; gap: var(--space-3); padding: var(--space-5); border-bottom: var(--border-thin) solid var(--color-border-subtle); }
  .sa-set__row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) auto; gap: var(--space-4) var(--space-6); align-items: center; padding: var(--space-5); }
  .sa-set__row + .sa-set__row { border-top: var(--border-thin) solid var(--color-border-subtle); }
  .sa-set__f { display: flex; flex-direction: column; gap: var(--space-1); min-width: 0; }
  .sa-set__f .field__label { margin: 0; }
  @media (max-width: 560px) { .sa-set__row { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } .sa-set__act { grid-column: 1 / -1; } .sa-set__act .btn { width: 100%; justify-content: center; } }
  /* activities contacts — contact cell */
  .sa-one-tile .stat-strip { grid-template-columns: minmax(0, 280px) !important; }
  .sa-contact { display: flex; align-items: center; gap: var(--space-3); min-width: 0; }
</style>
</head>
<body>
<div class="app" id="app">
  <div class="scrim"></div>
  <aside class="sidebar" id="sidebarMount"></aside>
  <div class="main">
    <header class="topbar" id="topbarMount"></header>
    <nav id="topTabsMount"></nav>

    <main class="content"><div class="content__inner" style="max-width:none">
      <div id="pageHead"></div>
      <div id="listMount"></div>
    </div></main>
  </div>
</div>

<script src="assets/js/data.js"></script>
<script src="assets/js/env.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/shell.js"></script>
<script src="assets/js/sa-data.js"></script>
<script src="assets/js/sa-kit.js"></script>
<script src="assets/js/sa-translation.js"></script>
<script src="assets/js/pp/pp-core.js"></script>
<script src="assets/js/sa-crud.js"></script>
<script>
(() => {
  /* settings.html — pages/settings: one setting (app version), edit modal (required; English-only
     messages in the dashboard), success reloads the page.
     activities-contacts.html — pages/activities-contacts: read-only list, search (debounced) by
     name / email / phone, 6 columns, no row actions.
     Permissions (dashboard job permissions; demo ?perm=limited | ?perm=none):
       settings             page view_settings · Update version update_settings
       activities contacts  page partner_activities_contact_us_view (the dashboard's key — it does not
                            start with view_, so the ?perm=limited demo treats it as not granted) */
  const file = location.pathname.split("/").pop().replace(/^_preview-/, "").replace(".html", "");
  const isSet = file === "settings";
  RD.boot({ activeId: isSet ? "settings" : "activities-contacts", title: isSet ? "Settings" : "Activities Contacts", perm: isSet ? "view_settings" : "partner_activities_contact_us_view" });
  if (!document.getElementById("listMount")) return;
  const { L, esc, ic, badge } = SA;
  const S = HF.SA;

  if (isSet) {
    S._settings = S._settings || [{ id: 1, key: "app_version", value: "1.0.0" }];
    /* the dashboard labels every row "App Version" whatever the key — kept 1:1.
       Redesign 2026-11-17: the one-row table becomes a settings card — each setting is a
       row of label-over-value fields (Property · Version) with its Update button; the
       Update modal (CRUD.form), its validation and the success alert are unchanged. */
    SA.head(document.getElementById("pageHead"), { title: ["Settings", "الإعدادات"] });
    const mount = document.getElementById("listMount");
    const cfg = { data: S._settings,
      form: { editTitle: ["Update version", "تحديث الإصدار"], updatingText: ["Updating…", "جاري التحديث…"], feedback: "alert", delay: 800,
        fields: [{ key: "value", label: ["Version", "الإصدار"], placeholder: ["Enter new version", "أدخل الإصدار الجديد"], rules: [(v) => (!v ? "This field is required" : "")] }] } };
    const paint = () => {
      mount.innerHTML = `<section class="card animate-in sa-set">
        <header class="sa-set__head"><span class="kpi-ic" style="background:var(--color-primary-subtle);color:var(--color-primary-ink);box-shadow:none">${ic("mobile")}</span>
          <h2 class="t-title" style="margin:0">${L("Application", "التطبيق")}</h2></header>
        ${S._settings.length ? S._settings.map((r) => `<div class="sa-set__row">
          <div class="sa-set__f"><span class="field__label">${L("Property", "الخاصية")}</span><b>${L("App version", "إصدار التطبيق")}</b></div>
          <div class="sa-set__f"><span class="field__label">${L("Version", "الإصدار")}</span><span><span class="badge badge--primary" dir="ltr" style="font-family:var(--font-mono, monospace)">${esc(r.value)}</span></span></div>
          <div class="sa-set__act">${PP.btn(L("Update version", "تحديث الإصدار"), "edit", `data-set-edit="${r.id}" data-perm="update_settings"`, "secondary")}</div></div>`).join("")
        : `<p class="text-tertiary" style="padding:var(--space-8) var(--space-5);text-align:center;margin:0">${L("There is no data to display", "لا توجد بيانات للعرض")}</p>`}
      </section>`;
    };
    mount.addEventListener("click", (e) => { const b = e.target.closest("[data-set-edit]"); if (b) CRUD.form(cfg, S._settings.find((x) => String(x.id) === b.dataset.setEdit), paint); });
    paint();
    return;
  }

  /* ---- Activities Contacts (GET /partner-activities/contact-us) ---- */
  const TYPES = ["football", "padel", "break_rooms", ""];
  const rows = ["Ahmed Kamal", "Sara Youssef", "", "Khaled Omar", "Nour Hassan", "Fahad Ali", "Lina Saeed", "Omar Nabil"].map((n, i) => ({ id: 120 + i, name: n, email: n ? `${n.split(" ")[0].toLowerCase()}@mail.com` : "", phone: i % 4 === 3 ? "" : `+966 5${i} 234 56${i}${i}`, type: TYPES[i % 4], created_at: new Date(2026, 10, 16 - i, 9 + i, 30).toLocaleString() }));
  SA.head(document.getElementById("pageHead"), { title: ["Activities Contacts", "جهات اتصال الأنشطة"] });
  const dash = (v) => (v ? esc(v) : "—");
  document.getElementById("listMount").classList.add("sa-one-tile");
  SA.list({
    mount: document.getElementById("listMount"), data: rows,
    pills: [{ key: "all", label: ["All", "الكل"] }], pillMatch: () => true,
    search: ["Search by name, email, or phone…", "البحث بالاسم أو البريد الإلكتروني أو الهاتف…"], searchMatch: (r, q) => [r.name, r.email, r.phone].some((v) => v.toLowerCase().includes(q)),
    empty: () => `<div class="empty-state stack gap-2" style="align-items:center"><span class="kpi-ic" style="background:var(--color-surface-sunken);color:var(--color-text-tertiary);box-shadow:none">${ic("mail")}</span><b class="t-title" style="margin-top:var(--space-2)">${L("No contacts found", "لا توجد جهات اتصال")}</b></div>`,
    /* redesign 2026-11-17: same 6 columns; name gets an avatar. Email is plain text and the type is the raw
       API word in a badge (e.g. break_rooms), as in the dashboard (PP.cap would humanize it — lead's call). */
    columns: [
      { head: ["ID", "المعرف"], cell: (r) => `<span class="text-tertiary" style="font-variant-numeric:tabular-nums">#${r.id}</span>` },
      { head: ["Name", "الاسم"], cell: (r) => `<div class="sa-contact">${r.name ? PP.avatar(r.name) : `<span class="avatar avatar--sm">${ic("users")}</span>`}<b>${dash(r.name)}</b></div>` },
      { head: ["Email", "البريد الإلكتروني"], cell: (r) => `<span class="text-secondary">${dash(r.email)}</span>` },
      { head: ["Phone", "الهاتف"], cell: (r) => `<span dir="ltr" style="font-variant-numeric:tabular-nums">${dash(r.phone)}</span>` },
      { head: ["Type", "النوع"], cell: (r) => (r.type ? badge("info", esc(r.type)) : `<span class="text-tertiary">—</span>`) },
      { head: ["Created at", "تاريخ الإنشاء"], cell: (r) => `<span class="text-secondary t-sm">${dash(r.created_at)}</span>` },
    ],
  });
})();
</script>
</body>
</html>
