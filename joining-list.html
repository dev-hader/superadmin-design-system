<style>
  .sa-hero { display: flex; gap: var(--space-6); flex-wrap: wrap; align-items: flex-start; margin-bottom: var(--space-5); }
  .sa-hero__status { min-width: 260px; flex: 0 1 340px; border-inline-start: var(--border-thin) solid var(--color-border-subtle); padding-inline-start: var(--space-6); }
  @media (max-width: 768px) { .sa-hero__status { border: 0; padding: 0; flex-basis: 100%; } }
  .sa-kv { display: grid; grid-template-columns: minmax(140px, 220px) minmax(0, 1fr); gap: var(--space-3) var(--space-5); margin: 0; }
  .sa-kv dt { color: var(--color-text-tertiary); font-size: var(--text-sm); }
  .sa-kv dd { margin: 0; font-weight: var(--weight-semibold); font-size: var(--text-sm); }
  @media (max-width: 560px) { .sa-kv { grid-template-columns: minmax(0, 1fr); gap: var(--space-1); } .sa-kv dd { margin-bottom: var(--space-2); } }
  .sa-tabbar { margin-bottom: var(--space-6); overflow-x: auto; }
  .sa-tabbar .tabs { flex-wrap: nowrap; white-space: nowrap; }
  .sa-tabbar .tabs > * { display: inline-flex; align-items: center; gap: var(--space-1); }
  .sa-gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: var(--space-4); }
  .sa-tile { margin: 0; border: var(--border-thin) solid var(--color-border); border-radius: var(--radius-lg); overflow: hidden; }
  .sa-tile.is-main { border-color: var(--color-warning); }
  .sa-tile__media { height: 150px; display: grid; place-content: center; justify-items: center; gap: var(--space-1); background: var(--color-surface-sunken); color: var(--color-text-tertiary); }
  .sa-tile figcaption { padding: var(--space-2); justify-content: center; }
  .sa-side { display: grid; grid-template-columns: 200px minmax(0, 1fr); gap: var(--space-6); align-items: start; }
  .sa-side__nav { display: flex; flex-direction: column; gap: var(--space-1); }
  .sa-side__nav a, .sa-side__nav span { display: flex; justify-content: space-between; align-items: center; padding: var(--space-2) var(--space-3); border-radius: var(--radius-md); font-size: var(--text-sm); color: var(--color-text-secondary); }
  .sa-side__nav a.is-active { background: var(--color-primary-subtle); color: var(--color-primary-ink); font-weight: var(--weight-semibold); }
  .sa-side__nav a:hover { background: var(--color-surface-hover); }
  .sa-side__nav .is-locked { opacity: .5; cursor: not-allowed; }
  @media (max-width: 900px) { .sa-side { grid-template-columns: minmax(0, 1fr); } .sa-side__nav { flex-direction: row; flex-wrap: wrap; } }
  .sa-players { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: var(--space-3); }
  .sa-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: var(--space-4); }
  .sa-formrow { display: grid; grid-template-columns: 180px minmax(0, 1fr); gap: var(--space-4); align-items: start; }
  @media (max-width: 640px) { .sa-formrow { grid-template-columns: minmax(0, 1fr); gap: var(--space-1); } }
  /* ---- redesign 2026-11-17: global list layer (same composition as partners.html) ---- */
  .ops-head { display: flex; align-items: flex-end; justify-content: space-between; gap: var(--space-4); flex-wrap: wrap; margin-bottom: var(--space-6); }
  #listMount .data-table-toolbar > .grow { display: none; }
  #listMount .data-table-toolbar > .input-wrap { flex: 1 1 320px; min-width: 0 !important; }
  .ops-chips { padding: 0 var(--space-5) var(--space-4); }
  .ops-id { font: inherit; font-weight: var(--weight-semibold); color: var(--color-text); padding: 0; cursor: pointer; text-align: start; }
  .ops-id:hover { color: var(--color-primary-ink); text-decoration: underline; text-underline-offset: 3px; }
  .ops-two { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .ops-two > b { font-weight: var(--weight-medium); }
  .ops-check { display: inline-flex; flex-direction: column; gap: var(--space-1); align-items: flex-start; }
  #listMount tbody tr:has([data-peek]) { cursor: pointer; }
  @media (min-width: 769px) { #listMount > .stat-strip { grid-template-columns: repeat(auto-fit, minmax(min(100%, 128px), 1fr)) !important; } } /* ≤768px: two per row (components.css) */

<body>
<div class="app" id="app">
  <div class="scrim"></div>
  <aside class="sidebar" id="sidebarMount"></aside>
  <div class="main">
    <header class="topbar" id="topbarMount"></header>
    <nav id="topTabsMount"></nav>

    <main class="content"><div class="content__inner" style="max-width:none">
      <div id="pageHead"></div>
      <div id="listMount"></div>
    </div></main>
  </div>
</div>

<script src="assets/js/data.js"></script>
<script src="assets/js/env.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/shell.js"></script>
<script src="assets/js/sa-data.js"></script>
<script src="assets/js/sa-kit.js"></script>
<script src="assets/js/pp/pp-core.js"></script>
<script src="assets/js/pp/pp-ops.js"></script>
<script src="assets/js/sa-ops.js"></script>
<script>
(() => {
  /* Joining List — mirrors pages/public-events/joining-list: pills by join
     status, search (3+ chars) on joining id / user / company / unit, Filter
     Options (session date-time · joining date-time · category → activity · age
     group · gender · public event status · check-in status), 14 columns,
     eye → public event view; the user name is plain text (no link). API: GET /joining-list. */
  /* Permissions (job keys): page view_joining_list (JoiningTableWrapper.js); row eye +
     drawer link view_public_event_details (joining-list/PublicEventsTable.js). */
  RD.boot({ activeId: "pe-joining-list", title: "Joining List", perm: "view_joining_list" });
  if (!document.getElementById("listMount")) return;
  const { L, esc, ic, badge } = SA;
  const D = OPS.all();
  const dash = (v) => (v == null || v === "" ? "---" : esc(v));
  const METHOD = { qr: L("QR scan", "مسح رمز QR"), manual: L("Manual", "يدوي"), auto: L("Automatic", "تلقائي") };
  const JOIN = { joined: ["success", L("Joined", "منضم")], left: ["warning", L("Left", "غادر")], removed: ["danger", L("Removed", "مُزال")] };
  const PE = () => [["coming", L("Coming", "قادم")], ["past", L("Past", "ماضي")], ["canceled", L("Cancelled", "ملغي")]];
  const CHK = () => [["checked_in", L("Checked in", "تم تسجيل الحضور")], ["not_checked_in", L("Not checked in", "لم يسجّل الحضور")]];
  const peBadge = (s) => badge(s === "coming" ? "success" : s === "past" ? "primary" : "danger", OPS.opt(PE(), s));

  /* Redesign (2026-11-17) — same data, filters, fields, actions and routes; laid
     out like partners.html: head with a live summary, status tiles, search +
     Filter bar with removable chips; the 14 columns are grouped into joining ·
     user · venue (company, branch, unit) · public event (id, time, status) ·
     activity (+ age group, gender) · joining status · check-in · price; row (or
     the joining id) opens a summary drawer with the link to the event view. */
  const by = (k) => D.joins.filter((r) => r.status === k).length;
  OPS.head(document.getElementById("pageHead"), { title: ["Joining List", "قائمة الانضمام"], crumbs: [["Public events", "الأحداث العامة", "public-events.html"]],
    sub: L(`${SA.fmt(D.joins.length)} joinings · ${by("joined")} joined · ${D.joins.filter((r) => r.check_in_at).length} checked in`, `${SA.fmt(D.joins.length)} انضمام · ${by("joined")} منضم · ${D.joins.filter((r) => r.check_in_at).length} سجّلوا الحضور`) });
  const viewHref = (r) => `public-events.html?view=${r.public_event.id}&redirect_to_page=${ctl ? ctl.state.page : 1}`;
  const checkin = (r) => (r.check_in_at ? `${badge("success", L("Checked in", "تم تسجيل الحضور"))}<div class="t-xs text-tertiary" style="margin-top:2px">${esc(r.check_in_at)}</div><div class="t-xs text-tertiary">${esc(r.checked_by || "—")} · ${METHOD[r.method] || esc(r.method || "—")}</div>` : badge("", L("Not checked in", "لم يسجّل الحضور")));
  const joinCell = (r) => `${badge(JOIN[r.status][0], JOIN[r.status][1])}${r.status !== "joined" ? `<div class="t-xs text-tertiary" style="margin-top:2px">${esc(r.status_date)}</div>` : ""}`;
  const fx = OPS.filters([
    { keys: ["session_from", "session_to"], label: ["Session date", "تاريخ الجلسة"], value: (f) => OPS.range(f.session_from, f.session_to) },
    { keys: ["joining_from", "joining_to"], label: ["Joining date", "تاريخ الانضمام"], value: (f) => OPS.range(f.joining_from, f.joining_to) },
    { keys: ["category"], also: ["activity"], label: ["Category", "الفئة"], value: (f) => f.category },
    { keys: ["activity"], label: ["Activity", "النشاط"], value: (f) => f.activity },
    { keys: ["age"], label: ["Age group", "الفئة العمرية"], value: (f) => f.age },
    { keys: ["gender"], label: ["Session gender", "جنس الجلسة"], value: (f) => PP.cap(f.gender) },
    { keys: ["pe_status"], label: ["Public event status", "حالة الحدث العام"], value: (f) => OPS.opt(PE(), f.pe_status) },
    { keys: ["check"], label: ["Check-in status", "حالة تسجيل الحضور"], value: (f) => OPS.opt(CHK(), f.check) },
  ]);
  let ctl = null;
  ctl = SA.list({
    mount: document.getElementById("listMount"), data: D.joins, minSearch: 3,
    pills: [["all", "All joinings", "كل الانضمامات", "users", ""], ["joined", "Joined", "منضم", "check", "success"], ["left", "Left", "غادر", "refresh", "warning"], ["removed", "Removed", "مُزال", "close", "danger"]]
      .map((p) => ({ key: p[0], label: [p[1], p[2]], icon: p[3], tone: p[4] })),
    pillMatch: (r, k) => k === "all" || r.status === k,
    search: ["Search by joining ID, user name, username, company name, unit name", "البحث برقم الانضمام أو الاسم أو اسم المستخدم أو اسم الشركة أو اسم الوحدة"],
    searchMatch: (r, q) => [String(r.id), r.user.name, r.user.username, r.company.name, r.unit.name].some((v) => v && v.toLowerCase().includes(q)),
    toolbarExtra: fx.toolbarExtra, after: fx.after,
    extraMatch: (r, f) => OPS.inRange(r.start_at, f.session_from, f.session_to) && OPS.inRange(r.joined_at, f.joining_from, f.joining_to) && (!f.category || r.category === f.category) && (!f.activity || r.activity === f.activity)
      && (!f.age || r.age_group === f.age) && (!f.gender || r.gender === f.gender) && (!f.pe_status || r.public_event.status === f.pe_status)
      && (!f.check || (f.check === "checked_in" ? !!r.check_in_at : !r.check_in_at)),
    empty: ["There are no joinings yet", "لا يوجد انضمام بعد"],
    columns: [
      { head: ["Joining", "الانضمام"], cell: (r) => `<div class="ops-two">${OPS.peekId(r.id, "#" + r.id)}<span class="t-xs text-tertiary">${esc(r.created_at)}</span></div>` },
      { head: ["User", "المستخدم"], cell: (r) => `<div class="cell-user">${PP.avatar(r.user.name)}<div class="ops-two"><b>${dash(r.user.name)}</b><span class="t-xs text-tertiary">${dash(r.user.username)}</span></div></div>` },
      { head: ["Company", "الشركة"], cell: (r) => OPS.two(esc(r.company.name), `${L("ID", "المعرف")} #${r.company.id}`) },
      { head: ["Branch / unit", "الفرع / الوحدة"], cell: (r) => OPS.two(esc(r.branch.name), esc(r.unit.name)) },
      { head: ["Public event", "الحدث العام"], cell: (r) => `<div class="ops-two"><b>#${r.public_event.id}</b><span class="t-xs text-tertiary">${esc(r.public_event.created_at)}</span></div>` },
      { head: ["Public event time", "وقت الحدث العام"], cell: (r) => OPS.two(esc(r.start_at), esc(r.end_at)) },
      { head: ["Category / activity", "الفئة / النشاط"], cell: (r) => OPS.two(esc(r.category), esc(r.activity)) },
      { head: ["Age group", "الفئة العمرية"], align: "center", cell: (r) => dash(r.age_group) },
      { head: ["Session gender", "جنس الجلسة"], align: "center", cell: (r) => OPS.dash(r.gender) },
      { head: ["Joining status", "حالة الانضمام"], align: "center", cell: joinCell },
      { head: ["Check-in status", "حالة تسجيل الحضور"], cell: checkin },
      { head: ["Price per user", "السعر لكل مستخدم"], align: "end", cell: (r) => `<b style="font-variant-numeric:tabular-nums">${r.price_per_user}</b> <span class="t-xs">${esc(r.currency.code)}</span>` },
      /* tone: coming → success; "past" → primary; else danger (dashboard checks the joining's own status for "past" — data here keeps it on the event) */
      { head: ["Public event status", "حالة الحدث العام"], align: "center", cell: (r) => peBadge(r.public_event.status) },
      { head: ["Actions", "الإجراءات"], align: "center", cell: (r) => `<a class="icon-btn" href="${viewHref(r)}" aria-label="${L("View public event", "عرض الحدث العام")} #${r.public_event.id}" data-tip="${L("View", "عرض")}" data-perm="view_public_event_details">${ic("eye")}</a>` },
    ],
  });
  fx.bind(document.getElementById("listMount"), ctl);
  OPS.peek(document.getElementById("listMount"), (id) => ctl.rowById(id), (r) => ({
    title: `${L("Joining", "الانضمام")} #${r.id}`, href: viewHref(r), open: L("Open public event", "فتح الحدث العام"), perm: "view_public_event_details",
    rows: [[L("Joining status", "حالة الانضمام"), joinCell(r)], [L("Joined at", "تاريخ الانضمام"), esc(r.joined_at)], [L("User", "المستخدم"), `${esc(r.user.name)} <span class="text-tertiary">${dash(r.user.username)}</span>`],
      [L("Company", "الشركة"), `${esc(r.company.name)} <span class="text-tertiary">#${r.company.id}</span>`], [L("Branch", "الفرع"), esc(r.branch.name)], [L("Unit", "الوحدة"), esc(r.unit.name)],
      [L("Public event", "الحدث العام"), `#${r.public_event.id} ${peBadge(r.public_event.status)}`], [L("Public event time", "وقت الحدث العام"), `<span dir="ltr">${esc(r.start_at)} – ${esc(r.end_at.slice(11))}</span>`],
      [L("Category", "الفئة"), esc(r.category)], [L("Activity", "النشاط"), esc(r.activity)], [L("Age group", "الفئة العمرية"), dash(r.age_group)], [L("Session gender", "جنس الجلسة"), OPS.dash(r.gender)],
      [L("Price per user", "السعر لكل مستخدم"), `${r.price_per_user} ${esc(r.currency.code)}`], [L("Check-in status", "حالة تسجيل الحضور"), checkin(r)]],
  }));
  document.getElementById("listMount").addEventListener("click", (e) => {
    const b = e.target.closest("[data-filter]");
    if (!b) return;
    PP.filterPop(b, { width: 340, value: ctl.state.extra, cascade: { category: ["activity"] }, resetApplies: true,
      fields: [{ key: "session", type: "range", input: "datetime-local", label: ["Session date", "تاريخ الجلسة"] }, { key: "joining", type: "range", input: "datetime-local", label: ["Joining date", "تاريخ الانضمام"] }]
        .concat(OPS.catFields(), [OPS.ageField(), OPS.genderField(),
          { key: "pe_status", label: ["Public event status", "حالة الحدث العام"], placeholder: ["Select status", "اختر الحالة"], options: PE },
          { key: "check", label: ["Check-in status", "حالة تسجيل الحضور"], options: CHK }]),
      /* Apply resets the page; Reset clears every filter and re-queries (menu stays open in the dashboard) */
      onApply: (d) => { ctl.state.extra = d; ctl.state.page = 1; ctl.paint(); } });
  });
})();
</script>
</body>
