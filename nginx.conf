server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # CSS/JS are not fingerprinted, so browsers must revalidate every time
    # (ETag/If-None-Match still avoids re-downloading unchanged bytes) —
    # otherwise a deploy can leave visitors on a week-old cached copy.
    location ~* \.(?:css|js)$ {
        try_files $uri =404;
        add_header Cache-Control "no-cache" always;
    }

    # Images/fonts change rarely and aren't referenced by hash either, but
    # staleness there is low-risk — keep the long cache for performance.
    location ~* \.(?:svg|png|jpg|jpeg|gif|webp|ico|woff2?)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=604800" always;
    }

    # Clean URLs, mirrors serve.json: /bookings -> /bookings.html, /a/b -> /a/b.html
    location / {
        try_files $uri $uri.html $uri/ =404;
    }
}
