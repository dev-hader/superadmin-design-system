<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script>try{document.documentElement.setAttribute("data-theme",localStorage.getItem("rd-theme")==="1"?"dark":"light");document.documentElement.dir=localStorage.getItem("rd-dir")==="1"?"rtl":"ltr";}catch(e){}</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><defs><linearGradient id='fvg' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='%23FC6404'/><stop offset='1' stop-color='%23FF8536'/></linearGradient></defs><rect width='64' height='64' rx='14' fill='%23131313'/><g transform='translate(6 10.71) scale(0.7312)' fill='url(%23fvg)'><path d='M9.19 34.39C8.66 33.98 8.39 33.32 6.29 32.44 4.52 31.7 2 32.73 2.07 35.06 2.15 37.81 7.95 50.58 10.44 53.63 12.15 55.74 16.3 54.67 16.78 51.56 17.46 47.1 11.6 36.26 9.19 34.39'/><path d='M57.86 13.44C56.88 13.08 53.96 13.48 51.32 19.16 49.99 22.02 45.55 38.6 45.63 40.58 45.75 43.74 50.36 45.81 52.67 42.28 53.44 41.11 59.78 19.81 60.15 18.41 60.95 15.37 59.63 14.07 57.86 13.44'/><path d='M33.57 5.08C32.57 4.75 30.43 5.64 27.22 11.03 25.3 14.24 20.01 34.86 19.9 41.69 19.81 47.32 25.82 46.77 27.05 43.99 29.87 37.62 35.64 11.65 36.03 9.96 36.72 6.9 35.36 5.65 33.57 5.08'/><path d='M66.39 28.04C65.4 27.69 62.48 28.08 59.84 33.76 58.93 35.72 54.31 49.26 54.65 51.63 55.03 54.21 59.1 56.24 61.35 53.21 61.99 52.35 62.74 49.48 63.38 47.41 65.82 39.58 68.02 33.43 68.31 32.3 69.12 29.26 68.16 28.68 66.39 28.04'/><path d='M50.27 7.33C51.07 4.29 49.76 3 47.98 2.36 47 2 44.08 2.39 41.44 8.08 39.7 11.81 32.43 33.12 33.95 37.77 34.71 40.1 37.95 41.32 40.38 38.99 42.69 36.78 49.81 9.09 50.27 7.33'/></g></svg>">
<title>units profile · HighFive Super Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Tajawal:wght@300;400;500;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/tokens.css">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/app.css">
<link rel="stylesheet" href="assets/css/components.css">
<link rel="stylesheet" href="assets/shell.css">
<style>
  .sa-hero { display: flex; gap: var(--space-6); flex-wrap: wrap; align-items: flex-start; margin-bottom: var(--space-5); }
  .sa-hero__status { min-width: 260px; flex: 0 1 340px; border-inline-start: var(--border-thin) solid var(--color-border-subtle); padding-inline-start: var(--space-6); }
  @media (max-width: 768px) { .sa-hero__status { border: 0; padding: 0; flex-basis: 100%; } }
  .sa-kv { display: grid; grid-template-columns: minmax(140px, 220px) minmax(0, 1fr); gap: var(--space-3) var(--space-5); margin: 0; }
  .sa-kv dt { color: var(--color-text-tertiary); font-size: var(--text-sm); }
  .sa-kv dd { margin: 0; font-weight: var(--weight-semibold); font-size: var(--text-sm); }
  @media (max-width: 560px) { .sa-kv { grid-template-columns: minmax(0, 1fr); gap: var(--space-1); } .sa-kv dd { margin-bottom: var(--space-2); } }
  .sa-tabbar { margin-bottom: var(--space-6); overflow-x: auto; }
  .sa-tabbar .tabs { flex-wrap: nowrap; white-space: nowrap; }
  .sa-tabbar .tabs > * { display: inline-flex; align-items: center; gap: var(--space-1); }
  .sa-gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: var(--space-4); }
  .sa-tile { margin: 0; border: var(--border-thin) solid var(--color-border); border-radius: var(--radius-lg); overflow: hidden; }
  .sa-tile.is-main { border-color: var(--color-warning); }
  .sa-tile__media { height: 150px; display: grid; place-content: center; justify-items: center; gap: var(--space-1); background: var(--color-surface-sunken); color: var(--color-text-tertiary); }
  .sa-tile figcaption { padding: var(--space-2); justify-content: center; }
  .sa-side { display: grid; grid-template-columns: 200px minmax(0, 1fr); gap: var(--space-6); align-items: start; }
  .sa-side__nav { display: flex; flex-direction: column; gap: var(--space-1); }
  .sa-side__nav a, .sa-side__nav span { display: flex; justify-content: space-between; align-items: center; padding: var(--space-2) var(--space-3); border-radius: var(--radius-md); font-size: var(--text-sm); color: var(--color-text-secondary); }
  .sa-side__nav a.is-active { background: var(--color-primary-subtle); color: var(--color-primary-ink); font-weight: var(--weight-semibold); }
  .sa-side__nav a:hover { background: var(--color-surface-hover); }
  .sa-side__nav .is-locked { opacity: .5; cursor: not-allowed; }
  @media (max-width: 900px) { .sa-side { grid-template-columns: minmax(0, 1fr); } .sa-side__nav { flex-direction: row; flex-wrap: wrap; } }
  .sa-players { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: var(--space-3); }
  .sa-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: var(--space-4); }
  .sa-formrow { display: grid; grid-template-columns: 180px minmax(0, 1fr); gap: var(--space-4); align-items: start; }
  @media (max-width: 640px) { .sa-formrow { grid-template-columns: minmax(0, 1fr); gap: var(--space-1); } }
</style>
</head>
<body>
<div class="app" id="app">
  <div class="scrim"></div>
  <aside class="sidebar" id="sidebarMount"></aside>
  <div class="main">
    <header class="topbar" id="topbarMount"></header>
    <nav id="topTabsMount"></nav>

    <main class="content"><div class="content__inner" style="max-width:none">
      <div id="pageHead"></div>
      <div id="upHero"></div>
      <div id="upTabs"></div>
      <div id="upBody"></div>
    </div></main>
  </div>
</div>

<script src="assets/js/data.js"></script>
<script src="assets/js/env.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/shell.js"></script>
<script src="assets/js/sa-data.js"></script>
<script src="assets/js/sa-kit.js"></script>
<script src="assets/js/sa-translation.js"></script>
<script src="assets/js/pp/pp-core.js"></script>
<script src="assets/js/pp/pp-ops.js"></script>
<script src="assets/js/up/up-info.js"></script>
<script src="assets/js/up/up-settings.js"></script>
<script>
(() => {
  /* Unit profile — mirrors pages/units/profile (ProfilePage.js + header/
     ProfileHeader.js): title "units profile", back, hero (image · rating ·
     methodology/online badges · name · company · description · translation)
     with the status block (HighFive / Partner App status + their modals) and
     the 13-tab strip. Tabs come from assets/js/up/*.js (unit-only) and the
     shared partner tabs in unit mode (pp-ops.js, ctx.unit).
     URL: unit-profile.html?id=<unitId>&tab=<key>[&redirect_to_page=…] */
  RD.boot({ activeId: "units", title: "units profile" });
  if (!document.getElementById("upBody")) return;
  const { L, esc, ic, badge } = SA;
  const qs = new URLSearchParams(location.search);
  const unit = HF.SA.units.find((x) => String(x.id) === qs.get("id")) || HF.SA.units[0];
  const partner = HF.SA.partners.find((p) => p.id === unit.partner.id);
  PP.extend(partner);

  /* ---------- per-unit sample data (shaped like GET /units/{id}) ---------- */
  if (!unit._up) {
    unit._up = true;
    const i = unit.id % 9;
    Object.assign(unit, {
      rate: i % 4 === 3 ? null : 3.5 + (i % 3) * 0.5, description: i % 2 ? `${unit.activity.name} ${unit.type.name.toLowerCase()} with lighting and changing rooms.` : "",
      gender: ["Both", "Male", "Female"][i % 3], services: ["Changing rooms", "Parking", "Lighting"].slice(0, 1 + (i % 3)),
      extra_categories: i % 3 === 0 ? ["Kids"] : [], extra_activities: i % 3 === 0 ? ["Trampoline"] : [], show_in_app: i % 5 !== 4,
      partner_allow_online: partner.settings.allow_online_attendance === 1 || unit.attendance_type === "online",
      activated_by: unit.status.value === "waiting" ? null : { name: "Super Admin" }, active_action_at: unit.status.value === "waiting" ? null : "2026-0" + ((i % 9) + 1) + "-12 10:30:00",
      loc: { type: i % 4 === 2 ? "part" : "main", part_from: null, conflicted_with: [], country: partner.country, state: partner.state, city: partner.city, branch: (partner.branches[i % partner.branches.length] || {}).name, address: `${partner.city.name}, ${partner.state.name}, ${partner.country.name}`, latitude: (24.71 + i / 100).toFixed(4), longitude: (46.67 + i / 100).toFixed(4) },
      gallery: [{ id: 1, is_image: true, main_photo: 1, original: true }, { id: 2, is_image: true, main_photo: 0 }, { id: 3, is_image: false, main_photo: 0 }],
      comments: {
        real: ["Omar Khalid", "Sara Nabil", "Yousef Adel", "Lama Fahad", "Hassan Ali"].map((n, k) => ({ id: 600 + k, user_name: n, created_at: `2026-1${k % 2}-0${k + 1} 18:2${k}:00`, comment: ["Great court, clean and well lit.", "Booking was easy, staff were friendly.", "Lights went off mid-session.", "Perfect for kids!", "تجربة ممتازة وسأعود مرة أخرى"][k], source_type: k % 3 === 2 ? "public_event" : "booking", ref: 5001 + k, rate: [5, 4, 2, 5, 4][k], status: [2, 2, 1, 2, 0][k], deleted_reason: k === 4 ? "Offensive language" : k === 2 ? "Requested by user" : null, deleted_at: k === 4 ? "2026-10-20 09:00:00" : null })),
        fake: [{ id: 700, user_name: "Ahmad R.", user_count: 3, rate: 5, description: "Amazing venue for weekend games.", commented_at: "2026-09-12 20:00:00", source_type: "booking", ref: 5003 }],
      },
    });
    if (unit.loc.type === "part") { const o = HF.SA.units.find((x) => x.partner.id === unit.partner.id && x.id !== unit.id); if (o) unit.loc.part_from = { id: o.id, name: o.name }; }
  }

  /* ---------- page head ---------- */
  const back = `units.html${qs.get("redirect_to_page") ? "?page=" + qs.get("redirect_to_page") : ""}`;
  SA.head(document.getElementById("pageHead"), {
    title: ["units profile", "ملف الوحدة"],
    crumbs: [["units", "الوحدات", "units.html"]],
    actions: `<a class="btn btn--sm btn--secondary" href="${back}">${ic(document.documentElement.dir === "rtl" ? "chevronRight" : "chevronLeft")}<span>${L("back", "رجوع")}</span></a>`,
  });

  /* ---------- hero ---------- */
  const tone = (v) => (v === "waiting" || v === "pending" ? "warning" : v === "active" ? "primary" : "danger");
  const lbl = (v) => ({ waiting: L("pending", "معلق"), pending: L("pending", "معلق"), active: L("approved", "معتمد"), inactive: L("not approved", "غير معتمد") }[v] || v);
  const indie = () => partner.is_independent && partner.show_in_app;
  function hero() {
    const u = unit;
    document.getElementById("upHero").innerHTML = `<section class="card card--pad animate-in sa-hero">
      <div class="row gap-5" style="align-items:flex-start;flex-wrap:wrap;flex:1;min-width:280px">
        <span class="cell-thumb" style="width:112px;height:112px;border-radius:var(--radius-lg)">${ic("box")}</span>
        <div class="stack gap-2" style="flex:1;min-width:200px">
          <div class="row gap-2" style="align-items:center;flex-wrap:wrap">
            ${u.rate ? `<span style="color:var(--color-warning)">${"★".repeat(Math.round(u.rate))}${"☆".repeat(5 - Math.round(u.rate))}</span> <b>${u.rate.toFixed(1)}</b>` : `<span class="t-sm text-tertiary">${L("No Rating", "لا يوجد تقييم")}</span>`}
            ${badge("primary", esc(u.booking_methodology))}
            ${u.attendance_type === "online" ? badge("success", `${L("Attendance", "الحضور")} : ${L("online", "عبر الإنترنت")}`) : ""}
          </div>
          <div class="row gap-2" style="align-items:center"><h2 class="t-h3">${esc(u.name || "---")}</h2>
            <a class="icon-btn" href="${href("translation")}" aria-label="${L("translation", "ترجمة")}" title="${L("translation", "ترجمة")}">${ic("globe")}</a></div>
          <span class="t-sm text-secondary" style="font-weight:var(--weight-semibold)">${esc(u.partner.company_name || "---")}</span>
          <p class="t-sm text-tertiary" style="max-width:560px">${u.description ? esc(u.description) : "---"}</p>
        </div>
      </div>
      <div class="sa-hero__status">
        <div class="row between gap-3" style="align-items:center;margin-bottom:var(--space-3)"><b>${L("unit Status :", "حالة الوحدة:")}</b>
          <button type="button" class="icon-btn" id="upEditStatus" aria-label="${L("update status", "تحديث الحالة")}" title="${L("update status", "تحديث الحالة")}">${ic("edit")}</button></div>
        <dl class="sa-kv" style="grid-template-columns:auto minmax(0,1fr)">
          ${indie() ? `<dt>${L("Partner App Status", "حالة تطبيق الشريك")}:</dt><dd>${u.ownappactive ? badge(tone(u.ownappactive.value), lbl(u.ownappactive.value)) : "---"}</dd>` : ""}
          <dt>${L("HighFive App Status", "حالة تطبيق هاي فايف")}:</dt><dd>${badge(tone(u.status.value), lbl(u.status.value))}</dd>
          <dt>${L("Action By:", "تم الإجراء بواسطة:")}</dt><dd>${u.activated_by ? esc(u.activated_by.name) : "---"}</dd>
          <dt>${L("Action On:", "تاريخ الإجراء:")}</dt><dd>${u.active_action_at ? esc(u.active_action_at) : "---"}</dd>
        </dl></div></section>`;
    document.getElementById("upEditStatus").onclick = editStatus;
  }
  UP.refreshHero = hero;
  function editStatus() {
    const u = unit, opts = (v) => [["1", L("Approved", "معتمد"), v === "1"], ["0", L("Not approved", "غير معتمد"), v === "0"]];
    const hf = u.status.value === "active" ? "1" : "0";
    if (!indie()) {
      /* Modal A — PUT /units/{id}/update-unit-status {active} */
      const el = SA.modal({ id: "upSt", title: L("update status", "تحديث الحالة"), body: SA.field(["status:", "الحالة:"], SA.select(opts(hf), 'data-f="a"')),
        foot: `<button class="btn btn--ghost" data-close>${L("cancel", "إلغاء")}</button><button class="btn" data-ok>${L("update", "تحديث")}</button>` });
      el.querySelector("[data-ok]").onclick = () => { u.status = { value: el.querySelector('[data-f="a"]').value === "1" ? "active" : "inactive" }; stamp(); SA.close(el); hero(); };
      return;
    }
    /* Modal B — PUT /units/{id}/update-all-unit-status {active, ownappactive}: HighFive needs Partner App approved first */
    let pa = u.ownappactive && u.ownappactive.value === "active" ? "1" : "0", h = hf;
    const body = () => `<div class="stack gap-4">${SA.field(["Partner App Status:", "حالة تطبيق الشريك:"], SA.select(opts(pa), 'data-f="pa"'))}${SA.field(["HighFive App Status:", "حالة تطبيق هاي فايف:"], SA.select(opts(h), `data-f="h" ${pa === "1" ? "" : "disabled"}`))}</div>`;
    const el = SA.modal({ id: "upStB", title: L("update status", "تحديث الحالة"), body: body(),
      foot: `<button class="btn btn--ghost" data-close>${L("cancel", "إلغاء")}</button><button class="btn" data-ok>${L("update", "تحديث")}</button>` });
    const b = el.querySelector(".modal__body");
    b.onchange = (e) => { if (e.target.dataset.f === "pa") { pa = e.target.value; if (pa === "0") h = "0"; b.innerHTML = body(); } if (e.target.dataset.f === "h") h = e.target.value; };
    el.querySelector("[data-ok]").onclick = () => { u.ownappactive = { value: pa === "1" ? "active" : "inactive" }; u.status = { value: pa === "0" ? "inactive" : h === "1" ? "active" : "inactive" }; stamp(); SA.close(el); hero(); };
  }
  function stamp() { unit.activated_by = { name: "Super Admin" }; unit.active_action_at = new Date().toISOString().slice(0, 19).replace("T", " "); }

  /* ---------- tabs (a scrolling strip, no "More" — like the dashboard) ---------- */
  const TABS = [["details", "Details", "التفاصيل"], ["location", "location", "الموقع"], ["gallery", "gallery", "معرض"], ["comments", "comments", "تعليقات"],
    ["public-events", "public events", "الأحداث العامة"], ["bookings", "bookings", "الحجوزات"], ["multi-bookings", "Multi-Booking Sessions", "جلسات الحجز المتعدد"],
    ["policy", "policy", "سياسة"], ["assigned-services", "Assigned Service Lists", "الخدمات المعينة"], ["contacts", "contacts", "جهات الاتصال"],
    ["assigned-employees", "assigned employees", "الموظفين المعينين"], ["settings", "Settings", "الإعدادات"], ["financial", "Financial", "المالية"]];
  function href(key, extra) {
    const u = new URLSearchParams(location.search);
    u.set("id", unit.id); u.set("tab", key);
    [...u.keys()].filter((k) => !["id", "tab", "redirect_to_page"].includes(k)).forEach((k) => u.delete(k));
    Object.entries(extra || {}).forEach(([k, v]) => u.set(k, v));
    return "?" + u.toString();
  }
  UP.href = href;
  PP.href = href; /* shared partner tabs build their links through PP.href */
  const tabsBar = (active) => (document.getElementById("upTabs").innerHTML = `<nav class="sa-tabbar" aria-label="${L("Unit sections", "أقسام الوحدة")}"><div class="tabs">
      ${TABS.map((t) => `<a href="${href(t[0])}" class="${t[0] === active ? "is-active" : ""}" ${t[0] === active ? 'aria-current="page"' : ""}>${esc(L(t[1], t[2]))}</a>`).join("")}</div></nav>`);

  /* ---------- router ---------- */
  const SHARED = { "public-events": "public-events", bookings: "bookings", "multi-bookings": "multi-bookings", policy: "policies", contacts: "contacts" };
  function render() {
    const u = new URLSearchParams(location.search), tab = u.get("tab") || "details";
    const solo = tab === "translation";
    ["upHero", "upTabs", "pageHead"].forEach((id) => (document.getElementById(id).hidden = solo));
    if (!solo) { tabsBar(tab); const a = document.querySelector("#upTabs .is-active"); if (a) a.scrollIntoView({ block: "nearest", inline: "nearest" }); }
    const body = document.createElement("div");
    body.className = "stack gap-6";
    document.getElementById("upBody").replaceChildren(body);
    const ctx = { unit, partner, params: u, rerender: render };
    if (solo) SATR.render(body, { key: "unit" + unit.id, itemName: unit.name, editTitle: L("edit translates", "تعديل الترجمات"), cols: [["name", L("name", "الاسم")], ["description", L("Description", "الوصف")]], src: { name: unit.name, description: unit.description }, backHref: href("details") });
    else if (UP.tabs[tab]) UP.tabs[tab](body, ctx);
    else if (SHARED[tab]) PP.tabs[SHARED[tab]](body, ctx);
    window.scrollTo({ top: 0 });
  }
  document.addEventListener("click", (e) => {
    const a = e.target.closest("a[href^='?']");
    if (!a || e.metaKey || e.ctrlKey || e.button) return;
    e.preventDefault();
    history.pushState(null, "", a.getAttribute("href"));
    render();
  });
  window.addEventListener("popstate", render);
  UP.go = (key, extra) => { history.pushState(null, "", href(key, extra)); render(); };
  hero();
  render();
})();
</script>
</body>
</html>
