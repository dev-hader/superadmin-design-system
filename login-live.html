<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <script>
            try {
                document.documentElement.setAttribute(
                    "data-theme",
                    localStorage.getItem("rd-theme") === "1" ? "dark" : "light",
                );
                document.documentElement.dir =
                    localStorage.getItem("rd-dir") === "1" ? "rtl" : "ltr";
            } catch (e) {}
        </script>
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Log in · High Five</title>
        <!-- This is the REAL login page (#2525/#2526) — wired to the external Design System
     Access backend via assets/js/api.js. login.html stays a static, view-only design
     reference (no API calls); this page is the actual product entry point that every
     RD.boot() guard (assets/shell.js) redirects unauthenticated users to. -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Tajawal:wght@300;400;500;700;800&family=JetBrains+Mono:wght@400;500&display=swap"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="assets/css/tokens.css" />
        <link rel="stylesheet" href="assets/css/base.css" />
        <link rel="stylesheet" href="assets/css/app.css" />
        <link rel="stylesheet" href="assets/css/components.css" />
    </head>
    <body>
        <div class="auth">
            <!-- Populated by the page's own script below (not auth.js's generic brand())
     with the "value props" content from the approved design — see the LANG
     dictionary + renderBrand() for copy/icons. A real background image will
     replace .auth-brand__bg's gradient once supplied; see components.css. -->
            <aside class="auth-brand" id="authBrand" data-brand="custom">
                <div class="auth-brand__bg"></div>
                <div class="auth-brand__glow"></div>
            </aside>
            <main class="auth-main auth-main-brand">
                <form
                    class="auth-card"
                    id="loginForm"
                    novalidate
                    style="z-index: 100"
                >
                    <a class="auth-card__logo" href="login-live.html"></a>
                    <div class="auth-head">
                        <h1 id="loginTitle">Log in to High Five</h1>
                        <p id="loginSubtitle">
                            Welcome back — sign in to your design system.
                        </p>
                    </div>

                    <!-- Visual only: the shared auth treatment's leading field
                         icons (.lg-fi, components.css). This page's copy, its
                         LANG dictionary and its data-brand="custom" panel are
                         deliberately left exactly as they were. -->
                    <div class="auth-field">
                        <label class="field__label" id="emailLabel"
                            >Email</label
                        >
                        <input
                            class="input"
                            id="username"
                            type="email"
                            autocomplete="username"
                            placeholder="Enter your email"
                        />
                        <span class="lg-fi" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-10 6L2 7"/></svg></span>
                    </div>

                    <div class="auth-field">
                        <label class="field__label" id="passwordLabel"
                            >Password</label
                        >
                        <div class="auth-pw">
                            <input
                                class="input"
                                id="password"
                                type="password"
                                autocomplete="current-password"
                                placeholder="Enter your password"
                            />
                            <span
                                class="auth-pw__eye"
                                data-eye="password"
                                aria-label="Show password"
                            ></span>
                            <span class="lg-fi" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></span>
                        </div>
                    </div>

                    <!-- <div class="auth-row">
                        <label class="check"
                            ><input type="checkbox" id="remember" /><span
                                class="check__box"
                            ></span
                            >Remember me</label
                        >
                        <a
                            href="forgot-password.html"
                            style="
                                color: var(--color-primary-ink);
                                font-size: var(--text-sm);
                            "
                            >Forgot Password?</a
                        >
                    </div> -->

                    <div class="auth-actions">
                        <button class="btn" type="submit" id="btnLogin">
                            Log in
                        </button>
                    </div>
                </form>
                <div class="auth-brand__bg"></div>
                <div class="auth-brand__glow-reverse"></div>
            </main>
        </div>

        <!-- Post-login destination choice — Web continues the current flow,
             Mobile App hands off to the partner-mobile-in-web-design reference. -->
        <div class="modal-overlay" id="deviceChoiceOverlay">
            <div class="modal" role="dialog" aria-modal="true" aria-labelledby="deviceChoiceTitle" style="max-width: 420px">
                <div class="modal__head">
                    <span id="deviceChoiceTitle"></span>
                </div>
                <div class="modal__body">
                    <p id="deviceChoiceSubtitle" class="t-sm text-secondary" style="margin: 0"></p>
                    <button class="btn btn--secondary" id="btnChooseWeb" type="button" style="justify-content: flex-start; text-align: start; height: auto; padding: var(--space-4)">
                        <span>
                            <span id="deviceChoiceWeb" style="display: block; font-weight: var(--weight-semibold)"></span>
                            <span id="deviceChoiceWebDesc" style="display: block; font-size: var(--text-xs); color: var(--color-text-secondary); font-weight: var(--weight-regular)"></span>
                        </span>
                    </button>
                    <button class="btn btn--secondary" id="btnChooseMobile" type="button" style="justify-content: flex-start; text-align: start; height: auto; padding: var(--space-4)">
                        <span>
                            <span id="deviceChoiceMobile" style="display: block; font-weight: var(--weight-semibold)"></span>
                            <span id="deviceChoiceMobileDesc" style="display: block; font-size: var(--text-xs); color: var(--color-text-secondary); font-weight: var(--weight-regular)"></span>
                        </span>
                    </button>
                </div>
            </div>
        </div>

        <script src="assets/js/env.js"></script>
        <script src="assets/js/api.js"></script>
        <script src="assets/shell.js"></script>
        <script src="assets/js/auth.js"></script>
        <script>
            (() => {
                /* Guest guard: already holding a valid session? Skip straight past the login
     form (honors ?redirect= the same way a fresh sign-in below does). */
                if (API.redirectIfAuthenticated()) return;

                AUTH.init();
                const $ = (id) => document.getElementById(id);
                const btn = $("btnLogin");

                /* Language (ar/en): AUTH.mountTools()'s #authDir button only flips
     document.documentElement.dir/lang for layout (auth pages render no app
     chrome, so shell.js's arInit()/arabize() — the app-wide translator — never
     runs here). Keep this page's own copy in sync with that same toggle so
     switching direction also switches the visible text, not just the layout. */
                const LANG = {
                    en: {
                        title: "Log in",
                        subtitle:
                            "Welcome back — sign in to your design system.",
                        email: "Email",
                        password: "Password",
                        emailPh: "Enter your email",
                        passwordPh: "Enter your password",
                        login: "Log in",
                        signingIn: "Signing in…",
                        emptyEmail: "Please enter the Email address",
                        emptyPassword: "Please enter the Password",
                        success: "Login successful",
                        noAccess:
                            "This account has no access yet — ask your Super Admin to add you first.",
                        /* Signed in fine, but the account's design systems don't
                           include this one (it may hold the User system). */
                        noSystem:
                            "This account doesn't have access to the Super Admin design system — ask your Super Admin to grant it.",
                        badCreds: "Incorrect email or password.",
                        network:
                            "Couldn't reach the server — likely blocked by CORS. Check the browser console.",
                        unexpected:
                            "Unexpected response from the server. Please try again.",
                        deviceTitle: "Continue on…",
                        deviceSubtitle: "Choose how you'd like to open High Five.",
                        deviceWeb: "Web",
                        deviceWebDesc: "Continue in the full partner dashboard.",
                        deviceMobile: "Mobile App",
                        deviceMobileDesc: "Open the mobile app experience instead.",
                        brand: {
                            eyebrow: {
                                pre: "",
                                accent: "Super Admin",
                                post: " Design System",
                            },
                            headline: [
                                "Thank you for",
                                "being part of ",
                                "HighFive.",
                            ],
                            desc: "One system for every screen that runs HighFive — consistent, accessible, and ready to ship.",
                            features: [
                                {
                                    icon: "trendUp",
                                    title: "Scalability",
                                    desc: "Built to grow with your product and team.",
                                },
                                {
                                    icon: "layers",
                                    title: "Consistency",
                                    desc: "Unified components, tokens, and guidelines.",
                                },
                                {
                                    icon: "accessibility",
                                    title: "Accessibility",
                                    desc: "Inclusive by default, designed for everyone.",
                                },
                                {
                                    icon: "puzzle",
                                    title: "Reusability",
                                    desc: "Modular components to save time and effort.",
                                },
                            ],
                            note: "We truly appreciate your trust and collaboration.",
                        },
                    },
                    ar: {
                        title: "تسجيل الدخول",
                        subtitle:
                            "مرحبًا بعودتك — سجّل الدخول إلى نظام التصميم الخاص بك.",
                        email: "البريد الإلكتروني",
                        password: "كلمة المرور",
                        emailPh: "أدخل بريدك الإلكتروني",
                        passwordPh: "أدخل كلمة المرور",
                        login: "تسجيل الدخول",
                        signingIn: "جارٍ تسجيل الدخول…",
                        emptyEmail: "من فضلك أدخل البريد الإلكتروني",
                        emptyPassword: "من فضلك أدخل كلمة المرور",
                        success: "تم تسجيل الدخول بنجاح",
                        noAccess:
                            "لا تملك صلاحية الوصول بعد — يرجى التواصل مع المسؤول لإضافتك أولًا.",
                        noSystem:
                            "هذا الحساب لا يملك صلاحية الوصول إلى نظام تصميم السوبر أدمن — يرجى التواصل مع المسؤول لمنحك الصلاحية.",
                        badCreds: "البريد الإلكتروني أو كلمة المرور غير صحيحة.",
                        network:
                            "تعذّر الوصول إلى الخادم — على الأرجح بسبب سياسة CORS. راجع الـ Console.",
                        unexpected:
                            "استجابة غير متوقعة من الخادم، يرجى المحاولة مرة أخرى.",
                        deviceTitle: "المتابعة عبر…",
                        deviceSubtitle: "اختر الطريقة التي تريد فتح High Five بها.",
                        deviceWeb: "الويب",
                        deviceWebDesc: "المتابعة في لوحة تحكم الشريك الكاملة.",
                        deviceMobile: "تطبيق الموبايل",
                        deviceMobileDesc: "افتح تجربة تطبيق الموبايل بدلاً من ذلك.",
                        brand: {
                            eyebrow: {
                                pre: "نظام تصميم ",
                                accent: "السوبر أدمن",
                                post: "",
                            },
                            headline: ["شكرًا لكونك", "جزءًا من ", "های فايف."],
                            desc: "نظام واحد لكل شاشة تدير هاي فايف — متّسق، سهل الوصول، وجاهز للتنفيذ.",
                            features: [
                                {
                                    icon: "trendUp",
                                    title: "قابلية التوسع",
                                    desc: "مصمم لينمو مع منتجك وفريقك.",
                                },
                                {
                                    icon: "layers",
                                    title: "الاتساق",
                                    desc: "مكوّنات وقيم تصميم وإرشادات موحّدة.",
                                },
                                {
                                    icon: "accessibility",
                                    title: "إمكانية الوصول",
                                    desc: "شامل افتراضيًا ومصمم للجميع.",
                                },
                                {
                                    icon: "puzzle",
                                    title: "إعادة الاستخدام",
                                    desc: "مكوّنات قابلة لإعادة الاستخدام توفّر الوقت والجهد.",
                                },
                            ],
                            note: "نقدّر بصدق ثقتك وتعاونك معنا.",
                        },
                    },
                };
                const lang = () =>
                    document.documentElement.dir === "rtl" ? "ar" : "en";
                const t = () => LANG[lang()];

                /* "Value props" panel (assets/js/auth.js leaves #authBrand alone because
     of its data-brand="custom" — see AUTH.init()). Rebuilt from scratch on every
     language switch; .auth-brand__bg/__glow are re-added each time so a future
     background image (applied via CSS on .auth-brand__bg, see components.css)
     keeps working regardless of language. */
                function renderBrand() {
                    const b = t().brand;
                    const feature = (f) => `
                        <div class="auth-brand__feature">
                            <span class="auth-brand__feature-icon">${RD.icon(f.icon)}</span>
                            <div>
                                <div class="auth-brand__feature-title">${f.title}</div>
                                <div class="auth-brand__feature-desc">${f.desc}</div>
                            </div>
                        </div>`;
                    $("authBrand").innerHTML = `
                        <div class="auth-brand__bg"></div>
                        <div class="auth-brand__glow"></div>
                        
                        <div class="auth-brand__content" style="text-align: start;">
                          <!-- same lockup every other auth page uses: the
                               shared inline mark + one-colour wordmark -->
                          <a class="auth-brand__logo lg-lockup" href="login-live.html">${AUTH.MARK("lgMarkGradLive", 58, 48)}<span class="lg-wordmark">High<b>Five</b></span></a>
                            <h2 class="auth-brand__headline" style="font-size: 1.6rem;">${b.eyebrow.pre}<em>${b.eyebrow.accent}</em>${b.eyebrow.post}</h2>
                            <div class="auth-brand__rule"></div>
                          
                            <p class="auth-brand__desc">${b.desc}</p>
                            <div class="auth-brand__features">${b.features.map(feature).join("")}</div>
                        </div>
                        `;
                }

                function applyLang() {
                    document.documentElement.lang = lang();
                    document.title =
                        lang() === "ar"
                            ? "تسجيل الدخول · High Five"
                            : "Log in · High Five";
                    $("loginTitle").textContent = t().title;
                    $("loginSubtitle").textContent = t().subtitle;
                    $("emailLabel").textContent = t().email;
                    $("passwordLabel").textContent = t().password;
                    $("username").placeholder = t().emailPh;
                    $("password").placeholder = t().passwordPh;
                    $("deviceChoiceTitle").textContent = t().deviceTitle;
                    $("deviceChoiceSubtitle").textContent = t().deviceSubtitle;
                    $("deviceChoiceWeb").textContent = t().deviceWeb;
                    $("deviceChoiceWebDesc").textContent = t().deviceWebDesc;
                    $("deviceChoiceMobile").textContent = t().deviceMobile;
                    $("deviceChoiceMobileDesc").textContent = t().deviceMobileDesc;
                    setLoading(btn.disabled);
                    renderBrand();
                }
                function setLoading(on) {
                    btn.disabled = on;
                    btn.textContent = on ? t().signingIn : t().login;
                }

                applyLang();
                /* AUTH.mountTools() (assets/js/auth.js) already wires #authDir to flip
     dir + persist rd-dir; piggyback a second listener to re-translate text
     right after that flip (it also runs on load, so a refresh keeps the
     previously chosen language in sync too). */
                const dirBtn = $("authDir");
                if (dirBtn) dirBtn.addEventListener("click", applyLang);

                /* Post-login destination choice — shown once, right after a
     successful login, instead of an immediate redirect. Web keeps the
     existing safeRedirect() flow; Mobile App hands off to the static
     partner-mobile-in-web-design reference (its own splash screen). */
                $("btnChooseWeb").addEventListener("click", () => {
                    location.href = safeRedirect();
                });
                $("btnChooseMobile").addEventListener("click", () => {
                    location.href = "partner-mobile-in-web-design/splash/index.html";
                });

                /* Only a relative, same-origin path (leading single "/") is honored, to avoid an
     open-redirect via a crafted ?redirect= param — mirrors RD.boot's own
     redirectToLogin() in assets/shell.js, which sends users here the same way. */
                function safeRedirect() {
                    const r = new URLSearchParams(location.search).get(
                        "redirect",
                    );
                    return r && /^\/(?!\/)/.test(r) ? r : "index.html";
                }

                /* POST /auth/login (#2525): email + password created by the Super Admin.
     Client-side validation only blocks empty fields — the server is the source of
     truth for whether the credentials/account are actually valid. */
                $("loginForm").addEventListener("submit", async (e) => {
                    e.preventDefault();
                    const email = $("username").value.trim(),
                        password = $("password").value.trim();
                    if (!email) return RD.toast("danger", t().emptyEmail);
                    if (!password) return RD.toast("danger", t().emptyPassword);

                    setLoading(true);
                    try {
                        const { token, expiresIn, systems, system } =
                            await API.login(email, password);
                        /* Multiple design systems (backend change, 2026-08-16):
     the login response now carries the user's systems, each with its
     own permissions. This deck is the Super Admin one and only that one —
     an account holding just the User system is refused here rather
     than let in against User keys. `systems` is null, not empty, when
     the response says nothing about systems at all (older backend),
     which keeps working unchanged. */
                        if (systems && !system) {
                            API.clearSession();
                            setLoading(false);
                            return RD.toast("danger", t().noSystem);
                        }
                        /* #remember checkbox is currently commented out of the markup above —
     guard against it being absent instead of throwing, defaulting to a
     session-only (non-persistent) login. */
                        const remember = $("remember")
                            ? $("remember").checked
                            : false;
                        /* systems are persisted with the token, so the first
     product page paints against this system's real permissions
     instead of the "dashboard only" default while /me is in flight. */
                        API.saveSession(token, expiresIn, remember, systems);
                        RD.toast("success", t().success);
                        setLoading(false);
                        /* No Web / Mobile chooser here: the Super Admin has no
     mobile app, so a successful login goes straight in. */
                        setTimeout(() => {
                            location.href = safeRedirect();
                        }, 500);
                    } catch (err) {
                        setLoading(false);
                        console.error("[login] failed:", err); // inspect this in DevTools Console for the real cause
                        if (err.status === 403)
                            RD.toast("danger", t().noAccess);
                        else if (err.status === 401)
                            RD.toast("danger", t().badCreds);
                        else if (err.status === 0)
                            RD.toast("danger", t().network);
                        else RD.toast("danger", t().unexpected);
                    }
                });
            })();
        </script>
    </body>
</html>
