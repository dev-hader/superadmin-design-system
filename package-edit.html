<style>
  .sa-hero { display: flex; gap: var(--space-6); flex-wrap: wrap; align-items: flex-start; margin-bottom: var(--space-5); }
  .sa-hero__status { min-width: 260px; flex: 0 1 340px; border-inline-start: var(--border-thin) solid var(--color-border-subtle); padding-inline-start: var(--space-6); }
  @media (max-width: 768px) { .sa-hero__status { border: 0; padding: 0; flex-basis: 100%; } }
  .sa-kv { display: grid; grid-template-columns: minmax(140px, 220px) minmax(0, 1fr); gap: var(--space-3) var(--space-5); margin: 0; }
  .sa-kv dt { color: var(--color-text-tertiary); font-size: var(--text-sm); }
  .sa-kv dd { margin: 0; font-weight: var(--weight-semibold); font-size: var(--text-sm); }
  @media (max-width: 560px) { .sa-kv { grid-template-columns: minmax(0, 1fr); gap: var(--space-1); } .sa-kv dd { margin-bottom: var(--space-2); } }
  .sa-tabbar { margin-bottom: var(--space-6); overflow-x: auto; }
  .sa-tabbar .tabs { flex-wrap: nowrap; white-space: nowrap; }
  .sa-tabbar .tabs > * { display: inline-flex; align-items: center; gap: var(--space-1); }
  .sa-gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: var(--space-4); }
  .sa-tile { margin: 0; border: var(--border-thin) solid var(--color-border); border-radius: var(--radius-lg); overflow: hidden; }
  .sa-tile.is-main { border-color: var(--color-warning); }
  .sa-tile__media { height: 150px; display: grid; place-content: center; justify-items: center; gap: var(--space-1); background: var(--color-surface-sunken); color: var(--color-text-tertiary); }
  .sa-tile figcaption { padding: var(--space-2); justify-content: center; }
  .sa-side { display: grid; grid-template-columns: 200px minmax(0, 1fr); gap: var(--space-6); align-items: start; }
  .sa-side__nav { display: flex; flex-direction: column; gap: var(--space-1); }
  .sa-side__nav a, .sa-side__nav span { display: flex; justify-content: space-between; align-items: center; padding: var(--space-2) var(--space-3); border-radius: var(--radius-md); font-size: var(--text-sm); color: var(--color-text-secondary); }
  .sa-side__nav a.is-active { background: var(--color-primary-subtle); color: var(--color-primary-ink); font-weight: var(--weight-semibold); }
  .sa-side__nav a:hover { background: var(--color-surface-hover); }
  .sa-side__nav .is-locked { opacity: .5; cursor: not-allowed; }
  @media (max-width: 900px) { .sa-side { grid-template-columns: minmax(0, 1fr); } .sa-side__nav { flex-direction: row; flex-wrap: wrap; } }
  .sa-players { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: var(--space-3); }
  .sa-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: var(--space-4); }
  .sa-formrow { display: grid; grid-template-columns: 180px minmax(0, 1fr); gap: var(--space-4); align-items: start; }
  @media (max-width: 640px) { .sa-formrow { grid-template-columns: minmax(0, 1fr); gap: var(--space-1); } }

  /* ---- redesign (2026-11-17): record header · section index · form-section cards · two-column fields · formbar ---- */
  .pe-head { margin-bottom: var(--space-6); }
  .pe-head .record-head__id h1 { margin-block: 2px var(--space-2); }
  .pe-layout { display: grid; grid-template-columns: 232px minmax(0, 1fr); gap: var(--space-6); align-items: start; }
  .pe-main { min-width: 0; display: flex; flex-direction: column; gap: var(--space-4); }
  .pe-main > .form-section + .form-section { margin: 0; }
  .pe-main .form-section { scroll-margin-top: calc(var(--topbar-height) + var(--space-4)); }
  .pe-main .form-section__title { font-size: var(--text-body, var(--text-sm)); }
  .pe-body { padding-top: var(--space-4); }
  .pe-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--space-4) var(--space-5); }
  .pe-grid > .field { margin: 0; min-width: 0; }
  .pe-index { position: sticky; top: calc(var(--topbar-height) + var(--space-4)); }
  .pe-index__card { display: flex; flex-direction: column; gap: 1px; padding: var(--space-3) var(--space-2); background: var(--color-surface); border: 1px solid var(--color-border-subtle); border-radius: var(--radius-lg); box-shadow: var(--shadow-xs); }
  .pe-index__title { padding: var(--space-1) var(--space-3) var(--space-2); font-size: var(--text-xs); font-weight: var(--weight-semibold); text-transform: uppercase; letter-spacing: var(--tracking-caps); color: var(--color-text-tertiary); }
  .pe-index__link { display: flex; align-items: center; gap: var(--space-3); padding: 8px var(--space-3); border-radius: var(--radius-md); font-size: var(--text-sm); color: var(--color-text-secondary); text-decoration: none; }
  .pe-index__link:hover { background: var(--color-surface-hover); color: var(--color-text); }
  .pe-index__link.is-invalid, .pe-index__link.is-invalid .pp-ic { color: var(--color-danger); font-weight: var(--weight-semibold); }
  .pp-ic { display: inline-grid; place-items: center; width: 18px; height: 18px; flex-shrink: 0; color: var(--color-text-tertiary); }
  .pp-ic svg { width: 16px; height: 16px; }
  .pe-bar { border-radius: var(--radius-lg) var(--radius-lg) 0 0; margin-inline: 0; }
  .pe-body .row { flex-wrap: wrap; }
  @media (max-width: 1000px) { .pe-layout { grid-template-columns: minmax(0, 1fr); } .pe-index { display: none; } }
  @media (max-width: 640px) { .pe-grid { grid-template-columns: minmax(0, 1fr); } .pe-bar { margin-inline: 0; border-radius: 0; } }

<script>
(() => {
  /* Edit package — mirrors pages/packages/package-edit (EditPackagePage + 9
     sections): status (read-only) · basic info · branches · media ·
     availability · validity & plans · access schedule · capacity · usage
     rules, sticky save bar, "fix the highlighted fields" jump list, discard
     changes guard. URL: package-edit.html?id=<pkgId>[&section=plans]
     Redesign (2026-11-17): same 9 sections, fields, validation and guard —
     re-composed like partners-add: a record header for the package, a sticky
     section index (errors flagged), registry form-section cards with fields in
     two columns, and the registry formbar. Previous layout:
     revisions/2026-11-17-all-pages/package-edit.html
     Save: POST /packages/{id} (multipart, _method=PUT) with the form + version.
     422 → errors under the fields (+ the "fix the highlighted fields" list);
     409 → toast + reload the form; 403 → back to the package; 404 → the list.
     Demo flags (samples, off by default): ?demo=readonly (read-only package —
     fields disabled, Save hidden), ?demo=locks (GET /edit per-plan locks with the
     server's texts), ?demo=banner (a GET /edit server banner).
     Permissions (job keys): the route sits under PackagesPage, gated by PERMISSIONS.PARTNERS.VIEW_PARTNER_PACKAGES is an empty string in the dashboard
     (constants/permissions.js, TODO 'view_partner_packages') — hasPermission() lets
     everyone in, so the page carries no perm key (?perm=none keeps it open, as the dashboard).
     Read-only / locks come from the GET /edit API flags (edit.visible …), not job keys. */
  RD.boot({ activeId: "packages", title: "Edit package" });
  if (!document.getElementById("keBody")) return;
  const { L, esc, ic, badge } = SA;
  const qs = new URLSearchParams(location.search);
  const demo = qs.get("demo");
  const readOnly = demo === "readonly"; /* data.readOnly || !data.canManage */
  const lockDemo = demo === "locks";
  const pkg = KP.extend(HF.SA.packages.find((x) => String(x.id) === qs.get("id")) || HF.SA.packages[0]);
  KP.pkg = pkg;
  const detail = `package-detail.html?id=${pkg.id}&tab=details`;
  const isRTL = () => document.documentElement.dir === "rtl";
  const apBadge = (v) => (v === "not_approved" ? badge("danger", L("Not approved", "غير مقبولة")) : KP.approvalBadge(v));
  const subs = pkg.approval_status.value === "approved" ? pkg.subscribers.active : 0;
  const DAYS = [["Sat", "Saturday", "السبت"], ["Sun", "Sunday", "الأحد"], ["Mon", "Monday", "الاثنين"], ["Tue", "Tuesday", "الثلاثاء"], ["Wed", "Wednesday", "الأربعاء"], ["Thu", "Thursday", "الخميس"], ["Fri", "Friday", "الجمعة"]];

  /* ---------- form state (GET /packages/{id}/edit → form) ---------- */
  const cat = HF.SA.CATS.find((c) => c.name === pkg.categories[0]) || HF.SA.CATS[0];
  const init = {
    name: pkg.name, description: pkg.description, categories: [String(cat.id)], activities: [pkg.categories[1]].filter(Boolean),
    all_age_groups: pkg.all_age_groups, age_groups: pkg.age_groups.map((a) => a.name), gender: pkg.gender,
    branches: pkg.branchList.map((b) => String(b.id)), cover: true, remove_cover: false, cover_file: null, gallery: pkg.galleryList.map((g) => ({ id: g.id, removed: false })),
    availability_type: pkg.availability.display_starts_at ? "specific_period" : "always", display_starts_at: pkg.availability.display_starts_at || "", display_ends_at: pkg.availability.display_ends_at || "",
    validity: pkg.validity.type,
    plans: pkg.planList.map((p) => ({ id: p.id, name: p.name, price: p.price, active: p.active, starts_on: p.starts_on ? p.starts_on.split("/").reverse().join("-") : "", ends_on: p.ends_on ? p.ends_on.split("/").reverse().join("-") : "", duration_value: p.duration_value, duration_unit: p.duration_unit, activation_window_value: p.activation_window_value || 14, activation_window_unit: "day", allow_renewal: p.renewal, renewal_window_days: 7, subscribers: p.subscribers.active })),
    access_type: pkg.access_schedule.days ? "scheduled" : "full_access",
    /* stored slots are `original` — with can_restrict:false they can't be deleted or narrowed */
    schedule: DAYS.map((d) => { const on = pkg.access_schedule.days ? ["Sun", "Tue"].includes(d[0]) : false; return { day: d[0], on, slots: on ? [{ from: "08:00", to: "22:00", original: true }] : [] }; }),
    capacity_type: pkg.capacityD.type, capacity_value: pkg.capacityD.limit || "",
    usage_type: pkg.usage_rules.type, usage_limit: pkg.usage_rules.limit || "", usage_reset: pkg.usage_rules.reset_period || "",
    notify: true,
  };
  let f = JSON.parse(JSON.stringify(init)), errs = {}, tried = false;
  const dirty = () => JSON.stringify(f) !== JSON.stringify(init);
  const resubmit = pkg.approval_status.value === "not_approved";
  /* GET /edit locks: access_schedule.can_restrict (false while it has subscribers), capacity.min_total /
     min_active, usage.min_limit and subscribers {total, active, highest_usage} */
  const restricted = subs > 0;
  const subsTotal = subs ? subs + 4 : 0, highestUsage = subs && pkg.usage_rules.type === "limited" ? 3 : 0;
  const minTotal = subsTotal, minActive = subs, minUsage = highestUsage;
  const capFloor = (type) => (type === "total" ? minTotal : type === "active" ? minActive : 0);
  const isWhole = (v) => /^\d+$/.test(String(v == null ? "" : v).trim()) && +v > 0;
  const DAYS_PER = { day: 1, week: 7, month: 30, year: 365 }; /* the renewal window's ceiling = the plan's duration in days */
  const durDays = (p) => (isWhole(p.duration_value) && DAYS_PER[p.duration_unit] ? +p.duration_value * DAYS_PER[p.duration_unit] : null);
  const subsWord = (n) => L(`${n} subscriber${n === 1 ? "" : "s"}`, n === 1 ? "مشترك واحد" : n === 2 ? "مشتركان" : n % 100 >= 3 && n % 100 <= 10 ? `${n} مشتركين` : `${n} مشتركاً`); /* PACKAGES.PLAN_SUBSCRIBERS */
  /* per-plan locks (locks.plans[] — the server's own texts); sample via ?demo=locks */
  const planLock = (p) => (!lockDemo || !p.id ? null : {
    duration: L(`This plan has ${subsWord(p.subscribers || 1)}, so its duration can't change.`, `لدى هذه الخطة ${subsWord(p.subscribers || 1)}، لذلك لا يمكن تغيير مدتها.`),
    starts_on: L("Subscribers have already started on this date.", "بدأ المشتركون بالفعل في هذا التاريخ."),
    ends_on: { message: p.subscribers ? "" : L("The end date is managed by HighFive support.", "يدير دعم HighFive تاريخ الانتهاء.") },
    can_delete: false, delete_message: L(`This plan has ${subsWord(p.subscribers || 1)} and can't be deleted.`, `لدى هذه الخطة ${subsWord(p.subscribers || 1)} ولا يمكن حذفها.`) });
  const nameLocked = lockDemo, canAddPlan = !lockDemo;
  let rejected = []; /* gallery files refused on pick */
  /* locks.plans[].ends_on {min}: with subscribers the end date can only move later than the stored one */
  const endMin = (p) => { const o = p.id && init.plans.find((x) => x.id === p.id); return o && o.subscribers && o.ends_on ? o.ends_on : null; };

  /* ---------- head: a record header for the package being edited ---------- */
  document.getElementById("pageHead").innerHTML = `<header class="page-head pe-head animate-in" style="max-width:none">
      <nav class="breadcrumb" aria-label="Breadcrumb"><a href="packages.html">${L("Packages", "الباقات")}</a><span aria-hidden="true">›</span><a href="${detail}" data-leave>${esc(pkg.name)}</a><span aria-hidden="true">›</span><span>${L("Edit", "تعديل")}</span></nav>
      <div class="record-head">
        <span class="record-head__media" aria-hidden="true">${ic("package")}</span>
        <div class="record-head__id">
          <span class="t-sm text-tertiary">${L("Edit package", "تعديل الباقة")}</span>
          <h1>${esc(pkg.name)}</h1>
          <div class="record-head__badges">${apBadge(pkg.approval_status.value)}${KP.statusBadge(pkg.package_status)}<span class="badge">#${pkg.id}</span></div>
          <div class="record-head__meta"><span>${esc(pkg.partner.name)}</span><span>${pkg.categories.map(esc).join(" · ")}</span></div>
        </div>
        <div class="record-head__actions">
          <a class="btn btn--secondary" href="${detail}" data-leave>${ic(isRTL() ? "chevronRight" : "chevronLeft")}<span>${L("Back", "رجوع")}</span></a>
        </div>
      </div>
    </header>`;

  /* ---------- bits ---------- */
  const err = (k) => (errs[k] ? `<span class="field__error">${ic("warn")} ${errs[k]}</span>` : "");
  const fld = (label, control, k, o) => `<div class="field ${errs[k] ? "is-invalid" : ""}"><label class="field__label">${label}${o && o.req ? ' <span class="req">*</span>' : ""}</label>${control}${o && o.lock ? lockLine(o.lock) : ""}${errs[k] ? err(k) : o && o.hint ? `<span class="field__hint">${o.hint}</span>` : ""}</div>`;
  const radio = (name, val, label, cur) => `<label class="check check--radio"><input type="radio" name="${name}" value="${val}" data-k="${name}" ${cur === val ? "checked" : ""}><span class="check__box"><span class="check__dot"></span></span>${label}</label>`;
  const sw = (k, on, label, attrs) => `<label class="row gap-2" style="align-items:center"><span class="switch"><input type="checkbox" data-k="${k}" ${on ? "checked" : ""} ${attrs || ""} aria-label="${esc(label)}"><span class="switch__track"></span></span><span class="t-sm">${label}</span></label>`;
  const checks = (k, opts, cur) => `<div class="row gap-3" style="flex-wrap:wrap">${opts.map((o) => `<label class="check"><input type="checkbox" data-m="${k}" value="${esc(o[0])}" ${cur.includes(String(o[0])) ? "checked" : ""} ${o[2] ? "disabled" : ""}><span class="check__box">${ic("check")}</span>${esc(o[1])}</label>`).join("")}</div>`;
  const input = (k, v, attrs) => `<input class="input" data-k="${k}" value="${esc(v)}" ${attrs || ""}>`;
  const unitSel = (k, v, locked) => SA.select([["day", L("Day(s)", "يوم"), v === "day"], ["week", L("Week(s)", "أسبوع"), v === "week"], ["month", L("Month(s)", "شهر"), v === "month"], ["year", L("Year(s)", "سنة"), v === "year"]], `data-k="${k}" ${locked ? "disabled" : ""}`);
  /* registry form-section (static flavour): icon · title · subtitle, flagged when a field inside failed */
  const SICON = { status: "shield", basic: "info", branches: "hotel", media: "camera", availability: "eye", plans: "list", schedule: "clock", capacity: "users", usage: "refresh" };
  const secErr = (id) => Object.keys(errs).some((k) => k.split(".")[0] === id);
  const section = (id, title, desc, body) => `<section class="form-section form-section--static${secErr(id) ? " is-invalid" : ""}" id="section-${id}" aria-labelledby="sec-t-${id}">
      <div class="form-section__head"><span class="form-section__ic">${ic(SICON[id])}</span><span class="form-section__txt"><h2 class="form-section__title" id="sec-t-${id}">${title}</h2>${desc ? `<span class="form-section__sub">${desc}</span>` : ""}</span></div>
      <div class="form-section__body"><div class="stack gap-4 pe-body">${body}</div></div></section>`;
  /* a locked field's note: the server's text, or the generic PACKAGES.FIELD_LOCKED when locked without one */
  const lockLine = (text) => `<span class="t-xs text-tertiary row gap-1" style="align-items:center">${ic("lock")} ${text === true ? L("Can't be changed on this package.", "لا يمكن تغيير هذا في هذه الباقة.") : esc(text)}</span>`;
  const lockNote = lockLine(true);

  function paint() {
    const acts = f.categories.flatMap((c) => HF.SA.ACTS[c] || []);
    const SECTIONS = [
      ["status", L("Package status", "حالة الباقة")], ["basic", L("Basic information", "المعلومات الأساسية")], ["branches", L("Branch assignment", "تعيين الفروع")], ["media", L("Package media", "وسائط الباقة")],
      ["availability", L("Availability", "الإتاحة")], ["plans", L("Subscription validity & plans", "صلاحية الاشتراك والخطط")], ["schedule", L("Access schedule", "جدول الدخول")], ["capacity", L("Subscriber capacity", "سعة المشتركين")], ["usage", L("Usage rules", "قواعد الاستخدام")]];
    const errSecs = SECTIONS.filter((s) => Object.keys(errs).some((k) => k.split(".")[0] === s[0]));
    const gal = f.gallery.filter((g) => !g.removed).length;
    document.getElementById("keBody").innerHTML = `<div class="pe-layout">
      <nav class="pe-index" aria-label="${L("Package sections", "أقسام الباقة")}"><div class="pe-index__card">
        <b class="pe-index__title">${L("Sections", "الأقسام")}</b>
        ${SECTIONS.map((s) => `<a href="#section-${s[0]}" class="pe-index__link${secErr(s[0]) ? " is-invalid" : ""}"><span class="pp-ic" aria-hidden="true">${ic(secErr(s[0]) ? "warn" : SICON[s[0]])}</span><span>${s[1]}</span></a>`).join("")}

  function validate() {

      if (!f.display_starts_at) e["availability.start"] = REQ;
      if (!f.display_ends_at) e["availability.end"] = REQ;
      else if (f.display_starts_at && f.display_ends_at <= f.display_starts_at) e["availability.end"] = L("The end date must be after the start date.", "يجب أن يكون تاريخ الانتهاء بعد تاريخ البدء.");
      else if (f.display_ends_at !== init.display_ends_at && f.display_ends_at <= today) e["availability.end"] = L("The end date must be in the future.", "يجب أن يكون تاريخ الانتهاء في المستقبل.");
    }
    if (!f.plans.length) e["plans.none"] = L("Add at least one plan.", "أضف خطة واحدة على الأقل.");
    const WHOLE = L("Enter a whole number of 1 or more.", "أدخل عدداً صحيحاً يساوي 1 أو أكثر.");
    f.plans.forEach((p, j) => {
      const lk = planLock(p);
      if (!String(p.name).trim()) e[`plans.${j}.name`] = REQ;
      if (p.price === "" || +p.price < 0) e[`plans.${j}.price`] = L("Enter a price of 0 or more.", "أدخل سعراً يساوي 0 أو أكثر.");
      if (f.validity === "fixed_date_range") {
        if (!p.starts_on) e[`plans.${j}.starts_on`] = REQ;
        if (!p.ends_on) e[`plans.${j}.ends_on`] = REQ;
        else if (p.starts_on && p.ends_on < p.starts_on) e[`plans.${j}.ends_on`] = L("The end date must be on or after the start date.", "يجب أن يكون تاريخ الانتهاء في يوم البدء أو بعده.");
        else if (endMin(p) && p.ends_on < endMin(p)) e[`plans.${j}.ends_on`] = L(`With subscribers, the end date can't be before ${endMin(p)}.`, `مع وجود مشتركين، لا يمكن أن يكون تاريخ الانتهاء قبل ${endMin(p)}.`);
      } else {
        /* not checked while locked — the server keeps the stored value */
        if (!(lk && lk.duration) && !isWhole(p.duration_value)) e[`plans.${j}.duration`] = WHOLE;
        if (f.validity === "user_activation" && !isWhole(p.activation_window_value)) e[`plans.${j}.activation`] = WHOLE;
        if (p.allow_renewal) { const max = durDays(p);
          if (!isWhole(p.renewal_window_days)) e[`plans.${j}.renewal`] = WHOLE;
          else if (max && +p.renewal_window_days > max) e[`plans.${j}.renewal`] = L(`At most ${max} days - the plan's duration.`, `${max} يوماً كحد أقصى - مدة الخطة.`); }
      }
    });
    /* schedule errors sit under their day (schedule.{Day}); schedule._ for the whole schedule */
    if (f.access_type === "scheduled") {
      if (!f.schedule.some((d) => d.on)) e["schedule._"] = L("Switch on at least one day.", "فعّل يوماً واحداً على الأقل.");
      f.schedule.forEach((d, j) => { if (!d.on) return; const day = L(DAYS[j][1], DAYS[j][2]), key = `schedule.${d.day}`;
        if (!d.slots.length || d.slots.some((s) => !s.from || !s.to)) e[key] = L(`${day}: fill in the start and end of every time slot.`, `${day}: أدخل بداية ونهاية كل فترة زمنية.`);
        else if (d.slots.some((s) => s.to <= s.from)) e[key] = L(`${day}: each time slot must end after it starts.`, `${day}: يجب أن تنتهي كل فترة بعد بدايتها.`);
        else { const s = d.slots.slice().sort((a, b) => a.from.localeCompare(b.from)); if (s.some((x, i) => i && x.from < s[i - 1].to)) e[key] = L(`${day}: time slots overlap.`, `${day}: الفترات الزمنية متداخلة.`); } });
      /* can_restrict:false — every stored hour must still be open (a wider slot is fine) */
      if (restricted && init.access_type === "scheduled") f.schedule.forEach((d, j) => {
        const before = init.schedule[j], key = `schedule.${d.day}`;
        if (!before.on || e[key]) return;
        const lost = !d.on || before.slots.some((o) => !d.slots.some((c) => c.from <= o.from && c.to >= o.to));
        if (lost) e[key] = L(`${L(DAYS[j][1], DAYS[j][2])}: the existing hours must stay open - they can only be extended.`, `${DAYS[j][2]}: يجب أن تبقى الساعات الحالية متاحة - يمكن تمديدها فقط.`);
      });
    }
    if (f.capacity_type !== "unlimited") { const floor = capFloor(f.capacity_type); if (!isWhole(f.capacity_value)) e["capacity.value"] = WHOLE; else if (floor && +f.capacity_value < floor) e["capacity.value"] = L(`Can't be less than ${floor} - the current subscribers.`, `لا يمكن أن يقل عن ${floor} - عدد المشتركين الحاليين.`); }
    if (f.usage_type === "limited") {
      if (!isWhole(f.usage_limit)) e["usage.limit"] = WHOLE; else if (minUsage && +f.usage_limit < minUsage) e["usage.limit"] = L(`Can't be less than ${minUsage} - a subscriber has already used that many.`, `لا يمكن أن يقل عن ${minUsage} - استخدم أحد المشتركين هذا العدد بالفعل.`);
      if (!f.usage_reset) e["usage.reset"] = REQ;
    }
    return e;
  }

  /* ---------- events ---------- */
  const setPath = (path, v) => { const ks = path.split("."); let o = f; ks.slice(0, -1).forEach((k) => (o = o[k])); o[ks[ks.length - 1]] = v; };
  const body = document.getElementById("keBody");
  const repaint = () => { const y = scrollY; paint(); scrollTo(0, y); };
  body.addEventListener("input", (e) => { const k = e.target.dataset.k; if (k && e.target.type !== "radio" && e.target.type !== "checkbox") { setPath(k, e.target.value); const b = body.querySelector("[data-save]"); if (b) b.disabled = !dirty(); } });
  /* cover: 16:9 crop (UploadCropImage), PNG / JPG, 10 MB · gallery: PNG / JPG / WEBP, 10 MB each, up to 10, no crop */
  const MAX_MB = 10, MAX_GALLERY = 10, GAL_TYPES = ["image/png", "image/jpeg", "image/jpg", "image/webp"];
  body.addEventListener("change", async (e) => {
    if (e.target.matches("[data-coverfile]")) {
      const file = e.target.files[0]; e.target.value = "";
      if (!file) return;
      delete errs["media.cover"];
      if (file.size > MAX_MB * 1048576) { errs["media.cover"] = L(`Maximum size ${MAX_MB} MB.`, `الحجم الأقصى ${MAX_MB} ميجابايت.`); return repaint(); }
      const url = await SA.crop(file, { ratio: 16 / 9, title: L("Cover image", "صورة الغلاف") });
      if (url) { f.cover_file = url; f.remove_cover = false; }
      return repaint();
    }
    if (e.target.matches("[data-galfile]")) {
      const picked = [...e.target.files]; e.target.value = "";
      const room = MAX_GALLERY - f.gallery.filter((g) => !g.removed).length, ok = [];
      rejected = [];
      picked.forEach((file) => {
        if (!GAL_TYPES.includes(file.type)) rejected.push(L(`${file.name}: only PNG, JPG or WEBP images.`, `${file.name}: صور PNG أو JPG أو WEBP فقط.`));
        else if (file.size > MAX_MB * 1048576) rejected.push(L(`${file.name}: larger than ${MAX_MB} MB.`, `${file.name}: أكبر من ${MAX_MB} ميجابايت.`));
        else ok.push(file);
      });
      if (ok.length > room) rejected.push(L(`The gallery holds up to ${MAX_GALLERY} images - the extra ones were not added.`, `يتسع المعرض لـ ${MAX_GALLERY} صور كحد أقصى - لم تتم إضافة الصور الزائدة.`));
      ok.slice(0, Math.max(0, room)).forEach((file) => f.gallery.push({ id: null, new: true, removed: false, url: URL.createObjectURL(file) }));
      return repaint();
    }
    const k = e.target.dataset.k, m = e.target.dataset.m;
    if (m) { const s = new Set(f[m]); e.target.checked ? s.add(e.target.value) : s.delete(e.target.value); f[m] = [...s]; if (m === "categories") f.activities = f.activities.filter((a) => f.categories.some((c) => (HF.SA.ACTS[c] || []).includes(a))); }
    else if (k) {
      setPath(k, e.target.type === "checkbox" ? e.target.checked : e.target.value);
      /* switching a day on with no slots starts it with one empty slot */
      const dm = k.match(/^schedule\.(\d+)\.on$/);
      if (dm && e.target.checked && !f.schedule[+dm[1]].slots.length) f.schedule[+dm[1]].slots.push({ from: "", to: "", original: false });
    }
    if (tried) errs = validate();
    repaint();
  });
  body.addEventListener("click", (e) => {
    const t = (s) => e.target.closest(s);
    if (t("[data-pickcover]")) return body.querySelector("[data-coverfile]").click();
    if (t("[data-rmnewcover]")) { f.cover_file = null; return repaint(); }
    if (t("[data-rmcover]")) { f.remove_cover = true; return repaint(); }
    if (t("[data-undo]")) { f.remove_cover = false; return repaint(); }
    if (t("[data-gal]")) { const g = f.gallery[+t("[data-gal]").dataset.gal]; g.new ? f.gallery.splice(f.gallery.indexOf(g), 1) : (g.removed = !g.removed); return repaint(); }
    if (t("[data-addimg]")) return body.querySelector("[data-galfile]").click();
    if (t("[data-addplan]")) { f.plans.push({ id: null, name: "", price: "", active: true, starts_on: "", ends_on: "", duration_value: 1, duration_unit: "month", activation_window_value: 14, activation_window_unit: "day", allow_renewal: false, renewal_window_days: 7, subscribers: 0 }); return repaint(); }
    if (t("[data-delplan]")) { f.plans.splice(+t("[data-delplan]").dataset.delplan, 1); return repaint(); }
    if (t("[data-addslot]")) { f.schedule[+t("[data-addslot]").dataset.addslot].slots.push({ from: "", to: "", original: false }); return repaint(); }
    if (t("[data-rmslot]")) { const [d, x] = t("[data-rmslot]").dataset.rmslot.split("."); f.schedule[d].slots.splice(+x, 1); return repaint(); }
    if (t("[data-save]")) {
      tried = true; errs = validate();
      if (Object.keys(errs).length) { paint(); const first = body.querySelector(".field__error, .alert--danger"); const sec = first && first.closest("section[id^='section-']"); (sec || body).scrollIntoView({ behavior: "smooth", block: "start" }); return; }
      RD.toast("success", L("Package updated", "تم تحديث الباقة"));
      Object.assign(pkg, { name: f.name, description: f.description });
      leaving = true; location.href = detail; return;
    }
  });
  /* unsaved-changes guard (useUnsavedChangesGuard.js) */
  let leaving = false;
  document.addEventListener("click", (e) => {
    const a = e.target.closest("[data-leave], .sidebar a, .content a[href]:not([href^='#'])");
    if (!a || leaving || !dirty() || a.closest("#keBody section")) return;
    e.preventDefault();
    const el = SA.modal({ id: "keDiscard", title: L("Discard changes?", "تجاهل التغييرات؟"), body: `<p class="t-sm text-secondary">${L("You have unsaved changes to this package. If you leave now, they will be lost.", "لديك تغييرات غير محفوظة على هذه الباقة. إذا غادرت الآن فستفقدها.")}</p>`,
      foot: `<button class="btn btn--ghost" data-close>${L("Keep editing", "متابعة التعديل")}</button><button class="btn btn--danger" data-ok>${L("Discard changes", "تجاهل التغييرات")}</button>` });
    el.querySelector("[data-ok]").onclick = () => { leaving = true; location.href = a.getAttribute("href"); };
  }, true);
  window.addEventListener("beforeunload", (e) => { if (dirty() && !leaving) { e.preventDefault(); e.returnValue = ""; } });

  paint();
  const s = qs.get("section");
  if (s) { const el = document.getElementById("section-" + s); if (el) setTimeout(() => el.scrollIntoView({ block: "start" }), 50); }
})();
</script>
</body>
</html>
