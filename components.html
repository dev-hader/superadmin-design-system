<style>
  .comp-list { width: 240px; flex-shrink: 0; display: flex; flex-direction: column; gap: 2px; }
  .comp-list button { text-align: start; padding: 9px 12px; border-radius: var(--radius-md); font-size: var(--text-sm); color: var(--color-text-secondary); display: flex; align-items: center; gap: 8px; }
  .comp-list button svg { width: 15px; height: 15px; flex-shrink: 0; }
  .comp-list button:hover { background: var(--color-surface-hover); color: var(--color-text); }
  .comp-list button.is-active { background: var(--color-primary-subtle); color: var(--color-primary); font-weight: var(--weight-semibold); }
  .comp-list__label { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--color-text-tertiary); padding: var(--space-4) 12px 4px; }
  .comp-list__label:first-child { padding-top: 4px; }
  .comp-stage { flex: 1; min-width: 0; background: var(--color-surface-sunken); border-radius: var(--radius-lg); padding: var(--space-8); }
  .comp-stage__head { display: flex; align-items: center; gap: var(--space-3); margin-bottom: var(--space-5); }
  .comp-stage__head .kpi-ic { width: 36px; height: 36px; }
  .comp-stage__head .kpi-ic svg { width: 18px; height: 18px; }
  .comp-stage__demo { display: flex; flex-wrap: wrap; gap: var(--space-5); align-items: flex-start; }
  .comp-stage__note { margin-top: var(--space-4); }

  .phone-field { display: flex; gap: 0; max-width: 320px; }
  .phone-field .input { border-start-start-radius: 0; border-end-start-radius: 0; border-start-end-radius: var(--radius-md); border-end-end-radius: var(--radius-md); }
  .dropdown-demo { position: relative; display: inline-block; }
  .flag-chip { width: 20px; height: 14px; border-radius: 3px; flex-shrink: 0; overflow: hidden; display: inline-block; box-shadow: 0 0 0 1px rgba(0,0,0,0.08); }
  .flag-chip svg { display: block; width: 100%; height: 100%; }
  .phone-field__country {
    display: flex; align-items: center; gap: 7px; height: 42px; padding: 0 10px;
    border: 1.5px solid var(--color-border); border-inline-end: none; flex-shrink: 0;
    border-start-start-radius: var(--radius-md); border-end-start-radius: var(--radius-md);
    border-start-end-radius: 0; border-end-end-radius: 0; background: var(--color-surface);
    font-size: var(--text-sm); font-weight: var(--weight-medium); white-space: nowrap;
  }
  .phone-field__country:hover { background: var(--color-surface-hover); }
  .phone-field__country svg:last-child { width: 14px; height: 14px; color: var(--color-text-tertiary); margin-inline-start: 2px; }
  #countryMenu .menu__item { justify-content: flex-start; }
  #countryMenu .menu__item span:last-child { margin-inline-start: auto; color: var(--color-text-tertiary); font-size: var(--text-xs); }

  .payresult { text-align: center; flex: 1; min-width: 220px; padding: var(--space-6); border-radius: var(--radius-lg); border: 1px solid var(--color-border); }
  .payresult .payresult__icon { width: 52px; height: 52px; border-radius: var(--radius-full); display: grid; place-items: center; margin: 0 auto var(--space-4); }
  .payresult .payresult__icon svg { width: 26px; height: 26px; }

  .exp-chevron svg { width: 15px; height: 15px; color: var(--color-text-tertiary); transition: transform var(--duration-fast) var(--ease-out); }
  .exp-row.is-open .exp-chevron svg { transform: rotate(90deg); }
  .exp-detail { display: none; background: var(--color-surface-sunken); }
  .exp-detail.is-open { display: table-row; }
</style>
</head>
<body>
<div class="app" id="app">
  <div class="scrim"></div>
  <aside class="sidebar" id="sidebarMount"></aside>
  <div class="main">
    <header class="topbar" id="topbarMount"></header>
    <nav id="topTabsMount"></nav>

    <main class="content"><div class="content__inner">

      <header class="page-head animate-in" style="margin-bottom:var(--space-6)">
        <h1>Components</h1>
        <p class="lead">A working reference for the smaller form, feedback and overlay pieces every module ends up needing.</p>
      </header>

      <div class="row gap-6" style="align-items:flex-start;width:100%">
        <nav class="comp-list" id="compList"></nav>
        <div class="comp-stage" id="compStage"></div>
      </div>

    </div></main>
  </div>
</div>
<div class="device-stage" id="deviceStage"></div>

<!-- Live modals (static top-level elements, unaffected by which component tab is open) -->
<div class="modal-overlay" id="demoModal">

</div>

<div class="modal-overlay" id="formModal">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="formModalTitle">
    <div class="modal__head"><span id="formModalTitle">Edit employee</span><button class="icon-btn" data-close style="width:32px;height:32px" aria-label="Close"></button></div>
    <div class="modal__body">
      <div class="field"><label class="field__label">Name</label><input class="input" value="Reem Al-Shehri"></div>
      <div class="field"><label class="field__label">Email</label><input class="input" type="email" value="reem@highfive.sa"></div>
    </div>
    <div class="modal__foot"><button class="btn btn--ghost" data-close>Cancel</button><button class="btn" data-close>Save changes</button></div>
  </div>
</div>

<script src="assets/js/data.js"></script>

<script src="assets/js/api.js"></script>

<script>
(() => {
  RD.boot({ activeId: "components", title: "Components" });
  const ic = RD.icon, d = window.HF.data;

  /* Real flag SVGs, not emoji - emoji flags render as bare two-letter codes
     on Windows (no system flag glyphs), so a native <option> flag is a bug
     waiting to happen on the platform most admins actually run. */
  const FLAGS = [
    { code: "SA", name: "Saudi Arabia", dial: "+966", flag: '<svg viewBox="0 0 24 16"><rect width="24" height="16" fill="#0f7a3d"/><rect x="4" y="7" width="12" height="1.6" fill="#fff"/><circle cx="17" cy="7.8" r="1.4" fill="#fff"/></svg>' },
    { code: "AE", name: "United Arab Emirates", dial: "+971", flag: '<svg viewBox="0 0 24 16"><rect width="24" height="16" fill="#fff"/><rect width="8" height="16" fill="#ef3340"/><rect x="8" width="16" height="5.33" fill="#00732f"/><rect x="8" y="5.33" width="16" height="5.33" fill="#fff"/><rect x="8" y="10.67" width="16" height="5.33" fill="#000"/></svg>' },
    { code: "EG", name: "Egypt", dial: "+20", flag: '<svg viewBox="0 0 24 16"><rect width="24" height="5.33" fill="#ce1126"/><rect y="5.33" width="24" height="5.33" fill="#fff"/><rect y="10.67" width="24" height="5.33" fill="#000"/><circle cx="12" cy="8" r="1.6" fill="#c8a227"/></svg>' },
    { code: "US", name: "United States", dial: "+1", flag: '<svg viewBox="0 0 24 16"><rect width="24" height="16" fill="#fff"/>' + [0,1,2,3,4,5,6].map((i) => `<rect y="${i * 2 * (16/13)}" width="24" height="${16/13}" fill="#b22234"/>`).join("") + '<rect width="10" height="8.6" fill="#3c3b6e"/></svg>' },
  ];

  /* Super Admin sample rows (same names as sa-data.js) */
  const SA_ACTIVITY = [
    { who: "Reem Al-Shehri", action: "approved package Platinum All-Access", time: "2 min ago" },
    { who: "Tarek Mansour", action: "exported financials · Saudi Arabia", time: "18 min ago" },
    { who: "Reem Al-Shehri", action: "activated partner Smash Padel Club", time: "1 hr ago" },
    { who: "Dina Mostafa", action: "deleted a comment on Kids Summer Camp", time: "2 hr ago" },
  ];
  const SA_PARTNERS = [
    { guest: "Al Olaya Sports Co.", amount: "3 units" },
    { guest: "Smash Padel Club", amount: "2 units" },
    { guest: "Blue Wave Aquatics", amount: "1 unit" },
  ];

  const stepperRow = () => `<div class="stepper" style="max-width:480px">
    ${[["Company","done"],["Owner","done"],["Location","active"],["Review",""]].map((s, i) => `
      <div class="step ${s[1] ? "is-" + s[1] : ""}"><span class="step__dot">${s[1] === "done" ? ic("check") : i + 1}</span><span class="step__label">${s[0]}</span></div>`).join("")}
  </div>`;
  const stepperCol = () => `<div class="stepper stepper--vertical">
    ${[["Package created","done"],["Submitted for approval","done"],["Under review","active"],["Approved",""]].map((s, i) => `
      <div class="step ${s[1] ? "is-" + s[1] : ""}"><span class="step__dot">${s[1] === "done" ? ic("check") : i + 1}</span><span class="step__label">${s[0]}</span></div>`).join("")}
  </div>`;

  const SECTIONS = [
    { group: "Forms", id: "button", title: "Button", icon: "click", body: () => `
      <div class="stack gap-5" style="width:100%">
        <div>
          <b class="t-sm">Variants</b>
          <div class="row wrap gap-3" style="margin-top:var(--space-3)">
            <button class="btn">Primary</button>
            <button class="btn btn--secondary">Secondary</button>
            <button class="btn btn--outline">Outline</button>
            <button class="btn btn--ghost">Ghost</button>
            <button class="btn btn--accent">Accent</button>
            <button class="btn btn--success">Success</button>
            <button class="btn btn--danger">Danger</button>
          </div>
        </div>
        <div>
          <b class="t-sm">Sizes</b>
          <div class="row wrap gap-3" style="margin-top:var(--space-3);align-items:center">
            <button class="btn btn--sm">Small</button>
            <button class="btn">Default</button>
            <button class="btn btn--lg">Large</button>
          </div>
        </div>
        <div>
          <b class="t-sm">Icon, split &amp; floating action</b>
          <div class="row wrap gap-3" style="margin-top:var(--space-3);align-items:center">
            <button class="btn">${ic("plus")} Add partner</button>
            <button class="btn btn--secondary">Export ${ic("chevronDown")}</button>
            <button class="btn btn--icon btn--secondary" aria-label="Search">${ic("search")}</button>
            <div class="btn-split"><button class="btn">Approve</button><button class="btn btn--icon" aria-label="More">${ic("chevronDown")}</button></div>
            <div class="btn-group"><button class="btn btn--secondary">Day</button><button class="btn btn--secondary">Week</button><button class="btn btn--secondary">Month</button></div>
          </div>
        </div>
        <div>
          <b class="t-sm">States</b>
          <div class="row wrap gap-3" style="margin-top:var(--space-3)">
            <button class="btn">Default</button>
            <button class="btn is-loading">Loading</button>
            <button class="btn" disabled>Disabled</button>
            <button class="btn btn--secondary is-loading">Saving</button>
          </div>
        </div>
      </div>
      <p class="t-xs text-tertiary comp-stage__note">One primary button per view - everything else is secondary, outline or ghost. Accent is reserved for a rare, high-emphasis moment; never use it for a routine action.</p>` },

    { group: "Forms", id: "input", title: "Input", icon: "users", body: () => `
      <div class="stack gap-6" style="width:100%">

        <div>
          <b class="t-sm">Select - grouped options</b>
          <div class="comp-stage__demo" style="margin-top:var(--space-3)">
            <div class="field" style="min-width:240px">
              <label class="field__label">Activity</label>
              <div class="select">
                <select>
                  <optgroup label="Sports"><option>Padel</option><option>Football</option><option>Swimming</option></optgroup>
                  <optgroup label="Kids"><option>Trampoline</option><option>Kids Academy</option></optgroup>
                  <optgroup label="Entertainment"><option>Bowling</option><option>Karting</option></optgroup>
                </select>
                <span class="select__caret">${ic("chevronDown")}</span>
              </div>
            </div>
            <div class="field" style="min-width:200px">
              <label class="field__label">Sort by</label>
              <div class="select"><select><option>Newest</option><option>Oldest</option><option>Name A–Z</option></select><span class="select__caret">${ic("chevronDown")}</span></div>
            </div>
            <div class="field" style="min-width:200px">
              <label class="field__label">Country</label>
              <div class="select"><select disabled><option>Saudi Arabia</option></select><span class="select__caret">${ic("chevronDown")}</span></div>
              <span class="field__hint">Locked - the partner's country can't change after activation</span>
            </div>
            <div class="field" style="min-width:200px">
              <label class="field__label">Categories <span class="t-xs text-tertiary">(multi-select)</span></label>
              <select multiple size="3" class="input" style="height:auto;padding:6px">
                <option selected>Sports</option><option selected>Kids</option><option>Entertainment</option>
              </select>
            </div>
          </div>
          <p class="t-xs text-tertiary" style="margin-top:var(--space-3)"><code>&lt;optgroup&gt;</code> keeps a long resource list scannable once a list passes ~8 options - group by category, not alphabetically. Disable a select rather than hide it when the value is locked, not just empty.</p>
        </div>

        <hr style="border:none;border-top:1px solid var(--color-border-subtle)">

        <div>
          <b class="t-sm">Floating label input</b>
          <div class="comp-stage__demo" style="margin-top:var(--space-3)">
            <div class="float" style="min-width:220px"><input class="input" id="flName" placeholder=" "><label for="flName">Full name</label></div>
            <div class="float" style="min-width:220px"><input class="input" id="flEmail" type="email" placeholder=" " value="reem@highfive.sa"><label for="flEmail">Email address</label></div>
            <div class="float" style="min-width:220px"><input class="input is-error" id="flPhone2" placeholder=" " value="05123"><label for="flPhone2">Phone number</label></div>
            <div class="float" style="min-width:220px"><input class="input" id="flLocked" placeholder=" " value="#700" disabled><label for="flLocked">Package ID</label></div>
            <div class="float" style="min-width:100%"><textarea class="input" id="flNotes" placeholder=" " style="min-height:72px"></textarea><label for="flNotes">Rejection reason</label></div>
          </div>
          <p class="t-xs text-tertiary" style="margin-top:var(--space-3)">The label rests inside the field until focus or a value pushes it up - saves vertical space in dense forms without losing the label once filled. Error and disabled states reuse the same <code>.input</code> modifiers as a standard field.</p>
        </div>

        <hr style="border:none;border-top:1px solid var(--color-border-subtle)">

        <div>
          <b class="t-sm">Phone number (flag + country)</b>
          <div class="comp-stage__demo" style="margin-top:var(--space-3)">
            <div class="field">
              <label class="field__label">Mobile number</label>
              <div class="phone-field">
                <div class="dropdown-demo">
                  <button class="phone-field__country" id="countryBtn" type="button" aria-haspopup="true" aria-expanded="false">
                    <span class="flag-chip" id="countryFlag">${FLAGS[0].flag}</span><span id="countryDial">${FLAGS[0].dial}</span>${ic("chevronDown")}
                  </button>
                  <div class="menu" id="countryMenu" style="min-width:230px">
                    ${FLAGS.map((f, i) => `<button class="menu__item" data-country="${i}"><span class="flag-chip">${f.flag}</span><span>${f.name}</span><span>${f.dial}</span></button>`).join("")}
                  </div>
                </div>
                <input class="input" placeholder="5X XXX XXXX">
              </div>
            </div>
            <div class="field">
              <label class="field__label">Owner phone</label>
              <div class="phone-field">
                <div class="phone-field__country" style="cursor:default"><span class="flag-chip">${FLAGS[1].flag}</span><span>${FLAGS[1].dial}</span></div>
                <input class="input is-error" value="5012">
              </div>
              <span class="field__error">${ic("warn")} Enter a complete phone number</span>
            </div>
          </div>
          <p class="t-xs text-tertiary" style="margin-top:var(--space-3)">Real SVG flags, not emoji - country-flag emoji render as plain two-letter codes on Windows, so a native flag glyph in a form field is a bug on most admin desktops.</p>
        </div>

      </div>` },

    { group: "Forms", id: "longform", title: "Long-form composition set", icon: "list", body: () => `
      <div class="stack gap-6" style="width:100%">

        <div>
          <b class="t-sm">Form section - icon · title · subtitle · chevron</b>
          <div style="margin-top:var(--space-3);max-width:620px">
            <section class="form-section is-open">
              <button type="button" class="form-section__head" aria-expanded="true">
                <span class="form-section__ic">${ic("info")}</span>
                <span class="form-section__txt">
                  <span class="form-section__title">1. Basic Information</span>
                  <span class="form-section__sub">Package details and targeting</span>
                </span>
                <span class="form-section__chev">${ic("chevronDown")}</span>
              </button>
              <div class="form-section__body">
                <div class="field">
                  <label class="field__label">Package Name <span class="req">*</span></label>
                  <input class="input" value="Platinum All-Access">
                  <span class="field__hint">Name of the package as shown to users in the app.</span>
                </div>
                <div class="field">
                  <label class="field__label">Description <span class="req">*</span></label>
                  <textarea class="input" rows="3">Platinum All-Access gives members access to sports & padel sessions across 1 branch.</textarea>
                  <span class="field__counter">84 / 1000</span>
                  <span class="field__hint">Full explanation of what the package includes.</span>
                </div>
              </div>
            </section>
            <section class="form-section">
              <button type="button" class="form-section__head" aria-expanded="false">
                <span class="form-section__ic">${ic("pin")}</span>
                <span class="form-section__txt">
                  <span class="form-section__title">3. Branch Assignment</span>
                  <span class="form-section__sub">Select available branches</span>
                </span>
                <span class="form-section__chev">${ic("chevronDown")}</span>
              </button>
              <div class="form-section__body"></div>
            </section>
            <section class="form-section is-invalid">
              <button type="button" class="form-section__head" aria-expanded="false">
                <span class="form-section__ic">${ic("clock")}</span>
                <span class="form-section__txt">
                  <span class="form-section__title">6. Subscription Validity &amp; Plans</span>
                  <span class="form-section__sub">How subscription time is calculated</span>
                </span>
                <span class="form-section__chev">${ic("chevronDown")}</span>
              </button>
              <div class="form-section__body"></div>
            </section>
          </div>
          <p class="t-xs text-tertiary" style="margin-top:var(--space-3)">The section unit of a long form. <code>.is-invalid</code> is set by the form's validation pass, so a <em>collapsed</em> section still announces it holds a problem - open it when Save reports the error. <code>.form-section--static</code> drops the disclosure for wizard panels and two-pane layouts.</p>
        </div>

        <hr style="border:none;border-top:1px solid var(--color-border-subtle)">

        <div>
          <b class="t-sm">Radio with description + conditional panel</b>
          <div style="margin-top:var(--space-3);max-width:620px">
            <label class="check check--radio check--detail">
              <input type="radio" name="dsValidity">
              <span class="check__box"><span class="check__dot"></span></span>
              <span class="check__detail"><b>Fixed Date Range</b>
                <span class="check__desc">All subscribers start and end on the same dates (e.g. a summer camp).</span></span>
            </label>
            <label class="check check--radio check--detail">
              <input type="radio" name="dsValidity" checked>
              <span class="check__box"><span class="check__dot"></span></span>
              <span class="check__detail"><b>Display During Specific Period</b>
                <span class="check__desc">The package appears only between the dates you set.</span></span>
            </label>
            <div class="cond-panel">
              <div class="row gap-4 wrap">
                <div class="field" style="flex:1 1 200px">
                  <label class="field__label">Start Date <span class="req">*</span></label>
                  <input class="input" type="date" value="2026-10-01">
                  <span class="field__hint">Visibility start date.</span>
                </div>
                <div class="field" style="flex:1 1 200px">
                  <label class="field__label">End Date <span class="req">*</span></label>
                  <input class="input is-error" type="date" value="2026-09-20">
                  <span class="field__error">${ic("warn")} End date must be after the start date</span>
                </div>
              </div>
              <span class="cond-panel__note">Outside this period the package is hidden from the app; existing subscribers are not affected.</span>
            </div>
          </div>
          <p class="t-xs text-tertiary" style="margin-top:var(--space-3)">Reach for a description when the consequence of the choice can't be guessed from a two-word label. The panel it reveals sits <em>immediately</em> after the group, owns the tint (so the controls inside return to the plain surface), and is <b>rendered, not hidden</b> - hidden fields must leave the tab order, which is the same rule that keeps them out of validation and out of the payload.</p>
        </div>

        <hr style="border:none;border-top:1px solid var(--color-border-subtle)">

        <div>
          <b class="t-sm">Repeater - add / remove field groups</b>
          <div style="margin-top:var(--space-3);max-width:620px">
            <div class="row between" style="margin-bottom:var(--space-3)">
              <b class="t-sm">Subscription Plans</b>
              <button type="button" class="btn btn--secondary btn--sm">${ic("plus")} Add Plan</button>
            </div>
            <div class="repeater">
              <div class="repeater__item">
                <div class="repeater__head">
                  <span class="repeater__num">Plan 1</span>
                  <button class="icon-btn" style="width:32px;height:32px" aria-label="Remove Plan 1">${ic("trash")}</button>
                </div>
                <div class="row gap-4 wrap">
                  <div class="field" style="flex:1 1 200px">
                    <label class="field__label">Plan Name <span class="req">*</span></label>
                    <input class="input" value="Monthly Plan">
                  </div>
                  <div class="field" style="flex:1 1 200px">
                    <label class="field__label">Price <span class="req">*</span></label>
                    <div class="input-affix"><input class="input" value="450"><span class="affix">SAR</span></div>
                  </div>
                </div>
                <div class="repeater__foot" style="margin-block-start:var(--space-2)">
                  <label class="switch"><input type="checkbox" checked><span class="switch__track"></span> Plan active</label>
                </div>
              </div>
              <div class="repeater__item is-invalid">
                <div class="repeater__head">
                  <span class="repeater__num">Plan 2</span>
                  <button class="icon-btn" style="width:32px;height:32px" aria-label="Remove Plan 2">${ic("trash")}</button>
                </div>
                <div class="field">
                  <label class="field__label">Plan Name <span class="req">*</span></label>
                  <input class="input is-error" value="Monthly Plan">
                  <span class="field__error">${ic("warn")} Plan 2: plan names must be unique</span>
                </div>
              </div>
            </div>
          </div>
          <p class="t-xs text-tertiary" style="margin-top:var(--space-3)">Keep a minimum (usually one) and drop the remove control at that floor. Remove buttons name their target - <code>aria-label="Remove Plan 2"</code>, not "Remove" - and field ids are keyed by a stable item id, never the array index, which shifts on removal and breaks <code>for</code> / <code>aria-describedby</code> wiring.</p>
        </div>

        <hr style="border:none;border-top:1px solid var(--color-border-subtle)">

        <div>
          <b class="t-sm">Media grid - uploaded image thumbnails</b>
          <div style="margin-top:var(--space-3);max-width:620px">
            <div class="media-grid">
              <div class="media-thumb media-thumb--cover">
                ${ic("camera")}
                <span class="media-thumb__name">package-cover.jpg</span>
                <button type="button" class="media-thumb__del" aria-label="Remove package-cover.jpg">${ic("close")}</button>
              </div>
              <div class="media-thumb">${ic("camera")}<span class="media-thumb__name">gym-floor.jpg</span>
                <button type="button" class="media-thumb__del" aria-label="Remove gym-floor.jpg">${ic("close")}</button></div>
              <div class="media-thumb">${ic("camera")}<span class="media-thumb__name">pool-lanes.png</span>
                <button type="button" class="media-thumb__del" aria-label="Remove pool-lanes.png">${ic("close")}</button></div>
              <div class="media-thumb">${ic("camera")}<span class="media-thumb__name">spa-reception.jpg</span>
                <button type="button" class="media-thumb__del" aria-label="Remove spa-reception.jpg">${ic("close")}</button></div>
            </div>
            <div class="row gap-2" style="margin-block-start:var(--space-2)">
              <button type="button" class="btn btn--secondary btn--sm">Add more</button>
              <span class="t-xs text-tertiary">3 of 10 images</span>
            </div>
          </div>
          <p class="t-xs text-tertiary" style="margin-top:var(--space-3)">The result view for images once the <code>.dropzone</code> has content - show one or the other, never both. Documents stay as <code>.file-row</code> filename rows; pictures get a crop, a truncating caption on the overlay token, and a remove control that names its image. Rejections (wrong type, over 10MB) are announced with a toast - the grid changing shape is not feedback.</p>
        </div>

        <hr style="border:none;border-top:1px solid var(--color-border-subtle)">

        <div>
          <b class="t-sm">Inline condition checkbox</b>
          <div style="margin-top:var(--space-3);max-width:620px">
            <div class="check-inline">
              <label class="check"><input type="checkbox" checked><span class="check__box">${ic("check")}</span>Can cancel within</label>
              <input class="input input--num" type="number" min="1" value="14" aria-label="Days from the subscription start date">
              <span>days from the subscription start date</span>
              <span class="check-inline__hint">Counted from the day the subscription starts, not the purchase day.</span>
            </div>
            <div class="check-inline">
              <label class="check"><input type="checkbox"><span class="check__box">${ic("check")}</span>Can cancel only if used less than</label>
              <input class="input input--num" type="number" disabled aria-label="Number of uses">
              <span>times</span>
              <span class="check-inline__hint">A “use” is one successful check-in. <b>0 = only before the first use.</b></span>
            </div>
            <div class="cond-panel" style="margin-block-start:var(--space-4)">
              <span class="cond-panel__note" style="margin:0"><b>Users can cancel within 14 days from start.</b></span>
            </div>
          </div>
          <p class="t-xs text-tertiary" style="margin-top:var(--space-3)">A rule the user switches on and then parameterises <em>in the same sentence</em>. The number field sits <b>outside</b> the <code>&lt;label&gt;</code> on purpose: a label forwards clicks to its control, so an input nested inside would toggle the checkbox every time the user tried to click into it — splitting the sentence at the field is what makes the pattern work. The field carries its own <code>aria-label</code> (the surrounding words are not programmatically its name), and it is <b>disabled rather than hidden</b> when the rule is off, so the sentence still reads and the layout doesn't jump. A read-only preview sentence underneath restates the whole rule as the user will experience it.</p>
        </div>

        <hr style="border:none;border-top:1px solid var(--color-border-subtle)">

        <div>
          <b class="t-sm">Method option - "how is this sold / booked"</b>
          <div class="card card--pad" style="margin-top:var(--space-3);max-width:620px">
            <div class="method-opt">
              <div class="method-opt__head">
                <label class="check check--radio"><input type="radio" name="dsMethod" checked>
                  <span class="check__box"><span class="check__dot"></span></span>Walk-in</label>
              </div>
              <p class="method-opt__note">The package is hidden from the user app; the partner sells it from their dashboard.</p>
            </div>
            <div class="method-opt">
              <div class="method-opt__head">
                <label class="check check--radio"><input type="radio" name="dsMethod">
                  <span class="check__box"><span class="check__dot"></span></span>Online & walk-in</label>
                <button type="button" class="btn btn--sm btn--secondary">View contacts</button>
              </div>
              <p class="method-opt__note">Shown in the user app and sold at the branch.</p>
              <div class="method-opt__error">${ic("warn")} Select at least one contact to choose this option.</div>
            </div>
            <div class="method-opt">
              <div class="method-opt__head">
                <label class="check check--radio"><input type="radio" name="dsMethod">
                  <span class="check__box"><span class="check__dot"></span></span>Online</label>
                <button type="button" class="btn btn--sm btn--secondary">View policy</button>
              </div>
              <p class="method-opt__note">Shown in the user app with a <b>Subscribe</b> button; the partner's policy applies.</p>
              <div class="method-opt__picked">(Standard Cancellation Policy)</div>
            </div>
          </div>
          <p class="t-xs text-tertiary" style="margin-top:var(--space-3)">One mutually-exclusive <em>way of doing something</em>, with room to explain itself and to carry the setup it depends on. Rows are separated by rules, not boxed — the card is the container. The setup button is a <b>sibling of the label, not inside it</b>: a label forwards clicks to its control, so a nested button would select the radio every time the user tried to open the picker. An option whose requirement is unmet stays <b>selectable</b> — the block happens on Save, with the reason stated in the row beside it, because a disabled radio cannot say why it is disabled.</p>
        </div>

        <hr style="border:none;border-top:1px solid var(--color-border-subtle)">

        <div>
          <b class="t-sm">Locked field - value readable, editing refused, reason stated</b>
          <div class="stack gap-4" style="margin-top:var(--space-3);max-width:620px">
            <div class="field field--locked">
              <label class="field__label field__label--locked" for="d-lockname">
                <span>Package Name</span>
                <span class="field__lock" title="Set by the partner - read-only in the Super Admin." aria-label="Set by the partner - read-only in the Super Admin.">${ic("lock")}</span>
              </label>
              <input class="input" id="d-lockname" value="Platinum All-Access" disabled>
              <span class="field__hint">Set by the partner - read-only in the Super Admin.</span>
            </div>
            <div class="field field--locked">
              <label class="field__label field__label--locked" for="d-lockdur">
                <span>Duration</span>
                <span class="field__lock" title="Locked - this plan has 96 subscribers." aria-label="Locked - this plan has 96 subscribers.">${ic("lock")}</span>
              </label>
              <input class="input input--num" id="d-lockdur" value="1" disabled>
              <span class="field__hint">Locked - this plan has 96 subscribers.</span>
            </div>
            <div class="field">
              <label class="field__label" for="d-freeprice">Price (SAR)</label>
              <input class="input input--num" id="d-freeprice" value="450">
              <span class="field__hint">What a subscriber pays.<br><span class="text-tertiary">Changes apply to new subscribers only.</span></span>
            </div>
          </div>
          <p class="t-xs text-tertiary" style="margin-top:var(--space-3)">A value the user may <b>read but not change</b>. The system's position, stated in <code>input.md</code> and <code>select.md</code>: disable the control and explain why in a visible hint - <b>never hide the field</b>, or the user cannot tell what exists. <code>.field--locked</code> restores full text contrast: the global <code>.input:disabled</code> rule dims text, which is right for "not available yet" and wrong for "locked, and this is the current value". The lock text <b>replaces</b> the hint rather than joining it - one reason, one line. A lock on an <em>action</em> (a delete icon, a toggle) is a different problem: an icon button has no hint slot and its tooltip does not exist on touch, so keep it live and explain on click.</p>
        </div>

        <hr style="border:none;border-top:1px solid var(--color-border-subtle)">

        <div>
          <b class="t-sm">Section tag - one status word for a whole section</b>
          <div style="margin-top:var(--space-3);max-width:620px">
            <section class="form-section">
              <button type="button" class="form-section__head" aria-expanded="false">
                <span class="form-section__ic">${ic("info")}</span>
                <span class="form-section__txt">
                  <span class="form-section__title">1. Basic Information</span>
                  <span class="form-section__sub">Package details and targeting</span>
                </span>
                <span class="badge form-section__tag">${ic("lock")} Locked</span>
                <span class="form-section__chev">${ic("chevronDown")}</span>
              </button>
            </section>
          </div>
          <p class="t-xs text-tertiary" style="margin-top:var(--space-3)"><code>.form-section__tag</code> is a slot between the title block and the chevron for one short status word about the <b>whole</b> section - a "Locked" badge, a count of changes. It only sets <code>flex-shrink: 0</code>; the badge supplies the look. A section whose fields are all locked can then also start collapsed, since there is nothing inside to act on.</p>
        </div>

        <hr style="border:none;border-top:1px solid var(--color-border-subtle)">

        <div>
          <b class="t-sm">Form action bar - sticky footer</b>
          <div style="margin-top:var(--space-3);max-width:620px;border:1px solid var(--color-border);border-radius:var(--radius-md);overflow:hidden">
            <div class="formbar" style="position:static;margin:0;box-shadow:none;border-block-start:0">
              <button type="button" class="btn btn--ghost">Cancel</button>
              <span class="formbar__spacer"></span>
              <button type="button" class="btn">Save</button>
            </div>
            <div class="formbar" style="position:static;margin:0;box-shadow:none">
              <button type="button" class="btn btn--ghost" disabled>Cancel</button>
              <span class="formbar__spacer"></span>
              <button type="button" class="btn" disabled><span class="spinner" style="width:16px;height:16px"></span> Saving…</button>
            </div>
          </div>
          <p class="t-xs text-tertiary" style="margin-top:var(--space-3)">Sticky at the end of the content column, with <code>.formbar__spacer</code> pushing the primary to the trailing edge in both directions. Save is <b>never disabled just because required fields are empty</b> - it stays enabled and runs validation, which is the only path that produces a message for screen-reader users. Disable both buttons only while the request is in flight, paired with a visible "Saving…" label. Below 768px the buttons become equal-width full rows.</p>
        </div>

      </div>` },

    { group: "Data", id: "subsset", title: "Subscription set", icon: "users", body: () => `
      <div class="stack gap-6" style="width:100%">

        <div>
          <b class="t-sm">Subscription status set - six states, one of them new</b>
          <div class="row wrap gap-2" style="margin-top:var(--space-3)">
            <span class="status status--confirmed"><span class="dot"></span>Upcoming</span>
            <span class="status status--live"><span class="dot"></span>Active</span>
            <span class="status status--frozen"><span class="dot"></span>Frozen</span>
            <span class="status status--inactive"><span class="dot"></span>Expired</span>
            <span class="status status--rejected"><span class="dot"></span>Cancelled</span>
            <span class="status status--inactive"><span class="dot"></span>Upgraded</span>
          </div>
          <p class="t-xs text-tertiary" style="margin-top:var(--space-3)">Five of the six reuse classes that already existed; only <b>Frozen</b> needed a new one, and it took <b>no new tokens</b> - it uses the violet <code>--status-refunded-*</code> triplet that already ships in both themes. Grey was the obvious alternative and the wrong one: it would have read the same as Expired, which is the opposite situation. One comes back. <b>Upgraded and Expired deliberately share a tone</b> and are told apart by their text ("→ Gold plan") - the one place in this vocabulary where colour alone does not separate two states.</p>
        </div>

        <hr style="border:none;border-top:1px solid var(--color-border-subtle)">

        <div>
          <b class="t-sm">Flagged row - this one needs you today</b>
          <div class="data-table-wrap" style="margin-top:var(--space-3)">
            <table class="data-table">
              <thead><tr><th>Subscriber</th><th>Status</th><th>Payment</th><th></th></tr></thead>
              <tbody>
                <tr><td data-label="Subscriber">Hana Ibrahim</td>
                  <td data-label="Status"><span class="status status--live"><span class="dot"></span>Active</span></td>
                  <td data-label="Payment"><span style="color:var(--color-success)">${ic("check")} 1,200 SAR</span></td><td></td></tr>
                <tr class="is-flagged"><td data-label="Subscriber">Yousef Nasser</td>
                  <td data-label="Status"><span class="status status--live"><span class="dot"></span>Active</span></td>
                  <td data-label="Payment"><b style="color:var(--color-warning)">450 SAR</b></td>
                  <td data-label="" style="text-align:end"><button type="button" class="btn btn--sm btn--secondary">View</button></td></tr>
              </tbody>
            </table>
          </div>
          <p class="t-xs text-tertiary" style="margin-top:var(--space-3)"><code>.is-flagged</code> on a <code>&lt;tr&gt;</code> tints the whole row: <em>this row needs something from you today</em>. Use it for a condition on a <b>different axis</b> from the row's own status - here the subscription is perfectly <b>Active</b> and separately <b>unpaid</b>. Colouring the status badge instead would merge two facts that have to stay apart. One flag per table, and only for something actionable: a table where a third of the rows are tinted has stopped saying anything.</p>
        </div>

        <hr style="border:none;border-top:1px solid var(--color-border-subtle)">

        <div>
          <b class="t-sm">Calculation sheet - how a number was arrived at</b>
          <div style="margin-top:var(--space-3);max-width:480px">
            <div class="calc-sheet">
              <div class="calc-row calc-row--pick"><span class="calc-row__k">Remaining days · 19 / 30</span><span class="calc-row__v">203 SAR</span></div>
              <div class="calc-row"><span class="calc-row__k">Remaining visits · 16 / 20</span><span class="calc-row__v">256 SAR</span></div>
              <div class="calc-row"><span class="calc-row__k">Lower of the two</span><span class="calc-row__v">203 SAR</span></div>
              <div class="calc-row calc-row--fee"><span class="calc-row__k">Fee 10%</span><span class="calc-row__v">− 20 SAR</span></div>
              <hr class="calc-sheet__rule">
              <div class="calc-row calc-row--total"><span class="calc-row__k">Refund per policy</span><span class="calc-row__v">182 SAR</span></div>
            </div>
            <div class="field" style="margin-top:var(--space-4)">
              <label class="field__label" for="d-refamt">Refund amount (SAR)</label>
              <input type="number" class="input input--num" id="d-refamt" value="182">
              <span class="field__hint">You can give more or less than the policy amount; the difference is recorded as a manual adjustment.</span>
            </div>
          </div>
          <p class="t-xs text-tertiary" style="margin-top:var(--space-3)">For a figure someone has to <b>explain out loud</b> - a refund a support agent has to justify to a user. Every step shows, <b>including the one that lost the comparison</b>, because that is usually the step the user asks about. The sheet itself is read-only and the editable field sits below it, so the derived number and the submitted number are visibly two different things. Not a <code>&lt;table&gt;</code>: these are steps in an argument, not tabular data. Don't use it for a plain basket subtotal - that's a <code>detail-list</code>; this is for a number that needs defending.</p>
        </div>

      </div>` },

    { group: "Data", id: "recordpage", title: "Record page set", icon: "layout", body: () => `

              <div class="detail-row"><span class="detail-row__k">Display period</span><span class="detail-row__v text-tertiary">&mdash;</span></div>
            </div>
          </div>
          <p class="t-xs text-tertiary" style="margin-top:var(--space-3)">Label to value rows for a record shown read-only - the page-level twin of the drawer's own <code>.drawer-body-row</code>. <code>--stack</code> turns the row into two lines for prose or a chip set, where a right-aligned value would wrap badly. An empty field still gets its row, with an em-dash: omitting it leaves the reader unable to tell "none" from "not shown".</p>

          <div class="card card--pad" style="margin-top:var(--space-3);max-width:620px">

                <span class="timeline__icon">${ic("close")}</span>

                <span class="timeline__icon">${ic("layers")}</span>

                  <span class="timeline__text">Plan <b>Yearly</b> price changed</span>

                <span class="timeline__icon">${ic("check")}</span>
                <div class="timeline__body">
                  <span class="timeline__text">Approved</span>
                  <span class="timeline__meta">Reem Al-Shehri · 28 Aug 2026, 9:02 AM</span>
                </div>

              <div class="timeline__item">
                <span class="timeline__icon">${ic("plus")}</span>
                <div class="timeline__body">
                  <span class="timeline__text">Package created by <b>Al Olaya Sports Co.</b></span>
                  <span class="timeline__meta">Ahmed Al-Harbi · 11 Aug 2026, 3:22 PM</span>
                </div>
              </div>
            </div>
          </div>
          <p class="t-xs text-tertiary" style="margin-top:var(--space-3)">A record's history as facts on a rail, newest first. The rail is drawn by each item except the last, so it stops at the final dot instead of trailing into the padding. Tone colours the <b>icon only</b> - the sentences stay body text, or a long feed becomes a traffic light. A reason or a before/after value goes in a <code>.timeline__note</code>, not in parentheses inside the sentence. Not to be confused with <code>resource-timeline</code>, which is a scheduler grid with a time axis.</p>
        </div>

        <hr style="border:none;border-top:1px solid var(--color-border-subtle)">

        <div>
          <b class="t-sm">Lightbox - one image from a gallery, full size</b>
          <div style="margin-top:var(--space-3);position:relative;height:280px;border:1px solid var(--color-border);border-radius:var(--radius-md);overflow:hidden;background:var(--color-overlay);display:flex;align-items:center;justify-content:center">
            <div style="max-width:60%;aspect-ratio:16/9;border-radius:var(--radius-md);box-shadow:var(--shadow-lg);background:var(--color-surface-sunken);display:grid;place-items:center;color:var(--color-text-tertiary)">${ic("camera")}</div>
            <button type="button" class="lightbox__nav lightbox__nav--prev" style="position:absolute" aria-label="Previous image">${ic("chevronLeft")}</button>
            <button type="button" class="lightbox__nav lightbox__nav--next" style="position:absolute" aria-label="Next image">${ic("chevronRight")}</button>
            <button type="button" class="lightbox__close" style="position:absolute" aria-label="Close">${ic("close")}</button>
            <span class="lightbox__count" style="position:absolute">2 / 5</span>
          </div>
          <p class="t-xs text-tertiary" style="margin-top:var(--space-3)">The viewer a <code>media-grid</code> thumbnail opens. It sits at <code>--z-popover</code>, <b>above</b> the modal layer, because it is opened from cards and modals and has to cover whatever launched it. The index <b>wraps</b> rather than disabling the arrows - a two-image gallery with a dead arrow reads as broken. Closes on the button, on the backdrop and on Escape; steps with the arrow keys. The nav glyphs mirror in RTL, so "next" always points along the reading direction. No open animation, deliberately.</p>
        </div>

      </div>` },

    { group: "Data", id: "listset", title: "List-screen set", icon: "list", body: () => `
      <div class="stack gap-6" style="width:100%">

        <div>
          <b class="t-sm">Stat tiles — clickable filters above a list</b>
          <div class="stat-strip" style="margin-top:var(--space-3)">
            <button type="button" class="stat-tile is-active" aria-pressed="true">
              <span class="kpi-ic">${ic("package")}</span>
              <span class="stat-tile__txt"><span class="stat-tile__val">13</span>
              <span class="stat-tile__label">Active packages</span></span></button>
            <button type="button" class="stat-tile" aria-pressed="false">
              <span class="kpi-ic">${ic("clock")}</span>
              <span class="stat-tile__txt"><span class="stat-tile__val">6</span>
              <span class="stat-tile__label">Pending approval</span></span></button>
            <button type="button" class="stat-tile stat-tile--alert" aria-pressed="false">
              <span class="kpi-ic">${ic("warn")}</span>
              <span class="stat-tile__txt"><span class="stat-tile__val">4</span>
              <span class="stat-tile__label">Rejected</span></span></button>
            <div class="stat-tile stat-tile--static">
              <span class="kpi-ic">${ic("users")}</span>
              <span class="stat-tile__txt"><span class="stat-tile__val">954</span>
              <span class="stat-tile__label">Active subscribers</span></span></div>
          </div>
          <p class="t-xs text-tertiary" style="margin-top:var(--space-3)">A filter tile is a <code>&lt;button&gt;</code> with <code>aria-pressed</code> — a toggle, because clicking the active tile clears its filter. Every tile filter must also appear in the <b>filter chips</b>, so the state stays visible and undoable in one place. The last tile is <code>--static</code>: a metric with nowhere to go renders as a <code>&lt;div&gt;</code>, never a disabled button. Not to be confused with the dashboard KPI card (<code>RD.kpiStrip</code>), which carries a period delta and isn't interactive.</p>
        </div>

        <hr style="border:none;border-top:1px solid var(--color-border-subtle)">

        <div>
          <b class="t-sm">Package statuses — two independent axes</b>
          <div class="comp-stage__demo" style="margin-top:var(--space-3);flex-direction:column;align-items:flex-start;gap:var(--space-3)">
            <div class="row gap-2 wrap"><span class="t-xs text-tertiary" style="width:70px">Approval</span>
              <span class="status status--pending"><span class="dot"></span>Pending Approval</span>
              <span class="status status--approved"><span class="dot"></span>Approved</span>
              <span class="status status--rejected"><span class="dot"></span>Rejected</span></div>
            <div class="row gap-2 wrap"><span class="t-xs text-tertiary" style="width:70px">Status</span>
              <span class="status status--live"><span class="dot"></span>Active</span>
              <span class="status status--inactive"><span class="dot"></span>Inactive</span></div>
            <div class="row gap-2 wrap"><span class="t-xs text-tertiary" style="width:70px">Flag</span>
              <span class="status status--live"><span class="dot"></span>Active · Pending changes<span class="status__flag"></span></span></div>
          </div>
          <p class="t-xs text-tertiary" style="margin-top:var(--space-3)">A second status vocabulary over the <em>same</em> token triplets — four near-identical palettes would be token bloat. It runs on <b>two independent axes</b>: an approval workflow and an on/off switch, one badge and one column each, so a package can be <em>Pending Approval</em> and <em>Inactive</em> at once. Combined states ("Approved · Policy required", "Active · Pending changes") were tried and dropped at review — they multiply the vocabulary and hide which of the two things changed. <code>Active</code> deliberately does <b>not</b> pulse the way <code>checked-in</code> does: pulse is for the exceptional, and most rows in a package list are active. <code>.status__flag</code> (last row) still exists for a second <em>concurrent</em> state where a whole column isn't warranted — it has no product consumer today.</p>
        </div>

        <hr style="border:none;border-top:1px solid var(--color-border-subtle)">

        <div>
          <b class="t-sm">Thumbnail cell · pinned columns</b>
          <div class="data-table-wrap" style="margin-top:var(--space-3)">
            <div class="data-table-scroll"><table class="data-table data-table--pinned">
              <thead><tr><th>Package</th><th>Branches</th><th>Plans</th><th>Validity</th><th>Approval</th><th>Status</th><th style="width:44px"></th></tr></thead>
              <tbody>
                <tr>
                  <td><div class="cell-user"><span class="cell-thumb">${ic("camera")}</span>
                    <div><div style="font-weight:var(--weight-semibold)">Platinum All-Access</div>
                    <span class="t-xs text-tertiary">Sports · Padel</span></div></div></td>
                  <td data-label="Branches">Main Branch <span class="badge">+2</span></td>
                  <td data-label="Plans">3 plans · from 450 SAR</td>
                  <td data-label="Validity">From purchase</td>
                  <td data-label="Approval"><span class="status status--approved"><span class="dot"></span>Approved</span></td>
                  <td data-label="Status"><span class="status status--live"><span class="dot"></span>Active</span></td>
                  <td><button class="icon-btn tbl-kebab" style="width:32px;height:32px" aria-label="Row actions" aria-haspopup="true">
                    <svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><circle cx="12" cy="6" r="1.9"/><circle cx="12" cy="12" r="1.9"/><circle cx="12" cy="18" r="1.9"/></svg></button></td>
                </tr>
                <tr>
                  <td><div class="cell-user"><span class="cell-thumb">${ic("camera")}</span>
                    <div><div style="font-weight:var(--weight-semibold)">Padel Pro Season</div>
                    <span class="t-xs text-tertiary">Padel</span></div></div></td>
                  <td data-label="Branches">North Branch <span class="badge">+1</span></td>
                  <td data-label="Plans">2 plans · from 1,600 SAR</td>
                  <td data-label="Validity">1 Jul – 31 Aug</td>
                  <td data-label="Approval"><span class="status status--pending"><span class="dot"></span>Pending Approval</span></td>
                  <td data-label="Status"><span class="status status--inactive"><span class="dot"></span>Inactive</span></td>
                  <td><button class="icon-btn tbl-kebab" style="width:32px;height:32px" aria-label="Row actions" aria-haspopup="true">
                    <svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><circle cx="12" cy="6" r="1.9"/><circle cx="12" cy="12" r="1.9"/><circle cx="12" cy="18" r="1.9"/></svg></button></td>
                </tr>
              </tbody>
            </table></div>
          </div>
          <p class="t-xs text-tertiary" style="margin-top:var(--space-3)"><code>.data-table--pinned</code> holds the identity column and the actions column while the middle scrolls — worth it past roughly eight columns, a wasted hairline below that. Offsets are logical, so RTL pins the mirror sides for free, and pinning switches itself off at ≤640px where the table is already a stack of cards. <code>.cell-thumb</code> is the square counterpart to the round <code>.avatar</code>: people get the avatar, <em>things</em> (a package cover, a unit photo) get the thumb.</p>
        </div>

        <hr style="border:none;border-top:1px solid var(--color-border-subtle)">

        <div>
          <b class="t-sm">Popover · multi-select filter menu</b>
          <div class="comp-stage__demo" style="margin-top:var(--space-3);align-items:flex-start;gap:var(--space-5)">
            <div class="popover is-open" style="position:relative;inset:auto">
              <div class="popover__title">${ic("warn")} Rejection reason</div>
              <div class="popover__body">The cover image shows a third-party logo.
                Replace it and make sure the description matches the plans.</div>
              <div class="popover__foot">
                <button class="btn btn--sm">Edit reason</button>
                <button class="btn btn--sm btn--ghost">Close</button>
              </div>
            </div>
            <div class="menu menu--select is-open" style="position:relative;inset:auto;min-width:210px">
              <label class="check"><input type="checkbox"><span class="check__box">${ic("check")}</span> Pending Approval</label>
              <label class="check"><input type="checkbox" checked><span class="check__box">${ic("check")}</span> Rejected</label>
              <label class="check"><input type="checkbox" checked><span class="check__box">${ic("check")}</span> Policy required</label>
              <label class="check"><input type="checkbox"><span class="check__box">${ic("check")}</span> Active</label>
              <label class="check"><input type="checkbox"><span class="check__box">${ic("check")}</span> Inactive</label>
              <div class="menu--select__foot"><button class="btn btn--sm btn--ghost">Clear</button></div>
            </div>
          </div>
          <p class="t-xs text-tertiary" style="margin-top:var(--space-3)">A <b>popover</b> is not a tooltip: it opens on click and carries the action that resolves it. If the user needs to <em>do</em> something about the message, it can't hide behind hover. A <b>filter menu</b>'s rows are <code>.check</code> labels, not <code>.menu__item</code> buttons — a checkbox inside a button is invalid markup — and its handler binds to <code>change</code> on the input, never <code>click</code> on the row: a label click also dispatches a synthetic click on its input, so a click handler fires twice per toggle. Both are shown pinned open here; in product they are portaled to <code>&lt;body&gt;</code> and positioned from the trigger.</p>
        </div>

      </div>` },

    { group: "Navigation", id: "tabs", title: "Tabs & segmented control", icon: "layout", body: () => `

    { group: "Navigation", id: "stepper-h", title: "Stepper - horizontal", icon: "steps", body: () => `

    { group: "Navigation", id: "stepper-v", title: "Stepper - vertical", icon: "steps", body: () => `

    { group: "Overlays", id: "modal", title: "Modal", icon: "revenue", body: () => `

    { group: "Overlays", id: "cmdk", title: "Command palette (⌘K)", icon: "search", body: () => `

    { group: "Overlays", id: "notifcenter", title: "Notifications center", icon: "bell", body: () => `

    { group: "Feedback", id: "toast", title: "Toast / snackbar", icon: "chat", body: () => `
      <div class="stack gap-3" style="width:100%;max-width:380px">
        <div class="toast toast--success"><span class="toast__icon">${ic("check")}</span><p>Partner approved successfully</p><button aria-label="Dismiss">${ic("close")}</button></div>
        <div class="toast"><span class="toast__icon" style="color:var(--lime-300)">${ic("info")}</span><p>Draft saved</p><button style="margin-inline-start:var(--space-3);color:var(--lime-300);font-weight:600">Undo</button></div>
        <div class="toast"><span class="toast__icon" style="color:var(--amber-300)">${ic("warn")}</span><p>Slow connection - retrying sync</p><button aria-label="Dismiss">${ic("close")}</button></div>
        <div class="toast"><span class="toast__icon" style="color:var(--red-300)">${ic("close")}</span><p>Could not save the changes</p><button style="margin-inline-start:var(--space-3);color:var(--red-300);font-weight:600">Retry</button></div>
      </div>
      <div style="margin-top:var(--space-5)">
        <b class="t-sm">Live queue — RD.toast()</b>
        <div class="row wrap gap-3" style="margin-top:var(--space-3)">
          <button class="btn btn--secondary btn--sm" data-toastdemo="success">Success</button>
          <button class="btn btn--secondary btn--sm" data-toastdemo="undo">Cancel with Undo</button>
          <button class="btn btn--secondary btn--sm" data-toastdemo="danger">Failure with Retry</button>
          <button class="btn btn--secondary btn--sm" data-toastdemo="flood">Fire 5 at once (cap = 3)</button>
        </div>
      </div>
      <p class="t-xs text-tertiary comp-stage__note">Transient and non-blocking. The shared emitter <code>RD.toast(kind, msg, {action, onAction})</code> enforces the queue contract: newest on top, max three visible, 5s life (8s with an action), timer pauses on hover. Destructive-but-reversible actions commit immediately and offer Undo here instead of a confirm modal - full rules in patterns/toast-queue.md.</p>` },

    { group: "Feedback", id: "alert", title: "Alert / banner", icon: "warn", body: () => `
      <div class="stack gap-3" style="width:100%">

    { group: "Charts", id: "chart-primitives", title: "Chart primitives", icon: "chart", body: () => {
      const W = 520, H = 200, X0 = 55, XSTEP = 82;
      const yFor = (v) => 180 - (v / 50000) * 160;
      const line = (vals) => vals.map((v, i) => `${X0 + i * XSTEP},${yFor(v).toFixed(1)}`).join(" ");
      const dots = (vals, color) => vals.map((v, i) =>
        `<circle cx="${X0 + i * XSTEP}" cy="${yFor(v).toFixed(1)}" r="3" fill="${color}"/>`).join("");
      const s0 = CP_DATA.series[0].values, s1 = CP_DATA.series[1].values;
      return `
      <div class="card card--pad" style="width:100%;max-width:640px">
        <div class="row" style="justify-content:space-between;margin-bottom:var(--space-3)">
          <b class="t-sm">Revenue vs subscriptions</b>
          <span class="t-xs text-tertiary">Jan – Jun 2026</span>
        </div>
        <div id="cpCanvas" style="position:relative" dir="ltr">
          <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block" role="img"
            aria-label="Revenue grew from SAR 32K in January to SAR 48K in June; subscription revenue grew from SAR 13K to SAR 21K">
            ${[0, 25000, 50000].map((v) => `
              <line x1="40" x2="${W - 8}" y1="${yFor(v)}" y2="${yFor(v)}" stroke="var(--chart-grid)" stroke-width="1"/>
              <text x="34" y="${yFor(v) + 4}" text-anchor="end" font-size="10" fill="var(--chart-axis)">${v ? v / 1000 + "K" : "0"}</text>`).join("")}
            ${CP_DATA.labels.map((m, i) => `<text x="${X0 + i * XSTEP}" y="196" text-anchor="middle" font-size="10" fill="var(--chart-axis)">${m}</text>`).join("")}
            <g data-sg="0"><polyline points="${line(s0)}" fill="none" stroke="var(--chart-1)" stroke-width="2" stroke-linejoin="round"/>${dots(s0, "var(--chart-1)")}</g>
            <g data-sg="1"><polyline points="${line(s1)}" fill="none" stroke="var(--chart-2)" stroke-width="2" stroke-linejoin="round"/>${dots(s1, "var(--chart-2)")}</g>
          </svg>
          <div class="chart-tip" id="cpTip"></div>
        </div>
        <div class="chart-legend" style="margin-top:var(--space-3)">
          ${CP_DATA.series.map((s, i) => `<button class="chart-legend__item" aria-pressed="true" data-cseries="${i}">
            <span class="chart-legend__swatch" style="background:var(--chart-${i + 1})"></span>${s.name}</button>`).join("")}
        </div>
      </div>
      <p class="t-xs text-tertiary comp-stage__note">The two primitives every hand-built SVG chart composes: <b>.chart-legend</b> (required at ≥2 series; these items carry aria-pressed and toggle their series — never below one visible) and <b>.chart-tip</b> (hover or tap the canvas; exact values with tabular numerals, flips near the inline-end edge). Time axes stay LTR in both directions; Latin digits in both languages. Full contract: patterns/charts.md.</p>`; } },
  ];

  function render(id) {
    const s = SECTIONS.find((x) => x.id === id);
    let lastGroup = null;
    document.getElementById("compList").innerHTML = SECTIONS.map((x) => {
      const groupHtml = x.group !== lastGroup ? `<div class="comp-list__label">${x.group}</div>` : "";
      lastGroup = x.group;
      return `${groupHtml}<button class="${x.id === id ? "is-active" : ""}" data-comp="${x.id}">${ic(x.icon)}${x.title}</button>`;
    }).join("");
    document.getElementById("compStage").innerHTML = `
      <div class="comp-stage__head"><span class="kpi-ic">${ic(s.icon)}</span><b class="t-title">${s.title}</b></div>
      ${s.body()}`;
    window.scrollTo({ top: 0, behavior: "smooth" });
  }
  document.getElementById("compList").addEventListener("click", (e) => {
    const b = e.target.closest("[data-comp]"); if (b) render(b.dataset.comp);
  });
  render(SECTIONS[0].id);

  /* Filter bar / date range demo wiring (delegated - survives re-renders) */
  document.addEventListener("click", (e) => {
    const x = e.target.closest(".filter-chip__x");
    if (x) { x.closest(".filter-chip").remove(); return; }
    const pr = e.target.closest(".daterange__presets button");
    if (pr) { pr.parentElement.querySelectorAll("button").forEach((b) => b.classList.toggle("is-active", b === pr)); return; }
    const vw = e.target.closest(".filterbar__views button");
    if (vw) vw.parentElement.querySelectorAll("button").forEach((b) => b.classList.toggle("is-active", b === vw));
  });

  /* Chart primitives / error summary / shell-chrome demo wiring (delegated) */
  const CP_DATA = {
    labels: ["Jan", "Feb", "Mar", "Apr", "May", "Jun"],
    months: ["January", "February", "March", "April", "May", "June"],
    series: [
      { name: "Revenue", values: [32450.75, 38120.5, 35890.25, 44310, 41205.5, 48231.5] },
      { name: "Subscriptions", values: [12800.25, 15340, 14210.75, 18450.5, 17120, 21390.25] },
    ],
  };
  const sar = (v) => "SAR " + v.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  document.addEventListener("click", (e) => {
    const td = e.target.closest("[data-toastdemo]");
    if (td) {
      const k = td.dataset.toastdemo;
      if (k === "success") RD.toast("success", "Changes saved successfully.");
      else if (k === "undo") RD.toast("info", "Partner deactivated.", { action: "Undo", onAction: () => RD.toast("success", "Partner activated.") });
      else if (k === "danger") RD.toast("danger", "Could not save the changes.", { action: "Retry", onAction: () => RD.toast("success", "Changes saved successfully.") });
      else if (k === "flood") ["One", "Two", "Three", "Four", "Five"].forEach((n, i) => setTimeout(() => RD.toast("info", `Toast ${n} of five.`), i * 120));
      return;
    }
    if (e.target.closest("#openCmdkBtn")) { RD.cmdk && RD.cmdk(); return; }
    if (e.target.closest("#openNotifDemoBtn")) { const b = document.getElementById("notifBtn"); if (b) b.click(); return; }
    const esLink = e.target.closest(".form-errors a");
    if (esLink) { e.preventDefault(); const f = document.querySelector(esLink.getAttribute("href")); if (f) f.focus(); return; }
    const leg = e.target.closest("[data-cseries]");
    if (leg) {
      const on = leg.getAttribute("aria-pressed") === "true";
      const others = [...document.querySelectorAll("[data-cseries]")].filter((x) => x !== leg && x.getAttribute("aria-pressed") === "true");
      if (on && !others.length) return; /* never below one visible series */
      leg.setAttribute("aria-pressed", on ? "false" : "true");
      const g = document.querySelector(`#cpCanvas [data-sg="${leg.dataset.cseries}"]`);
      if (g) g.style.display = on ? "none" : "";
    }
  });
  document.addEventListener("mousemove", (e) => {
    const canvas = e.target.closest && e.target.closest("#cpCanvas");
    const tip = document.getElementById("cpTip");
    if (!tip) return;
    if (!canvas) { tip.classList.remove("is-visible"); return; }
    const rect = canvas.getBoundingClientRect();
    const frac = (e.clientX - rect.left) / rect.width * 520;
    const i = Math.max(0, Math.min(5, Math.round((frac - 55) / 82)));
    const visible = [...document.querySelectorAll("[data-cseries]")].filter((x) => x.getAttribute("aria-pressed") === "true").map((x) => +x.dataset.cseries);
    tip.innerHTML = `<div class="chart-tip__title">${CP_DATA.months[i]} 2026</div>` +
      visible.map((s) => `<div class="chart-tip__row"><span><span class="chart-legend__swatch" style="display:inline-block;background:var(--chart-${s + 1})"></span>${CP_DATA.series[s].name}</span><span class="chart-tip__val">${sar(CP_DATA.series[s].values[i])}</span></div>`).join("");
    const px = (55 + i * 82) / 520 * rect.width;
    const flip = px > rect.width - 150;
    tip.style.insetInlineStart = "";
    tip.style.left = flip ? Math.max(4, px - tip.offsetWidth - 12) + "px" : Math.min(px + 12, rect.width - 130) + "px";
    tip.style.top = Math.max(4, (e.clientY - rect.top) - 40) + "px";
    tip.classList.add("is-visible");
  });

  document.querySelectorAll(".modal-overlay [aria-label=\"Close\"]").forEach((b) => b.innerHTML = ic("close"));

  /* =====================================================================
     Delegated wiring - components swap in and out of #compStage as the
     nav list is clicked, so listeners are bound once on stable ancestors
     rather than re-attached per render.
     ===================================================================== */

  /* modals (static, outside #compStage - always present regardless of tab) */
  const modal = document.getElementById("demoModal");
  const formModal = document.getElementById("formModal");
  document.addEventListener("click", (e) => {
    if (e.target.closest("#openModalBtn")) { modal.classList.add("is-open"); return; }
    if (e.target.closest("#openFormModalBtn")) { formModal.classList.add("is-open"); return; }
    [modal, formModal].forEach((m) => { if (e.target === m || (e.target.closest("[data-close]") && m.contains(e.target))) m.classList.remove("is-open"); });
  });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") { modal.classList.remove("is-open"); formModal.classList.remove("is-open"); } });

  /* All dropdown/popover menus are portaled to <body> and positioned with
     fixed coordinates from their trigger - see RD.portalMenu in shell.js.
     Left nested in a card, a menu inherits that card's stacking context;
     every comp-stage entrance and card animates in on load (opacity/
     transform), which is enough to trap a nested menu behind a later
     sibling for the whole animation - independent of the menu's z-index. */
  function openMenu(menu, trigger, align) {
    document.querySelectorAll(".menu.is-open").forEach((m) => { if (m !== menu) m.classList.remove("is-open"); });
    RD.portalMenu(menu);
    RD.positionMenu(menu, trigger, align);
    menu.classList.add("is-open");
  }
  function closeAllMenus() {
    document.querySelectorAll(".menu.is-open").forEach((m) => m.classList.remove("is-open"));
    const countryBtn = document.getElementById("countryBtn");
    if (countryBtn) countryBtn.setAttribute("aria-expanded", "false");
  }
  document.addEventListener("click", (e) => {
    const countryBtn = e.target.closest("#countryBtn");
    const kebab = e.target.closest(".tbl-kebab");
    const countryOption = e.target.closest("[data-country]");
    const menuItem = e.target.closest(".menu__item");
    const insideMenu = e.target.closest(".menu");

    if (countryOption) {
      const f = FLAGS[+countryOption.dataset.country];
      document.getElementById("countryFlag").innerHTML = f.flag;
      document.getElementById("countryDial").textContent = f.dial;
      closeAllMenus();
      return;
    }
    if (countryBtn) {
      const menu = document.getElementById("countryMenu");
      const willOpen = !menu.classList.contains("is-open");
      willOpen ? openMenu(menu, countryBtn, "start") : closeAllMenus();
      countryBtn.setAttribute("aria-expanded", willOpen);
      return;
    }
    if (kebab) {
      const menu = document.getElementById("rowMenu" + kebab.dataset.row);
      menu.classList.contains("is-open") ? closeAllMenus() : openMenu(menu, kebab, "end");
      return;
    }
    if (menuItem) { closeAllMenus(); return; }
    if (!insideMenu) closeAllMenus();
  });

  /* expandable rows */
  document.addEventListener("click", (e) => {
    const row = e.target.closest(".exp-row"); if (!row) return;
    const detail = document.getElementById("expDetail" + row.dataset.exp);
    const open = row.classList.toggle("is-open");
    detail.classList.toggle("is-open", open);
  });
})();
</script>
</body>
</html>
