<style>
  /* ---- redesign (2026-11-17): page head · one card per country wallet · country sub-nav ---- */
  .wl-head { display: flex; align-items: flex-end; justify-content: space-between; gap: var(--space-4); flex-wrap: wrap; margin-bottom: var(--space-5); }
  .wl-head__sub { margin-top: var(--space-1); }
  .wl-head__actions { display: flex; gap: var(--space-2); flex-wrap: wrap; }
  .wl-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 320px), 1fr)); gap: var(--space-4); }
  .wl-card { display: flex; flex-direction: column; gap: var(--space-4); }
  .wl-card__head { display: flex; align-items: center; gap: var(--space-3); }
  .wl-card__head h2 { font-size: var(--text-lg); font-weight: var(--weight-semibold); line-height: 1.2; }
  .wl-iso { width: 40px; height: 40px; flex: none; border-radius: var(--radius-md); display: grid; place-items: center; background: var(--color-primary-subtle); color: var(--color-primary-ink); font-size: var(--text-sm); font-weight: var(--weight-bold); }
  .wl-balance { padding: var(--space-4); border-radius: var(--radius-md); background: var(--color-surface-sunken); }
  .wl-balance__label { display: block; font-size: var(--text-xs); color: var(--color-text-tertiary); }
  .wl-balance__val { display: flex; align-items: baseline; gap: var(--space-2); margin-top: 2px; font-size: var(--text-h3); font-weight: var(--weight-semibold); color: var(--color-text); font-variant-numeric: tabular-nums; }
  .wl-balance__val small { font-size: var(--text-sm); font-weight: var(--weight-medium); color: var(--color-text-tertiary); }
  .wl-rows { display: flex; flex-direction: column; }
  .wl-row { display: flex; align-items: center; gap: var(--space-3); padding: var(--space-3) var(--space-2); margin-inline: calc(var(--space-2) * -1); border-radius: var(--radius-md); color: var(--color-text); text-decoration: none; }
  .wl-row + .wl-row { border-top: 1px solid var(--color-border-subtle); }
  .wl-row:hover { background: var(--color-surface-hover); }
  .wl-row--static:hover { background: none; } /* plain text without view_funds / view_cashout / view_exchanges */
  .wl-row .kpi-ic { width: 34px; height: 34px; flex: none; box-shadow: none; }
  .wl-row .kpi-ic svg { width: 16px; height: 16px; }
  .wl-row__txt { flex: 1; min-width: 0; }
  .wl-row__txt b { display: block; font-size: var(--text-sm); font-weight: var(--weight-semibold); }
  .wl-row__amt { text-align: end; font-size: var(--text-sm); font-weight: var(--weight-semibold); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .wl-row__amt small { font-size: var(--text-xs); font-weight: var(--weight-regular); color: var(--color-text-tertiary); }
  .wl-row__go { display: inline-flex; color: var(--color-text-tertiary); }
  .wl-row__go svg { width: 16px; height: 16px; }
  .wl-card__foot { margin-top: auto; display: flex; justify-content: flex-end; }
  .wl-sub { margin-bottom: var(--space-5); overflow-x: auto; scrollbar-width: none; }
  .wl-sub::-webkit-scrollbar { display: none; }
  .wl-sub .tabs { flex-wrap: nowrap; white-space: nowrap; }
  .wl-sub .tabs > a { display: inline-flex; align-items: center; gap: var(--space-2); }
  .wl-sub .tabs svg { width: 16px; height: 16px; }
  .wl-amt { font-variant-numeric: tabular-nums; white-space: nowrap; }
  .wl-in { color: var(--color-success); font-weight: var(--weight-medium); }
  .wl-out { color: var(--color-danger); font-weight: var(--weight-medium); }
  @media (max-width: 640px) { .wl-head__actions { width: 100%; } .wl-head__actions .btn { flex: 1 1 auto; } }

<script>
(() => {
  /* Wallet — mirrors pages/wallet:
       overview      /wallet                      wallet.html                   one card per country wallet
       transactions  /wallet/:iso/transactions    ?iso=SA&sub=transactions
       funds         /wallet/:iso/funds           ?iso=SA&sub=funds
       cash out      /wallet/:iso/cashout         ?iso=SA&sub=cashout
       exchanges     /wallet/:iso/exchanges       ?iso=SA&sub=exchanges
       currencies    /wallet/currencies           ?sub=currencies[&translation=<id>]
     Rows are the users' own wallets (us-wallet.js), so a fund edited here is the
     same record the user profile shows.
     Redesign (2026-11-17): same data, routes, modals and validation — re-composed.
     Country cards lead with the total balance and link each pending group to its
     list; a country's four lists share one sub-nav (the same routes); status pills
     are stat tiles. Previous layout: revisions/2026-11-17-all-pages/wallet.html
     Transaction views inside the wallet (dashboard routes
       /wallet/:iso/transactions/public-event/:id  → ?iso=SA&sub=transactions&event=<id>&redirect_to_page=<n>
       /wallet/:iso/transactions/booking/:id       → ?iso=SA&sub=transactions&booking=<id>&redirect_to_page=<n>)
     show the shared view with only "Back to transactions" (→ ?iso=..&sub=transactions&page=<n>).
     Sample states (off by default):
       ?demo=empty       overview with no wallets ("There is no data to display.")
       ?demo=error       saving fails: fund / cash-out edit, currency create / update / delete show the API message
       ?demo=fetcherror  currency edit: GET /currencies/{id} fails ("Error fetching currency")
       ?demo=loading     currency edit stays on "Loading"
     Permissions (dashboard job keys — data-perm / RD.can, demo ?perm=limited | ?perm=none):
       page: overview view_wallets · transactions view_transactions (event view
             view_public_event_details, booking view view_booking_details) · funds view_funds ·
             cash out view_cashout · exchanges view_exchanges · currencies view_currencies
       overview: pending funds / cash out / exchanges rows link only with view_funds /
             view_cashout / view_exchanges (else plain text) · Show transactions view_transactions ·
             Currency management view_currencies
       sub-pages: back to Wallet view_wallets · funds edit update_funds · cash out edit
             update_cashout · eyes on funds / cash out / exchanges view_user_wallet
       transactions eyes: fund / cash out view_user_wallet · public event view_public_event_details ·
             booking view_booking_details · multi booking view_multi_booking_details · package
             PERMISSIONS.USERS.VIEW_USER_PACKAGES (empty key in the dashboard = open to all, no tag)
       currencies: Add add_currencies · edit update_currencies · delete delete_currencies ·
             translation link ungated (as in the dashboard)
       The country sub-nav is this design's own; each tab carries its page key. */
  const qs = new URLSearchParams(location.search), iso = qs.get("iso"), sub = qs.get("sub"), demo = qs.get("demo");
  const PAGE_PERM = sub === "currencies" ? (qs.get("translation") ? undefined : "view_currencies") /* translation route: ungated in the dashboard */
    : !iso ? "view_wallets"
    : sub === "funds" ? "view_funds" : sub === "cashout" ? "view_cashout" : sub === "exchanges" ? "view_exchanges"
    : qs.get("event") ? "view_public_event_details" : qs.get("booking") ? "view_booking_details" : "view_transactions";
  RD.boot({ activeId: "wallet", title: "Wallet", perm: PAGE_PERM });
  if (!document.getElementById("listMount")) return;
  const { L, esc, ic, badge, fmt } = SA;
  const { kv } = PP;
  const mount = document.getElementById("listMount");
  const rtl = () => document.documentElement.dir === "rtl";
  const dash = (v) => (v == null || v === "" ? "---" : esc(v));
  const CUR = { SA: "SAR", EG: "EGP", AE: "AED" };
  const countries = [...new Map(HF.SA.GEO.map((g) => [g.country.iso, g.country])).values()];
  const backBtn = `<a class="btn btn--sm btn--secondary" href="wallet.html" data-perm="view_wallets">${ic(rtl() ? "chevronRight" : "chevronLeft")}<span>${L("Wallet", "المحفظة")}</span></a>`;
  /* page head: title · breadcrumb (Dashboard › Wallet › …) · optional line · actions */
  const head = (t, o) => {
    o = o || {};
    const title = L(t[0], t[1]);
    document.getElementById("pageHead").innerHTML = `<div class="wl-head animate-in">
      <div>
        <h1 class="t-h3">${esc(title)}</h1>
        <nav class="t-sm text-tertiary" aria-label="Breadcrumb" style="margin-top:var(--space-1)"><a href="index.html" style="color:inherit">${L("Dashboard", "لوحة القيادة")}</a> › ${o.root ? "" : `<a href="wallet.html" style="color:inherit">${L("Wallet", "المحفظة")}</a> › `}<span>${esc(title)}</span></nav>
        ${o.sub ? `<p class="t-sm text-secondary wl-head__sub">${o.sub}</p>` : ""}
      </div>
      <div class="wl-head__actions">${(o.actions || "") + (o.root || o.noBack ? "" : backBtn)}</div>
    </div>`;
  };
  const alertHtml = (tone, msg) => `<div class="alert alert--${tone}"><span class="alert__icon">${ic(tone === "success" ? "check" : "warn")}</span><div class="alert__body">${esc(msg)}</div></div>`;
  const API_MSG = ["The selected item is invalid.", "العنصر المحدد غير صالح."]; /* placeholder for the backend's own message */
  const byLink = (p) => (p ? `<a href="user-profile.html?id=${p.id}&tab=details" style="color:var(--color-text);font-weight:var(--weight-semibold)">${esc(p.name)}</a>` : "---");
  const userCell = (u) => `<div class="cell-user">${PP.avatar(u.name)}<div><a href="user-profile.html?id=${u.id}&tab=details" style="color:var(--color-text);font-weight:var(--weight-semibold)">${esc(u.name)}</a><div class="t-xs text-tertiary">${u.high_five_user_name ? "vie_" + (u.id % 900) : L("Username", "اسم المستخدم")}</div></div></div>`;
  const curCell = (c, country) => `<b>${esc(c)}</b><div class="t-xs text-tertiary">${esc(country)}</div>`;
  const ST = { pending: ["Pending", "معلق"], completed: ["Completed", "مكتمل"], rejected: ["Rejected", "مرفوض"] };
  const stLabel = (s) => (ST[s] ? L(ST[s][0], ST[s][1]) : PP.cap(s));
  const stBadge = (s) => badge(s === "pending" ? "warning" : s === "completed" ? "primary" : "danger", stLabel(s));
  const amt = (v) => `<span class="wl-amt">${v}</span>`;
  const EMPTY = ["There is no data to display.", "لا توجد بيانات للعرض."];

  /* ---- country data from the users' wallets ---- */
  const usersIn = (c) => HF.SA.users.filter((u) => u.country.iso === c);
  const all = (c, key) => usersIn(c).flatMap((u) => US.wallet(u)[key].map((r) => Object.assign(r, { _u: u })));
  const exchanges = (c) => usersIn(c).slice(0, 4).map((u, i) => ({ id: 400 + i, _u: u, create_at: `2026-10-${String(10 + i).padStart(2, "0")} 14:2${i}:00`, transaction: "exchange", info: { description: L("Phone number changed — balance moved", "تغيّر رقم الهاتف — تم نقل الرصيد") },
    amount: 100 + i * 50, currency: CUR[c], country: u.country.name, exchanged_amount: +((100 + i * 50) * (c === "EG" ? 0.077 : 1.02)).toFixed(2), exchanged_currency: c === "EG" ? "SAR" : "AED", exchanged_country: c === "EG" ? "Saudi Arabia" : "United Arab Emirates",
    status: ["completed", "pending", "completed", "rejected"][i], old_phone: `+966 50 000 00${i}0`, new_phone: u.phone }));
  const summary = (c) => { const F = all(c, "funds").filter((r) => r.status === "pending"), C = all(c, "cashouts").filter((r) => r.status === "pending"), X = exchanges(c);
    return { total_balance: usersIn(c).reduce((a, u) => a + (u.wallet_amount || 0), 0), funds_transactions: F.length, pending_funds: F.reduce((a, r) => a + r.amount, 0), cash_out_transactions: C.length, pending_cash_out: C.reduce((a, r) => a + r.amount, 0), exchange_transactions: X.length, exchanges: X.reduce((a, r) => a + r.amount, 0) }; };

  /* ---- read-only detail modals (Fund / Cash out) ---- */
  const fundModal = (f, title) => SA.modal({ id: "wFund", title, foot: `<button class="btn btn--ghost" data-close>${L("Close", "إغلاق")}</button>`, body: kv([[L("ID", "الرقم"), f.id], [L("Status", "الحالة"), f.status ? stBadge(f.status) : "---"], [L("Date & time", "التاريخ والوقت"), dash(f.initiated_at)], [L("Country", "البلد"), dash(f._u.country.name)],
    [L("Amount", "المبلغ"), dash(f.amount)], [L("Reason", "السبب"), dash(f.fund_reason)], [L("Action by", "تم بواسطة"), dash(f.action_by && f.action_by.name)], [L("Action date", "تاريخ الإجراء"), dash(f.action_at)]]) });
  const cashModal = (c, title) => SA.modal({ id: "wCash", title, foot: `<button class="btn btn--ghost" data-close>${L("Close", "إغلاق")}</button>`, body: kv([[L("ID", "الرقم"), c.id], [L("Status", "الحالة"), c.status ? stBadge(c.status) : "---"], [L("Date & time", "التاريخ والوقت"), dash(c.initiated_at)], [L("Country", "البلد"), dash(c._u.country.name)],
    [L("Bank name", "اسم البنك"), dash(c.bank_name)], [L("IBAN", "رقم الآيبان"), `<span dir="ltr">${dash(c.iban)}</span>`], [L("Account holder name", "اسم صاحب الحساب"), dash(c.account_name)],
    [L("Amount", "المبلغ"), dash(c.amount)], [L("Reason", "السبب"), dash(c.fund_reason)], [L("Action by", "تم بواسطة"), dash(c.action_by && c.action_by.name)], [L("Action date", "تاريخ الإجراء"), dash(c.action_at)]]) });
  /* Edit (funds and cash out share the dashboard's "add fund to user wallet" title — kept 1:1) */
  /* Reason starts from the row's refund_reason (not in the list response, so it is
     empty — kept 1:1). PUT /wallet-fund/{user}/{id} or /cash-out/{user}/{id} {status, action_reason}.
     backdrop='static' keyboard={false}. The cash-out button reads "Update ..." while
     saving (the dashboard uses UPDATE there), funds read "Updating ...". */
  const editModal = (row, isFund, done) => {
    const el = SA.modal({ id: "wEdit", static: true, title: L("Add fund to user wallet", "إضافة أموال لمحفظة المستخدم"), body: `<div class="stack gap-4"><div data-alert></div>
        ${SA.field(["Status", "الحالة"], SA.select([["completed", L("Completed", "مكتمل"), true], ["rejected", L("Rejected", "مرفوض")]], "data-s"))}
        ${SA.field(["Reason", "السبب"], `<textarea class="input" rows="3" data-r placeholder="${L("Enter action reason", "أدخل سبب الإجراء")}">${esc(row.refund_reason || "")}</textarea>`)}</div>`,
      foot: `<button class="btn btn--ghost" data-close>${L("Cancel", "إلغاء")}</button><button class="btn" data-ok>${L("Update", "تحديث")}</button>` });
    el.querySelector("[data-ok]").onclick = (e) => {
      const b = e.currentTarget; b.disabled = true; b.textContent = isFund ? L("Updating ...", "جاري التحديث ...") : L("Update ...", "تحديث ...");
      setTimeout(() => {
        if (demo === "error") { b.disabled = false; b.textContent = L("Update", "تحديث"); el.querySelector("[data-alert]").innerHTML = alertHtml("danger", L(API_MSG[0], API_MSG[1])); return; }
        Object.assign(row, { status: el.querySelector("[data-s]").value, action_reason: el.querySelector("[data-r]").value, action_by: { id: 1, name: "Super Admin" }, action_at: "2026-11-15 12:00:00" });
        el.querySelector("[data-alert]").innerHTML = alertHtml("success", L("Updated successfully", "تم التحديث بنجاح"));
        setTimeout(() => { SA.close(el); done(); }, 700); }, 400);
    };
  };
  const statusPills = [["all", "All", "الكل"], ["pending", "Pending", "معلق"], ["completed", "Completed", "مكتمل"], ["rejected", "Rejected", "مرفوض"]].map((p) => ({ key: p[0], label: [p[1], p[2]] }));

  /* ================= currencies ================= */
  /* API: GET /currencies?active=&search=&currency=<code>&page=&limit= (rows carry exchange_rate
     already relative to the chosen currency — shown as sent), GET /general/currencies (the
     currency select: codes, default SAR), POST /currencies multipart {name, code, active, icon},
     POST /currencies/{id} _method=put (icon: new file, or '' when the preview was cleared),
     GET /currencies/{id}, DELETE /currencies/{id}. Translation: /wallet/currencies/:id/translation. */
  if (sub === "currencies") {
    const C = (HF.SA._currencies = HF.SA._currencies || [["Saudi Riyal", "SAR", 1, 1], ["Egyptian Pound", "EGP", 0.077, 1], ["UAE Dirham", "AED", 1.02, 1], ["US Dollar", "USD", 3.75, 1], ["Euro", "EUR", 4.05, 0], ["Kuwaiti Dinar", "KWD", 12.2, 0]].map((c, i) => ({ id: 10 + i, name: c[0], code: c[1], rate: c[2], active: c[3], icon: i < 3 ? "sample" : "" })));
    const tr = qs.get("translation");
    if (tr) { const c = C.find((x) => String(x.id) === tr) || C[0]; SATR.render(mount, { key: "currency" + c.id, itemName: c.name, cols: [["name", L("Name", "الاسم")]], src: { name: c.name }, backHref: "wallet.html?sub=currencies" }); document.getElementById("pageHead").hidden = true; return; }
    head(["Currencies", "العملات"], { sub: L("Currencies, their exchange rates and status", "العملات وأسعار صرفها وحالتها"), actions: `<button type="button" class="btn btn--sm" data-add data-perm="add_currencies">${ic("plus")}<span>${L("Add new", "إضافة جديد")}</span></button>` });
    let base = "SAR";
    /* stand-in for the server: exchange_rate of each row against the chosen currency */
    const fetchRates = () => { const ref = (C.find((c) => c.code === base) || { rate: 1 }).rate; C.forEach((r) => (r.exchange_rate = +(r.rate / ref).toFixed(4))); };
    fetchRates();
    const iconThumb = (r, size) => (r.icon ? (r.icon === "sample" ? `<span class="cell-thumb" style="width:${size}px;height:${size}px;font-weight:var(--weight-bold)">${esc(r.code.slice(0, 1))}</span>` : `<span class="cell-thumb" style="width:${size}px;height:${size}px"><img src="${r.icon}" alt="${esc(r.name)}" style="object-fit:contain"></span>`)

        { head: ["Actions", "الإجراءات"], align: "center", cell: eye },
      ],
      /* keep the page in the URL so "Back to transactions" returns to it */
      after: () => { if (ctl) { const u = new URL(location.href); u.searchParams.set("page", ctl.state.page); history.replaceState(null, "", u); } },
    });
    if (startPage > 1) { ctl.state.page = startPage; ctl.paint(); }
    mount.addEventListener("click", (e) => {
      const b = e.target.closest("[data-w]"); if (!b) return;
      const [t, uid, id] = b.dataset.w.split(":"), u = HF.SA.users.find((x) => String(x.id) === uid), W = US.wallet(u);
      if (t === "wallet_fund") { const f = Object.assign(W.funds.find((x) => String(x.id) === id) || W.funds[0], { _u: u }); fundModal(f, `${L("Fund ID", "رقم الصندوق")}: ${f.id}`); }
      else { const co = Object.assign(W.cashouts.find((x) => String(x.id) === id) || W.cashouts[0], { _u: u }); cashModal(co, `${L("Cash out ID", "رقم السحب النقدي")}: ${co.id}`); }
    });
    return;
  }

  /* ================= overview ================= */
  head(["Wallet", "المحفظة"], { root: true, sub: L("Users' wallet balances and pending requests per country", "أرصدة محافظ المستخدمين والطلبات المعلقة لكل بلد"),
    actions: `<a class="btn btn--sm" href="wallet.html?sub=currencies" data-perm="view_currencies">${ic("globe")}<span>${L("Currency management", "إدارة العملات")}</span></a>` });
  const go = rtl() ? "chevronLeft" : "chevronRight";
  /* GET /wallets — no wallets: "There is no data to display." (?demo=empty) */
  if (demo === "empty") { mount.innerHTML = `<section class="card card--pad animate-in" style="text-align:center;padding-block:var(--space-10)"><p class="text-tertiary" style="margin:0">${L(EMPTY[0], EMPTY[1])}</p></section>`; return; }
  mount.innerHTML = `<div class="wl-grid">${countries.map((c) => {
    const s = summary(c.iso), code = CUR[c.iso];
    /* a row links to its list only with that list's key (CountryWallet.js) — else plain text */
    const row = (t, n, v, sub2, icon, tone, perm) => { const link = RD.can(perm); return `<${link ? `a class="wl-row" href="wallet.html?iso=${c.iso}&sub=${sub2}"` : `div class="wl-row wl-row--static"`}>
        <span class="kpi-ic" style="background:var(--color-${tone}-subtle);color:var(--color-${tone === "primary" ? "primary-ink" : tone})">${ic(icon)}</span>
        <span class="wl-row__txt"><b>${t}</b><span class="t-xs text-tertiary">${L(`${fmt(n)} transactions`, `${fmt(n)} معاملة`)}</span></span>
        <span class="wl-row__amt">${fmt(v)} <small>${code}</small></span>${link ? `<span class="wl-row__go" aria-hidden="true">${ic(go)}</span>` : ""}</${link ? "a" : "div"}>`; };
    return `<section class="card card--pad wl-card animate-in" aria-labelledby="wl-${c.iso}">
      <div class="wl-card__head"><span class="wl-iso" aria-hidden="true">${esc(c.iso)}</span><div style="flex:1;min-width:0"><h2 id="wl-${c.iso}">${esc(c.name)}</h2><span class="t-xs text-tertiary">${L("Currency", "العملة")}: ${code}</span></div></div>
      <div class="wl-balance"><span class="wl-balance__label">${L("Total balance", "الرصيد الإجمالي")}</span><span class="wl-balance__val">${fmt(s.total_balance || 0)}<small>${code}</small></span></div>
      <div class="wl-rows">${row(L("Pending funds", "الأموال المعلقة"), s.funds_transactions, s.pending_funds, "funds", "plus", "warning", "view_funds")}${row(L("Pending cash out", "السحب النقدي المعلق"), s.cash_out_transactions, s.pending_cash_out, "cashout", "upload", "warning", "view_cashout")}${row(L("Exchanges", "التبادلات"), s.exchange_transactions, s.exchanges, "exchanges", "refresh", "primary", "view_exchanges")}</div>
      <div class="wl-card__foot"><a class="btn btn--sm" href="wallet.html?iso=${c.iso}&sub=transactions" data-perm="view_transactions"><span>${L("Show transactions", "عرض المعاملات")}</span>${ic(go)}</a></div></section>`;
  }).join("")}</div>`;
})();
</script>
</body>
</html>
