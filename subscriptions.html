<style>
  /* ---- redesign (2026-11-17): partners-style head + one static tile ---- */
  .sb-head { margin-bottom: var(--space-5); }
  .sb-tiles { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); margin-bottom: var(--space-4); }
  .sb-tiles .stat-tile { cursor: default; }
  #listMount .data-table-toolbar .input-wrap { flex: 1 1 320px; min-width: 0; }
  #listMount .data-table-footer .pagination { flex-wrap: wrap; max-width: 100%; }
</style>

<body>
<div class="app" id="app">
  <div class="scrim"></div>
  <aside class="sidebar" id="sidebarMount"></aside>
  <div class="main">
    <header class="topbar" id="topbarMount"></header>
    <nav id="topTabsMount"></nav>

    <main class="content"><div class="content__inner" style="max-width:none">
      <div id="pageHead"></div>
      <div id="listMount"></div>
    </div></main>
  </div>
</div>

<script src="assets/js/data.js"></script>
<script src="assets/js/env.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/shell.js"></script>
<script src="assets/js/sa-data.js"></script>
<script src="assets/js/sa-kit.js"></script>
<script src="assets/js/pp/pp-core.js"></script>
<script>
(() => {
  /* Subscriptions — mirrors pages/subscriptions (read-only): search by email
     (from 3 chars), id + email columns. No pills, no actions (Add is commented
     out in the dashboard). API: GET /subscriptions.
     Redesign (2026-11-17): partners-style head with a live count, one static
     stat tile, the search in the table bar, email rows with an icon.
     Previous layout: revisions/2026-11-17-all-pages/subscriptions.html
     Sample state (off by default): ?demo=error — GET /subscriptions fails: the API message
     in a red alert in place of the table (as CatItemsTableWrapper).
     Permissions (dashboard job key, demo ?perm=none): page view_subscriptions — the only
     key (the add_activities toolbar check is commented out in the dashboard). */
  RD.boot({ activeId: "subscriptions", title: "Subscriptions", perm: "view_subscriptions" });
  if (!document.getElementById("listMount")) return;
  const { L, esc, ic, fmt } = SA;
  const data = HF.SA.users.filter((u) => u.email).map((u, i) => ({ id: 120 + i, email: u.email })).concat(["news@fit-life.co", "hello@padelfans.net", "coach.samir@mail.com"].map((e, i) => ({ id: 300 + i, email: e })));
  document.getElementById("pageHead").innerHTML = `<div class="sb-head animate-in">
      <div>
        <h1 class="t-h3">${L("Subscriptions", "الاشتراكات")}</h1>
        <nav class="t-sm text-tertiary" aria-label="Breadcrumb" style="margin-top:var(--space-1)"><a href="index.html" style="color:inherit">${L("Dashboard", "لوحة القيادة")}</a> › <span>${L("Subscriptions", "الاشتراكات")}</span></nav>
      </div>
    </div>
    <div class="stat-strip sb-tiles animate-in"><div class="stat-tile stat-tile--static"><span class="kpi-ic" style="background:var(--color-primary-subtle);color:var(--color-primary-ink);box-shadow:none">${ic("mail")}</span>
      <span class="stat-tile__txt"><span class="stat-tile__val" style="font-variant-numeric:tabular-nums">${fmt(data.length)}</span><span class="stat-tile__label">${L("Subscribers", "المشتركون")}</span></span></div></div>`;
  const apiError = new URLSearchParams(location.search).get("demo") === "error";
  SA.list({
    mount: document.getElementById("listMount"), data, minSearch: 3,
    after: (root) => {
      if (!apiError) return;
      const sc = root.querySelector(".data-table-scroll"), ft = root.querySelector(".data-table-footer");
      if (ft) ft.remove();
      if (sc) sc.outerHTML = `<div style="padding:var(--space-4) var(--space-5)"><div class="alert alert--danger"><span class="alert__icon">${ic("warn")}</span><div class="alert__body">${L("Server error, please try again later.", "خطأ في الخادم، يرجى المحاولة لاحقاً.")}</div></div></div>`; /* placeholder for the API's message */
    },
    search: ["Search by email", "البحث بالبريد الإلكتروني"], searchMatch: (r, q) => r.email.toLowerCase().includes(q),
    empty: ["There is no data to display.", "لا توجد بيانات للعرض."],
    columns: [
      { head: ["ID", "الرقم"], cell: (r) => `<span class="t-sm text-tertiary" style="font-variant-numeric:tabular-nums">#${r.id}</span>` },
      { head: ["Email", "البريد الإلكتروني"], cell: (r) => `<div class="cell-user"><span class="cell-thumb" style="width:32px;height:32px" aria-hidden="true">${ic("mail")}</span><b dir="ltr">${esc(r.email)}</b></div>` },
    ],
  });
})();
</script>
</body>
</html>
