<style>
  /* Dashboard rows mirror the Super Admin layout: stats card (col-xl-4) beside
     its chart card (col-xl-8); stacked below 1200px like Bootstrap's xl. */
  .sa-row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 2fr); gap: var(--space-6); align-items: stretch; }
  @media (max-width: 1199px) { .sa-row { grid-template-columns: minmax(0, 1fr); } }
  .sa-total { font-size: var(--text-h1); font-weight: var(--weight-bold); line-height: var(--leading-tight); }
  .sa-caps { text-transform: uppercase; letter-spacing: var(--tracking-caps); font-size: var(--text-xs); font-weight: var(--weight-semibold); color: var(--color-text-tertiary); }
  .sa-boxes { display: grid; grid-template-columns: repeat(auto-fit, minmax(84px, 1fr)); gap: var(--space-2); }
  .sa-box { border: var(--border-thin) dashed var(--color-border); border-radius: var(--radius-md); padding: var(--space-3) var(--space-2); text-align: center; }
  .sa-box b { display: block; font-size: var(--text-title); }
  .sa-box span { font-size: var(--text-xs); color: var(--color-text-tertiary); }
  .sa-pct { display: grid; grid-template-columns: auto 1fr auto auto; align-items: center; gap: var(--space-2); font-size: var(--text-sm); }
  .sa-pct + .sa-pct { margin-top: var(--space-2); }
  .sa-swatch { width: 10px; height: 10px; border-radius: var(--radius-full); }
  .sa-donuts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--space-5); }
  @media (max-width: 768px) { .sa-donuts { grid-template-columns: minmax(0, 1fr); } }
  .sa-filters { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: var(--space-3); align-items: end; }
  .sa-chart { width: 100%; display: block; }
</style>
</head>
<body>
<div class="app" id="app">
  <div class="scrim"></div>
  <aside class="sidebar" id="sidebarMount"></aside>
  <div class="main">
    <header class="topbar" id="topbarMount"></header>
    <nav id="topTabsMount"></nav>

    <main class="content"><div class="content__inner" style="max-width:none">

      <header class="row between gap-4 animate-in" style="margin-bottom:var(--space-6);flex-wrap:wrap;align-items:center">
        <h1 class="t-h3" id="pageTitle"></h1>
        <span class="row gap-3" style="align-items:center">
          <span class="t-sm text-tertiary" id="filterInfo"></span>
          <button class="btn btn--sm" id="filterBtn" aria-haspopup="dialog" aria-expanded="false"></button>
        </span>
      </header>

      <div class="popover" id="filterPop" role="dialog" aria-labelledby="filterPopTitle" style="width:300px">
        <div class="popover__title" id="filterPopTitle"></div>
        <div class="popover__body stack gap-3" id="filterFields"></div>
        <div class="popover__foot">
          <button class="btn btn--sm btn--secondary" id="filterReset"></button>
          <button class="btn btn--sm" id="filterApply"></button>
        </div>
      </div>

      <div class="stack gap-6" id="rows"></div>

    </div></main>
  </div>
</div>

<script src="assets/js/data.js"></script>
<script src="assets/js/env.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/shell.js"></script>
<script>
(() => {
  RD.boot({ activeId: "dashboard", title: "Dashboard" });
  if (!document.getElementById("rows")) return; /* access/config error page replaced the content */
  const ic = RD.icon;
  const AR = document.documentElement.dir === "rtl";
  const L = (en, ar) => (AR ? ar : en);
  const fmt = (n) => Number(n || 0).toLocaleString("en-US");
  const showAll = (id) => {
    const it = RD.navPick([id])[0];
    return `<div style="text-align:center;margin-top:auto;padding-top:var(--space-5)"><a class="btn btn--sm" href="${it ? it.href : "index.html"}">${L("show all", "عرض الكل")}</a></div>`;
  };

  /* ---------------- chart helpers (SVG, token colours only) ---------------- */
  const C = {
    blue: "var(--chart-3)", red: "var(--color-danger)", grey: "var(--gray-300)",
    amber: "var(--chart-5)", teal: "var(--chart-6)", pink: "var(--chart-7)",
    primary: "var(--color-primary)",
  };
  function lineChart(labels, series) {
    const w = 720, h = 260, px = 36, py = 20;
    const max = Math.max(1, ...series.flatMap((s) => s.values)) * 1.15;
    const x = (i) => px + (i * (w - px * 2)) / Math.max(1, labels.length - 1);
    const y = (v) => h - py - 18 - (v / max) * (h - py * 2 - 18);
    const grid = [0, 0.25, 0.5, 0.75, 1].map((g) => {
      const gy = y(max * g / 1.15);
      return `<line x1="${px}" x2="${w - px}" y1="${gy}" y2="${gy}" stroke="var(--chart-grid)"/>`;
    }).join("");
    const lines = series.map((s) => {
      const pts = s.values.map((v, i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(" ");
      return `<polyline points="${pts}" fill="none" stroke="${s.color}" stroke-width="2.5" stroke-linejoin="round"/>` +
        s.values.map((v, i) => `<circle cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="5" fill="var(--color-surface)" stroke="${s.color}" stroke-width="2.5"><title>${s.name}: ${fmt(v)}</title></circle>`).join("");
    }).join("");
    const xl = labels.map((l, i) => `<text x="${x(i).toFixed(1)}" y="${h - 4}" text-anchor="middle" font-size="11" fill="var(--chart-axis)">${l}</text>`).join("");
    const legend = series.length > 1
      ? `<div class="chart-legend" style="margin-bottom:var(--space-3)">${series.map((s) => `<span class="chart-legend__item"><span class="chart-legend__swatch" style="background:${s.color}"></span>${s.name}</span>`).join("")}</div>`
      : "";
    return legend + `<svg class="sa-chart" width="100%" viewBox="0 0 ${w} ${h}" role="img" aria-label="${series.map((s) => s.name).join(", ")}">${grid}${lines}${xl}</svg>`;
  }
  function barChart(bars) {
    const w = 720, h = 260, px = 36, py = 20;
    const max = Math.max(1, ...bars.map((b) => b.value)) * 1.15;
    const bw = (w - px * 2) / bars.length;
    return `<svg class="sa-chart" width="100%" viewBox="0 0 ${w} ${h}" role="img" aria-label="${bars.map((b) => b.label + " " + b.value).join(", ")}">` +
      bars.map((b, i) => {
        const bh = (b.value / max) * (h - py * 2 - 18);
        const bx = px + i * bw + bw * 0.2;
        return `<rect x="${bx.toFixed(1)}" y="${(h - py - 18 - bh).toFixed(1)}" width="${(bw * 0.6).toFixed(1)}" height="${bh.toFixed(1)}" rx="6" fill="${b.color}"><title>${b.label}: ${fmt(b.value)}</title></rect>
          <text x="${(bx + bw * 0.3).toFixed(1)}" y="${h - 4}" text-anchor="middle" font-size="12" fill="var(--chart-axis)">${b.label}</text>`;
      }).join("") + `</svg>`;
  }
  function donut(segs, hole) {
    const total = segs.reduce((a, s) => a + s.value, 0);
    if (!total) return `<div class="t-sm text-tertiary" style="text-align:center;padding:var(--space-10) 0">${L("0 Statistics", "0 إحصائيات")}</div>`;
    const R = 80, r = hole ? 52 : 0, cx = 100, cy = 100;
    let a0 = -Math.PI / 2;
    const arcs = segs.filter((s) => s.value).map((s) => {
      const a1 = a0 + (s.value / total) * Math.PI * 2;
      const large = a1 - a0 > Math.PI ? 1 : 0;
      const p = (rad, a) => `${(cx + rad * Math.cos(a)).toFixed(2)} ${(cy + rad * Math.sin(a)).toFixed(2)}`;
      const full = s.value === total;
      const d = full
        ? `M ${cx} ${cy - R} A ${R} ${R} 0 1 1 ${cx - 0.01} ${cy - R} Z` + (r ? ` M ${cx} ${cy - r} A ${r} ${r} 0 1 0 ${cx - 0.01} ${cy - r} Z` : "")
        : r
          ? `M ${p(R, a0)} A ${R} ${R} 0 ${large} 1 ${p(R, a1)} L ${p(r, a1)} A ${r} ${r} 0 ${large} 0 ${p(r, a0)} Z`
          : `M ${cx} ${cy} L ${p(R, a0)} A ${R} ${R} 0 ${large} 1 ${p(R, a1)} Z`;
      a0 = a1;
      return `<path d="${d}" fill="${s.color}" fill-rule="evenodd" stroke="var(--color-surface)" stroke-width="2"><title>${s.label}: ${fmt(s.value)}</title></path>`;
    }).join("");
    return `<svg width="100%" viewBox="0 0 200 200" style="height:auto;max-width:200px;display:block;margin:0 auto" role="img" aria-label="${segs.map((s) => s.label + " " + s.value).join(", ")}">${arcs}</svg>`;
  }
  const pct = (part, total) => (total ? parseInt((part / total) * 100, 10) : 0);
  function pctList(segs, total, withAll) {
    const rows = (withAll ? [{ label: L("all", "الكل"), color: C.grey, value: total, all: true }] : []).concat(segs);
    return `<div style="margin-top:var(--space-4)">${rows.map((s) => `
      <div class="sa-pct"><span class="sa-swatch" style="background:${s.color}"></span><span>${s.label}</span>
        <b>${s.all ? 100 : pct(s.value, total)}%</b><span class="text-tertiary">${fmt(s.value)}</span></div>`).join("")}</div>`;
  }

  /* ---------------- shared pieces ---------------- */
  const statsHead = (icon, total, label) => `
    <div class="row gap-4" style="align-items:center;margin-bottom:var(--space-5)">
      <span class="kpi-ic" style="width:56px;height:56px">${ic(icon)}</span>
      <div><div class="sa-total">${fmt(total)}</div><div class="sa-caps">${label}</div></div>
    </div>`;
  const boxes = (items) => `<div class="sa-boxes">${items.map((b) => `<div class="sa-box"><b>${fmt(b[1])}</b><span>${b[0]}</span></div>`).join("")}</div>`;
  const chartHead = (title, sub, extra) => `
    <div class="row between gap-4" style="flex-wrap:wrap;margin-bottom:var(--space-5)">
      <div><b class="t-title">${title}</b><p class="t-sm text-tertiary" style="margin-top:2px">${sub}</p></div>${extra || ""}
    </div>`;
  const period = (id, active) => `
    <div class="row gap-2" style="align-items:center;flex-wrap:wrap">
      <div class="segmented" data-period="${id}">
        ${[["all", L("all", "الكل")], ["year", L("year", "سنة")], ["month", L("month", "شهر")]]
          .map(([k, t]) => `<button type="button" data-k="${k}" class="${k === active ? "is-active" : ""}">${t}</button>`).join("")}
      </div>
      <span data-picker="${id}">${picker(active)}</span>
    </div>`;
  function picker(k) {
    if (k === "year") return `<div class="select" style="min-width:110px"><select aria-label="${L("year", "سنة")}">${[2026, 2025, 2024, 2023].map((y) => `<option>${y}</option>`).join("")}</select><span class="select__caret">${ic("chevronDown")}</span></div>`;
    if (k === "month") return `<input class="input" type="month" value="2026-11" aria-label="${L("month", "شهر")}" style="min-width:150px">`;
    return "";
  }
  const sel = (label, opts) => `
    <div class="field"><label class="field__label">${label}</label>
      <div class="select"><select>${[L("all", "الكل")].concat(opts).map((o) => `<option>${o}</option>`).join("")}</select><span class="select__caret">${ic("chevronDown")}</span></div></div>`;
  const CATS = ["Sports", "Kids", "Entertainment"];
  const ACTS = ["Padel", "Football", "Bowling", "Swimming"];
  const card = (body, extraStyle) => `<section class="card card--pad animate-in" style="display:flex;flex-direction:column;${extraStyle || ""}">${body}</section>`;

  /* ---------------- sample data (shapes = the /statistics/* responses) ---------------- */
  const MONTHS = AR
    ? ["يناير", "فبراير", "مارس", "أبريل", "مايو", "يونيو", "يوليو", "أغسطس", "سبتمبر", "أكتوبر", "نوفمبر", "ديسمبر"]
    : ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
  /* "all" (the default period on both line charts) groups by year */
  const YEARS = ["2021", "2022", "2023", "2024", "2025", "2026"];
  const D = {
    partners: { total: 1284, pending: 37, active: 1102, inactive: 145,
      statistics: { partners: [96, 188, 241, 279, 312, 168], active: [81, 162, 210, 247, 276, 126] } },
    units: { total: 4210, pending: 96, active: 3870, inactive: 244 },
    users: { total: 86410, very_active: 12480, active: 38215, inactive: 35715,
      statistics: [6120, 11480, 14010, 17890, 20240, 16670] },
    engagement: { booked: 21430, joined: 9870, booked_joined: 14215, not_try: 40895 },
    genders: { total: 86410, males: 49810, females: 31260, not_determined: 5340, age_groups: [
      { name: L("Kids", "أطفال"), users: { total: 9120, males: 4980, females: 3710, not_determined: 430 } },
      { name: L("Teens", "مراهقون"), users: { total: 17340, males: 10120, females: 6210, not_determined: 1010 } },
      { name: L("Adults", "بالغون"), users: { total: 51870, males: 30010, females: 18640, not_determined: 3220 } },
      { name: L("Seniors", "كبار السن"), users: { total: 8080, males: 4700, females: 2700, not_determined: 680 } },
    ] },
    bookings: { total: 3962, coming: { total: 1210, online: 830, manual: 380 }, ended: { total: 2415, online: 1605, manual: 810 }, cancelled: { total: 337, online: 251, manual: 86 } },
    events: { total: 642, coming: 118, ended: 489, cancelled: 35,
      public_events_status: { full: 301, missing: 244, blank: 97 },
      public_events_players: { joined: 5210, lefted: 640, removed: 112 } },
  };

  /* ---------------- rows ---------------- */
  const rows = [];

  // 1 · Partners
  rows.push(`<div class="sa-row">
    ${card(statsHead("hotel", D.partners.total, L("Partners", "شركاء")) +
      boxes([[L("Pending", "معلق"), D.partners.pending], [L("Activated", "مفعَّل"), D.partners.active], [L("Inactivated", "غير مفعَّل"), D.partners.inactive]]) +
      showAll("partners"))}
    ${card(chartHead(L("partners statistics", "إحصائيات الشركاء"), L("number of registered partners.", "عدد الشركاء المسجلين."), period("partners", "all")) +
      lineChart(YEARS, [
        { name: L("Partners", "شركاء"), color: C.primary, values: D.partners.statistics.partners },
        { name: L("Activated", "مفعَّل"), color: C.blue, values: D.partners.statistics.active },
      ]))}
  </div>`);

  // 2 · Units
  rows.push(`<div class="sa-row">
    ${card(statsHead("box", D.units.total, L("units", "وحدات")) +
      boxes([[L("Pending", "معلق"), D.units.pending], [L("Approved", "معتمد"), D.units.active], [L("Not Approved", "غير معتمد"), D.units.inactive]]) +
      showAll("units"))}
    ${card(chartHead(L("units statistics", "إحصائيات الوحدات"), L("number of units based on activity.", "عدد الوحدات بناءً على النشاط.")) +
      `<div class="sa-filters" style="margin-bottom:var(--space-5)">${sel(L("category", "الفئة"), CATS)}${sel(L("activity", "النشاط"), ACTS)}</div>` +
      barChart([
        { label: L("all", "الكل"), value: D.units.total, color: C.grey },
        { label: L("Pending", "معلق"), value: D.units.pending, color: C.amber },
        { label: L("Approved", "معتمد"), value: D.units.active, color: C.blue },
        { label: L("Not Approved", "غير معتمد"), value: D.units.inactive, color: C.red },
      ]))}
  </div>`);

  // 3 · Users
  rows.push(`<div class="sa-row">
    ${card(statsHead("users", D.users.total, L("users", "المستخدمون")) +
      boxes([[L("very active", "نشط جداً"), D.users.very_active], [L("active", "نشط"), D.users.active], [L("inactive", "غير نشط"), D.users.inactive]]) +
      `<div class="row gap-3" style="align-items:center;margin:var(--space-6) 0 var(--space-4)"><span class="kpi-ic">${ic("heart")}</span><span class="sa-caps">${L("user engagement", "تفاعل المستخدمين")}</span></div>` +
      boxes([[L("booked only", "حجز فقط"), D.engagement.booked], [L("joined only", "انضم فقط"), D.engagement.joined], [L("joined & booked", "انضم وحجز"), D.engagement.booked_joined], [L("not tried any", "لم يجرب أي شيء"), D.engagement.not_try]]) +
      showAll("users"))}
    ${card(chartHead(L("users statistics", "إحصائيات المستخدمين"), L("number of registered users.", "عدد المستخدمين المسجلين."), period("users", "all")) +
      lineChart(YEARS, [{ name: L("users", "المستخدمون"), color: C.blue, values: D.users.statistics }]))}
  </div>`);

  // 4 · Gender + age groups
  const g = D.genders;
  const gSegs = [
    { label: L("Male", "ذكر"), color: C.blue, value: g.males },
    { label: L("Female", "أنثى"), color: C.red, value: g.females },
    { label: L("N/A", "غير متاح"), color: C.grey, value: g.not_determined },
  ];
  const cellBar = (part, total, tone) => `
    <div class="row between t-xs"><b>${pct(part, total)}%</b><span class="text-tertiary">${fmt(part)}</span></div>
    <div class="progress" style="margin-top:var(--space-1)"><div class="progress__bar" style="width:${pct(part, total)}%;background:${tone}"></div></div>`;
  rows.push(`<div class="sa-row">
    ${card(`<div class="row gap-3" style="align-items:center;margin-bottom:var(--space-5)"><span class="kpi-ic">${ic("users")}</span><span class="sa-caps">${L("gender of users", "نوع المستخدمين")}</span></div>` +
      donut(gSegs, false) + pctList(gSegs, g.total, false))}
    ${card(`<b class="t-title" style="margin-bottom:var(--space-4)">${L("number of users based on age groups and gender", "عدد المستخدمين بناءً على الفئات العمرية والنوع")}</b>
      <div class="data-table-scroll"><table class="data-table">
        <thead><tr><th>${L("age group", "الفئة العمرية")}</th><th>${L("all", "الكل")}</th><th>${L("Male", "ذكر")}</th><th>${L("Female", "أنثى")}</th><th>${L("N/A", "غير متاح")}</th></tr></thead>
        <tbody>${g.age_groups.map((a) => `<tr>
          <td><div class="cell-user"><span class="cell-thumb">${ic("users")}</span><b>${a.name}</b></div></td>
          <td data-label="${L("all", "الكل")}"><b>${fmt(a.users.total)}</b></td>
          <td data-label="${L("Male", "ذكر")}" style="min-width:120px">${cellBar(a.users.males, a.users.total, C.blue)}</td>
          <td data-label="${L("Female", "أنثى")}" style="min-width:120px">${cellBar(a.users.females, a.users.total, C.red)}</td>
          <td data-label="${L("N/A", "غير متاح")}" style="min-width:120px">${cellBar(a.users.not_determined, a.users.total, C.grey)}</td>
        </tr>`).join("")}</tbody>
      </table></div>`)}
  </div>`);

  // 5 · Bookings
  const b = D.bookings;
  const bCol = (label, o) => `<div class="stack gap-2" style="text-align:center">
      <span class="sa-caps">${label}</span><b class="t-h3">${fmt(o.total)}</b>
      <div class="sa-box"><b>${fmt(o.online)}</b><span>${L("Online", "عبر الإنترنت")}</span></div>
      <div class="sa-box"><b>${fmt(o.manual)}</b><span>${L("Manual", "يدوي")}</span></div></div>`;
  const bDonut = (label, o) => {
    const segs = [{ label: L("Online", "عبر الإنترنت"), color: C.teal, value: o.online }, { label: L("Manual", "يدوي"), color: C.amber, value: o.manual }];
    return `<div><div class="t-sm" style="text-align:center;font-weight:var(--weight-semibold);margin-bottom:var(--space-3)">${label}</div>${donut(segs, true)}${pctList(segs, o.total, true)}</div>`;
  };
  const filterRow = (id, active) => `<div class="sa-filters" style="margin-bottom:var(--space-5)">
      ${sel(L("category", "الفئة"), CATS)}${sel(L("activity", "النشاط"), ACTS)}
      <div class="field"><label class="field__label">${L("date type", "نوع التاريخ")}</label>${period(id, active)}</div>
    </div>`;
  rows.push(`<div class="sa-row">
    ${card(statsHead("booking", b.total, L("bookings", "الحجوزات")) +
      `<div class="sa-boxes" style="grid-template-columns:repeat(3,minmax(0,1fr))">${bCol(L("Coming", "قادمة"), b.coming)}${bCol(L("Ended", "منتهية"), b.ended)}${bCol(L("Canceled", "ملغاة"), b.cancelled)}</div>` +
      showAll("bookings"))}
    ${card(chartHead(L("bookings statistics", "إحصائيات الحجوزات"), L("booking statistics for the current month.", "إحصائيات الحجوزات للشهر الحالي.")) +
      filterRow("bookings", "month") +
      `<div class="sa-donuts">${bDonut(L("Coming", "قادمة"), b.coming)}${bDonut(L("Ended", "منتهية"), b.ended)}${bDonut(L("Canceled", "ملغاة"), b.cancelled)}</div>`)}
  </div>`);

  // 6 · Public events
  const e = D.events;
  const eDonut = (caption, segs) => {
    const total = segs.reduce((a, s) => a + s.value, 0);
    return `<div><div class="t-sm" style="text-align:center;font-weight:var(--weight-semibold);margin-bottom:var(--space-3)">${caption} (${fmt(total)})</div>${donut(segs, true)}${pctList(segs, total, false)}</div>`;
  };
  const tri = (a, bb, c) => [{ label: a[0], value: a[1], color: C.amber }, { label: bb[0], value: bb[1], color: C.teal }, { label: c[0], value: c[1], color: C.pink }];
  rows.push(`<div class="sa-row">
    ${card(statsHead("ticket", e.total, L("public events", "الفعاليات العامة")) +
      `<div class="stack gap-2">
        ${boxes([[L("Coming", "قادمة"), e.coming], [L("Ended", "منتهية"), e.ended], [L("Canceled", "ملغاة"), e.cancelled]])}
        ${boxes([[L("Full", "ممتلئة"), e.public_events_status.full], [L("Missing", "مفقودة"), e.public_events_status.missing], [L("Empty", "فارغة"), e.public_events_status.blank]])}
        ${boxes([[L("Joined", "انضم"), e.public_events_players.joined], [L("Left", "غادر"), e.public_events_players.lefted], [L("Removed", "أُزيل"), e.public_events_players.removed]])}
      </div>` +
      showAll("public-events"))}
    ${card(chartHead(L("public events statistics", "إحصائيات الفعاليات العامة"), L("public events statistics for the current month.", "إحصائيات الفعاليات العامة للشهر الحالي.")) +
      filterRow("events", "all") +
      `<div class="sa-donuts">
        ${eDonut(L("public events", "الفعاليات العامة"), tri([L("Coming", "قادمة"), e.coming], [L("Ended", "منتهية"), e.ended], [L("Canceled", "ملغاة"), e.cancelled]))}
        ${eDonut(L("success performance", "أداء النجاح"), tri([L("Full", "ممتلئة"), e.public_events_status.full], [L("Missing", "مفقودة"), e.public_events_status.missing], [L("Empty", "فارغة"), e.public_events_status.blank]))}
        ${eDonut(L("in & out users", "المستخدمون الداخلون والخارجون"), tri([L("Joined", "انضم"), e.public_events_players.joined], [L("Left", "غادر"), e.public_events_players.lefted], [L("Removed", "أُزيل"), e.public_events_players.removed]))}
      </div>`)}
  </div>`);

  document.getElementById("rows").innerHTML = rows.join("");

  /* period toggles: all / year / month swap the picker beside them */
  document.getElementById("rows").addEventListener("click", (ev) => {
    const btn = ev.target.closest(".segmented[data-period] button");
    if (!btn) return;
    const seg = btn.parentElement;
    seg.querySelectorAll("button").forEach((x) => x.classList.toggle("is-active", x === btn));
    const slot = document.querySelector(`[data-picker="${seg.dataset.period}"]`);
    if (slot) slot.innerHTML = picker(btn.dataset.k);
  });

  /* ---------------- toolbar: title + location filter ---------------- */
  document.getElementById("pageTitle").textContent = L("Dashboard", "لوحة القيادة");
  const filterBtn = document.getElementById("filterBtn");
  filterBtn.innerHTML = `${ic("sliders")}<span>${L("Filter", "تصفية")}</span>`;
  document.getElementById("filterPopTitle").textContent = L("Filter Options", "خيارات التصفية");
  document.getElementById("filterReset").textContent = L("Reset", "إعادة تعيين");
  document.getElementById("filterApply").textContent = L("Apply", "تطبيق");

  const GEO = {
    [L("Saudi Arabia", "السعودية")]: { [L("Riyadh Region", "منطقة الرياض")]: [L("Riyadh", "الرياض"), L("Al Kharj", "الخرج")], [L("Makkah Region", "منطقة مكة")]: [L("Jeddah", "جدة"), L("Makkah", "مكة")] },
    [L("Egypt", "مصر")]: { [L("Cairo", "القاهرة")]: [L("Nasr City", "مدينة نصر"), L("Maadi", "المعادي")], [L("Giza", "الجيزة")]: [L("Dokki", "الدقي"), L("6th of October", "السادس من أكتوبر")] },
  };
  const ALL = L("all", "الكل");
  let applied = { country: ALL, state: ALL, city: ALL };
  let draft = Object.assign({}, applied);
  const geoSel = (key, label, opts) => `
    <div class="field"><label class="field__label">${label}</label>
      <div class="select"><select data-geo="${key}">${[ALL].concat(opts).map((o) => `<option ${o === draft[key] ? "selected" : ""}>${o}</option>`).join("")}</select><span class="select__caret">${ic("chevronDown")}</span></div></div>`;
  function paintFields() {
    const states = draft.country !== ALL ? Object.keys(GEO[draft.country]) : [];
    const cities = draft.country !== ALL && draft.state !== ALL ? GEO[draft.country][draft.state] : [];
    document.getElementById("filterFields").innerHTML =
      geoSel("country", L("country:", "البلد:"), Object.keys(GEO)) +
      geoSel("state", L("state:", "الولاية:"), states) +
      geoSel("city", L("city:", "المدينة:"), cities);
  }
  const paintInfo = () => (document.getElementById("filterInfo").textContent = `${applied.country} - ${applied.state} - ${applied.city}`);
  document.getElementById("filterFields").addEventListener("change", (ev) => {
    const k = ev.target.dataset.geo;
    if (!k) return;
    draft[k] = ev.target.value;
    if (k === "country") { draft.state = ALL; draft.city = ALL; }
    if (k === "state") draft.city = ALL;
    paintFields();
  });
  const pop = document.getElementById("filterPop");
  const closePop = () => { pop.classList.remove("is-open"); filterBtn.setAttribute("aria-expanded", "false"); };
  filterBtn.addEventListener("click", (ev) => {
    ev.stopPropagation();
    if (pop.classList.contains("is-open")) return closePop();
    draft = Object.assign({}, applied);
    paintFields();
    const r = filterBtn.getBoundingClientRect();
    pop.style.position = "fixed";
    pop.style.top = r.bottom + 6 + "px";
    pop.classList.add("is-open");
    const left = AR ? r.left : r.right - pop.offsetWidth;
    pop.style.left = Math.min(Math.max(8, left), innerWidth - pop.offsetWidth - 8) + "px";
    filterBtn.setAttribute("aria-expanded", "true");
  });
  document.getElementById("filterReset").addEventListener("click", () => { draft = { country: ALL, state: ALL, city: ALL }; paintFields(); });
  document.getElementById("filterApply").addEventListener("click", () => { applied = Object.assign({}, draft); paintInfo(); closePop(); });
  document.addEventListener("click", (ev) => { if (!pop.contains(ev.target) && ev.target !== filterBtn) closePop(); });
  document.addEventListener("keydown", (ev) => { if (ev.key === "Escape") closePop(); });
  paintInfo();
})();
</script>
</body>
</html>
