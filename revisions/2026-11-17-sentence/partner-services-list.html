  .sa-formrow { display: grid; grid-template-columns: 180px minmax(0, 1fr); gap: var(--space-4); align-items: start; }
  .sa-formrow .field__label { padding-top: var(--space-2); }
  @media (max-width: 640px) { .sa-formrow { grid-template-columns: minmax(0, 1fr); gap: var(--space-1); } }

<body>
<div class="app" id="app">
  <div class="scrim"></div>
  <aside class="sidebar" id="sidebarMount"></aside>
  <div class="main">
    <header class="topbar" id="topbarMount"></header>
    <nav id="topTabsMount"></nav>

    <main class="content"><div class="content__inner" style="max-width:none">
      <div id="pageHead"></div>
      <div id="summary"></div>
      <div id="listMount"></div>
    </div></main>
  </div>
</div>

<script src="assets/js/data.js"></script>
<script src="assets/js/env.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/shell.js"></script>
<script src="assets/js/sa-data.js"></script>
<script src="assets/js/sa-kit.js"></script>
<script src="assets/js/sa-translation.js"></script>
<script src="assets/js/sa-services.js"></script>
<script>
(() => {
  /* Service List → Services — mirrors ServiceListServicesPage.js. Summary card,
     services table and every modal come from assets/js/sa-services.js.
     Demo flag: ?demo=vis-counts — the API's visibility-based counts variant
     (tiles All / Active / Inactive, filtering by visibility).
     Permissions (job keys — demo ?perm=limited | ?perm=none): page view_partner_services
     (PartnersServicesPage) · Add new + every row action update_partner_services
     (ServiceListServicesToolbarWrapper / PartnersServicesTable). */
  RD.boot({ activeId: "partner-services", title: "Services", perm: "view_partner_services" });
  if (!document.getElementById("listMount")) return;
  const { L, ic } = SA;
  const id = +(new URLSearchParams(location.search).get("list") || HF.SA.serviceLists[0].id);
  const list = HF.SA.serviceLists.find((x) => x.id === id) || HF.SA.serviceLists[0];
  SA.head(document.getElementById("pageHead"), {
    title: [`${list.name} · Services`, `الخدمات · ${list.name}`],
    crumbs: [["Partners Lists and Services", "قوائم وخدمات الشركاء", "partner-services.html"]],
    actions: `<a class="btn btn--sm btn--secondary" href="partner-services.html">${ic(document.documentElement.dir === "rtl" ? "chevronRight" : "chevronLeft")}<span>${L("Service Lists", "قوائم الخدمات")}</span></a>
      <button type="button" class="btn btn--sm" id="addSvc" data-perm="update_partner_services">${ic("plus")}<span>${L("Add new", "إضافة جديد")}</span></button>`,
  });
  SV.services(document.getElementById("listMount"), {
    list, data: HF.SA.services.filter((s) => s.service_list.id === list.id),
    summary: document.getElementById("summary"), addButton: document.getElementById("addSvc"),
    translationHref: (s) => `services-translation.html?service=${s.id}&list=${list.id}`,
  });
})();
</script>
</body>
