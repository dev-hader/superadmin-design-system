<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Units · HighFive Super Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Tajawal:wght@300;400;500;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/tokens.css">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/app.css">
<link rel="stylesheet" href="assets/css/components.css">
<link rel="stylesheet" href="assets/shell.css">
<link rel="stylesheet" href="assets/css/skin-v2.css?v=7">
<link rel="stylesheet" href="assets/css/skin-v2-looks.css?v=7">
<style>
  /* ---- redesign (2026-11-17): partners-style head, compact merged columns ---- */
  .un-head { margin-bottom: var(--space-5); }
  #listMount .data-table-toolbar .input-wrap { flex: 1 1 320px; min-width: 0; }
  .un-strong { font-weight: var(--weight-medium); }
  .un-st { display: flex; align-items: center; gap: var(--space-2); flex-wrap: wrap; }
  .un-st + .un-st { margin-top: var(--space-1); }
  .un-st .t-xs { min-width: 4.5em; }
  #listMount .data-table-footer .pagination { flex-wrap: wrap; max-width: 100%; }
</style>
</head>
<body>
<div class="app" id="app">
  <div class="scrim"></div>
  <aside class="sidebar" id="sidebarMount"></aside>
  <div class="main">
    <header class="topbar" id="topbarMount"></header>
    <nav id="topTabsMount"></nav>

    <main class="content"><div class="content__inner" style="max-width:none">
      <div id="pageHead"></div>
      <div id="listMount"></div>
    </div></main>
  </div>
</div>

<script src="assets/js/data.js"></script>
<script src="assets/js/env.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/shell.js"></script>
<script src="assets/js/sa-data.js"></script>
<script src="assets/js/sa-kit.js"></script>
<script src="assets/js/pp/pp-core.js"></script>
<script>
(() => {
  /* Units — mirrors pages/units (list): status pills with counts, search,
     Filter (category · activity · type · capacity · availability · partner
     app status · attendance type), 11 columns, eye → unit profile.
     API: GET /units.
     Redesign (2026-11-17): partners-style head with a live summary, status pills
     as stat tiles, search + Filter (applied-count badge) in one bar; category ·
     activity · type in one column, capacity under the booking methodology, the
     two app statuses in one column. Previous layout:
     revisions/2026-11-17-all-pages/units.html
     Permissions (job keys, as pages/units): page view_units (UnitsPage.js →
     NotHavePermissions); row eye view_unit_details (UnitsTable.js). */
  RD.boot({ activeId: "units", title: "Units", perm: "view_units" });
  if (!document.getElementById("listMount")) return;
  const { L, esc, ic, badge, fmt } = SA;
  const data = HF.SA.units;

  const isPending = (r) => r.status.value === "waiting" || r.status.value === "pending";
  document.getElementById("pageHead").innerHTML = `<div class="un-head animate-in">
      <div>
        <h1 class="t-h3">${L("Units", "الوحدات")}</h1>
        <nav class="t-sm text-tertiary" aria-label="Breadcrumb" style="margin-top:var(--space-1)"><a href="index.html" style="color:inherit">${L("Dashboard", "لوحة القيادة")}</a> › <span>${L("Units", "الوحدات")}</span></nav>
        <p class="t-sm text-secondary" style="margin-top:var(--space-1)">${L(`${fmt(data.length)} units · ${fmt(data.filter(isPending).length)} waiting for approval`, `${fmt(data.length)} وحدة · ${fmt(data.filter(isPending).length)} في انتظار الموافقة`)}</p>
      </div>
    </div>`;

  const tone = (v) => (v === "waiting" || v === "pending" ? "warning" : v === "active" ? "primary" : "danger");
  const label = (v) => ({ waiting: L("Pending", "معلق"), pending: L("Pending", "معلق"), active: L("Approved", "معتمد"), inactive: L("Not approved", "غير معتمد") }[v] || v);
  const initials = (s) => (s || "?").trim().split(/\s+/).map((w) => w[0]).slice(0, 2).join("").toUpperCase();
  const dash = (v) => (v == null || v === "" ? "---" : esc(v));
  const FKEYS = ["category", "activity", "type", "capacity", "availability", "partner_app_status", "attendance_type"];

  let ctl = null;
  ctl = SA.list({
    mount: document.getElementById("listMount"),
    data,
    pills: [
      { key: "all", label: ["All units", "كل الوحدات"], icon: "box", tone: "primary" },
      { key: "waiting", label: ["Pending", "معلق"] },
      { key: "active", label: ["Approved", "معتمد"] },
      { key: "inactive", label: ["Not approved", "غير معتمد"] },
    ],
    pillMatch: (r, k) => k === "all" || (k === "waiting" ? isPending(r) : r.status.value === k),
    search: ["Search by company name or unit name", "البحث باسم الشركة أو الوحدة"],
    searchMatch: (r, q) => r.name.toLowerCase().includes(q) || r.partner.company_name.toLowerCase().includes(q),
    toolbarExtra: (st) => PP.filterBtn(FKEYS.filter((k) => st.extra[k]).length),
    extraMatch: (r, f) =>
      (!f.category || String(r.activity_category.id) === f.category) &&
      (!f.activity || r.activity.name === f.activity) &&
      (!f.type || r.type.name === f.type) &&
      (!f.capacity || r.capacity === f.capacity) &&
      (!f.availability || r.availability.toLowerCase() === f.availability) &&
      (!f.partner_app_status || (r.ownappactive && r.ownappactive.value === f.partner_app_status)) &&
      (!f.attendance_type || r.attendance_type === f.attendance_type),
    empty: ["There is no data to display", "لا توجد بيانات للعرض"],
    columns: [
      { head: ["Unit", "الوحدة"], cell: (r) => `<div class="cell-user"><span class="cell-thumb">${ic("box")}</span>
          <div><b>${esc(r.name)}</b> ${r.attendance_type === "online" ? badge("primary", L("Online", "عبر الإنترنت")) : ""}<div class="t-xs text-tertiary">${esc(r.created_at)}</div></div></div>` },
      { head: ["Company", "الشركة"], cell: (r) => `<div class="cell-user"><span class="avatar avatar--sm">${esc(initials(r.partner.company_name))}</span>
          <div><a href="partner-profile.html?id=${r.partner.id}&tab=owner" style="color:var(--color-text-link);font-weight:var(--weight-semibold)">${esc(r.partner.company_name)}</a><div class="t-xs text-tertiary">${esc(r.partner.created_at)}</div></div></div>` },
      { head: ["Activity", "النشاط"], label: ["Category · activity · type", "الفئة · النشاط · النوع"], cell: (r) => `<b class="un-strong">${dash(r.activity.name)}</b><div class="t-xs text-tertiary">${dash(r.activity_category.name)} · ${dash(r.type.name)}</div>` },
      { head: ["Booking", "الحجز"], label: ["Booking methodology · capacity", "منهجية الحجز · السعة"], cell: (r) => `${dash(r.booking_methodology)}<div class="t-xs text-tertiary">${L("Capacity", "السعة")}: ${dash(r.capacity)}</div>` },
      { head: ["Availability", "التوفر"], align: "center", cell: (r) => (r.availability.toLowerCase() === "available" ? badge("info", L("Available", "متاح")) : badge("danger", L("Maintenance", "صيانة"))) },
      { head: ["App status", "حالة التطبيق"], cell: (r) => `<div class="un-st"><span class="t-xs text-tertiary">${L("HighFive", "هاي فايف")}</span>${badge(tone(r.status.value), label(r.status.value))}</div>
          <div class="un-st"><span class="t-xs text-tertiary">${L("Partner", "الشريك")}</span>${r.partner.is_independent ? (r.ownappactive ? badge(tone(r.ownappactive.value), label(r.ownappactive.value)) : badge("", L("N/A", "غير متاح"))) : `<span class="text-tertiary">---</span>`}</div>` },
      { head: ["Actions", "الإجراءات"], align: "center", cell: (r) => `<a class="icon-btn" href="unit-profile.html?id=${r.id}&tab=details&redirect_to_page=${ctl ? ctl.state.page : 1}" aria-label="${L("View", "عرض")} ${esc(r.name)}" data-tip="${L("View unit", "عرض الوحدة")}" data-perm="view_unit_details">${ic("eye")}</a>` },
    ],
  });

  /* ?page= (the unit profile's Back sends redirect_to_page back here) — read on load, as UnitsTableWrapper does */
  const startPage = +new URLSearchParams(location.search).get("page");
  if (startPage > 1) { ctl.state.page = startPage; ctl.paint(); }

  /* ---------------- Filter Options ---------------- */
  const ALL = L("All", "الكل");
  const pop = document.createElement("div");
  pop.className = "popover";
  pop.setAttribute("role", "dialog");
  pop.style.cssText = "width:300px;max-height:500px;overflow:auto";
  document.body.appendChild(pop);
  let draft = {};
  function paintPop() {
    const o = (v, t, k) => [v, t, String(draft[k] || "") === String(v)];
    const sel = (k, list) => SA.select([o("", ALL, k)].concat(list.map((x) => o(x[0], x[1], k))), `data-f="${k}"`);
    const acts = draft.category ? HF.SA.ACTS[draft.category] : [];
    pop.innerHTML = `<div class="popover__title">${L("Filter options", "خيارات التصفية")}</div>
      <div class="popover__body stack gap-3">
        ${SA.field(["Category", "الفئة"], sel("category", HF.SA.CATS.map((c) => [c.id, c.name])))}
        ${SA.field(["Activity", "النشاط"], sel("activity", acts.map((a) => [a, a])))}
        ${SA.field(["Type", "النوع"], sel("type", HF.SA.TYPES.map((t) => [t, t])))}
        ${SA.field(["Capacity", "السعة"], sel("capacity", HF.SA.CAPS.map((c) => [c, c])))}
        ${SA.field(["Availability", "التوفر"], sel("availability", [["available", L("Available", "متاح")], ["maintenance", L("Maintenance", "صيانة")]]))}
        ${SA.field(["Partner app status", "حالة تطبيق الشريك"], sel("partner_app_status", [["waiting", L("Pending", "معلق")], ["active", L("Approved", "معتمد")], ["inactive", L("Not approved", "غير معتمد")]]))}
        ${SA.field(["Attendance type", "نوع الحضور"], sel("attendance_type", [["online", L("Online", "عبر الإنترنت")], ["onsite", L("Onsite", "حضوري")]]))}
      </div>
      <div class="popover__foot">
        <button type="button" class="btn btn--sm btn--secondary" data-reset>${L("Reset", "إعادة تعيين")}</button>
        <button type="button" class="btn btn--sm" data-apply>${L("Apply", "تطبيق")}</button>
      </div>`;
  }
  pop.addEventListener("change", (e) => {
    const k = e.target.dataset.f;
    if (!k) return;
    draft[k] = e.target.value;
    if (k === "category") draft.activity = "";
    paintPop();
  });
  pop.addEventListener("click", (e) => {
    /* the dashboard's Reset clears the fields AND reloads page 1 */
    if (e.target.closest("[data-reset]")) { draft = {}; ctl.state.extra = {}; ctl.state.page = 1; paintPop(); ctl.paint(); }
    if (e.target.closest("[data-apply]")) { ctl.state.extra = Object.assign({}, draft); ctl.state.page = 1; pop.classList.remove("is-open"); ctl.paint(); }
  });
  document.getElementById("listMount").addEventListener("click", (e) => {
    const b = e.target.closest("[data-filter]");
    if (!b) return;
    if (pop.classList.contains("is-open")) return pop.classList.remove("is-open");
    draft = Object.assign({}, ctl.state.extra);
    paintPop();
    SA.popover(pop, b);
  });
})();
</script>
</body>
</html>
