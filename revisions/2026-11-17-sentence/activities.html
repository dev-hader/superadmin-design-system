<style>
  .sa-hero { display: flex; gap: var(--space-6); flex-wrap: wrap; align-items: flex-start; margin-bottom: var(--space-5); }
  .sa-hero__status { min-width: 260px; flex: 0 1 340px; border-inline-start: var(--border-thin) solid var(--color-border-subtle); padding-inline-start: var(--space-6); }
  @media (max-width: 768px) { .sa-hero__status { border: 0; padding: 0; flex-basis: 100%; } }
  .sa-kv { display: grid; grid-template-columns: minmax(140px, 220px) minmax(0, 1fr); gap: var(--space-3) var(--space-5); margin: 0; }
  .sa-kv dt { color: var(--color-text-tertiary); font-size: var(--text-sm); }
  .sa-kv dd { margin: 0; font-weight: var(--weight-semibold); font-size: var(--text-sm); }
  @media (max-width: 560px) { .sa-kv { grid-template-columns: minmax(0, 1fr); gap: var(--space-1); } .sa-kv dd { margin-bottom: var(--space-2); } }
  .sa-tabbar { margin-bottom: var(--space-6); overflow-x: auto; }
  .sa-tabbar .tabs { flex-wrap: nowrap; white-space: nowrap; }
  .sa-tabbar .tabs > * { display: inline-flex; align-items: center; gap: var(--space-1); }
  .sa-gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: var(--space-4); }
  .sa-tile { margin: 0; border: var(--border-thin) solid var(--color-border); border-radius: var(--radius-lg); overflow: hidden; }
  .sa-tile.is-main { border-color: var(--color-warning); }
  .sa-tile__media { height: 150px; display: grid; place-content: center; justify-items: center; gap: var(--space-1); background: var(--color-surface-sunken); color: var(--color-text-tertiary); }
  .sa-tile figcaption { padding: var(--space-2); justify-content: center; }
  .sa-side { display: grid; grid-template-columns: 200px minmax(0, 1fr); gap: var(--space-6); align-items: start; }
  .sa-side__nav { display: flex; flex-direction: column; gap: var(--space-1); }
  .sa-side__nav a, .sa-side__nav span { display: flex; justify-content: space-between; align-items: center; padding: var(--space-2) var(--space-3); border-radius: var(--radius-md); font-size: var(--text-sm); color: var(--color-text-secondary); }
  .sa-side__nav a.is-active { background: var(--color-primary-subtle); color: var(--color-primary-ink); font-weight: var(--weight-semibold); }
  .sa-side__nav a:hover { background: var(--color-surface-hover); }
  .sa-side__nav .is-locked { opacity: .5; cursor: not-allowed; }
  @media (max-width: 900px) { .sa-side { grid-template-columns: minmax(0, 1fr); } .sa-side__nav { flex-direction: row; flex-wrap: wrap; } }
  .sa-players { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: var(--space-3); }
  .sa-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: var(--space-4); }
  .sa-formrow { display: grid; grid-template-columns: 180px minmax(0, 1fr); gap: var(--space-4); align-items: start; }
  @media (max-width: 640px) { .sa-formrow { grid-template-columns: minmax(0, 1fr); gap: var(--space-1); } }
  /* redesign 2026-11-17 — card list: the SA.list table shown as a grid of cards
     (same rows, search, pager and row actions; the last cell is the card footer) */
  .sa-cards .data-table-scroll { overflow: visible; padding: var(--space-4); background: var(--color-surface-sunken); }
  .sa-cards .data-table { display: block; }
  .sa-cards .data-table thead { display: none; }
  .sa-cards .data-table tbody { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, var(--sa-card-min, 300px)), 1fr)); gap: var(--space-4); }
  .sa-cards .data-table tbody tr { display: flex; flex-direction: column; min-width: 0; background: var(--color-surface); border: var(--border-thin) solid var(--color-border); border-radius: var(--radius-lg); padding: 0; box-shadow: var(--shadow-xs); transition: box-shadow var(--duration-fast); }
  .sa-cards .data-table tbody tr:hover { background: var(--color-surface); box-shadow: var(--shadow-sm); }
  .sa-cards .data-table td { display: block; padding: var(--space-4); border: 0; white-space: normal; text-align: start !important; min-width: 0; }
  .sa-cards .data-table td + td { padding-top: 0; }
  .sa-cards .data-table td::before { content: none !important; }
  .sa-cards .data-table td:last-child:not(:first-child) { margin-top: auto; padding: var(--space-2) var(--space-3); border-top: var(--border-thin) solid var(--color-border-subtle); }
  .sa-cards .data-table td:last-child .row { justify-content: flex-end !important; }
  .sa-cards .data-table tr:has(> td[colspan]) { grid-column: 1 / -1; }
  .sa-cards .data-table td[colspan] { text-align: center !important; }
  .sa-cards--1 .data-table tbody { grid-template-columns: minmax(0, 1fr); gap: var(--space-3); }
  @media (max-width: 640px) { .sa-cards .data-table-scroll { padding: 0; background: transparent; } }
  /* activity category cards */
  .ac-card { display: flex; flex-direction: column; gap: var(--space-4); }
  .ac-card__top { display: flex; align-items: flex-start; gap: var(--space-3); }
  .ac-card__top .cell-thumb { width: 48px; height: 48px; border-radius: var(--radius-md); flex: none; color: var(--color-primary-ink); background: var(--color-primary-subtle); }
  .ac-card__meta { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--space-3); padding: var(--space-3); border-radius: var(--radius-md); background: var(--color-surface-sunken); }
  .ac-card__meta dt { font-size: var(--text-xs); color: var(--color-text-tertiary); margin-bottom: 2px; }
  .ac-card__meta dd { margin: 0; font-weight: var(--weight-semibold); font-variant-numeric: tabular-nums; }
  .ac-link { display: inline-flex; align-items: center; gap: var(--space-1); color: var(--color-text-link); font-weight: var(--weight-semibold); }
  .ac-link svg { width: 14px; height: 14px; }
  .ac-two { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 200px), 1fr)); gap: var(--space-4); }
  .ac-chips { display: flex; flex-wrap: wrap; gap: var(--space-1); justify-content: center; }
</style>

<div class="app" id="app">
  <div class="scrim"></div>
  <aside class="sidebar" id="sidebarMount"></aside>
  <div class="main">
    <header class="topbar" id="topbarMount"></header>
    <nav id="topTabsMount"></nav>

    <main class="content"><div class="content__inner" style="max-width:none">
      <div id="pageHead"></div>
      <div id="listMount"></div>
    </div></main>

<script src="assets/js/data.js"></script>
<script src="assets/js/env.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/shell.js"></script>
<script src="assets/js/sa-data.js"></script>
<script src="assets/js/sa-kit.js"></script>
<script src="assets/js/sa-translation.js"></script>
<script src="assets/js/pp/pp-core.js"></script>
<script>
(() => {
  /* Activities — mirrors pages/activites:
       categories  /activites/categories                         activities.html
       activities  /activites/categories/:catId/activities       ?cat=<id>
       translation …/:itemId/translation                        ?translation=<id>[&cat=<id>]
     Create / Edit / Delete modals with the dashboard's validation; edit / delete feedback is an
     inline alert inside the modal (no toasts), create closes silently. Status pills all · active · inactive.
     Permissions (dashboard job permissions; demo ?perm=limited | ?perm=none): both lists need
     view_activities; on the categories list Add add_activities · Edit update_activities · Delete
     delete_activities. The activities list (?cat=) has no add / edit / delete check in the dashboard
     (activites/ItemsTable.js) and the translation pages none at all — left open here too. */
  const qs = new URLSearchParams(location.search), catId = qs.get("cat"), trId = qs.get("translation");
  RD.boot({ activeId: "activities", title: "activities", perm: trId ? undefined : "view_activities" });
  if (!document.getElementById("listMount")) return;
  const { L, esc, ic, badge } = SA;
  const mount = document.getElementById("listMount");

  /* ---- data (GET /activity-categories, /activity-categories/{id}/activities) ---- */
  const S = HF.SA;
  if (!S._acts) {
    const TYPES = S.TYPES.map((t, i) => ({ id: i + 1, name: t })), CAPS = S.CAPS.map((c, i) => ({ id: i + 1, name: c })), SERV = ["Changing rooms", "Parking", "Lighting", "Coach", "Equipment"].map((s, i) => ({ id: i + 1, name: s }));
    S._opts = { TYPES, CAPS, SERV };
    S._acts = S.CATS.map((c, i) => ({ id: c.id, name: c.name, image: null, created_at: `2026-0${i + 1}-1${i} 10:00:00`, order: i + 1, active: i === 3 ? 0 : 1,
      activities: (S.ACTS[c.id] || []).map((a, j) => ({ id: c.id * 100 + j, name: a, image: null, created_at: `2026-0${i + 1}-2${j} 12:00:00`, order: j + 1, active: j === 3 ? 0 : 1, activity_category_id: c.id,
        types: TYPES.slice(j % 2, (j % 2) + 2), capacities: j % 3 ? CAPS.slice(0, 2) : [], services: SERV.slice(j % 3, (j % 3) + 2) })) }));
  }
  const cats = S._acts, cat = catId ? cats.find((c) => String(c.id) === catId) || cats[0] : null;

  /* ---- translation (shared module) ---- */
  if (trId) {
    const item = cat ? cat.activities.find((a) => String(a.id) === trId) || cat.activities[0] : cats.find((c) => String(c.id) === trId) || cats[0];
    document.getElementById("pageHead").hidden = true;
    SATR.render(mount, { key: (cat ? "activity" : "activity-category") + item.id, itemName: item.name, editTitle: L("Edit translations", "تعديل الترجمات"), cols: [["name", L("Name", "الاسم")]], src: { name: item.name }, backHref: cat ? `activities.html?cat=${cat.id}` : "activities.html" });
    return;
  }

  /* r.image when set (the dashboard falls back to a blank avatar — here the icon) */
  const thumb = (r, icon, style) => (r.image ? `<span class="cell-thumb" style="${style || ""}background:var(--color-surface) center/cover no-repeat url('${esc(r.image)}')" role="img" aria-label="${esc(r.name)}"></span>` : `<span class="cell-thumb"${style ? ` style="${style}"` : ""}>${ic(icon)}</span>`);
  const nameCell = (r) => `<div class="cell-user">${thumb(r, cat ? "star" : "layers")}<div><b>${esc(r.name)}</b><div class="t-xs text-tertiary">${esc(r.created_at)}</div></div></div>`;
  const status = (r) => (r.active ? badge("success", L("Active", "نشط")) : badge("danger", L("Inactive", "غير نشط")));
  const chips = (arr) => (arr.length ? `<div class="ac-chips">${arr.map((x) => badge("", x.name)).join("")}</div>` : `<span class="text-tertiary">---</span>`);
  const actions = (r) => `<div class="row gap-1" style="justify-content:center"><a class="icon-btn" href="activities.html?${cat ? `cat=${cat.id}&` : ""}translation=${r.id}" aria-label="${L("Translation", "الترجمة")}" data-tip="${L("Translation", "الترجمة")}">${ic("globe")}</a>${SA.iconBtn("edit", L("Edit", "تعديل"), `data-edit="${r.id}"${cat ? "" : ' data-perm="update_activities"'}`)}${SA.iconBtn("trash", L("Delete", "حذف"), `data-del="${r.id}"${cat ? "" : ' data-perm="delete_activities"'}`)}</div>`;
  const chev = () => ic(document.documentElement.dir === "rtl" ? "chevronLeft" : "chevronRight");
  /* redesign 2026-11-17: categories render as cards (icon · name · created · order · status ·
     activities link · actions) — same rows, tiles, search and pager as the table */
  const catCard = (r) => `<div class="ac-card"><div class="ac-card__top">${thumb(r, "layers")}<div style="min-width:0;flex:1"><b class="t-title" style="display:block;overflow-wrap:anywhere">${esc(r.name)}</b><span class="t-xs text-tertiary">${esc(r.created_at)}</span></div>${status(r)}</div>
      <dl class="ac-card__meta" style="margin:0"><div><dt>${L("Order", "الترتيب")}</dt><dd>${r.order}</dd></div><div><dt>${L("Activities", "الأنشطة")}</dt><dd>${r.activities.length || 0}</dd></div></dl>
      <a class="ac-link" href="activities.html?cat=${r.id}">${L("View activities", "عرض الأنشطة")}${chev()}</a></div>`;
  if (!cat) mount.classList.add("sa-cards");

  SA.head(document.getElementById("pageHead"), cat
    ? { title: [`${cat.name} activities`, `أنشطة ${cat.name}`], crumbs: [["Activity categories", "فئات الأنشطة", "activities.html"]], actions: PP.btn(L("Add new", "إضافة جديد"), "plus", "data-add") }
    : { title: ["Activity Categories", "فئات الأنشطة"], actions: PP.btn(L("Add new", "إضافة جديد"), "plus", 'data-add data-perm="add_activities"') });
  const data = cat ? cat.activities : cats;
  const ctl = SA.list({
    mount, data,
    pills: [{ key: "all", label: ["All", "الكل"] }, { key: "1", label: ["Active", "نشط"] }, { key: "0", label: ["Inactive", "غير نشط"] }],
    pillMatch: (r, k) => k === "all" || String(r.active) === k,
    search: ["Search by name", "البحث بالاسم"], searchMatch: (r, q) => r.name.toLowerCase().includes(q),
    empty: ["There is no data to display.", "لا توجد بيانات للعرض."],
    /* the dashboard heads the status column "States / المحافظات" (a translation slip) — shown as Status / الحالة */
    columns: cat ? [
      { head: ["Name", "الاسم"], cell: nameCell },
      { head: ["Order", "الترتيب"], align: "center", cell: (r) => `<b style="font-variant-numeric:tabular-nums">${r.order}</b>` },
      { head: ["Type", "النوع"], align: "center", cell: (r) => chips(r.types) },
      { head: ["Capacity", "السعة"], align: "center", cell: (r) => chips(r.capacities) },
      { head: ["Services", "الخدمات"], align: "center", cell: (r) => chips(r.services) },
      { head: ["Status", "الحالة"], align: "center", cell: status },
      { head: ["Actions", "الإجراءات"], align: "center", cell: actions },
    ] : [
      { head: ["Category", "الفئة"], cell: catCard },
      { head: ["Actions", "الإجراءات"], align: "center", cell: actions },
    ],
  });

  /* ---------- Create / Edit ---------- */
  const multi = (k, opts, sel) => `<div class="row gap-3" style="flex-wrap:wrap">${opts.map((o) => `<label class="check"><input type="checkbox" data-m="${k}" value="${o.id}" ${sel.some((s) => s.id === o.id) ? "checked" : ""}><span class="check__box">${ic("check")}</span>${esc(o.name)}</label>`).join("")}</div>`;
  function form(row) {
    const isNew = !row, O = S._opts;
    const title = cat ? (isNew ? L("Create new activity", "إنشاء نشاط جديد") : L("Edit activity", "تعديل النشاط")) : isNew ? L("Create new category", "إنشاء فئة جديدة") : L("Edit category", "تعديل الفئة");
    const el = SA.modal({ id: "acForm", wide: !!cat, title, body: `<div class="stack gap-4"><div data-alert></div>
        <div class="field" style="margin:0"><label class="field__label">${L("Image", "الصورة")}</label><div class="row gap-4" style="align-items:center;padding:var(--space-3);border:var(--border-thin) dashed var(--color-border);border-radius:var(--radius-lg);background:var(--color-surface-sunken)"><span class="cell-thumb" data-thumb style="width:72px;height:72px;border-radius:var(--radius-md);flex:none;background:var(--color-surface);background-size:cover;background-position:center${row && row.image ? `;background-image:url('${esc(row.image)}')` : ""}">${row && row.image ? "" : ic("camera")}</span>
          <div class="stack gap-1" style="min-width:0"><label class="btn btn--sm btn--secondary" style="align-self:flex-start;cursor:pointer">${ic("upload")}<span>${L("Change image", "تغيير الصورة")}</span><input type="file" accept=".png,.jpg,.jpeg" data-img style="position:absolute;inline-size:1px;block-size:1px;opacity:0;pointer-events:none"></label>
          <span class="t-xs text-secondary" data-fname style="overflow-wrap:anywhere">${L("No file chosen", "لم يتم اختيار ملف")}</span><button type="button" class="btn btn--sm btn--ghost" data-imgdel hidden style="align-self:flex-start;color:var(--color-danger)">${ic("trash")}<span>${L("Remove photo", "إزالة الصورة")}</span></button><span class="t-xs text-tertiary">${L("Max size 1MB for images", "الحد الأقصى للصور 1 ميجابايت")}</span><span class="t-xs" style="color:var(--color-warning)">${L("The image should be an icon with a transparent background.", "يجب أن تكون الصورة أيقونة ذات خلفية شفافة.")}</span><span data-e="img"></span></div></div></div>
        <div class="field" style="margin:0"><label class="field__label">${L("Name", "الاسم")}</label><input class="input" data-n value="${esc(row ? row.name : "")}" placeholder="${cat ? L("Enter name", "أدخل الاسم") : L("Enter category name", "أدخل اسم الفئة")}"><span data-e="n"></span></div>
        <div class="ac-two"><div class="field" style="margin:0"><label class="field__label">${L("Order", "الترتيب")}</label><input class="input" type="number" min="1" data-o value="${row ? row.order : ""}" placeholder="${cat ? L("Enter order", "أدخل الترتيب") : L("Enter category order", "أدخل ترتيب الفئة")}"><span data-e="o"></span></div>
        <div class="field" style="margin:0"><label class="field__label">${L("Status", "الحالة")}</label>${SA.select([["", L("Select status", "اختر الحالة"), !row], ["1", L("Active", "نشط"), row && row.active === 1], ["0", L("Inactive", "غير نشط"), row && row.active === 0]], "data-s")}<span data-e="s"></span></div></div>
        ${cat ? `${row ? SA.field(["Category", "الفئة"], SA.select(cats.map((c) => [c.id, c.name, c.id === row.activity_category_id]), "data-cat")) : ""}
          ${SA.field(["Types", "الأنواع"], multi("types", O.TYPES, row ? row.types : []))}${SA.field(["Capacities", "السعات"], multi("capacities", O.CAPS, row ? row.capacities : []))}${SA.field(["Services", "الخدمات"], multi("services", O.SERV, row ? row.services : []))}` : ""}</div>`,
      foot: `<button class="btn btn--ghost" data-close>${L("Cancel", "إلغاء")}</button><button class="btn" data-ok>${isNew ? L("Create", "إنشاء") : L("Update", "تحديث")}</button>` });
    el.querySelector(".modal__foot").style.justifyContent = "space-between";
    const err = (k, m) => (el.querySelector(`[data-e="${k}"]`).innerHTML = m ? `<span class="field__error">${ic("warn")} ${m}</span>` : "");
    /* UploadCropImage: 1MB checked on pick, 1:1 crop, "Remove photo" goes back to the existing image (initialImage) */
    let picked = null;
    const inp = el.querySelector("[data-img]"), box = inp.closest(".row"), th = box.querySelector("[data-thumb]"), rm = box.querySelector("[data-imgdel]");
    const showImg = (url) => { th.style.backgroundImage = url ? `url("${url}")` : ""; th.innerHTML = url ? "" : ic("camera"); };
    const reset = () => { picked = null; inp.value = ""; box.querySelector("[data-fname]").textContent = L("No file chosen", "لم يتم اختيار ملف"); rm.hidden = true; showImg(row && row.image); };
    rm.onclick = reset;
    inp.onchange = async () => {
      const f0 = inp.files[0];
      if (!f0) return;
      if (f0.size > 1024 * 1024) { reset(); return err("img", L("Max size 1MB for images", "الحد الأقصى للصور 1 ميجابايت")); }
      err("img", "");
      const url = await SA.crop(f0, { ratio: 1 });
      if (!url) return reset();
      picked = url; box.querySelector("[data-fname]").textContent = f0.name; rm.hidden = false; showImg(url);
    };
    el.querySelector("[data-ok]").onclick = (e) => {
      const n = el.querySelector("[data-n]").value.trim(), o = el.querySelector("[data-o]").value.trim(), s = el.querySelector("[data-s]").value;
      const REQ = L("This field is required", "هذا الحقل مطلوب"), MIN = L("Minimum 3 symbols", "الحد الأدنى 3 رموز");
      err("n", !n ? REQ : n.length < 2 ? MIN : n.length > 50 ? L("Maximum 50 symbols", "الحد الأقصى 50 رمزًا") : "");
      err("o", !o ? REQ : o.length > 10 ? L("Maximum 10 symbols", "الحد الأقصى 10 رموز") : !/^[0-9]+$/.test(o) ? L("Number is not valid", "الرقم غير صحيح") : "");
      err("s", s === "" ? REQ : "");
      if ([...el.querySelectorAll(".field__error")].some((x) => !x.closest('[data-e="img"]'))) return;
      const b = e.currentTarget; b.disabled = true; b.textContent = isNew ? L("Creating…", "جاري الإنشاء…") : L("Updating…", "جاري التحديث…");
      const pick = (k, src) => [...el.querySelectorAll(`[data-m="${k}"]:checked`)].map((x) => src.find((y) => String(y.id) === x.value));
      setTimeout(() => {
        const vals = { name: n, order: +o, active: +s };
        if (picked) vals.image = picked;
        if (cat) Object.assign(vals, { types: pick("types", S._opts.TYPES), capacities: pick("capacities", S._opts.CAPS), services: pick("services", S._opts.SERV) });
        if (isNew) data.push(Object.assign({ id: Date.now() % 100000, image: null, created_at: "2026-11-15 12:00:00", activities: [], activity_category_id: cat ? cat.id : undefined }, vals));
        else {
          Object.assign(row, vals);
          const to = el.querySelector("[data-cat]");
          if (to && +to.value !== row.activity_category_id) { cat.activities.splice(cat.activities.indexOf(row), 1); row.activity_category_id = +to.value; cats.find((c) => c.id === +to.value).activities.push(row); }
        }
        /* create closes silently (category: onCompleteHide, activity: window.location.reload());
           edit shows the success alert first */
        if (isNew) { SA.close(el); return ctl.paint(); }
        el.querySelector("[data-alert]").innerHTML = `<div class="alert alert--success"><span class="alert__icon">${ic("check")}</span><div class="alert__body">${isNew ? L("Created successfully", "تم الإنشاء بنجاح") : L("Updated successfully", "تم التحديث بنجاح")}</div></div>`;
        setTimeout(() => { SA.close(el); ctl.paint(); }, 1500);
      }, 400);
    };
  }
  function del(row) {
    const el = SA.modal({ id: "acDel", title: L("Delete item", "حذف العنصر"), body: `<div class="stack gap-2"><div data-alert></div><p class="t-sm text-secondary">${L("Please confirm that you want to delete this item", "يرجى تأكيد أنك تريد حذف هذا العنصر")}</p>
        <p class="t-sm" style="color:var(--color-danger)">${L("You can't delete a type that is linked to a unit", "لا يمكنك حذف نوع مرتبط بوحدة")}</p></div>`,
      foot: `<button class="btn btn--secondary" data-close>${L("Cancel", "إلغاء")}</button><button class="btn" data-ok>${L("Confirm", "تأكيد")}</button>` });
    el.querySelector("[data-ok]").onclick = (e) => {
      e.currentTarget.disabled = true;
      setTimeout(() => { data.splice(data.indexOf(row), 1); el.querySelector("[data-alert]").innerHTML = `<div class="alert alert--success"><span class="alert__icon">${ic("check")}</span><div class="alert__body">${L("Deleted successfully", "تم الحذف بنجاح")}</div></div>`;
        setTimeout(() => { SA.close(el); ctl.paint(); }, 1500); }, 400);
    };
  }
  document.addEventListener("click", (e) => {
    const find = (id) => data.find((x) => String(x.id) === String(id));
    if (e.target.closest("[data-add]")) return form(null);
    const ed = e.target.closest("[data-edit]"); if (ed) return form(find(ed.dataset.edit));
    const d = e.target.closest("[data-del]"); if (d) del(find(d.dataset.del));
  });
})();
</script>
</body>
</html>
