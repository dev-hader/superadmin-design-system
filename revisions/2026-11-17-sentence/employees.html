<style>
  .sa-hero { display: flex; gap: var(--space-6); flex-wrap: wrap; align-items: flex-start; margin-bottom: var(--space-5); }
  .sa-hero__status { min-width: 260px; flex: 0 1 340px; border-inline-start: var(--border-thin) solid var(--color-border-subtle); padding-inline-start: var(--space-6); }
  @media (max-width: 768px) { .sa-hero__status { border: 0; padding: 0; flex-basis: 100%; } }
  .sa-kv { display: grid; grid-template-columns: minmax(140px, 220px) minmax(0, 1fr); gap: var(--space-3) var(--space-5); margin: 0; }
  .sa-kv dt { color: var(--color-text-tertiary); font-size: var(--text-sm); }
  .sa-kv dd { margin: 0; font-weight: var(--weight-semibold); font-size: var(--text-sm); }
  @media (max-width: 560px) { .sa-kv { grid-template-columns: minmax(0, 1fr); gap: var(--space-1); } .sa-kv dd { margin-bottom: var(--space-2); } }
  .sa-tabbar { margin-bottom: var(--space-6); overflow-x: auto; }
  .sa-tabbar .tabs { flex-wrap: nowrap; white-space: nowrap; }
  .sa-tabbar .tabs > * { display: inline-flex; align-items: center; gap: var(--space-1); }
  .sa-gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: var(--space-4); }
  .sa-tile { margin: 0; border: var(--border-thin) solid var(--color-border); border-radius: var(--radius-lg); overflow: hidden; }
  .sa-tile.is-main { border-color: var(--color-warning); }
  .sa-tile__media { height: 150px; display: grid; place-content: center; justify-items: center; gap: var(--space-1); background: var(--color-surface-sunken); color: var(--color-text-tertiary); }
  .sa-tile figcaption { padding: var(--space-2); justify-content: center; }
  .sa-side { display: grid; grid-template-columns: 200px minmax(0, 1fr); gap: var(--space-6); align-items: start; }
  .sa-side__nav { display: flex; flex-direction: column; gap: var(--space-1); }
  .sa-side__nav a, .sa-side__nav span { display: flex; justify-content: space-between; align-items: center; padding: var(--space-2) var(--space-3); border-radius: var(--radius-md); font-size: var(--text-sm); color: var(--color-text-secondary); }
  .sa-side__nav a.is-active { background: var(--color-primary-subtle); color: var(--color-primary-ink); font-weight: var(--weight-semibold); }

  .sa-side__nav .is-locked { opacity: .5; cursor: not-allowed; }
  @media (max-width: 900px) { .sa-side { grid-template-columns: minmax(0, 1fr); } .sa-side__nav { flex-direction: row; flex-wrap: wrap; } }
  .sa-players { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: var(--space-3); }

  .sa-formrow { display: grid; grid-template-columns: 180px minmax(0, 1fr); gap: var(--space-4); align-items: start; }

  /* ---- redesign 2026-11-17: global list layer (same composition as partners.html) ---- */
  .ops-head { display: flex; align-items: flex-end; justify-content: space-between; gap: var(--space-4); flex-wrap: wrap; margin-bottom: var(--space-6); }

<script>
(() => {
  /* Employees — mirrors pages/emploayees (list): add new, pills (all · active ·
     inactive), search by name / phone / email, Filter (country · job), 7 columns,
     row actions reset password · edit · delete. All feedback is inline alerts
     inside the modals (no toasts), as in the dashboard. Every modal is
     backdrop='static' keyboard={false} (only Cancel / × close it).
     API: GET /employees?search=&country=<ISO>&job_id=&active=1|0&page=&limit=
          POST /employees  multipart {name, image, email, phone, phone_code, country_iso, active, job_id}
          POST /employees/{id}  same fields + _method=put
          GET /general/countries (country select + phone codes) · GET /jobs (form) · GET /general/jobs (filter)
          POST /employees/set-password · DELETE /employees/{id}
     Permissions (dashboard job keys — data-perm, demo ?perm=limited | ?perm=none):
       page view_employees · Add new add_employees · reset password + edit update_employees ·
       delete delete_employees */
  RD.boot({ activeId: "emp-list", title: "Employees", perm: "view_employees" });
  if (!document.getElementById("listMount")) return;
  const { L, esc, ic, badge } = SA;
  const S = HF.SA, data = S.employees;
  const mount = document.getElementById("listMount");
  const dash = (v) => (v == null || v === "" ? "---" : esc(v));
  const countries = [...new Map(S.GEO.map((g) => [g.country.iso, g.country.name])).entries()];
  /* GET /general/countries stand-in: { iso, name, phone_code } per country (S.GEO) */
  const PHONE = { SA: "+966", EG: "+20", AE: "+971" };
  const GEN_COUNTRIES = countries.map(([iso, name]) => ({ iso, name, phone_code: PHONE[iso] || "" }));
  const STATUS = (v) => (v === 1 ? badge("primary", L("Active", "نشط")) : badge("danger", L("Inactive", "غير نشط")));

  /* Redesign (2026-11-17) — same data, pills, search, filter, fields, actions and
     modals; laid out like partners.html: head with a live summary + the add action,
     status tiles, search + Filter bar with removable chips, phone + email in one
     Contact column; the form puts each label above its field (as the CRUD form)
     in a two-column grid with a designed image picker. */
  OPS.head(document.getElementById("pageHead"), { title: ["Employees", "الموظفين"],
    sub: L(`${SA.fmt(data.length)} employees · ${data.filter((r) => r.active === 1).length} active · ${S.jobs.length} jobs`, `${SA.fmt(data.length)} موظف · ${data.filter((r) => r.active === 1).length} نشط · ${S.jobs.length} وظائف`),
    actions: `<button type="button" class="btn" data-add data-perm="add_employees">${ic("plus")}<span>${L("Add new", "إضافة جديد")}</span></button>` });
  const fx = OPS.filters([
    { keys: ["country"], label: ["Country", "البلد"], value: (f) => OPS.opt(countries, f.country) },
    { keys: ["job_id"], label: ["Job", "الوظيفة"], value: (f) => OPS.opt(S.jobs.map((j) => [String(j.id), j.name]), f.job_id) },
  ]);
  const ctl = SA.list({
    mount, data,
    pills: [{ key: "all", label: ["All employees", "كل الموظفين"], icon: "users", tone: "" }, { key: "1", label: ["Active", "نشط"], icon: "check", tone: "primary" }, { key: "0", label: ["Inactive", "غير نشط"], icon: "close", tone: "danger" }],
    pillMatch: (r, k) => k === "all" || String(r.active) === k,
    search: ["Search by name, phone, or email", "البحث بالاسم أو الهاتف أو البريد الإلكتروني"],
    searchMatch: (r, q) => [r.name, r.phone, r.email].some((v) => v.toLowerCase().includes(q)),
    toolbarExtra: fx.toolbarExtra, after: fx.after,
    extraMatch: (r, f) => (!f.country || r.country.iso === f.country) && (!f.job_id || String(r.job.id) === f.job_id),
    empty: ["There is no data to display.", "لا توجد بيانات للعرض."],
    columns: [
      { head: ["Name", "الاسم"], cell: (r) => `<div class="cell-user">${PP.avatar(r.name)}<div><b>${esc(r.name)}</b><div class="t-xs text-tertiary">${esc(r.created_at)}</div></div></div>` },
      { head: ["Contact", "التواصل"], label: ["Phone · email", "الهاتف · البريد الإلكتروني"], cell: (r) => `<div class="ops-two"><b dir="ltr" style="text-align:start">${dash(r.phone)}</b><span class="t-xs text-tertiary">${dash(r.email)}</span></div>` },
      { head: ["Job", "الوظيفة"], cell: (r) => (r.job ? `<span class="chip">${esc(r.job.name)}</span>` : "---") },
      { head: ["Country", "البلد"], cell: (r) => dash(r.country.name) },
      { head: ["Status", "الحالة"], align: "center", cell: (r) => STATUS(r.active) },
      { head: ["Actions", "الإجراءات"], align: "center", cell: (r) => `<div class="row gap-1" style="justify-content:center">${SA.iconBtn("lock", L("Reset password", "إعادة تعيين كلمة المرور"), `data-pass="${r.id}" data-perm="update_employees"`)}${SA.iconBtn("edit", L("Edit employee", "تعديل موظف"), `data-edit="${r.id}" data-perm="update_employees"`)}${SA.iconBtn("trash", L("Delete item", "حذف العنصر"), `data-del="${r.id}" data-perm="delete_employees"`)}</div>` },
    ],
  });
  fx.bind(mount, ctl);

  /* ---------- helpers ---------- */
  const errBox = (el, k, m) => (el.querySelector(`[data-e="${k}"]`).innerHTML = m ? `<span class="field__error">${ic("warn")} ${m}</span>` : "");
  /* label above its field (sa-crud form) */
  const row = (label, control, k, o) => `<div class="field" style="margin:0${o && o.wide ? ";grid-column:1/-1" : ""}"><label class="field__label">${label}${o && o.req ? ' <span class="req">*</span>' : ""}</label>${control}<span data-e="${k}"></span></div>`;
  const REQ = L("This field is required", "هذا الحقل مطلوب"), MIN3 = L("Minimum 3 symbols", "الحد الأدنى 3 رموز"), MAX50 = L("Maximum 50 symbols", "الحد الأقصى 50 رمز");
  const PHONE_RE = /^(\+?\d{0,4})?\s?-?\s?(\(?\d{3}\)?)\s?-?\s?(\(?\d{3}\)?)\s?-?\s?(\(?\d{4}\)?)?$/;

  /* ---------- Create / Edit employee ---------- */
  function form(emp) {
    const isNew = !emp, codes = [...new Set(GEN_COUNTRIES.map((c) => c.phone_code).filter(Boolean))];
    /* UploadCropImage (showDelete): pick → size check (1MB) → 1:1 crop → preview; "Remove photo" clears it */
    let img = emp && emp.image ? emp.image : null, removed = false;
    const picker = `<div class="row gap-4" style="align-items:center;padding:var(--space-3);border:var(--border-thin) dashed var(--color-border);border-radius:var(--radius-lg);background:var(--color-surface-sunken)">
        <span class="cell-thumb" data-thumb style="width:72px;height:72px;border-radius:var(--radius-md);flex:none;background:var(--color-surface);background-size:cover;background-position:center"></span>
        <div class="stack gap-1" style="min-width:0">
          <div class="row gap-2" style="flex-wrap:wrap">
            <label class="btn btn--sm btn--secondary" style="cursor:pointer;position:relative">${ic("upload")}<span>${L("Change image", "تغيير الصورة")}</span><input type="file" accept=".png,.jpg,.jpeg" data-img style="position:absolute;inline-size:1px;block-size:1px;opacity:0;pointer-events:none"></label>
            <button type="button" class="btn btn--sm btn--ghost" data-rm hidden>${ic("trash")}<span>${L("Remove photo", "إزالة الصورة")}</span></button>
          </div>
          <span class="t-xs text-secondary" data-fname style="overflow-wrap:anywhere">${L("No file chosen", "لم يتم اختيار ملف")}</span>
          <span class="t-xs text-tertiary">${L("Max size 1MB for images", "الحد الأقصى للصور 1 ميجابايت")}</span></div></div>`;
    const el = SA.modal({ id: "empForm", wide: true, static: true, title: isNew ? L("Create employee", "إنشاء موظف") : L("Edit employee", "تعديل موظف"), body: `<div class="stack gap-4"><div data-alert></div>
        <div class="emp-form">
        ${row(L("Image", "الصورة"), picker, "img", { wide: true })}
        ${row(L("Name", "الاسم"), `<input class="input" data-f="name" value="${esc(emp ? emp.name : "")}" placeholder="${L("Enter name", "أدخل الاسم")}">`, "name")}
        ${row(L("Email", "البريد الإلكتروني"), `<input class="input" data-f="email" value="${esc(emp ? emp.email : "")}" placeholder="${L("Enter email address", "أدخل البريد الإلكتروني")}">`, "email")}
        ${row(L("Phone", "الهاتف"), `<div class="row gap-2" dir="ltr">${SA.select(codes.map((c) => [c, c, emp ? emp.phone_code === c : c === codes[0]]), 'data-f="code" style="width:110px" aria-label="' + L("Phone code", "رمز الهاتف") + '"')}<input class="input" data-f="phone" value="${esc(emp ? emp.phone : "")}" placeholder="${L("Enter phone", "أدخل الهاتف")}" style="flex:1;min-width:0"></div>`, "phone")}
        ${row(L("Job", "الوظيفة"), SA.select(S.jobs.map((j, i) => [j.id, j.name, emp ? emp.job.id === j.id : i === 0]), 'data-f="job"'), "job")}
        ${row(L("Country", "البلد"), SA.select(GEN_COUNTRIES.map((c, i) => [c.iso, c.name, emp ? emp.country.iso === c.iso : i === 0]), 'data-f="country"'), "country")}
        ${row(L("Status", "الحالة"), SA.select([["1", L("Active", "نشط"), !emp || emp.active === 1], ["0", L("Inactive", "غير نشط"), emp && emp.active === 0]], 'data-f="active"'), "active")}</div></div>`,
      foot: `<button class="btn btn--ghost" data-close>${L("Cancel", "إلغاء")}</button><button class="btn" data-ok>${isNew ? L("Create", "إنشاء") : L("Update", "تحديث")}</button>` });
    el.querySelector(".modal__foot").style.justifyContent = "space-between";
    const paintImg = () => {
      const th = el.querySelector("[data-thumb]");
      th.style.backgroundImage = img ? `url("${img}")` : "";
      th.innerHTML = img ? "" : emp && !removed ? esc(PP.initials(emp.name)) : ic("camera");
      el.querySelector("[data-rm]").hidden = !img;
    };
    paintImg();
    el.querySelector("[data-img]").onchange = (e) => {
      const input = e.target, file = input.files[0], big = file && file.size > 1024 * 1024;
      errBox(el, "img", big ? L("Max size 1MB for images", "الحد الأقصى للصور 1 ميجابايت") : "");
      if (!file || big) { input.value = ""; return; }
      SA.crop(file, { ratio: 1 }).then((url) => {
        input.value = "";
        if (!url) return;
        img = url; removed = false;
        el.querySelector("[data-fname]").textContent = file.name;
        paintImg();
      });
    };
    el.querySelector("[data-rm]").onclick = () => { img = null; removed = true; el.querySelector("[data-fname]").textContent = L("No file chosen", "لم يتم اختيار ملف"); paintImg(); };
    el.querySelector("[data-ok]").onclick = (e) => {
      const v = (k) => el.querySelector(`[data-f="${k}"]`).value.trim();
      const n = v("name"), m = v("email"), p = v("phone");
      errBox(el, "name", !n ? REQ : n.length < 3 ? MIN3 : n.length > 50 ? MAX50 : "");
      errBox(el, "email", !m ? REQ : !/^\S+@\S+\.\S+$/.test(m) ? L("Wrong email format", "تنسيق البريد الإلكتروني خاطئ") : m.length > 50 ? MAX50 : "");
      errBox(el, "phone", !p ? REQ : !PHONE_RE.test(p) ? L("Phone number is not valid", "رقم الهاتف غير صحيح") : "");
      if (el.querySelector(".field__error")) return;
      const b = e.currentTarget; b.disabled = true; b.textContent = isNew ? L("Creating ...", "جاري الإنشاء ...") : L("Updating ...", "جاري التحديث ...");
      setTimeout(() => {
        const job = S.jobs.find((j) => String(j.id) === v("job")), c = GEN_COUNTRIES.find((x) => x.iso === v("country"));
        const vals = { name: n, email: m, phone: p, phone_code: v("code"), job, country: { iso: c.iso, name: c.name }, active: +v("active"), image: img };
        if (isNew) data.unshift(Object.assign({ id: Math.max(...data.map((x) => x.id)) + 1, created_at: "2026-11-16 10:00:00" }, vals)); else Object.assign(emp, vals);
        SA.close(el); ctl.paint(); /* success is silent in the dashboard */
      }, 400);
    };
  }
  /* ---------- Reset password — POST /employees/set-password ---------- */
  function pass(emp) {
    const el = SA.modal({ id: "empPass", static: true, title: L("Reset password", "إعادة تعيين كلمة المرور"), body: `<div class="stack gap-4"><div data-alert></div>
        <div class="field"><label class="field__label">${L("New password", "كلمة المرور الجديدة")}</label><input class="input" type="password" data-p placeholder="${L("Enter new password", "أدخل كلمة المرور الجديدة")}"><span data-e="p"></span></div>
        <div class="field"><label class="field__label">${L("Confirm new password", "تأكيد كلمة المرور الجديدة")}</label><input class="input" type="password" data-c placeholder="${L("Enter confirm new password", "أدخل تأكيد كلمة المرور الجديدة")}"><span data-e="c"></span></div></div>`,
      foot: `<button class="btn btn--ghost" data-close>${L("Cancel", "إلغاء")}</button><button class="btn" data-ok>${L("Update", "تحديث")}</button>` });
    el.querySelector("[data-ok]").onclick = (e) => {
      const p = el.querySelector("[data-p]").value, c = el.querySelector("[data-c]").value;
      const len = (x) => (x.length < 8 ? L("Minimum 8 symbols", "الحد الأدنى 8 رموز") : x.length > 50 ? MAX50 : "");
      errBox(el, "p", !p ? L("Password is required", "كلمة المرور مطلوبة") : len(p));
      errBox(el, "c", !c ? L("Password confirmation is required", "تأكيد كلمة المرور مطلوب") : len(c) || (c !== p ? L("Password and confirm password didn't match", "كلمة المرور وتأكيد كلمة المرور غير متطابقتين") : ""));
      if (el.querySelector(".field__error")) return;
      const b = e.currentTarget; b.disabled = true; b.textContent = L("Updating ...", "جاري التحديث ...");
      setTimeout(() => SA.close(el), 400);
    };
  }
  /* ---------- Delete — DELETE /employees/{id} ---------- */
  function del(emp) {
    const el = SA.modal({ id: "empDel", static: true, title: L("Delete item", "حذف العنصر"), body: `<p class="t-sm text-secondary">${L("Please confirm that you want to delete this item", "يرجى تأكيد أنك تريد حذف هذا العنصر")}</p>`,
      foot: `<button class="btn btn--ghost" data-close>${L("Cancel", "إلغاء")}</button><button class="btn btn--danger" data-ok>${L("Confirm", "تأكيد")}</button>` });
    el.querySelector("[data-ok]").onclick = (e) => { e.currentTarget.disabled = true; e.currentTarget.textContent = L("Confirming ...", "جاري التأكيد ..."); setTimeout(() => { data.splice(data.indexOf(emp), 1); SA.close(el); ctl.paint(); }, 400); };
  }

  document.addEventListener("click", (e) => {
    const find = (id) => data.find((x) => String(x.id) === id);
    if (e.target.closest("[data-add]")) return form(null);
    const t = e.target.closest("[data-pass],[data-edit],[data-del]");
    if (t) return t.dataset.pass ? pass(find(t.dataset.pass)) : t.dataset.edit ? form(find(t.dataset.edit)) : del(find(t.dataset.del));
    const fb = e.target.closest("[data-filter]");
    if (fb) PP.filterPop(fb, { width: 300, value: ctl.state.extra, fields: [
      { key: "country", label: ["Country", "البلد"], placeholder: ["Select country", "اختر البلد"], options: () => GEN_COUNTRIES.map((c) => [c.iso, c.name]) },
      { key: "job_id", label: ["Job", "الوظيفة"], placeholder: ["Select job", "اختر الوظيفة"], options: () => S.jobs.map((j) => [String(j.id), j.name]) },
    ], onApply: (d) => { ctl.state.extra = d; ctl.state.page = 1; ctl.paint(); } });
  });
})();
</script>
</body>
</html>
