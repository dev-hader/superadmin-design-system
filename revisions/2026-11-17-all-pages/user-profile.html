<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>user profile · HighFive Super Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Tajawal:wght@300;400;500;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/tokens.css">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/app.css">
<link rel="stylesheet" href="assets/css/components.css">
<link rel="stylesheet" href="assets/shell.css">
<style>
  .sa-hero { display: flex; gap: var(--space-6); flex-wrap: wrap; align-items: flex-start; margin-bottom: var(--space-5); }
  .sa-hero__status { min-width: 260px; flex: 0 1 340px; border-inline-start: var(--border-thin) solid var(--color-border-subtle); padding-inline-start: var(--space-6); }
  @media (max-width: 768px) { .sa-hero__status { border: 0; padding: 0; flex-basis: 100%; } }
  .sa-kv { display: grid; grid-template-columns: minmax(140px, 220px) minmax(0, 1fr); gap: var(--space-3) var(--space-5); margin: 0; }
  .sa-kv dt { color: var(--color-text-tertiary); font-size: var(--text-sm); }
  .sa-kv dd { margin: 0; font-weight: var(--weight-semibold); font-size: var(--text-sm); }
  @media (max-width: 560px) { .sa-kv { grid-template-columns: minmax(0, 1fr); gap: var(--space-1); } .sa-kv dd { margin-bottom: var(--space-2); } }
  .sa-tabbar { margin-bottom: var(--space-6); overflow-x: auto; }
  .sa-tabbar .tabs { flex-wrap: nowrap; white-space: nowrap; }
  .sa-tabbar .tabs > * { display: inline-flex; align-items: center; gap: var(--space-1); }
  .sa-gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: var(--space-4); }
  .sa-tile { margin: 0; border: var(--border-thin) solid var(--color-border); border-radius: var(--radius-lg); overflow: hidden; }
  .sa-tile.is-main { border-color: var(--color-warning); }
  .sa-tile__media { height: 150px; display: grid; place-content: center; justify-items: center; gap: var(--space-1); background: var(--color-surface-sunken); color: var(--color-text-tertiary); }
  .sa-tile figcaption { padding: var(--space-2); justify-content: center; }
  .sa-side { display: grid; grid-template-columns: 200px minmax(0, 1fr); gap: var(--space-6); align-items: start; }
  .sa-side__nav { display: flex; flex-direction: column; gap: var(--space-1); }
  .sa-side__nav a, .sa-side__nav span { display: flex; justify-content: space-between; align-items: center; padding: var(--space-2) var(--space-3); border-radius: var(--radius-md); font-size: var(--text-sm); color: var(--color-text-secondary); }
  .sa-side__nav a.is-active { background: var(--color-primary-subtle); color: var(--color-primary-ink); font-weight: var(--weight-semibold); }
  .sa-side__nav a:hover { background: var(--color-surface-hover); }
  .sa-side__nav .is-locked { opacity: .5; cursor: not-allowed; }
  @media (max-width: 900px) { .sa-side { grid-template-columns: minmax(0, 1fr); } .sa-side__nav { flex-direction: row; flex-wrap: wrap; } }
  .sa-players { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: var(--space-3); }
  .sa-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: var(--space-4); }
  .sa-formrow { display: grid; grid-template-columns: 180px minmax(0, 1fr); gap: var(--space-4); align-items: start; }
  @media (max-width: 640px) { .sa-formrow { grid-template-columns: minmax(0, 1fr); gap: var(--space-1); } }
</style>
</head>
<body>
<div class="app" id="app">
  <div class="scrim"></div>
  <aside class="sidebar" id="sidebarMount"></aside>
  <div class="main">
    <header class="topbar" id="topbarMount"></header>
    <nav id="topTabsMount"></nav>

    <main class="content"><div class="content__inner" style="max-width:none">
      <div id="pageHead"></div>
      <div id="usHero"></div>
      <div id="usTabs"></div>
      <div id="usBody"></div>
    </div></main>
  </div>
</div>

<script src="assets/js/data.js"></script>
<script src="assets/js/env.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/shell.js"></script>
<script src="assets/js/sa-data.js"></script>
<script src="assets/js/sa-kit.js"></script>
<script src="assets/js/pp/pp-core.js"></script>
<script src="assets/js/pp/pp-info.js"></script>
<script src="assets/js/pp/pp-ops.js"></script>
<script src="assets/js/kp/kp-info.js"></script>
<script src="assets/js/kp/kp-ops.js"></script>
<script src="assets/js/us/us-tabs.js"></script>
<script src="assets/js/us/us-wallet.js"></script>
<script>
(() => {
  /* User profile — mirrors pages/users/profile (ProfilePage + header/ProfileHeader
     + EditStatusModal): title "user profile", back (keeps redirect_to_page),
     hero (photo · name · (username) · bio · country · gender · age · wallet) with
     the user-status block, and the 8 tabs. Tabs: assets/js/us/*.js.
     URL: user-profile.html?id=<userId>&tab=<key>[&redirect_to_page=…] */
  RD.boot({ activeId: "users", title: "user profile" });
  if (!document.getElementById("usBody")) return;
  const { L, esc, ic, badge } = SA;
  const qs = new URLSearchParams(location.search);
  const user = HF.SA.users.find((x) => String(x.id) === qs.get("id")) || HF.SA.users[0];
  US.user = user;

  const back = `users.html${qs.get("redirect_to_page") ? "?page=" + qs.get("redirect_to_page") : ""}`;
  SA.head(document.getElementById("pageHead"), {
    title: ["user profile", "ملف المستخدم الشخصي"],
    crumbs: [["Users", "المستخدمون", "users.html"]],
    actions: `<a class="btn btn--sm btn--secondary" href="${back}">${ic(document.documentElement.dir === "rtl" ? "chevronRight" : "chevronLeft")}<span>${L("back", "رجوع")}</span></a>`,
  });

  /* ---------- hero (no phone / email here — as in the dashboard) ---------- */
  function hero() {
    const u = user;
    document.getElementById("usHero").innerHTML = `<section class="card card--pad animate-in sa-hero">
      <div class="row gap-5" style="align-items:flex-start;flex-wrap:wrap;flex:1;min-width:280px">
        <span class="avatar" style="width:120px;height:120px;font-size:var(--text-h3);border-radius:var(--radius-lg)">${esc(PP.initials(u.name))}</span>
        <div class="stack gap-1" style="flex:1;min-width:200px">
          <h2 class="t-h3">${esc(u.name)}</h2>
          ${u.high_five_user_name ? `<span class="t-sm text-tertiary">(${esc(u.high_five_user_name)})</span>` : ""}
          ${u.biography ? `<p class="t-sm text-tertiary">${esc(u.biography)}</p>` : ""}
          <span class="t-sm text-tertiary" style="font-weight:var(--weight-semibold)">${esc(u.country.name)}</span>
          <span class="t-sm text-secondary">${esc(u.gender)}<br>${u.age || 0} ${L("years", "سنوات")}</span>
          <span class="t-sm"><b>${u.wallet_amount || 0}</b> ${esc(u.country.currency.code)}</span>
        </div>
      </div>
      <div class="sa-hero__status">
        <div class="row between gap-3" style="align-items:center;margin-bottom:var(--space-3)"><b>${L("user Status :", "حالة المستخدم:")}</b>
          ${SA.iconBtn("edit", L("update status", "تحديث الحالة"), 'id="usEditStatus"')}</div>
        <dl class="sa-kv" style="grid-template-columns:auto minmax(0,1fr)">
          <dt>${L("Status:", "الحالة:")}</dt><dd>${u.status === 0 ? badge("danger", L("blocked", "محظور")) : badge("primary", L("active", "نشط"))}</dd>
          <dt>${L("Action By:", "الإجراء بواسطة:")}</dt><dd>${u.status_action_by ? esc(u.status_action_by.name) : "---"}</dd>
          <dt>${L("Action On:", "الإجراء في:")}</dt><dd>${u.status_action_at ? esc(u.status_action_at) : "---"}</dd>
        </dl></div></section>`;
    /* update status — PUT /users/{id}/update-status {status}; no toast, in-modal alert on error */
    document.getElementById("usEditStatus").onclick = () => {
      const el = SA.modal({ id: "usSt", title: L("update status", "تحديث الحالة"), body: SA.field(["status:", "الحالة:"], SA.select([["0", L("blocked", "محظور"), user.status === 0], ["1", L("active", "نشط"), user.status !== 0]], "data-s")),
        foot: `<button class="btn btn--ghost" data-close>${L("cancel", "إلغاء")}</button><button class="btn" data-ok>${L("update", "تحديث")}</button>` });
      el.querySelector("[data-ok]").onclick = (e) => {
        const b = e.currentTarget; b.disabled = true; b.textContent = L("update ...", "جاري التحديث...");
        setTimeout(() => { user.status = +el.querySelector("[data-s]").value; user.status_action_by = { name: "Super Admin" }; user.status_action_at = "2026-11-15 12:00:00"; SA.close(el); hero(); }, 400);
      };
    };
  }
  US.refreshHero = hero;

  /* ---------- tabs ---------- */
  const TABS = [["details", "info", "معلومات"], ["bookings", "bookings", "الحجوزات"], ["multi-bookings", "multi-bookings", "الحجوزات المتعددة"], ["public-events", "public events", "الأحداث العامة"],
    ["packages", "Packages", "الباقات"], ["wallet", "wallet", "محفظة"], ["comments", "comments", "تعليقات"], ["notes", "notes", "ملحوظات"]];
  function href(key, extra) {
    const u = new URLSearchParams();
    u.set("id", user.id); u.set("tab", key);
    if (qs.get("redirect_to_page")) u.set("redirect_to_page", qs.get("redirect_to_page"));
    Object.entries(extra || {}).forEach(([k, v]) => v != null && u.set(k, v));
    return "?" + u.toString();
  }
  US.href = href;
  PP.href = href; /* the shared booking / event views and notes build links through PP.href */
  const tabsBar = (active) => (document.getElementById("usTabs").innerHTML = `<nav class="sa-tabbar" aria-label="${L("User sections", "أقسام المستخدم")}"><div class="tabs">
      ${TABS.map((t) => `<a href="${href(t[0])}" class="${t[0] === active ? "is-active" : ""}" ${t[0] === active ? 'aria-current="page"' : ""}>${esc(L(t[1], t[2]))}</a>`).join("")}</div></nav>`);

  function render() {
    const u = new URLSearchParams(location.search), tab = TABS.some((t) => t[0] === u.get("tab")) ? u.get("tab") : "details";
    tabsBar(tab);
    const a = document.querySelector("#usTabs .is-active"); if (a) a.scrollIntoView({ block: "nearest", inline: "nearest" });
    const body = document.createElement("div");
    body.className = "stack gap-6";
    document.getElementById("usBody").replaceChildren(body);
    US.tabs[tab](body, { user, params: u, rerender: render });
    window.scrollTo({ top: 0 });
  }
  document.addEventListener("click", (e) => {
    const a = e.target.closest("a[href^='?']");
    if (!a || e.metaKey || e.ctrlKey || e.button) return;
    e.preventDefault();
    history.pushState(null, "", a.getAttribute("href"));
    render();
  });
  window.addEventListener("popstate", render);
  hero();
  render();
})();
</script>
</body>
</html>
