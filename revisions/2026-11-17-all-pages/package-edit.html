<link rel="stylesheet" href="assets/css/base.css">

<style>
  .sa-hero { display: flex; gap: var(--space-6); flex-wrap: wrap; align-items: flex-start; margin-bottom: var(--space-5); }
  .sa-hero__status { min-width: 260px; flex: 0 1 340px; border-inline-start: var(--border-thin) solid var(--color-border-subtle); padding-inline-start: var(--space-6); }
  @media (max-width: 768px) { .sa-hero__status { border: 0; padding: 0; flex-basis: 100%; } }
  .sa-kv { display: grid; grid-template-columns: minmax(140px, 220px) minmax(0, 1fr); gap: var(--space-3) var(--space-5); margin: 0; }
  .sa-kv dt { color: var(--color-text-tertiary); font-size: var(--text-sm); }
  .sa-kv dd { margin: 0; font-weight: var(--weight-semibold); font-size: var(--text-sm); }
  @media (max-width: 560px) { .sa-kv { grid-template-columns: minmax(0, 1fr); gap: var(--space-1); } .sa-kv dd { margin-bottom: var(--space-2); } }
  .sa-tabbar { margin-bottom: var(--space-6); overflow-x: auto; }
  .sa-tabbar .tabs { flex-wrap: nowrap; white-space: nowrap; }
  .sa-tabbar .tabs > * { display: inline-flex; align-items: center; gap: var(--space-1); }
  .sa-gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: var(--space-4); }
  .sa-tile { margin: 0; border: var(--border-thin) solid var(--color-border); border-radius: var(--radius-lg); overflow: hidden; }
  .sa-tile.is-main { border-color: var(--color-warning); }
  .sa-tile__media { height: 150px; display: grid; place-content: center; justify-items: center; gap: var(--space-1); background: var(--color-surface-sunken); color: var(--color-text-tertiary); }
  .sa-tile figcaption { padding: var(--space-2); justify-content: center; }
  .sa-side { display: grid; grid-template-columns: 200px minmax(0, 1fr); gap: var(--space-6); align-items: start; }
  .sa-side__nav { display: flex; flex-direction: column; gap: var(--space-1); }
  .sa-side__nav a, .sa-side__nav span { display: flex; justify-content: space-between; align-items: center; padding: var(--space-2) var(--space-3); border-radius: var(--radius-md); font-size: var(--text-sm); color: var(--color-text-secondary); }
  .sa-side__nav a.is-active { background: var(--color-primary-subtle); color: var(--color-primary-ink); font-weight: var(--weight-semibold); }
  .sa-side__nav a:hover { background: var(--color-surface-hover); }
  .sa-side__nav .is-locked { opacity: .5; cursor: not-allowed; }
  @media (max-width: 900px) { .sa-side { grid-template-columns: minmax(0, 1fr); } .sa-side__nav { flex-direction: row; flex-wrap: wrap; } }
  .sa-players { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: var(--space-3); }
  .sa-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: var(--space-4); }
  .sa-formrow { display: grid; grid-template-columns: 180px minmax(0, 1fr); gap: var(--space-4); align-items: start; }
  @media (max-width: 640px) { .sa-formrow { grid-template-columns: minmax(0, 1fr); gap: var(--space-1); } }
</style>
</head>
<body>
<div class="app" id="app">
  <div class="scrim"></div>
  <aside class="sidebar" id="sidebarMount"></aside>
  <div class="main">
    <header class="topbar" id="topbarMount"></header>
    <nav id="topTabsMount"></nav>

    <main class="content"><div class="content__inner" style="max-width:none">
      <div id="pageHead"></div>
      <div id="keBody"></div>
    </div></main>
  </div>
</div>

<script src="assets/js/data.js"></script>
<script src="assets/js/env.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/shell.js"></script>
<script src="assets/js/sa-data.js"></script>
<script src="assets/js/sa-kit.js"></script>
<script src="assets/js/pp/pp-core.js"></script>
<script src="assets/js/kp/kp-info.js"></script>
<script src="assets/js/kp/kp-ops.js"></script>
<script>
(() => {
  /* Edit package — mirrors pages/packages/package-edit (EditPackagePage + 9
     sections): status (read-only) · basic info · branches · media ·
     availability · validity & plans · access schedule · capacity · usage
     rules, sticky save bar, "fix the highlighted fields" jump list, discard
     changes guard. URL: package-edit.html?id=<pkgId>[&section=plans] */
  RD.boot({ activeId: "packages", title: "Edit package" });
  if (!document.getElementById("keBody")) return;
  const { L, esc, ic, badge } = SA;
  const qs = new URLSearchParams(location.search);
  const pkg = KP.extend(HF.SA.packages.find((x) => String(x.id) === qs.get("id")) || HF.SA.packages[0]);
  KP.pkg = pkg;
  const detail = `package-detail.html?id=${pkg.id}&tab=details`;
  const isRTL = () => document.documentElement.dir === "rtl";
  const subs = pkg.approval_status.value === "approved" ? pkg.subscribers.active : 0;
  const DAYS = [["Sat", "Saturday", "السبت"], ["Sun", "Sunday", "الأحد"], ["Mon", "Monday", "الاثنين"], ["Tue", "Tuesday", "الثلاثاء"], ["Wed", "Wednesday", "الأربعاء"], ["Thu", "Thursday", "الخميس"], ["Fri", "Friday", "الجمعة"]];

  /* ---------- form state (GET /packages/{id}/edit → form) ---------- */
  const cat = HF.SA.CATS.find((c) => c.name === pkg.categories[0]) || HF.SA.CATS[0];
  const init = {
    name: pkg.name, description: pkg.description, categories: [String(cat.id)], activities: [pkg.categories[1]].filter(Boolean),
    all_age_groups: pkg.all_age_groups, age_groups: pkg.age_groups.map((a) => a.name), gender: pkg.gender,
    branches: pkg.branchList.map((b) => String(b.id)), cover: true, remove_cover: false, gallery: pkg.galleryList.map((g) => ({ id: g.id, removed: false })),
    availability_type: pkg.availability.display_starts_at ? "specific_period" : "always", display_starts_at: pkg.availability.display_starts_at || "", display_ends_at: pkg.availability.display_ends_at || "",
    validity: pkg.validity.type,
    plans: pkg.planList.map((p) => ({ id: p.id, name: p.name, price: p.price, active: p.active, starts_on: p.starts_on ? p.starts_on.split("/").reverse().join("-") : "", ends_on: p.ends_on ? p.ends_on.split("/").reverse().join("-") : "", duration_value: p.duration_value, duration_unit: p.duration_unit, activation_window_value: p.activation_window_value || 14, activation_window_unit: "day", allow_renewal: p.renewal, renewal_window_days: 7, subscribers: p.subscribers.active })),
    access_type: pkg.access_schedule.days ? "scheduled" : "full_access",
    schedule: DAYS.map((d) => ({ day: d[0], on: ["Sun", "Tue"].includes(d[0]), slots: [{ from: "08:00", to: "22:00" }] })),
    capacity_type: pkg.capacityD.type, capacity_value: pkg.capacityD.limit || "",
    usage_type: pkg.usage_rules.type, usage_limit: pkg.usage_rules.limit || "", usage_reset: pkg.usage_rules.reset_period || "",
    notify: true,
  };
  let f = JSON.parse(JSON.stringify(init)), errs = {}, tried = false;
  const dirty = () => JSON.stringify(f) !== JSON.stringify(init);
  const resubmit = pkg.approval_status.value === "not_approved";
  const minCap = subs, minUsage = pkg.usage_rules.type === "limited" ? 3 : 0;

  /* ---------- head ---------- */
  SA.head(document.getElementById("pageHead"), {
    title: ["Edit package", "تعديل الباقة"],
    crumbs: [["Packages", "الباقات", "packages.html"]],
    actions: `<a class="btn btn--sm btn--secondary" href="${detail}" data-leave>${ic(isRTL() ? "chevronRight" : "chevronLeft")}<span>${L("Back", "رجوع")}</span></a>`,
  });

  /* ---------- bits ---------- */
  const err = (k) => (errs[k] ? `<span class="field__error">${ic("warn")} ${errs[k]}</span>` : "");
  const fld = (label, control, k, o) => `<div class="field ${errs[k] ? "is-invalid" : ""}"><label class="field__label">${label}${o && o.req ? ' <span class="req">*</span>' : ""}</label>${control}${errs[k] ? err(k) : o && o.hint ? `<span class="field__hint">${o.hint}</span>` : ""}</div>`;
  const radio = (name, val, label, cur) => `<label class="check check--radio"><input type="radio" name="${name}" value="${val}" data-k="${name}" ${cur === val ? "checked" : ""}><span class="check__box"><span class="check__dot"></span></span>${label}</label>`;
  const sw = (k, on, label, attrs) => `<label class="row gap-2" style="align-items:center"><span class="switch"><input type="checkbox" data-k="${k}" ${on ? "checked" : ""} ${attrs || ""} aria-label="${esc(label)}"><span class="switch__track"></span></span><span class="t-sm">${label}</span></label>`;
  const checks = (k, opts, cur) => `<div class="row gap-3" style="flex-wrap:wrap">${opts.map((o) => `<label class="check"><input type="checkbox" data-m="${k}" value="${esc(o[0])}" ${cur.includes(String(o[0])) ? "checked" : ""} ${o[2] ? "disabled" : ""}><span class="check__box">${ic("check")}</span>${esc(o[1])}</label>`).join("")}</div>`;
  const input = (k, v, attrs) => `<input class="input" data-k="${k}" value="${esc(v)}" ${attrs || ""}>`;
  const unitSel = (k, v) => SA.select([["day", L("Day(s)", "يوم"), v === "day"], ["week", L("Week(s)", "أسبوع"), v === "week"], ["month", L("Month(s)", "شهر"), v === "month"], ["year", L("Year(s)", "سنة"), v === "year"]], `data-k="${k}"`);
  const section = (id, title, desc, body) => `<section class="card card--pad stack gap-4" id="section-${id}" style="scroll-margin-top:90px"><div><h3 class="t-title">${title}</h3>${desc ? `<p class="t-sm text-tertiary">${desc}</p>` : ""}</div>${body}</section>`;
  const lockNote = `<span class="t-xs text-tertiary row gap-1" style="align-items:center">${ic("lock")} ${L("Can't be changed on this package.", "لا يمكن تغيير هذا في هذه الباقة.")}</span>`;

  function paint() {
    const acts = f.categories.flatMap((c) => HF.SA.ACTS[c] || []);
    const SECTIONS = [
      ["status", L("Package Status", "حالة الباقة")], ["basic", L("Basic Information", "المعلومات الأساسية")], ["branches", L("Branch Assignment", "تعيين الفروع")], ["media", L("Package Media", "وسائط الباقة")],
      ["availability", L("Availability", "الإتاحة")], ["plans", L("Subscription Validity & Plans", "صلاحية الاشتراك والخطط")], ["schedule", L("Access Schedule", "جدول الدخول")], ["capacity", L("Subscriber Capacity", "سعة المشتركين")], ["usage", L("Usage Rules", "قواعد الاستخدام")]];
    const errSecs = SECTIONS.filter((s) => Object.keys(errs).some((k) => k.split(".")[0] === s[0]));
    const gal = f.gallery.filter((g) => !g.removed).length;
    document.getElementById("keBody").innerHTML = `<div class="stack gap-5">
      <section class="card card--pad"><span class="t-sm text-tertiary">${L("Edit package", "تعديل الباقة")}</span><h1 class="t-h3">${esc(pkg.name)}</h1></section>
      ${resubmit ? KP.notice("warning", "warn", L("This package was rejected. Saving sends it back for review.", "تم رفض هذه الباقة. الحفظ يعيد إرسالها للمراجعة.")) : ""}
      ${tried && errSecs.length ? `<div class="alert alert--danger"><span class="alert__icon">${ic("warn")}</span><div class="alert__body">${L("Please fix the highlighted fields in:", "يرجى تصحيح الحقول المحددة في:")}<div class="row gap-2" style="flex-wrap:wrap;margin-top:var(--space-2)">${errSecs.map((s) => `<a class="btn btn--sm btn--secondary" href="#section-${s[0]}" style="color:var(--color-danger)">${s[1]}</a>`).join("")}</div></div></div>` : ""}

      ${section("status", SECTIONS[0][1], L("Read-only here. Approve or reject from the package page, and activate or deactivate from its status control.", "للعرض فقط هنا. يتم القبول أو الرفض من صفحة الباقة، والتفعيل أو الإيقاف من أداة الحالة فيها."),
        `<div class="row gap-2">${KP.approvalBadge(pkg.approval_status.value)}${KP.statusBadge(pkg.package_status)}</div>`)}

      ${section("basic", SECTIONS[1][1], "", `
        ${fld(L("Package name", "اسم الباقة"), input("name", f.name, 'maxlength="255"'), "basic.name", { req: 1 })}
        ${fld(L("Description", "الوصف"), `<textarea class="input" rows="4" data-k="description">${esc(f.description)}</textarea>`, "basic.description")}
        <div class="grid grid-2">${fld(L("Categories", "التصنيفات"), checks("categories", HF.SA.CATS.map((c) => [String(c.id), c.name]), f.categories), "basic.categories", { req: 1 })}
          ${fld(L("Activities", "الأنشطة"), acts.length ? checks("activities", acts.map((a) => [a, a]), f.activities) : `<span class="t-sm text-tertiary">${L("Select...", "اختر...")}</span>`, "basic.activities")}</div>
        ${fld(L("Age Groups", "الفئات العمرية"), sw("all_age_groups", f.all_age_groups, L("All age groups", "جميع الفئات العمرية")) + (f.all_age_groups ? "" : checks("age_groups", [["Kids", "Kids"], ["Teens", "Teens"], ["Adults", "Adults"], ["Seniors", "Seniors", !f.age_groups.includes("Seniors")]], f.age_groups)), "basic.age_groups")}
        ${fld(L("Gender", "الجنس"), `<div class="row gap-4">${radio("gender", "male", L("Male", "ذكور"), f.gender)}${radio("gender", "female", L("Female", "إناث"), f.gender)}${radio("gender", "both", L("Both", "الكل"), f.gender)}</div>`, "basic.gender", { req: 1 })}`)}

      ${section("branches", SECTIONS[2][1], L("The partner's branches where this package is sold.", "فروع الشريك التي تُباع فيها هذه الباقة."),
        fld(L("Branches", "الفروع"), checks("branches", pkg.branchList.map((b) => [String(b.id), b.active ? b.name : `${b.name} ${L("(inactive)", "(غير نشط)")}`, !b.active && !f.branches.includes(String(b.id))]), f.branches), "branches.branches", { req: 1 }))}

      ${section("media", SECTIONS[3][1], L("Nothing is uploaded until you save.", "لا يتم رفع أي شيء قبل الحفظ."), `
        <div class="stack gap-2"><span class="field__label">${L("Cover image:", "صورة الغلاف")}</span>
          <div class="row gap-3" style="align-items:center;flex-wrap:wrap"><div class="cell-thumb" style="width:224px;height:126px;border-radius:var(--radius-md);opacity:${f.remove_cover ? 0.3 : 1}">${ic("camera")}</div>
          ${f.remove_cover ? `<span class="t-sm" style="color:var(--color-danger)">${L("The cover will be removed when you save.", "ستتم إزالة الغلاف عند الحفظ.")}</span><button type="button" class="btn btn--sm btn--secondary" data-undo>${L("Undo", "تراجع")}</button>`
            : `<button type="button" class="btn btn--sm btn--secondary" style="color:var(--color-danger)" data-rmcover>${ic("trash")}<span>${L("Remove cover", "إزالة الغلاف")}</span></button>`}</div>
          <span class="field__hint">${L("Maximum size 10 MB.", "الحجم الأقصى 10 ميجابايت.")}</span></div>
        <div class="stack gap-2" style="border-top:var(--border-thin) dashed var(--color-border);padding-top:var(--space-4)">
          <div class="row between"><span class="field__label">${L("Gallery", "المعرض")}</span><span class="t-sm text-tertiary">${gal} / 10</span></div>
          <span class="field__hint">${L("Up to 10 images (PNG, JPG or WEBP), 10 MB each.", "حتى 10 صور (PNG أو JPG أو WEBP)، 10 ميجابايت لكل صورة.")}</span>
          <div class="row gap-3" style="flex-wrap:wrap">${f.gallery.map((g, j) => `<div style="position:relative;width:125px;height:125px;opacity:${g.removed ? 0.25 : 1}"><div class="cell-thumb" style="width:100%;height:100%;border-radius:var(--radius-md)">${ic("camera")}</div>
              ${g.new ? `<span class="badge badge--primary" style="position:absolute;top:6px;inset-inline-start:6px">${L("New", "جديدة")}</span>` : ""}
              <button type="button" class="icon-btn" data-gal="${j}" style="position:absolute;top:-8px;inset-inline-end:-8px;width:28px;height:28px;border-radius:50%;background:var(--color-surface);box-shadow:var(--shadow-sm)" title="${g.removed ? L("Keep this image", "الإبقاء على الصورة") : L("Remove", "إزالة")}" aria-label="${g.removed ? L("Keep this image", "الإبقاء على الصورة") : L("Remove", "إزالة")}">${ic(g.removed ? "refresh" : "close")}</button></div>`).join("")}
            ${gal < 10 ? `<button type="button" data-addimg style="width:125px;height:125px;border:2px dashed var(--color-border);border-radius:var(--radius-md);display:grid;place-content:center;justify-items:center;gap:4px;color:var(--color-text-tertiary);background:none;cursor:pointer">${ic("plus")}<span class="t-xs">${L("Add images", "إضافة صور")}</span></button>` : ""}</div></div>`)}

      ${section("availability", SECTIONS[4][1], L("When the package is shown to customers.", "متى تظهر الباقة للعملاء."), `
        <div class="row gap-4">${radio("availability_type", "always", L("Always display", "العرض دائماً"), f.availability_type)}${radio("availability_type", "specific_period", L("Specific period", "فترة محددة"), f.availability_type)}</div>
        ${f.availability_type === "specific_period" ? `<div class="grid grid-2">${fld(L("Display from", "العرض من"), input("display_starts_at", f.display_starts_at, 'type="date"'), "availability.start", { req: 1, hint: L("Today or an earlier date is fine.", "يمكن أن يكون اليوم أو تاريخاً سابقاً.") })}
          ${fld(L("Display until", "العرض حتى"), input("display_ends_at", f.display_ends_at, 'type="date"'), "availability.end", { req: 1 })}</div>` : ""}`)}

      ${section("plans", SECTIONS[5][1], L("How long a subscription lasts, and the plans the package is sold in.", "مدة الاشتراك، والخطط التي تُباع بها الباقة."), `
        ${fld(L("Subscription validity", "صلاحية الاشتراك"), SA.select([["from_purchase", L("Start from purchase", "تبدأ من الشراء"), f.validity === "from_purchase"], ["user_activation", L("Start on user activation", "تبدأ عند تفعيل المستخدم"), f.validity === "user_activation"], ["fixed_date_range", L("Fixed date range", "فترة تواريخ محددة"), f.validity === "fixed_date_range"]], `data-k="validity" ${subs ? "disabled" : ""}`) + (subs ? lockNote : ""), "plans.validity")}
        ${f.plans.map((p, j) => `<div class="stack gap-3" style="padding:var(--space-4);border:var(--border-thin) solid var(--color-border);border-radius:var(--radius-lg)">
          <div class="row between gap-3" style="align-items:center;flex-wrap:wrap"><div class="row gap-2" style="align-items:center"><b>${L(`Plan ${j + 1}`, `الخطة ${j + 1}`)}</b>${p.id ? "" : badge("primary", L("New", "جديدة"))}${p.subscribers ? badge("warning", L(`${p.subscribers} subscriber${p.subscribers === 1 ? "" : "s"}`, p.subscribers === 1 ? "مشترك واحد" : p.subscribers === 2 ? "مشتركان" : `${p.subscribers} مشتركاً`)) : ""}</div>
            <div class="row gap-3" style="align-items:center">${sw(`plans.${j}.active`, p.active, L("Active", "نشطة"))}<button type="button" class="icon-btn" data-delplan="${j}" ${p.subscribers ? "disabled" : ""} style="color:var(--color-danger)" title="${p.subscribers ? L("This plan can't be deleted.", "لا يمكن حذف هذه الخطة.") : L("Delete plan", "حذف الخطة")}" aria-label="${L("Delete plan", "حذف الخطة")}">${ic("trash")}</button></div></div>
          <div class="grid grid-2">${fld(L("Plan name", "اسم الخطة"), input(`plans.${j}.name`, p.name, 'maxlength="255"'), `plans.${j}.name`, { req: 1 })}
            ${fld(L("Price", "السعر"), `<div class="input-affix"><input class="input" type="number" step="0.01" data-k="plans.${j}.price" value="${p.price}"><span class="affix">${esc(pkg.currency)}</span></div>`, `plans.${j}.price`, { req: 1, hint: L("On an approved package, a new price applies as soon as you save.", "في الباقة المقبولة، يُطبَّق السعر الجديد فور الحفظ.") })}</div>
          ${f.validity === "fixed_date_range" ? `<div class="grid grid-2">${fld(L("Starts on", "تاريخ البدء"), input(`plans.${j}.starts_on`, p.starts_on, 'type="date"'), `plans.${j}.starts_on`, { req: 1 })}${fld(L("Ends on", "تاريخ الانتهاء"), input(`plans.${j}.ends_on`, p.ends_on, 'type="date"'), `plans.${j}.ends_on`, { req: 1, hint: p.subscribers ? L(`With subscribers, the end date can only move later (not before ${p.ends_on}).`, `مع وجود مشتركين، يمكن تأخير تاريخ الانتهاء فقط (ليس قبل ${p.ends_on}).`) : "" })}</div>`
            : `<div class="grid grid-2">${fld(L("Duration", "المدة"), `<div class="row gap-2"><input class="input" type="number" min="1" style="width:100px" data-k="plans.${j}.duration_value" value="${p.duration_value}">${unitSel(`plans.${j}.duration_unit`, p.duration_unit)}</div>`, `plans.${j}.duration`, { req: 1 })}
              ${f.validity === "user_activation" ? fld(L("Activate within", "التفعيل خلال"), `<div class="row gap-2"><input class="input" type="number" min="1" style="width:100px" data-k="plans.${j}.activation_window_value" value="${p.activation_window_value}">${unitSel(`plans.${j}.activation_window_unit`, p.activation_window_unit)}</div>`, `plans.${j}.activation`, { hint: L("How long after purchase the subscriber has to activate it.", "المدة المتاحة للمشترك لتفعيل الاشتراك بعد الشراء.") }) : ""}</div>
            <div class="stack gap-3" style="padding:var(--space-3);border-radius:var(--radius-md);background:var(--color-surface-sunken)">${sw(`plans.${j}.allow_renewal`, p.allow_renewal, L("Allow renewal", "السماح بالتجديد"))}
              ${p.allow_renewal ? fld(L("Show the Renew button this many days before the end date", "إظهار زر التجديد قبل تاريخ الانتهاء بهذا العدد من الأيام"), `<div class="input-affix" style="max-width:200px"><input class="input" type="number" min="1" data-k="plans.${j}.renewal_window_days" value="${p.renewal_window_days}"><span class="affix">${L("days", "أيام")}</span></div>`, `plans.${j}.renewal`, { hint: L("From 1 to 30 days.", "من 1 إلى 30 يوماً.") }) : ""}</div>`}
        </div>`).join("")}
        ${errs["plans.none"] ? `<div class="alert alert--danger"><span class="alert__icon">${ic("warn")}</span><div class="alert__body">${errs["plans.none"]}</div></div>` : ""}
        <div><button type="button" class="btn btn--sm btn--secondary" data-addplan>${ic("plus")}<span>${L("Add plan", "إضافة خطة")}</span></button></div>`)}

      ${section("schedule", SECTIONS[6][1], L("When subscribers can use the package.", "الأوقات التي يمكن للمشتركين فيها استخدام الباقة."), `
        ${subs ? KP.notice("warning", "lock", L("This package has subscribers, so access can only be extended: no day or hours can be taken away.", "لهذه الباقة مشتركون، لذا يمكن توسيع الدخول فقط: لا يمكن حذف أي يوم أو ساعات.")) : ""}
        <div class="row gap-4">${radio("access_type", "full_access", L("Full access", "دخول كامل"), f.access_type)}${radio("access_type", "scheduled", L("Scheduled", "حسب جدول"), f.access_type)}</div>
        ${f.access_type === "scheduled" ? `<div class="stack">${f.schedule.map((d, j) => `<div class="row gap-4" style="padding-block:var(--space-3);border-bottom:var(--border-thin) dashed var(--color-border);align-items:flex-start;flex-wrap:wrap">
            <div style="width:170px">${sw(`schedule.${j}.on`, d.on, L(DAYS[j][1], DAYS[j][2]))}</div>
            <div class="stack gap-2" style="flex:1">${d.on ? d.slots.map((s, x) => `<div class="row gap-2" style="align-items:center"><input class="input" type="time" style="width:130px" data-k="schedule.${j}.slots.${x}.from" value="${s.from}" aria-label="${L("From", "من")}"> – <input class="input" type="time" style="width:130px" data-k="schedule.${j}.slots.${x}.to" value="${s.to}" aria-label="${L("To", "إلى")}">
                ${SA.iconBtn("trash", L("Remove time slot", "حذف الفترة الزمنية"), `data-rmslot="${j}.${x}"`)}</div>`).join("") + `<button type="button" class="btn btn--sm btn--ghost" data-addslot="${j}" style="align-self:flex-start">+ ${L("Add time slot", "إضافة فترة زمنية")}</button>` : `<span class="t-sm text-tertiary">${L("Closed", "مغلق")}</span>`}</div></div>`).join("")}</div>${err("schedule.days")}` : ""}
        ${subs && JSON.stringify([f.access_type, f.schedule]) !== JSON.stringify([init.access_type, init.schedule]) ? `<label class="check"><input type="checkbox" data-k="notify" ${f.notify ? "checked" : ""}><span class="check__box">${ic("check")}</span>${L("Notify current subscribers about this schedule change", "إشعار المشتركين الحاليين بتغيير الجدول")}</label>` : ""}`)}

      ${section("capacity", SECTIONS[7][1], L(`Current: ${subs} total · ${subs} active`, `الحالي: ${subs} إجمالي · ${subs} نشط`), `
        <div class="row gap-4" style="flex-wrap:wrap">${radio("capacity_type", "unlimited", L("Unlimited", "غير محدودة"), f.capacity_type)}${radio("capacity_type", "total", L("Total subscribers", "إجمالي المشتركين"), f.capacity_type)}${radio("capacity_type", "active", L("Active subscribers", "المشتركون النشطون"), f.capacity_type)}</div>
        ${init.capacity_type !== "unlimited" && f.capacity_type !== "unlimited" && f.capacity_type !== init.capacity_type ? KP.notice("warning", "warn", L("Total and Active count subscribers differently - check the limit before saving.", "الإجمالي والنشط يحسبان المشتركين بشكل مختلف - راجع الحد قبل الحفظ.")) : ""}
        ${f.capacity_type !== "unlimited" ? fld(L("Maximum subscribers", "الحد الأقصى للمشتركين"), input("capacity_value", f.capacity_value, 'type="number" min="1" style="max-width:200px"'), "capacity.value", { req: 1, hint: minCap ? L(`At least ${minCap} - the subscribers it already counts.`, `${minCap} على الأقل - عدد المشتركين الحاليين.`) : "" }) : ""}`)}

      ${section("usage", SECTIONS[8][1], minUsage ? L(`Highest current usage: ${minUsage} visits`, `أعلى استخدام حالي: ${minUsage} زيارات`) : "", `
        <div class="row gap-4">${radio("usage_type", "unlimited", L("Unlimited", "غير محدود"), f.usage_type)}${radio("usage_type", "limited", L("Limited", "محدود"), f.usage_type)}</div>
        ${f.usage_type === "limited" ? `<div class="grid grid-2">${fld(L("Visits", "عدد الزيارات"), input("usage_limit", f.usage_limit, 'type="number" min="1"'), "usage.limit", { req: 1, hint: minUsage ? L(`At least ${minUsage} - the highest current usage.`, `${minUsage} على الأقل - أعلى استخدام حالي.`) : "" })}
          ${fld(L("Reset every", "إعادة الضبط كل"), SA.select([["", L("Select...", "اختر...")], ["day", L("Day", "يوم"), f.usage_reset === "day"], ["week", L("Week", "أسبوع"), f.usage_reset === "week"], ["month", L("Month", "شهر"), f.usage_reset === "month"]], 'data-k="usage_reset"'), "usage.reset", { req: 1 })}</div>` : ""}`)}
    </div>
    <div class="card" style="position:sticky;bottom:var(--space-3);z-index:20;margin-top:var(--space-5);padding:var(--space-3) var(--space-5);display:flex;justify-content:space-between;align-items:center;box-shadow:var(--shadow-lg)">
      <a class="btn btn--ghost" href="${detail}" data-leave>${L("Cancel", "إلغاء")}</a>
      <button type="button" class="btn" data-save ${dirty() ? "" : "disabled"}>${resubmit ? L("Save and resubmit", "حفظ وإعادة الإرسال") : L("Save changes", "حفظ التغييرات")}</button></div>`;
  }

  /* ---------- validation (packageEditForm.js / planForm.js / limitsForm.js) ---------- */
  function validate() {
    const e = {}, REQ = L("This field is required.", "هذا الحقل مطلوب."), ONE = L("Pick at least one.", "اختر عنصراً واحداً على الأقل."), today = new Date().toISOString().slice(0, 10);
    if (!f.name.trim()) e["basic.name"] = REQ;
    if (!f.categories.length) e["basic.categories"] = ONE;
    if (!f.all_age_groups && !f.age_groups.length) e["basic.age_groups"] = ONE;
    if (!f.branches.length) e["branches.branches"] = ONE;
    if (f.availability_type === "specific_period") {
      if (!f.display_starts_at) e["availability.start"] = REQ;
      if (!f.display_ends_at) e["availability.end"] = REQ;
      else if (f.display_starts_at && f.display_ends_at <= f.display_starts_at) e["availability.end"] = L("The end date must be after the start date.", "يجب أن يكون تاريخ الانتهاء بعد تاريخ البدء.");
      else if (f.display_ends_at !== init.display_ends_at && f.display_ends_at <= today) e["availability.end"] = L("The end date must be in the future.", "يجب أن يكون تاريخ الانتهاء في المستقبل.");
    }
    if (!f.plans.length) e["plans.none"] = L("Add at least one plan.", "أضف خطة واحدة على الأقل.");
    f.plans.forEach((p, j) => {
      if (!String(p.name).trim()) e[`plans.${j}.name`] = REQ;
      if (p.price === "" || +p.price < 0) e[`plans.${j}.price`] = L("Enter a price of 0 or more.", "أدخل سعراً يساوي 0 أو أكثر.");
      if (f.validity === "fixed_date_range") {
        if (!p.starts_on) e[`plans.${j}.starts_on`] = REQ;
        if (!p.ends_on) e[`plans.${j}.ends_on`] = REQ;
        else if (p.starts_on && p.ends_on < p.starts_on) e[`plans.${j}.ends_on`] = L("The end date must be on or after the start date.", "يجب أن يكون تاريخ الانتهاء في يوم البدء أو بعده.");
      } else {
        if (!Number.isInteger(+p.duration_value) || +p.duration_value < 1) e[`plans.${j}.duration`] = L("Enter a whole number of 1 or more.", "أدخل عدداً صحيحاً يساوي 1 أو أكثر.");
        if (p.allow_renewal && (+p.renewal_window_days < 1 || +p.renewal_window_days > 30)) e[`plans.${j}.renewal`] = L("At most 30 days - the plan's duration.", "30 يوماً كحد أقصى - مدة الخطة.");
      }
    });
    if (f.access_type === "scheduled") {
      if (!f.schedule.some((d) => d.on)) e["schedule.days"] = L("Switch on at least one day.", "فعّل يوماً واحداً على الأقل.");
      f.schedule.forEach((d, j) => { if (!d.on) return; const day = L(DAYS[j][1], DAYS[j][2]);
        if (d.slots.some((s) => !s.from || !s.to)) e["schedule.days"] = L(`${day}: fill in the start and end of every time slot.`, `${day}: أدخل بداية ونهاية كل فترة زمنية.`);
        else if (d.slots.some((s) => s.to <= s.from)) e["schedule.days"] = L(`${day}: each time slot must end after it starts.`, `${day}: يجب أن تنتهي كل فترة بعد بدايتها.`);
        else { const s = d.slots.slice().sort((a, b) => a.from.localeCompare(b.from)); if (s.some((x, i) => i && x.from < s[i - 1].to)) e["schedule.days"] = L(`${day}: time slots overlap.`, `${day}: الفترات الزمنية متداخلة.`); } });
    }
    if (f.capacity_type !== "unlimited") { if (f.capacity_value === "") e["capacity.value"] = REQ; else if (+f.capacity_value < minCap) e["capacity.value"] = L(`Can't be less than ${minCap} - the current subscribers.`, `لا يمكن أن يقل عن ${minCap} - عدد المشتركين الحاليين.`); }
    if (f.usage_type === "limited") {
      if (f.usage_limit === "") e["usage.limit"] = REQ; else if (+f.usage_limit < minUsage) e["usage.limit"] = L(`Can't be less than ${minUsage} - a subscriber has already used that many.`, `لا يمكن أن يقل عن ${minUsage} - استخدم أحد المشتركين هذا العدد بالفعل.`);
      if (!f.usage_reset) e["usage.reset"] = REQ;
    }
    return e;
  }

  /* ---------- events ---------- */
  const setPath = (path, v) => { const ks = path.split("."); let o = f; ks.slice(0, -1).forEach((k) => (o = o[k])); o[ks[ks.length - 1]] = v; };
  const body = document.getElementById("keBody");
  const repaint = () => { const y = scrollY; paint(); scrollTo(0, y); };
  body.addEventListener("input", (e) => { const k = e.target.dataset.k; if (k && e.target.type !== "radio" && e.target.type !== "checkbox") { setPath(k, e.target.value); const b = body.querySelector("[data-save]"); if (b) b.disabled = !dirty(); } });
  body.addEventListener("change", (e) => {
    const k = e.target.dataset.k, m = e.target.dataset.m;
    if (m) { const s = new Set(f[m]); e.target.checked ? s.add(e.target.value) : s.delete(e.target.value); f[m] = [...s]; if (m === "categories") f.activities = f.activities.filter((a) => f.categories.some((c) => (HF.SA.ACTS[c] || []).includes(a))); }
    else if (k) setPath(k, e.target.type === "checkbox" ? e.target.checked : e.target.value);
    if (tried) errs = validate();
    repaint();
  });
  body.addEventListener("click", (e) => {
    const t = (s) => e.target.closest(s);
    if (t("[data-rmcover]")) { f.remove_cover = true; return repaint(); }
    if (t("[data-undo]")) { f.remove_cover = false; return repaint(); }
    if (t("[data-gal]")) { const g = f.gallery[+t("[data-gal]").dataset.gal]; g.new ? f.gallery.splice(f.gallery.indexOf(g), 1) : (g.removed = !g.removed); return repaint(); }
    if (t("[data-addimg]")) { f.gallery.push({ id: null, new: true, removed: false }); return repaint(); }
    if (t("[data-addplan]")) { f.plans.push({ id: null, name: "", price: "", active: true, starts_on: "", ends_on: "", duration_value: 1, duration_unit: "month", activation_window_value: 14, activation_window_unit: "day", allow_renewal: false, renewal_window_days: 7, subscribers: 0 }); return repaint(); }
    if (t("[data-delplan]")) { f.plans.splice(+t("[data-delplan]").dataset.delplan, 1); return repaint(); }
    if (t("[data-addslot]")) { f.schedule[+t("[data-addslot]").dataset.addslot].slots.push({ from: "", to: "" }); return repaint(); }
    if (t("[data-rmslot]")) { const [d, x] = t("[data-rmslot]").dataset.rmslot.split("."); f.schedule[d].slots.splice(+x, 1); return repaint(); }
    if (t("[data-save]")) {
      tried = true; errs = validate();
      if (Object.keys(errs).length) { paint(); const first = body.querySelector(".field__error, .alert--danger"); const sec = first && first.closest("section[id^='section-']"); (sec || body).scrollIntoView({ behavior: "smooth", block: "start" }); return; }
      RD.toast("success", L("Package updated", "تم تحديث الباقة"));
      Object.assign(pkg, { name: f.name, description: f.description });
      leaving = true; location.href = detail; return;
    }
  });
  /* unsaved-changes guard (useUnsavedChangesGuard.js) */
  let leaving = false;
  document.addEventListener("click", (e) => {
    const a = e.target.closest("[data-leave], .sidebar a, .content a[href]:not([href^='#'])");
    if (!a || leaving || !dirty() || a.closest("#keBody section")) return;
    e.preventDefault();
    const el = SA.modal({ id: "keDiscard", title: L("Discard changes?", "تجاهل التغييرات؟"), body: `<p class="t-sm text-secondary">${L("You have unsaved changes to this package. If you leave now, they will be lost.", "لديك تغييرات غير محفوظة على هذه الباقة. إذا غادرت الآن فستفقدها.")}</p>`,
      foot: `<button class="btn btn--ghost" data-close>${L("Keep editing", "متابعة التعديل")}</button><button class="btn btn--danger" data-ok>${L("Discard changes", "تجاهل التغييرات")}</button>` });
    el.querySelector("[data-ok]").onclick = () => { leaving = true; location.href = a.getAttribute("href"); };
  }, true);
  window.addEventListener("beforeunload", (e) => { if (dirty() && !leaving) { e.preventDefault(); e.returnValue = ""; } });

  paint();
  const s = qs.get("section");
  if (s) { const el = document.getElementById("section-" + s); if (el) setTimeout(() => el.scrollIntoView({ block: "start" }), 50); }
})();
</script>
</body>
</html>
